l_english:
 ##Anomalies
 uma_ale_anomoly: "The Breath"
 uma_ale_anomoly_desc: "While analyzing this black hole, the science ship detected an anomalous flow of particles. Further research is required."
 uma_ale_2_anomoly: "Spacetime Survey"
 uma_ale_2_anomoly_desc: "Although the galactic structure is identical to $UMA_ALE_PAST_EYE$, time here appears to be 9 days ahead of standard time. We have named this system $UMA_ALE_FUTURE_EYE$. To determine our next step, we must find a breakthrough; this work will be completed by the scientists who entered previously."

 UMA_ALE_PAST_EYE: "Eye of the Past"
 UMA_ALE_FUTURE_EYE: "Eye of the Future"

 ##EVT
 uma_ale.2.title: "$uma_ale_anomoly$"
 uma_ale.2.desc: "Scientist [This.Fleet.GetLeaderName] has completed the study of the black hole. Results show that although the black hole is continuously absorbing matter, its gravity is gradually decreasing. This means it is losing mass, which clearly falls outside the scope of Hawking radiation.\nScientist [This.Fleet.GetLeaderName] proposes deploying a quantum beacon into the black hole, which may aid our research in black hole physics."
 uma_ale.2.a: "Approve"
 uma_ale.2.b: "Just Monitor It"
 uma_ale.3.title: "Matter Big Bang"
 uma_ale.3.desc.a: "Our beacon lost its quantum response as usual the moment it crossed the event horizon, but after some time, it seemed to become active again. However, we cannot determine its position, and it shows no special reaction.\nYet, just now, a singular change occurred. The light originally distorted by gravity fell back to the 'rear' of the black hole, and then it began to erupt with a violent light, much like a supernova.\nA massive amount of matter began to spew outward, containing many familiar elements and minerals, as well as compounds never seen before—there are even Crystal Radishes!\nOur scientists find this phenomenon difficult to explain. They believe the unique structure of this black hole caused spacetime to run in reverse. Regardless, it has provided us with a wealth of resources."
 uma_ale.3.a: "This is miraculous."
 uma_ale.4.title: "Spacetime Storm"
 uma_ale.4.desc: "A peculiar storm has formed in 「$UMA_ALE_PAST_EYE$」. Scientists believe this is a spacetime disruption caused by the black hole's anomalous activity, naming it a 'Spacetime Storm.'\nWithin the reach of this storm, most of our FTL engines are difficult to start. However, calculations show its influence will be limited to the system.\nShips trapped within can wait for the storm to end or attempt to initiate FTL after a long period of coordinate calculation."
 uma_ale.4.a: "$OK$"
 uma_ale.5.title: "Hyperlane Restructuring"
 uma_ale.5.desc: "Through continuous observation of the Spacetime Storm, we have gradually discovered more of its characteristics, especially its impact on hyperlanes. Although FTL travel is impossible within 「$UMA_ALE_PAST_EYE$」, ships stranded inside have detected anomalous spacetime fluctuations, seemingly indicating a path to a previously undetected system."
 uma_ale.5.a: "We should not put scientists in danger."
 uma_ale.5.b: "Attempt to Locate Hyperlane"
 uma_ale.6.title: "Localization Complete"
 uma_ale.6.desc: "Scientist [This.Fleet.GetLeaderName] has successfully located the hyperlane within the Spacetime Storm. Although we emphasized not to attempt entry, [This.Fleet.GetLeaderName] encountered a powerful gravitational pull and entered the lane without even activating the hyperdrive."
 uma_ale.6.a: "Attempt to Establish Communication"
 uma_ale.7.title: "[From.Fleet.GetLeaderName]"
 uma_ale.7.desc: "...I'm not entirely sure what's happening. Although I'm certain I entered the hyperlane, I seem to have returned to this same system... something must be wrong. I need to check the instruments."
 uma_ale.7.a: "(Wait)"
 uma_ale.8.title: "[From.Fleet.GetLeaderName]"
 uma_ale.8.desc: "Coordinates... gravity parameters... time... Time? I think I understand. Please tell me the standard time."
 uma_ale.8.a: "The date is [GetDate]"
 uma_ale.9.title: "[From.Fleet.GetLeaderName]"
 uma_ale.9.desc: "The instruments on the science ship show the current time is 9 days ahead of standard time. I am certain this isn't due to gravity. While there are many possibilities, I lean towards... this being a 'Hyper-Time Lane.' As for further research, I believe we should §Yestablish outposts in $UMA_ALE_PAST_EYE$ and $UMA_ALE_FUTURE_EYE$§!."
 uma_ale.9.a: "Authorized"
 uma_ale.10.title: "Spacetime Constant"
 uma_ale.10.desc: "Generally, systems with spacetime anomalies exhibit various disruptions like abnormal time flow or spatial folding. However, the structure of $UMA_ALE_FUTURE_EYE$ is remarkably stable, bringing the investigation to a bottleneck.\nScience headquarters is in an uproar. Aside from various conjectures, many scientists believe the instruments are faulty and demand more science ships be sent to investigate."
 uma_ale.10.a: "We can continue research by §Ybuilding a Starbase§! there."
 uma_ale.12.title: "Eyes of the Future"
 uma_ale.12.desc: "Even if all devices entering the system show identical internal and external time, and though it feels like no time has passed, the dashboards invariably and emotionlessly show it is nine days ahead of standard time.\nScientists have searched every inch of this system and found no other anomalies. Cargo ships, however, are happily transporting resources out of the system.\nResearchers suggest that $UMA_ALE_FUTURE_EYE$ and $UMA_ALE_PAST_EYE$ are extremely similar—perhaps they are two timelines formed by the black hole that 'sync' periodically.\nAfter deliberation, we decided to establish a Resource Recovery Station in $UMA_ALE_PAST_EYE$ to process and destroy waste resources. If the two systems sync, the added mass might cause interference; collecting this data could aid physical development.\n\n§YThe Surplus Resource Recovery Station interface can be accessed via the Edicts screen.§!"
 uma_ale.12.a: "$OK$"

 uma_ale.31.title: "Mysterious Whispers"
 uma_ale.31.desc: "Recently, we have heard mysterious whispers from the black hole at the $UMA_ALE_PAST_EYE$ recovery station. They manifest as faint, intermittent signals. Curiously, when translated, they say: 'Uu... I can't eat anymore... stop dropping things down here...'\nPerhaps something miraculous will happen if we try to extract from it?"
 uma_ale.31.a: "What is going on?"

 uma_ale.32.title: "An Abundant Umamusume?"
 uma_ale.32.desc: "While receiving resources from the Eye of the Future, we heard a 'thud' as a strange Umamusume fell out along with a pile of supplies. Her eyes were tightly shut, and she was muttering something about being tired of food falling from the sky... Our staff immediately reported this and took her to the infirmary on the nearest planet. It is unclear where she came from, but after a detailed check, she is in perfect health and well-nourished. It seems she was just asleep.\nA few hours later, the Umamusume jumped out of bed, curiously looking at everyone.\n'Ah, can someone tell me where this is?'"
 uma_ale.32.a: "Good morning!"
 uma_ale.33.title: "???"
 uma_ale.33.desc: "Huh? I only remember taking a short nap. How did I end up surrounded by so many people? And in such an unfamiliar place... Was I... rescued home?!\nAh, hello. Imperial 3rd Strike Fleet, Commander Almond Eye, reporting for duty! And you are...?"
 uma_ale.33.a: "I am [Root.GetRulerTitle] [Root.GetRulerName]"
 uma_ale.34.title: "Almond Eye"
 uma_ale.34.desc: "Eek! It's the [Root.GetRulerTitle]! So, does the Empire still exist? I don't know how much time has passed.\n...Looking at your expression, you seem confused by the concept of the 'Empire.' Don't tell me this isn't the Umamusume Empire I know... Ugh... if only I hadn't fallen into that black hole..."
 uma_ale.34.a: "Fallen into that black hole?"
 uma_ale.35.desc: "That black hole right there. At the time, we were building a Spacetime Stabilization Anchor to delay a displacement caused by external forces. The method was... to blow up the system's star into a black hole! Just as we prepared to evacuate, it generated a massive pull and dragged me and my ship right in. Strangely, the inside was a massive space where I was trapped. Then one day, resources started raining from the sky. I just noticed you throwing resources into it, could those be...?"
 uma_ale.35.a: "Likely our surplus resources."
 uma_ale.36.desc: "I... I see! Thank you so much! Unfortunately, I don't know the rate of time flow inside. But based on the signs, it seems the 'home' I knew has been buried in the dust of time. Those feelings and memories... they're all gone."
 uma_ale.36.a: "Miss Almond Eye, we can be your family and friends."
 uma_ale.37.desc: "Really!? Then, allow me to reintroduce myself."
 uma_ale.37.a: "Of course."

 uma_ale.38.desc: "§YShe stands confidently before you and turns around, her long golden hair fluttering. Opening her eyes, you see her crystal-clear, determined gaze. Her pupils, shining like cross-stars, lock onto you. She then points to herself.§!\n'I am Almond Eye, and I am a Captain.'\n§YThe extraordinary aura in her brief introduction quickly infects the surrounding Umamusumes.§!\n'Of course, I strive for perfection. Only by being flawless can one truly convince their enemies... or opponents.'\n§YShe winks.§!\n'Whether it's racing or drills, I will de-de-de-de-de-de-de-definitely not lose!' "
 uma_ale.38.a.a: "What are your plans for the future?"
 uma_ale.38.a.a.resp: "'To get used to life here first, of course!'\n§YShe smiles gently.§!\n'But, I will win against everyone here.'"
 uma_ale.38.b: "There are many experts here, you know."
 uma_ale.38.b.resp: "'That makes it even more interesting. I quite enjoy such challenges.'"

