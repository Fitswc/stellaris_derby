 uma_ap.160.title: "Insomnia"
 uma_ap.160.desc: "Contrary to the last time, large-scale insomnia symptoms emerged in the test group this time. The report shows that Umamusumes has difficulty falling asleep, with some cases having their eyes open continuously for a week. At first, Umamusumes were very happy and even began to celebrate having several times more time than usual to complete the things they wanted to do. Gradually, they began to feel something was amiss. Due to lack of rest, Umamusumes' health seemed to be getting worse and worse. Almost every morning, one could hear Umamusumes' howling because of her hair loss. After all, hair was Umamusume's life. \n Anyway, we must respond to this problem."
 uma_ap.160.a: "Make adjustments based on the existing Realm activation"
 uma_ap.160.b: "Sleeping pills can be distributed"
 uma_ap.160.c: "I also want a long period of personal time"
  
