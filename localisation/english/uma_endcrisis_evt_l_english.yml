 uma_ec_1.10.title: "Advances in Factor Engineering"
 uma_ec_1.10.desc: "Our control over Factors now allows us to define the traits of newborns! We can determine their personality, abilities, and even model them after our icons. Selecting our species at the Factor level will bring our development to a new height."
 uma_ec_1.10.a: "Excellent."

 uma_ec_1.12.title: "Unknown Call"
 uma_ec_1.12.desc: "A few days after the sudden appearance of the megastructure and defenses in [event_target:uma_ec1_main_system.GetName], a stranger calling themselves the §YTriple Goddesses§! abruptly contacted us."
 uma_ec_1.12.a: "Who is it? Patch them through!"

 uma_ec_1.13.title: "The 'Triple Goddesses'"
 uma_ec_1.13.desc: "§PChildren! How long has it been since we last spoke—you might have forgotten.§!\n\n§BWe are here for serious business. Your Factor development has far exceeded our imagination.§!\n\n§PAs reluctant as we are, it has interfered with the [DATA EXPUNGED] cycle. We must reverse time in this universe.§!\n\n§HThis means you, as you are now, will cease to exist, and start again from a single cell.§!\n\n§PThough it does not benefit you, please understand. You may have noticed your birth rates declining. As your Factors become more complex and perfect, it becomes harder for us to match them with souls.§!\n\n§BThe buildup of excess souls will impact the [DATA EXPUNGED] world, which violates our mission.§!\n\n§HIn short, children, we suggest you do not interfere with our reversal. Though other civilizations will surely attack, please do not...§!\n\n§BThat is all. The choice is yours. We hope you make the right one.§!"
 uma_ec_1.13.a: "This is..."

 uma_ec_1.14.title: "The Disaster of the Time Machine"
 uma_ec_1.14.desc: "An unknown force has built a massive structure in [event_target:uma_ec1_main_system.GetName]. According to investigations, it is absorbing vast amounts of energy, and time itself seems to be warping around it. Regardless, it is a dangerous building that must be destroyed."
 uma_ec_1.14.a: "$OK$"

 uma_ec_1.15.title: "Failure of Time Reversal"
 uma_ec_1.15.desc: "We successfully destroyed the time machine erected by the Triple Goddesses, preventing the reset of the universe. Our race shall continue to thrive."
 uma_ec_1.15.a: "$OK$"

 uma_ec_1.16.title: "The 'Triple Goddesses'"
 uma_ec_1.16.desc: "§BChildren, we have seen your determination. Your efforts have made this universe an independent parallel realm, isolating the pollution of your Factors. From now on, the Triple Goddesses and their agents will no longer exist here. Finally, we wish you well.§!\n\n§gThe leak over there has been sealed, though it cost significant resources...§!"
 uma_ec_1.16.a: "Farewell."

 uma_ec_1.17.title: "Failure of Time Reversal"
 uma_ec_1.17.desc: "We successfully destroyed the time machine erected by unknown forces, preventing the reset of the universe. Our race shall continue to live on."
 uma_ec_1.17.a: "$OK$"

 uma_ec_1.19.title: "Eureka!"
 uma_ec_1.19.desc: "We have instantly returned to the time when we first stepped into space. However, our knowledge seems to have been preserved. Could it be that the locals shared advanced technology with us?"
 uma_ec_1.19.a: "$OK$"

