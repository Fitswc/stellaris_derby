l_simp_chinese:

uma_curren_name: "真机怜"


uma_curren.1.title: "可爱的真谛"
uma_curren.1.desc: "在你的领导下，你的国家蒸蒸日上，实力版图逐渐扩张，你也因此听到许多故事及传说，大部分除了提供闲暇时的调剂以外并没有更多作用，某个关于“可爱”的传说就此埋入你的记忆深处。"
uma_curren.1.a: "……"

uma_curren.2.title: "可爱的拜访"
uma_curren.2.desc: "你的部下表示有人想觐见你，对方是个§H唐突出现§!在本舰上的“马娘”。"
uma_curren.2.a: "你怎么笑成这个样子？这“马娘”是什么来头？"
uma_curren.2.b: "我很忙，让她提前预约再来。"

uma_curren.3.title: "真机伶"
uma_curren.3.desc: "你就是这个国家的领导人吗？机伶很高兴见到你。"
uma_curren.3.a: "你找我有什么事？"


uma_curren.4.desc: "嗯……机伶也不知道呢，明明先前还在瀑布下修炼的说。"
uma_curren.4.a: "不知道？"

uma_curren.5.desc: "机伶，想留在这里，不知道可不可以呢？"
uma_curren.5.a: "你为什么想留下呢？"
uma_curren.5.b: "当然可以，能获得一位这么可爱的伙伴是我的荣幸"
uma_curren.5.c: "不好意思，恕我拒绝"

uma_curren.6.desc: "因为机伶想让全宇宙的大家都因为机伶的可爱变得幸福起来，也就是——可爱的终点！"
uma_curren.6.a: "既然如此，你就陪在我的身边吧"
uma_curren.6.b: "不好意思，恕我拒绝"

uma_curren.6.a.tt: "机伶好开心，有什么机伶能帮忙的，请尽管拜托我吧~"

uma_curren.7.title: "End"
uma_curren.7.desc: "真机伶对你的决定似乎并不意外，只是失落地自言自语道：“还是没有办法实现吗。”你将她安排在专人看管的房间中。可没等你想好如何处理，第二天真机伶便从房间中消失。床上只留着一张用鎏金字体写着“香草度假村”的白色小纸片。"
uma_curren.7.a: "……"

uma_curren.8.desc: "§Y来自特雷森学园，在马推拥有百万级粉丝的“可爱の天使”。为了迈向更高的“可爱”而来到宇宙的舞台。\n借助她“可爱”的力量，更好地统治国家，并和她一同探寻未知的前方吧。§!\n“啊，欧尼酱！”\n§Y她轻跳着跑过来，用清澈的眼睛盯着你。§!"
uma_curren.8.a: "谢谢你，真机伶。顺便也恭喜你赢下URA。"
uma_curren.8.a.resp: "“嗯嗯，大家都因为机伶的可爱露出了笑容呢。”\n§Y机伶向后跳了两步，在原地转了个圈。§!\n“不过那还不够，要让全宇宙——都认识到机伶的可爱才行。”"
uma_curren.8.b: "就像那个‘可爱的终极’的传说吗。"
uma_curren.8.b.resp: "“这回可不一样，你要和机伶酱一起把那些传说变成现实哦。”"
uma_curren.8.hire: "欢迎!"




uma_curren.10.title: "可爱的扩散"
uma_curren.10.desc: "真机伶被你收留之后，十分主动地了解起你的国家的现状。除了非常机密的部分，你对真机伶知无不言，没想到她却意外的机敏，在很多领域亟待突破的问题给予了奇特的角度，令你也有所启发。政事之外，真机伶似乎非常热衷于提高自己在你的臣民间的知名度，并称之为“专属于机伶的可爱”。"
uma_curren.10.a: "什么叫专属于机伶的可爱？去调查一下"
uma_curren.10.b: "她确实挺可爱的......"

uma_curren.11.title: "Research Completed"
uma_curren.11.desc: "从收集到的反馈意见来看，群众对于“可爱”这一词汇的定义可能不甚了然，但看见真机伶时总能莫名其妙的或打起精神，或情绪平复，单从这一点来看，她似乎并未带来任何不良影响。"
uma_curren.11.a: "真不错"

uma_curren.12.desc: "在你的国家的生活真的很奇妙呢。不过比那更让机伶开心的，果然还是在这里也能让大家感受到机伶的‘可爱’。"
uma_curren.12.a: "希望这个国家日后也能得到你的认可。"
uma_curren.12.a.repo: "呵呵，大家也都是很好的人，你的领导能力真的很厉害呢。"
uma_curren.12.b: "说起来，真机伶为什么要这么执着于‘可爱’呢？"
uma_curren.12.b.repo: "机伶呢，在小的时候就因为非常可爱，总是能让家里人变得开心。机伶就想，这份能力，如果扩散开来，那么不仅是机伶身边的人，还有更多的人，大家都可以因为机伶感到幸福。\n还有就是，机伶的训练员，也就是哥哥，他为了机伶，也付出过很多……机伶不想让他失望。"
uma_curren.12.c: "不知道真机伶你有没有听说过那个关于‘可爱’的传说？"
uma_curren.13.desc: "嗯……不知道呢。机伶应该还没到变成传说的程度吧。"
uma_curren.13.a: "§g她似乎了解些什么，但现在显然不是谈这个的时候。§!"

uma_curren.20.title: "遗迹"
uma_curren.20.desc: "你的先遣队发现了一处遗迹，从返回的资料来看，是一个名叫香草星人的种族留下的——香草星人是个唯科学论的种族，曾以高超的科学技术闻名宇宙，但传说它们遭到了某种打击，整个香草星就此消失，香草星人也彻底变成茫茫星海中无数被遗忘的尘埃之一。不知为何真机伶一定要在现场亲自参与。"
uma_curren.20.a: "……机伶也有听说，香草星人是自己选择毁掉整个星球的。"

uma_curren.21.title: "更进一步"
uma_curren.21.desc: "随着你的部下对遗迹的逐渐发掘，越来越多香草星人的科学技术得以为你所用。休息时间，你和真机伶聊起了得到的成果——现在的真机伶已经是你的国家里闻名遐迩的偶像了，甚至在星际间也有相当的知名度，无论冷清还是繁荣，几乎每个空间交易站，都能找到真机伶传播“可爱”的影子。真机伶本人一直挂念的“可爱的终点”似乎已经很近很近了。\n‘那它们为什么要毁掉自己族人奋斗几代得来的知识呢？’"
uma_curren.21.a: "因为人们总是对自己未知的事情感到恐惧"

uma_curren.22.title: "未知邀请"
uma_curren.22.desc: "早在你和真机伶见面之前，留驻遗迹内的部下给你发送来一张图片——纯白色的邀请函在碎石瓦砾中显得格外突兀，但鎏金的“香草度假村”大字似乎从未被岁月洗礼过。邀请函的背面，赫然写着“真机伶”的这三个字。"
uma_curren.22.a: "但也会有人为了那一瞬的可能去努力，哪怕未知的尽头是连想象力都触及不到的深处"

uma_curren.23.title: "隐瞒"
uma_curren.23.desc: "你姑且将看到的事情瞒了下来，随着队伍继续探索，你们发现了一处叫做“香草星技术博物馆”的奇怪建筑。"
uma_curren.23.a: "让我们继续"

uma_curren.24.title: "α=1"
uma_curren.24.desc: "香草星人的遗迹已基本被搜索干净，但正所谓“知道得越多越感觉自己无知”，香草星人的科技仿佛一个辐射图，浅显发掘得到的那些成果只是绕着外围走了一圈。除了一个巨大的由无数反射率几乎为0的平面所组成的类球体以外，科学家没有带回来任何有价值的东西。"
uma_curren.24.a: "这是个什么玩意，必须全力解析！"

uma_curren.30.title: "可爱的未知"
uma_curren.30.desc: "研究所建成后，全国数十名最顶尖的科学家开始了夜以继日的研究，可仍然没有任何实质性的进展。某天你正在为此事发愁时，突然注意到装着那个“类球体”的核心区域的监视器里出现了熟悉的身影。\n奇妙的是，在几个月内对所有连接方式都没有任何反应的类球体。真机伶没有带着任何护具，就这么触摸上了类球体表面。当你带着卫队赶到现场时，类球体已经变成了曾经只在量子计算机模拟中出现过的纯黑色高维几何体。"
uma_curren.30.a: "真机伶？！她怎么进去的！"

uma_curren.31.desc: "'伯列恒之星哟，接下来只要……'\n你看到真机伶掏出一张白色的卡片，烫金的“香草度假村”字样在光线照射下显得格外晃眼，将手一抬，卡片便缓缓浮起，直向着伯列恒之星制造出的锁孔飞去。刹那间，一股能量涌向真机伶。"
uma_curren.31.a: "真机伶！"

uma_curren.32.desc: "不，不对，这不是“未来”！"
uma_curren.32.a: "你到底在干什么？"
uma_curren.33.desc: "对不起，这么久以来都在利用你们。"
uma_curren.33.a: "利用我们，是为了那个装置吗？"
uma_curren.34.desc: "没错，为了找到伯利恒之星。"
uma_curren.34.a: "为了‘可爱’的终极？"
uma_curren.35.desc: "没错，为了找到伯利恒之星。"
uma_curren.35.a: "我们的研究员全力以赴，也无法对其进行解析。应该说，它在等你!"
uma_curren.36.desc: "……香草星人，其实很可怜呢。为了那么缥缈的‘未来’就能付出全族人的力量。千年，万年，不，已经比那还要久了。这个‘伯列恒之星’，是一个时间线跨越装置，以使用者的三项特质为燃料，便可以知晓无数可能的未来。"
uma_curren.36.a: "听起来非常诱人"
uma_curren.37.desc: "机伶觉得，为了在万千选择里面选中那个正确的答案，首先排除错误答案是很重要的。\n这张写着‘香草度假村’和你名字的卡片它有释放出一种特殊信号。对其进行追踪得到的结果是，这样的信号几乎遍布整个宇宙——香草星人的技术并不完满。你追踪到的那些信号是机伶存在过的时间线的残余。但只要机伶找到正确的时间线，宇宙会自动消除这些残余，仅仅留下最终的路径。"
uma_curren.37.a: "为什么是邀请函，而且还叫什么‘度假村’。"
uma_curren.38.desc: "那是第一次尝试的时候，香草星人给机伶的幻觉引导，伯列恒之星应该是记住了这一设定。本来机伶……应该在那个精神的‘度假村’里面因为无穷尽的时间线跨越，被当成燃料燃烧殆尽的。可机伶抓住机会逃了出来，而香草星人被留在那里，应该是连同坏掉的伯列恒之星一起消失了吧。逃出来之后的事情，你也都知道了。"
uma_curren.38.a: "既然逃出来了，为什么还要把它找回来。"
uma_curren.39.desc: "这个时间线并不属于机伶，也没有对于机伶很重要的那个人。机伶再怎么‘可爱’也好，如果没有她在，一切就都没有任何意义。"
uma_curren.39.a: "你就不怕失败？"
uma_curren.40.desc: "如果机伶没有在某个节点之前完成，那宇宙时间线的自我修复机制会将机伶视为威胁，在不知在哪个时间线的哪个事件，把机伶本身连同所有残余一起，全都抹消掉。"
uma_curren.40.a: "你疯了……"
uma_curren.41.desc: "机伶，很喜欢在你的国家生活的日子。每个人都因为机伶的可爱而感觉到幸福，也都因为你的领导而感到幸福……但你终究是个外来人。你说的那些故事也可能都是随口而来。"
uma_curren.41.a: "我承认对你有所隐瞒，但从未说过谎。"
uma_curren.42.desc: "选择权在你，朋友。但就像机伶刚刚想说的，无论你怎么选，机伶都不会后悔过去的那些时光。"
uma_curren.42.a: "我很抱歉，朋友。但这个装置我们必须把它研究透彻。"
uma_curren.42.b: "如果可以的话，请让我们也帮忙。"

uma_curren.43.title: "可爱的终末"
uma_curren.43.desc: "真机伶眼帘低垂，无声注视着研究所的地面，任由赶来的研究人员们将伯利恒之星关停。伯列恒之星表面的锁孔碎裂开来，重新分解为无数的平面。\n“如果你想，我和我的人民依然欢迎你。”\n真机伶摇摇头，接着又点头，低声道：“谢谢你，但是机伶，现在想休息一下。”\n“如你所愿。”\n真机伶没走出几步，突然从虚空传来了熟悉的声音：“果然你也失败了。”\n突然出现的“§R真机伶§!”从身后抱住了真机伶，脸上带着得意的笑容。\n“那么，该清扫垃圾啦~”\n“等等，你是谁！”\n二人在消失的瞬间。望着空无一物的实验室，你和士兵们面面相觑。"
uma_curren.43.a: "这里是哪里？我们是在干什么？"

uma_curren.44.title: "可爱的未来/过去"
uma_curren.44.desc: "不可以的！对我这个使用者来说还好，如果发生什么意外，你们可能就会和香草星人一样……\n“所以，就需要麻烦你这个对香草星人的装置了解透彻的人带领我们了。我想其他人应该也不会有意见吧。”\n“永远支持真机伶小姐！”\n“谢谢你们……”\n“不用客气，我们是——朋友，对吧？”\n\n白色的邀请函在被真机伶接过的瞬间仿佛闪烁出了认可的光。伯列恒之星在吞没邀请函之后开始逐渐颤抖，散发出的波动从研究所扩散而出，蔓延到了感知雷达也触及不到的边缘。真机伶、你、跟随的几名士兵、研究所内的研究员、你的国家的人民、驻扎在虫洞边缘的太空商队、正在捕猎的黑洞蠕虫，以及被追猎的星系群……“可爱”的脚步遍及之处，都不约而同地感受到了某种平静，各自将视线和感知投向伯列恒之星所在的方位。\n“咔嚓”清脆的响声，轻轻敲打了所有生灵的精神。伯利恒之星从在场众人的眼中逐渐融化，没有形体的纯白，一点点涂过空间表面，粘腻地粘在视线之中。回过神时，已置身于概念化的⌈ ⌋之中。\n你回头看向身后。\n两个你看向身后。\n四个你看向身后。\n465亿光年外的你看向身后。\n\n无数的时间线，展列于眼前。看见那么多个自己的后脑勺必然不是那么让人舒服，于是你转过头，往真机伶的方向看去——"
uma_curren.44.a: "欢迎来到香草度假村。"
uma_curren.50.title: "Win！"
uma_curren.50.desc: "“诸位，伯列恒之星终于被我们摧毁了，能有如今的结果，都仰赖各位的倾力相助。机伶能遇见各位，真是太好了。“\n“可爱真机伶！”\n“刚才你指挥舰队的样子，真的很帅。谢谢你，愿意信任机伶。”\n过谦了，战局的关键部分，如果没有你的意见，恐怕结果都会不一样吧。\n“嘿嘿，如果只有机伶自己，是肯定没法走到今天的。”\n你要回去了吗。\n“嗯，因为机伶的未来要让哥哥一起见证。”\n祝你幸福。\n“别那么伤心嘛！这是机伶的联系方式，如果需要机伶的时候，叫机伶就好了～”"
uma_curren.50.a: "诶？"


