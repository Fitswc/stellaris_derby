l_simp_chinese:

uma_ar_mejro_ardan: "单程票"
uma_mejro_ardan.1.title: "奥德修斯和他的单程票"
uma_mejro_ardan.1.desc: "当这个裂隙撕开宇宙空间的时候，我们收到了一丝微弱的中微子信号。经过R&D部门的解密，我们最终认为这束信号来自于上个世纪由‘目白家族’创立的航天集团所发射的一颗私人卫星，其目的就是验证载马娘飞行的可能性。\n对于那个年代的记录，我们的资料库只遗存下来一份记录了航天员和控制中心的最后一段对话的时间轴录本：\n“控制中心，我不太清楚我被什么东西牵引住了，但我唯一清楚的是......以火箭的动力无法摆脱它......”\n“.....办法....”\n“我想没有了。”\n“很抱歉......我们......只能祝您好运。”\n“请不要灰心，也不要因为这场远征的失败而气馁，我们已经做到了我们能够做到的极致，当我们因为这一次失败便抗拒且惧怕尝试下一次，那才是真正失败的开始。我想我会睡上一觉，希望在我再度睁眼时，我们的火箭已经能够冲出太阳系了。我期待着这一天的到来，并且坚信......确信......自信......我们一定能够做到......”\n我们确定里面肯定存在一艘飞行器，但是到底是哪种飞行器？和那名失踪的宇航员有关吗？那名宇航员是否还活着？亦或，这只是又一条来自视界内的一条莫名其妙的通信？\n我想一探究竟。目白家的马娘们似乎对这次探索积极性异常地高。"

uma_mejro_ardan.1.a: "让我们进去看看吧"


uma_mejro_ardan.2.title: "漫漫路途"
uma_mejro_ardan.2.desc: "异界探球带着数名考察队的成员进入裂隙。意外的是，在数分钟后，周围的环境并没有出现明显的变化，依然如外面的宇宙一般平静，我们的考察队员很快产生了睡意，但是按照航行规则，在考察中睡觉是不被允许的。“呃，出去之后我想在我的晚餐上加上一杯芭菲”\n就在她们畅想今晚芭菲的味道时，仪表中的重力突然激增，我们的探球一头扎进了大气层，重重摔在草地上。幸好探球出色的性能，除了球表面被绕了几圈线之外，并无太大损失。\n片刻，我们的考察队就踏上了这片土地"
uma_mejro_ardan.2.a: "今晚的芭菲取消"

uma_mejro_ardan.3.title: "先驱"
uma_mejro_ardan.3.desc: "这里有着许多稀奇的物种，其中一些植物学家或生物学家便秉持着“来都来了”的原则，在前往目的地的道路中，也随带着取走此处的“特产”。也请不要太苛责，科学家们总喜欢这些新奇的玩意儿。\n不远处，一艘长满了绿色植被以及生了铁锈的火箭出现在众人面前。这艘火箭近乎断成两截。队员们下意识地站在火箭的残骸前默哀，并祈祷着三女神收去这位勇者的英魂。\n队员们在火箭的控制室找到了坐在椅子上的航天员，她原有的身躯已化作白骨，身上任穿着那身笨重的宇航服；她不再动弹的躯体也化作了植被的安身之所，现在的她简直已与大自然融为一体，自那空洞的眼眶之中生长着一朵开得灿烂的花儿。\n她可能在火箭抵达这座星球之前就因为食物的缺乏或是别的什么原因而逝去了\n在她的怀中抱着她的日记本，上面记录着她自始发的第一天，直到她离世前的最后一天。在日记的末尾，她用歪歪扭扭的字迹写着：\n“我已经离我的祖国，太远......太远...... ”当时的人们曾以为，她将会是星际版本的哥伦布或是麦哲伦这样的人物，却没想到，她连流落孤岛的鲁滨逊都不如。"
uma_mejro_ardan.3.a: "我们来接您回家了"

uma_mejro_ardan.4.title: "伊利亚特"
uma_mejro_ardan.4.desc: "在经过数日向标记信号源的行进后，我们的考察队员发现自己正处在一片水晶原，其品质也与如今采集到或从市场收购到的不同，这里的品质要较之外面更为上乘，其坚硬程度也可用作铸造船体护盾，不管任何情况下都是坚韧的。\n她们还没有忘记自己的目的，只能带着些恋恋不舍，继续行进。\n当她们行走至星球深处时，她们找寻到了一丝生活痕迹，有起来谁曾经在这里待过，并且时间不短。她们自然想到了那名航天员，而后续从中发现的符合当时年代的便携式生存工具与背包也证实了这一点。而在稍远处，她们也发现了一个上世纪火箭残骸，上面留有维修过的痕迹，但显然她并未成功。\n调查员们在工具包中找到了数本笔记本，页纸都已泛黄，仿佛轻轻翻动便能将纸捏成碎片。而在那名航天员生活的地方，她们也在一部分地面的刻痕上发现了字迹，可能是续着笔记本写下的内容。她们小心地扫描着笔记本与其他遗留有笔迹的地方，并同步传输至指挥中心。\n可能她曾想过，自己有朝一日肯定能被同族的人找着的，只是时间问题罢了，而她自己也相信，自己写下来的这些东西也能够稍微帮上她们的忙。她在每本笔记的开头与每一章节的开头都写着：\n“致我敬爱的朋友们......嘿！如果您姓目白，不......哪怕您不姓目白......”"
uma_mejro_ardan.4.a: "应该还未到结束的时候"

uma_mejro_ardan.5.title: "画中人"
uma_mejro_ardan.5.desc: "在考察队通过在星球表面的地洞前往星球核心位置时，她们在路上发现这里的晶体奇妙的相连接在一起，像是血管一般往更深处输送着什么。\n随着她们的深入，此处的秘密面纱也逐渐被揭晓。\n位于星球中央的核心，在那里有着一颗巨大的菱形水晶，而四周的晶体也似环抱一般簇拥在它的周围。当调查员们注意到菱形水晶中的事物时，无不瞠目结舌。\n那颗菱形的晶体被安置在最中央，被包裹在其中的正是她们找寻已久的目白阿尔丹。她穿着那身二十世纪的航天服；她闭着双眼，双手平静交叠在一起，显现出她孩童般的娴静，让众人觉得，不管她如何进入晶体其中的，那时的情绪是如何的，可能是被强迫，可能是主动接受，但至少她此刻的模样，她表现的很幸福。现在的她，模样就像被浸在琥珀中的史前生物，没有经过衰老、腐朽，继而变成一个骨头架子，而是浸润在晶体之中，仿佛世间一切青春与美好都永久地环绕在她的周围，以令她保持着自身的年轻靓丽、英姿飒爽。就像永远活在人们心里与艺术创作中的：“身着航天服的目白阿尔丹”形象。这时谁又能想到她是一位生活在近两三百年前的老人呢？\n她们不由感叹着，往常只在书本插画或是类似墙绘横幅等等地方的“画中人”阿尔丹，此时真真正正地出现在了众人的面前，多少有着些小偶像亲眼见到自己的崇拜对象的兴奋情绪。\n当官方的人员还正思考着现在的阿尔丹还是否留有生命体征，若是擅自挪动这块中央晶体的话是否会导致星球的崩溃？在另一边，目白家的成员已经取出切割设备，准备将阿尔丹送回特雷森了。\n只有这种时候目白家族的她们才会搁下自己的矜持与风雅。\n“喂！你们这样可太莽撞啦！”"
uma_mejro_ardan.5.a: "我们的睡美人"

uma_mejro_ardan.6.title: "融冰之时"
uma_mejro_ardan.6.desc_a: "众人将阿尔丹的性命托付给主持项目的$AGT$，并且嘱咐了她许多话，像是稍微小心点啦云云。\n熟悉$AGT$的科研人员常形容$AGT$的实验：“虽然过程总是如此惊险，但你会发现她那是近似于炫技、唬人的技巧，实际上她的效率与成功率都是迅速且安全无险的。她就是那种极具恶趣味的人。”不知是$AGT$认真听取了嘱咐的话，还是她自己也知道这是一件极其严肃且认真的重要事项，不容马虎。整场下来可以看见她很务实地做着，没有搞多余的事情，这也让从旁的人放下了点儿心。\n项目持续仅不到一小时，“破冰行动”宣告完成。现在的阿尔丹正平静地躺在疗养床上，面色带着些红润，缓慢且平稳的呼吸让众人晓得：她现在还活着，正睡着。没有谁是比目白家的人要来的兴奋的了，要不是现在就在目白阿尔丹身边，她们准要大声呼喊上几句，再到大操场上跑上个几千几万米路。\n现在阿尔丹所要做的便是静静修养，等到哪一天她自己醒来的时候。"
uma_mejro_ardan.6.desc_b: "众人将阿尔丹的性命托付给主持项目的科研总管，并且嘱咐了她许多话，像是稍微小心点啦云云。\n她自己也知道这是一件极其严肃且认真的重要事项，不容马虎。整场下来可以看见她很务实地做着，没有搞多余的事情，这也让从旁的人放下了点儿心。\n项目持续仅不到一小时，“破冰行动”宣告完成。现在的阿尔丹正平静地躺在疗养床上，面色带着些红润，缓慢且平稳的呼吸让众人晓得：她现在还活着，正睡着。没有谁是比目白家的人要来的兴奋的了，要不是现在就在目白阿尔丹身边，她们准要大声呼喊上几句，再到大操场上跑上个几千几万米路。\n现在阿尔丹所要做的便是静静修养，等到哪一天她自己醒来的时候。"
uma_mejro_ardan.6.a: "做的好"
uma_mejro_ardan.7.title: "新世纪的旧时代公民"
uma_mejro_ardan.7.desc: "阿尔丹醒过来了。这其实是个秘密，并没有多少人知道。她很快就能下床了，医护人员都劝她先休息，可她偏不，最后倒也同意了。\n为了不惊扰到阿尔丹的休息，目白家只派了三位小代表。\n阿尔丹总会到外面的花园子里，这时候总会有三个小家伙偷偷摸摸地跟过来。她总招呼着她们过来，打趣说：\n“老是傻站在那儿干吗呢？难道是怕我吗？”\n每当阿尔丹对当下进步感到惊讶时，她们不免哑然失笑，她们国家的疆域也早不局限于一个星球、一个星系，她们早已一跃成为整个银河系都不容忽视的星际文明。她仍需要适应。就像她不久前才知道自己成为了一代人的精神象征一样\n想到熟悉的人与物都早早地随时间逝去了，不免悲戚，常趁着三位小代表离开时自己在房间里抽泣。\n当她们问起阿尔丹当时为什么会在那块晶体里面。\n“它们......不太平常，它们能够自然生长，这一点匪夷所思，但它缺少一个像我们一样脉动着的心脏，我就想：‘我能不能呢？反正我待在这里也会有一天因为食物匮乏而死去。’想到这里之后，我就主动与它们接触了，最终融入到晶体里面去......实际上这种体验可能有些类似于植物人，当时调查队来的时候，我能够感受到她们，她们就像骑士一样。现在看来，这个选择不坏。”阿尔丹轻笑着说道。\n幼时怂恿着阿尔丹的蓬勃朝气此时又在心底里显现了。她托小代表为她购来许多书籍，学习起这两百年后的科学与人文。\n看得出来，阿尔丹是绝不会放下一切去某个地方平静生活的。"
uma_mejro_ardan.7.a: "了不起的人儿"



uma_mejro_ardan.adname: "目白阿尔丹"
uma_mejro_ardan.8.desc: "初次见面，[Root.ruler.GetRulerTitle]。本次我与您沟通，实属我的个人请求。"
uma_mejro_ardan.8.a: "阿尔丹找我们有什么事呢？"
uma_mejro_ardan.9.desc: "我希望得到一个就职的机会，我不希望我只是像一个动物园里的珍稀动物一样好好过活着，我希望能够继续从事我的事业......如果这项职业需要进行考试评测，请给我这样的一个机会，即便我考试不过，我也不会迁怒于你，为此我已做足了功课......"
uma_mejro_ardan.9.a: "那么你还想要成为一名科学家吗？"
uma_mejro_ardan.10.desc: "怎么不想呢，[Root.ruler.GetRulerTitle]？我打小便填上这个志愿，并希望为其奋斗终生。"
uma_mejro_ardan.10.a: "可是你的身体......能够支持吗？"
uma_mejro_ardan.11.desc: "我的身体早已不碍事......不然特雷森联盟号的首席航天员便不会是我了，这些都是可以证明的。"
uma_mejro_ardan.11.a: "尽管如此，我们仍希望你好好休息"
uma_mejro_ardan.12.desc: "[Root.ruler.GetRulerTitle]，我已经休息了两百多年了。"
uma_mejro_ardan.12.a: "好吧，如果阿尔丹你能通过考试，那么我们就接收你"
uma_mejro_ardan.12.a.repo: "感谢你，[Root.ruler.GetRulerTitle]。我很高兴我即将要回到我的位置上去。"
uma_mejro_ardan.13.title: "统一考试"
uma_mejro_ardan.13.desc: "阿尔丹即将复出的消息早已通过各式各样的门道给传遍了，而之后官方也发表了正式的通知来证实消息的属实。人们虽然热情，但能够独立思考，她们并不会组团打着横幅到阿尔丹休息的地方去吵吵闹闹，只是偶尔会有一些小粉丝，三三两两的凑到那附近，看看有没有机会一睹真容。但可惜的是，阿尔丹一直未曾出门。人们猜测她正在好生修养，但实际上她正日夜兼程、如饥似渴地学习着本世纪的知识。来自二十三世纪的知识只要轻轻一推便冲垮了她二十世纪的大脑。\n随着一届科学技术人员统一考试的落幕，一些格外细致群众从国立科学院的招收名单上看到了熟悉的名字：\n目白阿尔丹。"
uma_mejro_ardan.13.a: "她考上了"


UMA_MEJRO_ARDAN_SAVE_AD: "Melt"
UMA_MEJRO_ARDAN_SAVE_AD_DESC: "我们的考察队在裂隙中将包裹在水晶中的阿尔丹带了回来。显而易见，我们不可能将这具水晶棺放在博物馆中，为了确认被困在里面的阿尔丹是否存活，我们必须要把她从里面救出来。"



uma_mejro_ardan.14.desc: "§Y目白阿尔丹捧着教科书，步履轻盈，像羽毛飘落地面，随后又升起，又飘落。\n她对如今时代的变化适应的相当好，脸上都充斥着孩童似的欢快与活泼，还有少不了的好奇。\n随后她立马站住了，面露惊讶，她可不知道学生会书记居然悄无声息地站在这儿呢。§!\n“你好，[Root.ruler.GetRulerTitle]，是有公务要来这里吗？\n如果需要的话，我可以陪同着，这里的每一位同事与教授我都很熟悉。”"
uma_mejro_ardan.14.a: "不，我只是来看看你的情况怎么样"
uma_mejro_ardan.14.a.resp: "§Y她很柔和地笑了起来，像是很感激这样的举措。§!\n“不用为我担心，[Root.ruler.GetRulerTitle]。再怎么说，算上被封住的时间，我也是个几百岁的人了！现在的各种知识学说令我眼花缭乱，老实讲，以前我学的物理知识，放到现在就跟白学过似的，其实这多少令我有些难过。也正因如此，我乐于接受现在如此先进的知识，它们总让我受益良多。我相信再过不久，我就能重回岗位工作。”"
uma_mejro_ardan.14.b: "看来你和她们相处的很好"
uma_mejro_ardan.14.b.resp: "“是的，[Root.ruler.GetRulerTitle]。我甚至可以很自傲地同你说，这处设施里每一位同事的脸我都能够认得，并且叫出名字来！”\n§Y她的脸上果真浮现出了那般骄傲的神情，但看上去仍是那么温和、那么谦卑。§!\n“她们教我现在的物理学与航天科学，还教我现代的常识与自我那一代往后到现在的历史，没有她们，我现在指定还蹒跚学步地读着课本呢。是的......她们帮了我许多忙。”"
uma_mejro_ardan.14.c: "我相信你仍能工作，但我们害怕，你再出现那样的意外"
uma_mejro_ardan.14.c.resp: "“在我那时候，我已经把我可能会遭遇到的一切困境与绝望都想了个遍，别人也说我的身体哪怕挺过模拟测试，也不太能挺过真实的太空环境。但即便如此，我仍然选择登上火箭。”\n§Y她的眼神那样坚毅，使人不知不觉联想到两百年前某位记者留下的一张照片：她穿着笨重的航天服，转过身去，作出微笑，抬起的右手比着代表胜利的“V”。§!\n“往后退一步，就是要把曾经意志坚定的自己彻底否决掉；我们发展到现在，绝不是靠着对过去的留念，而是我们能够昂首阔步向前走的信念。”"

uma_mejro_ardan.14.hire: "欢迎回来"
uma_leader_ardan: "航天先驱目白阿尔丹"
uma_mejro_ardan.15.title: "百年前的今天"
uma_mejro_ardan.15.desc: "不知何时，在发现阿尔丹的裂隙前突然出现了一个星球。似乎是裂隙将科考队登上的星球吐了出来，至于原因我们不甚清楚，但是是事实是，我们又多了一处可以殖民的星球。"
uma_mejro_ardan.15.a: "甚好"

uma_pc_ardan_planet: "奥特洛伊"


