uma_still_in_love.1.name: "Promoting full-scale simulation experiments?"

uma_still_in_love.1.desc: "After promoting the fully realistic grassland based on VR training facilities to the wholesociety, we have collected a large amount of relevant data. The scientific research department recently proposed alarge-scale research project codenamed 'EVERLASTING BEATS', aiming to improve the fully realistic simulation system'Mega Dream', deeply analyze the perception of Ma Niang, and use it to assist field research."

uma_still_in_love.1.a: "Approve it."

uma_still_in_love.1.a.tooltip: "Open the next event chain"

uma_still_in_love.1.b: "We should focus on economic development."

uma_still_in_love.1.b.tooltip: "Gain 150 influence"