uma_menace_crisis_description_title: "马娘的世界"
uma_menace_crisis_description_intro: "星海共同体中那些希图在历史的长河中照见未来的人们长期以来一直设想会有一场将要降临的§R天灾§!——一场所有智慧生命的生死危机，唯有倚仗前所未有的万众一心与前仆后继方能克服——如果真有可能克服的话。\n\n流行的关于何为这场天灾的本质的预测相当异想天开，比如系外掠食者入侵，再比如星系中机械智能星火燎原，又或是其他位面的继位战争波及而至，但是……\n\n如今显而易见的是，那个天灾一直都会是§R我们§!。"
uma_menace_crisis_description: "$menace_crisis_description_intro$\n\n我们的一举一动激起的涟漪，回响在一个能量无限的维度中。我们只需发现如何驾驭这种能量就能让整个星系向我们卑躬屈膝。"
uma_menace_crisis_howto_title: "威慑力与引擎"
uma_menace_crisis_howto: "作为天灾完成§H天灾目标§!来产生£menace£§H威慑力§!，这样便能解锁帝国的毁灭性潜力，助您完成建造以太相引擎巨型结构的任务，为星系带来一个新的时代。"

uma_crisis_path_orbital_ring: "领域空间篡改器"
uma_crisis_path_orbital_ring_DESC: "别名破窗锤，可以将领域能集中起来，扭曲或者撕裂当前的空间，将我们的种族从这由藏在裂隙后的物体制造的不确定性中解放出来"






