 tech_uma_atom_breker: "Rapid molecular splitting agent"  #NT!
 tech_uma_atom_breker_desc: "This magical potion can quickly split molecules into atoms \n\nModifier:\n Gas refiner maintenance: §G-8%§!"  #NT!
 tech_uma_atom_sticker: "Rapid atomic combination agent"  #NT!
 tech_uma_atom_sticker_desc: "As its name suggests - this magical potion can easily combine a bunch of atoms into different molecules \n\nFixed:\n $mod_planet_jobs_alloys_upkeep_mult$ §G-10%§!\nGiant structure Build speed: §G+8%§!\n Military ship maintenance: §G-6%§!"  #NT!
 tech_uma_effective_catalyst: "High-efficiency catalyst"  #NT!
 tech_uma_effective_catalyst_desc: "This catalyst can greatly increase the reaction speed \n\n Correction:\n Specialist Produce: §G+7%§!"  #NT!
 tech_uma_tg_alloys_maker_Automatic: "TG-Automated Alloy Manufacturing Factory"  #NT!
 tech_uma_tg_alloys_maker_Automatic_desc: "The alloy factory has been automated and can continuously produce large amounts of alloys only if power is turned on"  #NT!
 tech_uma_tg_alloys_maker_Automatic_2: "TG-Automated Alloy Manufacturing FactoryⅡ"  #NT!
 tech_uma_tg_alloys_maker_Automatic_2_desc: "The alloy factory has been automated and can continuously produce a large amount of £alloys£alloys with just power-up."  #NT!
 tech_uma_tg_custom_goods_productor: "TG-Automated Consumer Products Factory"  #NT!
 tech_uma_tg_custom_goods_productor_desc: "The consumer goods factory has been automated and can produce a large amount of £consumer_goods£consumer goods by simply turning on the power "  #NT!
 tech_uma_tg_custom_goods_productor_2: "TG-Automated Consumer Products FactoryⅡ"  #NT!
 tech_uma_tg_custom_goods_productor_2_desc: "The consumer goods factory has been automated and can produce a large amount of £consumer_goods£consumer goods by simply turning on the power"  #NT!
 tech_uma_tg_industrial_complex: "TG-industrial complex"  #NT!
 tech_uma_tg_industrial_complex_desc: "This factory seems to be able to produce anything!"  #NT!
 tech_uma_tg_planet_energy_extractor: "TG-Planetary Energy Extractor"  #NT!
 tech_uma_tg_planet_energy_extractor_desc: "This building can extract the energy of the planet's nucleus to produce a large amount of £energy£ energy"  #NT!
 tech_uma_tg_planet_energy_extractor_2: "$tech_uma_tg_planet_energy_extractor$Ⅱ" #NT!
 tech_uma_tg_planet_energy_extractor_2_desc: "$tech_uma_tg_planet_energy_extractor_desc$"  #NT!
 tech_uma_tg_resource_soil: "TG-High-voltage resource storage"  #NT!
 tech_uma_tg_resource_soil_desc: "This storage tank can store a large amount of materials in a very advanced way"  #NT!
 tech_uma_super_high_temp_container: "High temperature container"  #NT!
 tech_uma_super_high_temp_container_desc: "This container can withstand extreme high temperatures \n\nFixed:\nWorker resources produce: §G+7%§!"  #NT!
 tech_uma_high_presure_molt: "High-energy particle concentration process"  #NT!
 tech_uma_high_presure_molt_desc: "Explosive particles will be compressed at high pressure to accommodate more high-energy particles in a smaller volume. \n\nFixed:\n Ship Weapon Damage §G+20%§!\n Ship Weapon Range §G+7%§!"  #NT!
 tech_uma_weapon_controler: "Weapon control system"  #NT!
 tech_uma_weapon_controler_desc: "Advanced weapon control system can help us control various weapons more easily \n\nFixed:\n Ship weapon range §G+3%§! \nAccuracy §G+10%§!"  #NT!
 tech_uma_energy_raiser_b70: "B70 Energy Amplifier"  #NT!
 tech_uma_energy_raiser_b70_desc: "This energy amplifier can greatly enhance the energy level \n\nFixed:\nBasic ship speed §G+5%§! \nStar base module cost §G-10%§!"  #NT!
 tech_uma_high_energy_electoric_projector: "High-energy electron stream transmitter"  #NT!
 tech_uma_high_energy_electoric_projector_desc: "This device can quickly emit high-energy electronic flow \n\nFixed:\nShip weapon fire rate §G+10%§!"  #NT!
 tech_uma_combine_light_projector: "Broadcast light generator"  #NT!
 tech_uma_combine_light_projector_desc: "This device can emit powerful beam light and emit huge energy \n\nFixed:\nShip weapon fire rate §G+10%§!"  #NT!
 tech_uma_MAAM: "TG-MAAM missile"  #NT!
 tech_uma_MAAM_desc: "TG multi-child missiles can intensively strike target ships"  #NT!
 tech_uma_QAAM: "TG-QAAM missile"  #NT!
 tech_uma_QAAM_desc: "TG tracking enhanced missiles can accurately strike target ships"  #NT!
 tech_uma_tg_reaction: "TG-Reactor"  #NT!
 tech_uma_tg_reaction_desc: "TG enhanced reactors can generate huge energy in a short time"  #NT!
 tech_uma_arch_weapon: "TG-Arc Weapon"  #NT!
 tech_uma_arch_weapon_desc: "TG arc weapon, can break through the target ship with huge energy emitted in a short time"  #NT!
