uma_marking.4.title: "StellarDerby has Update"
uma_marking.4.desc: "The £uma_sd£StellarDerby version you saves is [event_target:global_event_country.UMA_SD_VER]. Huh, it seems older than the current version. The update includes the following: \n\nAdd: New Umamusume special leader: Almond Eye and a new related resource system; Add these new leader into leader compound system, by the way, fix the localization.\n\nAlthough the auto-fix has changed the planet types, due to the nature of Paradox Interactive save files, this update may cause planet type corruption. \n\n No auto fix because this leader anomaly generated at game start."
uma_marking.4.a: "OK"

uma_marking_system_update_info_on: "It seems that you have already started playing this End-time catastrophe. However, the modifications caused by this update cannot be quickly fixed through this event. §Y If possible, please roll back to before the natural Crisis. §! If not, the button below can help you §Y immediately end the Crisis §! Of course, you can also choose to continue playing, but §Ryou might not be able to complete the event chain!§! .\nSorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!"
uma_marking_system_update_info_off: "However, it seems to have no impact on the save data of the old version. Wish you a pleasant time playing. Thank you for your support (love)."
uma_marking_system_update_info_1_on: "It seems that you have already started playing this End-time catastrophe. As a mistake, Factor endcrisis seems could not start before this fix. You can begin end crisis by using the option below.\nSorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!Sorry!"
