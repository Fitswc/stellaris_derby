##EC2

uma_ec_2.20.title: "Strange Device"
uma_ec_2.20.desc: "We have noticed that the Umamusume Fallen Empire seems to have established a mysterious device in a certain star system. Concurrently, all Fallen Empires appear to have collectively merged into the Umamusume Fallen Empire. What is happening? Perhaps we can send a Science Ship to investigate."
uma_ec_2.20.a: "Approve"
uma_ec_2.21.title: "Chairwoman Akikawa"
uma_ec_2.21.desc: "Have you discovered these Domain Amplifiers? Listen, children, you have touched the forbidden. You should not have developed the Domain to this extent... I have warned you about this. Now, according to the covenant with §YThem§!, we must eliminate you and all other nations, regardless of whether you have seen §YThose Visions§!. This is our mission, and we hope you will understand..."
uma_ec_2.21.a: "??? What's going on"

uma_ec_2.22.title: "Chairwoman Akikawa"
uma_ec_2.22.desc: "Listen, children, you have touched the forbidden. You should not have developed the Domain to this extent... I have warned you about this. Now, according to the covenant with §YThem§!, we must eliminate you and all other nations, regardless of whether you have seen §YThose Visions§!. This is our mission, and we hope you will understand..."
uma_ec_2.22.a: "??? What's going on"
uma_ec_2.23.title: "Source of Disaster"
uma_ec_2.23.desc: "The once-quiet Umamusume Fallen Empire has, at some point, begun unconditionally attacking all nations. Through our intelligence network, we have learned that this seems to be because a certain Umamusume Empire developed their own power beyond a certain limit."
uma_ec_2.23.a: "Prepare Defenses"
uma_ec_2.24.title: "Domain Amplification"
uma_ec_2.24.desc: "The starbases equipped with Domain Amplifiers, scattered throughout the capitals of the former Fallen Empires, seem to effectively boost the Umamusume Fallen Empire's combat power. We must destroy them to reduce our casualties. Simultaneously, we need to invade the Umamusume Fallen Empire's capital, Noah, to open negotiations with them."
uma_ec_2.24.a: "$OK$"
uma_ec_2.25.title: "Chairwoman Akikawa"
uma_ec_2.25.desc: "§gTurn off the camera—yes, is it off? Good.§!\nAh... you've already attacked this far... We have failed. §YThey§! have seen all of this."
uma_ec_2.25.a: "Who are They"
uma_ec_2.26.desc: "§YThe Three Goddesses§!\nBillions of years ago, we made a covenant with Them: to monitor the Umamusume civilization's Domain development and punish those who cross the line... You are a generation with a considerably high level of development, congratulations. But our journey is coming to an end. If our defense fails, the Three Goddesses will erase us along with this entire universe. However, due to Domain {EXTERNAL INTERFERENCE}, we will depart first; §Yunless you have the confidence to oppose 'God'§! \nOtherwise, please migrate your population to our final ark: §YNoah§!'s §YVitality§!. This is my last request... please...\n{NOISE}\n{NOISE}\n{SILENCE}"
uma_ec_2.26.a.resp: "{SILENCE} {ECHO}"
uma_ec_2.26.a: "Chairwoman?"
uma_ec_2.27.title: "Noah and the Great Flood"
uma_ec_2.27.desc: "No matter how we try to contact them later, the communication channel remains silent. As for whether to migrate the capital to Noah, there are still many internal disputes. We trust that our [ruler.GetTitle] will, as always, make a compelling decision."
uma_ec_2.27.a: "We will migrate to Noah"
uma_ec_2.27.b: "We will not yield"
uma_ec_2.27.c: "I... do not know"
uma_ec_2.27.a.tt: "Migrate capital to Noah"
uma_ec_2.27.b.tt: "Do not migrate capital to Noah (Follow-up content still planning)"
uma_ec_2.27.c.tt: "This requires some time to consider..."
uma_ec_2.28.title: "Shockwave"
uma_ec_2.28.desc: "As our ships approached the Umamusume Fallen Empire's home system, *Past*, a huge shockwave was suddenly emitted, causing tremendous damage to our vessels. It seems we should not risk entering before we reduce their Domain strength to a certain level."
uma_ec_2.28.a: "Fearsome"
uma_ec_2.29.title: "Shockwave"
uma_ec_2.29.desc: "As our ships approached the Umamusume Fallen Empire's home system, *Noah*, a huge shockwave was suddenly emitted, and our vessels were instantly vaporized. It seems we should not risk entering before we reduce their Domain strength to a certain level."
uma_ec_2.29.a: "Fearsome"
uma_ec_2.31.title: "Boarding"
uma_ec_2.31.desc: "We boarded Noah and migrated our capital here as per Chairwoman Akikawa's request. Although we don't understand why she pleaded with us to do this, I believe she must have had a reason... perhaps the Three Goddesses she mentioned?\nAfter everything settled, an unregistered nation calling itself §YThe Three Goddesses§! suddenly requested communication with us."
uma_ec_2.31.a: "Connect Communication"
uma_ec_2.32.title: "The Three Goddesses"
uma_ec_2.32.desc: "§PThe new children. It is good to see you. As you know, we are the Three Goddesses—the same Three Goddesses who created your species and whom you worship.§!\n§BGet to the point with them, Lamb.§!\n§PFine... I wanted to say hello to them... As you can see, Vitality is an ideal city, and we want you to continue the work of the previous children—observing the nascent children, and preventing them from... following the same path as you.§!\n§H...The Domain is very dangerous; many children have died because of it...§!\n§PThe Domain will cause your universe to be forcefully unfolded, eventually disappearing into the unknown.§!\n§BBut you've controlled it well, children. We are also doing our best to help reduce the Domain's impact on your universe. Now, are you willing to accept this job? Observe the nascent children, guide them; we will assist you as much as possible to ensure your empire's eternal prosperity.§!\n§H...Of course, if you are defeated...§!\n§PAlright, alright, I believe in your abilities. Well, do you accept?§!"
uma_ec_2.32.a: "Accept"
uma_ec_2.32.a.tt: ""
uma_ec_2.32.b: "Accept"
uma_ec_2.32.b.tt: "Why can't we refuse?"
uma_ec_2.32.c.tt: "Why can't we refuse?!"
uma_ec_2.33.title: "The Three Goddesses"
uma_ec_2.33.desc: "§PThank you, children. We will soon provide you with resources. We hope you have a pleasant life... feel free to contact us anytime if you need any help.§!\n§PAlso, I can give you a little... small prophecy: in a number of years, your nation will produce a great Chairwoman, your technology will be highly advanced, and a child of extraordinary talent will be born. Well, that's all I can say. Goodbye.§!"
uma_ec_2.33.a: "Of course"
