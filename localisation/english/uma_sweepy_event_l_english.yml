l_english:
  
  
 uma_sweepy.1.title: "Mysterious Forum"  #NT!
 uma_sweepy.1.desc: "Ma girls are always curious about various unknown phenomena. Recently, we found that a popular forum website appeared on the Internet. The forum is called "Moonstone", which claims to be a main association for magic and various §YResearch on Supernatural Phenomena§!, and most of the posts in the forum are related to so-called magic and supernatural phenomena. It contains mysterious sticks that can only appear at night, etc. The investigation department, who was bored, applied to investigate the forum."  #NT!
 uma_sweepy.1.a: "Investigate what this forum is"  #NT!
 uma_sweepy.1.b: "What's so strange about this kind of forum?"  #NT!
 uma_sweepy.2.title: "Mysterious ForumⅡ"  #NT!
 uma_sweepy.2.desc: "The results show that the forum was established about half a year ago. Its founder is called Sweepy Tonson and is a student of Tracen University. It is worth mentioning that Dongshang was born into a family with a strong academic atmosphere. Her parents were both senior scholars of the Tracen Academy of Sciences. She seemed to have believed that science could not explain everything since she was a child, but instead had a strong interest in magic and supernatural phenomena."  #NT!
 uma_sweepy.2.a: "The content written in these posts is really interesting. Ask her where these writing materials come from."  #NT!
 uma_sweepy.2.b: "It seems that Tracen Academy is full of talents."  #NT!
 uma_sweepy.3.title: "Sweepy Tonson"  #NT!
 uma_sweepy.3.desc: "This is the Moonstone Supernatural Magic Research Association. I am a genius——magic girl, sweepy, is there anything wrong?"  #NT!
 uma_sweepy.3.a: "I am [This.GetRulerTitle][This.GetRulerName]. I want to talk to you about your forum."  #NT!
 uma_sweepy.4.title: "$uma_sweepy.3.title$" #NT!
 uma_sweepy.4.desc: "Hey hey hey? Why [This.GetRulerTitle] contacted me in person? Is there something wrong with my forum?"  #NT!
 uma_sweepy.4.a: "Not so, I'm just interested in what's in the post."  #NT!
 uma_sweepy.5.title: "$uma_sweepy.3.title$" #NT!
 uma_sweepy.5.desc: "Humph, these contents are absolutely real materials obtained by my personal investigation. Although I haven't had time to conduct a deeper investigation, I believe these phenomena must be because of magic."  #NT!
 uma_sweepy.5.a: "学生会可以动用部分调查部门的资源帮你探寻造成这些事件的原因"  <"Student Union can use some of the resources from the investigation department to help you explore the causes of these incidents."  #NT!
 uma_sweepy.6.title: "$uma_sweepy.3.title$" #NT!
 uma_sweepy.6.desc: "Humph, I am the future great witch sweepy, and I can find these magics myself. But it’s better if you are willing to help me, then you will be my Servant in the future!"  #NT!
 uma_sweepy.6.a: "诶？使魔？"  <"Eh? Demon?"  #NT!
  
  
  
 ##ARC 
 uma_sweepy_arc_heat_building: "Fever corridor"  #NT!
 uma_sweepy_arc_heat_building_desc: "There is a residential building in the Sakura Community. It is obviously very cool on rainy days, but the floor temperature of the corridor can reach a high temperature of nearly 70℃. Sweepy Tonson believes that this is because a magic circle was engraved under the corridor, and the rain activated the magic circle to launch it to increase the temperature on the ground. It's time to investigate."  #NT!
 uma_sweepy.101.a: "$CURIOUS$"  #NT!
 uma_sweepy.10.name: "Natural disasters"  #NT!
 uma_sweepy.10.desc: "The investigation team learned from the residential building that the abnormal rise in the ground of the corridor has lasted for about half a year. On weekdays, the temperature at the ground is significantly higher than that of the nearby ground. When it rains, the temperature is even higher, and it can even cause the rainwater to evaporate directly. \nResidents of the community are worried that there will be natural disasters that cause this strange phenomenon. \nThe investigation team quickly contacted the local earthquake detection experts for testing."  #NT!
  
 uma_sweepy.11.name: "Magic circle?"  #NT!
 uma_sweepy.11.desc: "However, after analyzing and comparing the data collected by the earthquake detector, the technician said that there is no possibility of earthquakes in the area in the near future. \n Someone in the investigation team asked whether it was the abnormal increase in the ground temperature caused by the power system failure? However, after the power company sent professional emergency repair personnel for inspection, it was found that there were no underground cables buried underground in the building, which eliminated the possibility of power failure. Similar water pipe failures and natural gas transmission pipeline failures may also be eliminated one by one. \nSome people also say, will there be geothermal resources such as underground hot springs underground? However, the local area has already conducted geological surveys, and the survey results have long shown that there is no geothermal resources underground. \nThis is not that nor that, what is going on? The investigation team even dispatched more advanced and more accurate natural disaster detection equipment, but the result was that there were still no signs of natural disasters. The power department also conducted multiple inspections of the circuit system, but still no results were found. Is it really as the Sweepy Tonson thought, is it really because the magic array was engraved underground and the rain activated the array to cause the temperature to rise?"  #NT!
 uma_sweepy.11.a: "Think of another way"  #NT!
  
 uma_sweepy.12.name: "CaO"  #NT!
 uma_sweepy.12.desc: "Finally, the unsuccessful investigation team decided to dig the ground to find out. Unexpectedly, just after digging less than half a meter deep, a large piece of quicklime was dug out. It turned out that when the residential building was built, the construction workers might have dumped the construction waste here to save trouble, and sealed the place with cement so that the quicklime could not touch the water. After decades, the building aging and continuous rainy weather caused water seepage here. The rainwater generated a lot of heat energy after contacting quicklime. Because the surface cement cover could not be well distributed, the temperature of the ground at the end eventually led to an abnormal increase in the long-term temperature."  #NT!
 uma_sweepy.12.a: "Why can't you just dig the ground and take a look when you investigate?"  #NT!
  
 uma_sweepy_arc_ice_from_sky: "Blue ice falling from the sky"  #NT!
 uma_sweepy_arc_ice_from_sky_desc: "When the villagers of Donghai Village were working in the carrot field, they suddenly heard a strange sound in the sky. They looked up and saw two shining white things falling from the sky. After landing, they found that they were two pieces of blue ice. The sky is cloudless and no planes fly by. How did these two pieces of ice come from? The Sweepy Tonson believed that it was someone in the sky who used ice magic to produce blue ice."  #NT!
  
 uma_sweepy.13.name: "Treat all diseases"  #NT!
 uma_sweepy.13.desc: "The investigation team came to Donghai Village for investigation and found that the local villagers who were falling into the ice said that she was working in the fields at that time and suddenly heard a strange sound, and then she saw a ball of shining white things falling into the woods next to her. After a while, another piece of the same thing fell from the sky. The villagers went to the woods and found that the fallen objects were two pieces of blue ice. \nSome villagers tasted the falling ice cubes, which mean that they tasted salty, bitter and sweet. Some superstitious villagers claimed that this was the Tianbing that cures all diseases. \n Some villagers have made a guess, would this be just a special hailstone? The investigation team contacted the local meteorological bureau. After checking the data of the day, professionals raised their opinions, saying that the climate on that day was particularly stable and there was no conditions for hail to form. After seeing Lan Bing's video data, it is certain that the appearance of ice has nothing to do with the weather."  #NT!
 uma_sweepy.13.a: "No matter how superstition is coming"  #NT!
 uma_sweepy.14.name: "Ice"  #NT!
 uma_sweepy.14.desc: "An astronomer in the investigation team put forward her own opinions, and she believed that these two pieces of ice were likely to be extremely rare ice phenomenon. In long-term space exploration, we have known that there are a large number of ice in space. Scientists believe that ice can also enter the atmosphere like meteorites to form meteorites. Since the isotope ratio of water in space is not the same as that of water on earth, the investigation team immediately sent the ice water sample to the physical and chemical testing center for isotope testing. However, it was found that the water sample was within the range of the earth's water, which turned out to be the ice from the earth."  #NT!
 uma_sweepy.14.a: "$CURIOUS$"  #NT!
 uma_sweepy.15.name: "Possibility of aircraft"  #NT!
 uma_sweepy.15.desc: "The investigation team had to investigate again what caused the blue ice to fall. Is there really so-called ice magic? At the beginning of the investigation, the investigation team ruled out the possibility of the plane because the villagers unanimously denied that an aircraft flew through the sky when the ice fell. However, as various possibilities were eliminated one by one, experts had to start thinking about whether the plane caused the blue ice to fall from the sky. The follow-up investigation showed that under the air route, would Lan Bing fall from a plane far away from the village, and then the ice cubes fall into the village due to the effect of airflow? Why does blue ice appear on the plane?"  #NT!
 uma_sweepy.15.a: "$CURIOUS$"  #NT!
 uma_sweepy.16.name: "Well--"  #NT!
 uma_sweepy.16.desc: "Finally, the investigation team learned that in order to ensure that there is no odor flowing out of the bathroom on the plane, passengers' excrement will be vacuum-pressed into the sewage tank and then added chemicals to react. After the reaction, a blue solution will be obtained. If the sewage tank cover on the plane is not closed tightly, the sewage will leak out and freeze on the surface of the plane. The freezing becomes heavier and he will fall off the surface of the plane. In other words, these blue ices are actually the excrement of passengers on the plane."  #NT!
 uma_sweepy.16.a: "I suddenly felt very sympathetic to the villagers who tasted these ice cubes..."  #NT!
  
 uma_sweepy_arc_carrot: "Variety carrot"  #NT!
 uma_sweepy_arc_carrot_desc: "A few carrots actually grew in a white radish field in Mejro Town. Sweepy Tonson believes that there is a replacement magic to turn the white radish into carrots. Is this really the case?"  #NT!
  
 uma_sweepy.17.name: "Gene mutations"  #NT!
 uma_sweepy.17.desc: "The investigation team came to Mejro Town for a visit. The owner of the field said that the field was originally planted with white radishes this year, but unexpectedly, when it was harvested, a few carrots grew out of the field. Such a strange phenomenon has never been encountered before. \nSome townspeople said, could it be caused by a gene mutation? Botanists quickly gave a negative answer. It turns out that although white radish and carrot are both called radish, they are not close relatives. White radish belongs to the genus Crusogenaceae, while carrots belong to the genus Umbrella family. Gene mutations are absolutely impossible to turn white radish into carrots. \nSo could it be that this land has planted carrots before, and the seeds left behind have not sprouted until now? The owner of the field said it was impossible. The owner said that although this land has been planted since its cultivation, it has never planted carrots. So this possibility is also ruled out."  #NT!
 uma_sweepy.17.a: "$CURIOUS$"  #NT!
 uma_sweepy.18.desc: "A large number of agriculturalists and botanists came to test the soil, water quality, temperature and even magnetic fields, but they didn't understand why carrots grew in white radish fields. Is there really magic in the field that can turn white radish into carrots? \n Finally, the members of the investigation team focused on the unused white radish seeds when sowing. Unexpectedly, when checking these white radish seeds, the inspector found a lot of carrot seeds from it. It seemed that it was because the seed company was not strict in quality control or the land owner was careless. Some carrot seeds were mixed into the white radish seeds and planted together..."  #NT!
 uma_sweepy.18.name: "God!!!"  #NT!
 uma_sweepy.18.a: "These experts and your investigation team are simply a bunch of idiots!"  #NT!
  
  
 uma_sweepy.20.title: "Idiot Investigation Team"  #NT!
 uma_sweepy.20.desc: "From all kinds of outrageous investigations, it can be seen that these investigation teams and experts are simply a group of idiots!"  #NT!
 uma_sweepy.20.a: "Forget it, contact Sweepy Tonson first"  #NT!
  
 uma_sweepy.21.title: "Sweepy Tonson"  #NT!
 uma_sweepy.21.desc: "You are here, so what is the reason for these events? Is it because of magic?"  #NT!
 uma_sweepy.21.a: "The result may not be what you think..."  #NT!
  
  
 uma_sweepy.22.desc: "Hey hey hey, it means that these things happen because of these boring reasons. Doesn’t it have anything to do with magic?"  #NT!
 uma_sweepy.22.a: "Maybe there has not been any real magical participation."  #NT!
  
  
 uma_sweepy.23.desc: "snort! Yada Yada, this is impossible, magic must exist! I must prove the existence of magic!"  #NT!
 uma_sweepy.23.a: ""
  
 uma_sweepy.24.title: "Big Bang"  #NT!
 uma_sweepy.24.desc: "A huge explosion suddenly appeared in the previous valley, and the power of the explosion almost flattened the entire valley. Fortunately, the explosion occurred in the wilderness and caused no casualties. Strangely, the investigation team could not find the reason for the explosion anyway."  #NT!
 uma_sweepy.24.a: "True Magic?!"  #NT!
  
 uma_sweepy.25.desc: "Servant......This great explosion...It's mine......"  #NT!
 uma_sweepy.25.a: "What did you mess with? How did you do it?"  #NT!
 uma_sweepy.26.desc: "I found an ancient book that records a magic, and I did it after doing it and it became like this."  #NT!
 uma_sweepy.26.a: "What magic has such great power?"  #NT!
 uma_sweepy.27.desc: "I don't know either. The book said that I would set up the magic circle recorded in the book, and then recite the spell "The color vortex of life rotates, the seventh level of gate appears in the world, and the tower of power is in the nine heavens " After I recited the spell, I exploded..."  #NT!
 uma_sweepy.27.a: "You are too messy. This magic may protect the caster this time. What if your life is in danger?"  #NT!
 uma_sweepy.28.desc: "I don't know either. The book said that I would set up the magic circle recorded in the book, and then recite the spell "The color vortex of life rotates, the seventh level of gate appears in the world, and the tower of power is in the nine heavens!" After I recited the spell, I exploded..."  #NT!
 uma_sweepy.28.a: "You are too messy. This magic may protect the caster this time. What if your life is in danger?"  #NT!
 uma_sweepy.29.desc: "Sorry...I never dare to do these magic research again..."  #NT!
 uma_sweepy.29.a: "But you seem to have really proved the existence of magic. Would you like to join us?"  #NT!
 uma_sweepy.30.desc: "Yada! ! My parents have been studying science for a lifetime but have never developed anything interesting. Science is the most boring! I don’t want to be a scientific official!"  #NT!
 uma_sweepy.30.a: "It's just a name, you can continue to study what you like."  #NT!
 uma_sweepy.31.desc: "Really?"  #NT!
 uma_sweepy.31.a: "You can also apply for a scientific research ship to explore the unknown in outer space. Maybe you can find new magic~"  #NT!
 uma_sweepy.31.desc.repo: "Humph, since you said so, I will reluctantly be your scientific officer. You want to help me as my servant~"  #NT!
  
  
