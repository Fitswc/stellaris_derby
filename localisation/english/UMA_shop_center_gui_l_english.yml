 ### 
 uma_goods_1_description: "§YBuffy Dessert§!\n\nBuffy, a favorite food of Umamusume's (especially a certain fat pony). Just one extra-large glass of Barfi can bring a good mood to Umamusume's day.\nPrice:§Y30§!£uma_shop_coin£\nEffect:Use to §YUmamusume Specie's§! §YAny Leader§!,Elevating an Umamusume leader's mood  for §YOne level§!\n\nYou have §Y[from.uma_num_of_good_1]§! Pieces of this item!"

 uma_goods_2_description: "§YShoe-Ultra§!\n\nThe Shoe, considered to be the life of Umamusume. A quality Shoe can provide a boost to the Umamusume's road to championship. Therefore, many Umamusume collect quality Shoes as treasures.\nPrice:§Y55§!£uma_shop_coin£\nEffect: Use for the §Iofficial§! of §IUmamusume species§!\n§YOfficer§!：Get trait “['leader_trait:uma_governor_trait_horse_shoes_ultra']”.Effects last §Y10§!years\n(§YThis effect cannot be stacked§!)\n\nYou have §Y[from.uma_num_of_good_2]§!Pieces of this item!"

 uma_goods_3_description: "§YAmulet§!\n\nAn Amulet with mysterious power seems to ward off disasters and bring good luck to its owner.\nPrice:§Y55§!£uma_shop_coin£\nEffect: Use for the §YCommanders§! of §YUmamusume species§!\n§YCommander§! Get trait “['leader_trait:uma_admiral_trait_amulet']”, For §Y10§! years.\n(§YThis effect cannot be stacked§!)\n\nAdditionally, the amulet may also bring §B unexpected good luck§!...\n\nYou have §Y[from.uma_num_of_good_3]§!Pieces of this item!"

 uma_goods_4_description: "§YLoudspeaker§!\n\nThe magical Loudspeaker is able to make a rousing sound. Umamusume who hear this sound will become so energetic and excited that one person can do the work of two people. If you want to further enhance the effect of the loudspeaker, I heard that you can let Umamusume's beloved hold the loudspeaker and say "love" to her ....\nPrice:§Y75§!£uma_shop_coin£\nEffect: Use for §Yany leader§! of §YUmamusume species§!\n§YScientist§!Get trait “['leader_trait:uma_scientist_trait_horn']”, Effects last §Y5§! years.\n§YOfficer§! Get trait “['leader_trait:uma_scientist_trait_horn']”, Effects last §Y5§! years.\n§YCommander§! Get trait “['leader_trait:uma_scientist_trait_horn']”, For §Y10§! years.\n(§YThis effect cannot be stacked§!)\n\nYou have §Y[from.uma_num_of_good_4]§!Pieces of this item!"

 uma_goods_5_description: "§YScholar's Hat§!\n\nScholar's Hat, It is an item that only Umamusume scientists with the highest intelligence in the country can have. If you put it on your head, you suddenly seem to be smart.\nPrice:§Y350§!£uma_shop_coin£\nEffect: Use for the §YOfficer§! or §YScientist§! of Umamusume §Yspecies§!\n§YOfficer§! Get trait “['leader_trait:uma_governor_trait_special_scholar']”, Trait will never be removed\n§YScientist§! Get trait “['leader_trait:uma_scientist_trait_special_scholar']”, Trait will never be removed.\n(§YThis effect cannot be stacked§!)\n\nYou have §Y[from.uma_num_of_good_5]§!Pieces of this item!"

 uma_goods_6_description: "§YTraining Manual§!\n\nA manual with a variety of training methods from which Umamusume people can learn a lot.\nPrice:§Y120§!£uma_shop_coin£\nEffect: Use for any leader of Umamusume species\n§YAny leaders§!: Get trait “['leader_trait:uma_governor_trait_training_book']”,§YAlways Continuous §!.\n(§YThis effect cannot be stacked§!)\n\nYou have §Y[from.uma_num_of_good_6]§!Pieces of this item!"

 uma_goods_7_description: "§YEye-catching telescope§!\n\nA long time ago, there were trainers in the audience of the debut match with this telescope to find the top Umamusume of tomorrow. Similarly, the Umamusume who is watched by this telescope will be extremely popular.\nPrice:§Y200§!£uma_shop_coin£\nEffect: Use for any leader of Umamusume species\n§YOfficer§! Get trait “['leader_trait:uma_governor_trait_tomorrow_star']”, Trait will never be removed\n§YScientist§! Get trait “['leader_trait:uma_scientist_trait_tomorrow_star']”, Trait will never be removed\n§YCommander§! Get trait “['leader_trait:uma_admiral_trait_tomorrow_star']”, Trait will never be removedTraits §YAlways Continuous §!\n(§YThis effect cannot be stacked§!)\n\nYou have §Y[from.uma_num_of_good_7]§!Pieces of this item!"

 uma_goods_8_description: "§YUmamusume's small mirror§!\n\nUmamusume in adolescence are very concerned about their appearance, so they like to use this small mirror to dress up. However, this mirror seems to have some kind of magic power to make its owner more lovely.\nPrice:§Y100§!£uma_shop_coin£\nEffect: Use for the official of Umamusume。\n§YOfficer§! Get trait “['leader_trait:uma_governor_trait_lovely']” Trait will never be removed Traits §YAlways Continuous §!.\n(§YThis effect cannot be stacked§!)\n\nYou have §Y[from.uma_num_of_good_8]§!Pieces of this item!"

 uma_goods_9_description: "§YOversized Cupcake§!\n\nSuper-sized cupcakes, a super-sized dessert experience. If weight is not a concern, nothing makes Umamusume happier than cupcakes.\nPrice:§Y55§!£uma_shop_coin£\nEffect:Use to §YUmamusume Specie's§! §YAny Leader§! , elevate the mood of an Umamusume leader by §YTwo Levels§!\n\nYou have §Y[from.uma_num_of_good_9]§!Pieces of this item!"

 uma_goods_10_description: "§YRoyal Vagetable Juice§!\n\nAlthough Stamina 65 is considered the most powerful physical recovery agent, but the real king of physical recovery potion is someone else - is this cup of Royal Vagetable Juice. Just a small cup of this magical drink, you can make Umamusume from extreme fatigue completely recovered. However, the taste... Well... It's not very flattering. As a result, when trainers try to feed Umamusume green juice, they are often met with strong resistance - even worse than an injection. So, if you're going to use it on your own Umamusume, remember to get them back in the mood with a dessert, an amusement park date (or an intense, exciting Umayo).\nPrice:§Y100§!£uma_shop_coin£\nEffect: Use for §Yany leaders§! of §YUmamusume species§!, Decrease mood of this Umsmusume \n§YOfficer§! Get trait “['leader_trait:uma_governor_trait_vegetable_drink']”, Effects last §Y25§! years.\n§YScientist§! Get trait “['leader_trait:uma_scientist_trait_vegetable_drink']”, Effects last §Y25§! years.\n§YCommander§! Get trait “['leader_trait:uma_admiral_trait_vegetable_drink']”, Effects last §Y25§! years.(Cannot be used on Umamusume leaders whose mood is §Y Worst Mood §! for Umamusume leaders,And §YThis effect cannot be stacked§!)\n\nYou have §Y[from.uma_num_of_good_10]§!Pieces of this item!"

 uma_goods_11_description: "§YStamina 65 potion§!\n\nUmamusume, being energy-hungry creatures, often need to replenish their strength. This sweet and sour oversized stamina potion is the favorite of Umamusume.\nPrice:§Y80§!£uma_shop_coin£\nEffect: Use for §Yany leaders§! of §YUmamusume species§!\n§YOfficer§! Get trait “['leader_trait:uma_governor_trait_power_sf']”, Effects last §Y20§! years.\n§YScientist§! Get trait “['leader_trait:uma_scientist_trait_power_sf']”, Effects last §Y20§! years.\n§YCommander§! Get trait “['leader_trait:uma_admiral_trait_power_sf']”, Effects last §Y20§! years.\n(§YThis effect cannot be stacked§!)\n\nYou have §Y[from.uma_num_of_good_11]§!Pieces of this item!"

 uma_goods_12_description: "§YIntelligence Secret Scrolls§!\n\nA wonderful scroll that contains the method of intelligence training, which can permanently improve the intelligence of all Umamusume.\nPrice:§Y50§!£uma_shop_coin£\nEffect:Permanently increase the country £physics£ §YPhysics Research§!、 £engineering£ §YEngineering Research§! And £society£ §YSociological Research§! Each §Y1%§!Leader experience gain speed increased §Y1%§!.Every 10 levels of buffs also provide additional §Y5%§! research speed boost (§Y this effect can be stacked§!)\n\nYou have §Y[from.uma_num_of_good_12]§!Pieces of this item!"
 uma_goods_13_description: "§YScroll of Willpower Secrets§!\n\nA wonderful scroll that contains the method of willpower training, which can permanently improve the willpower of all Umamusume.\nPrice:§Y50§!£uma_shop_coin£\nEffect:Permanent reduction of population housing use§Y0.5%§!to increase the rate of population growth §Y0.5%§!In addition, the hull value is permanently increased §Y1%§!Army life permanently increased §Y2%§!.Every 10 levels of buffs also provide additional §Y10%§! hull value boost(§Y this effect can be stacked§!)\n\nYou have §Y[from.uma_num_of_good_13]§!Pieces of this item!"

 uma_goods_14_description: "§YStrength Secret Scroll§!\n\nA wonderful scroll that contains strength training methods and can permanently increase the strength of all Umamusume.\nPrice:§Y50§!£uma_shop_coin£\nEffect:Permanently upgrade the jobs food output, mineral output each §Y1%§!In addition, the ship's weapon damage is permanently increased §Y1%§! Army damage permanently increased§Y2%§!.Every 10 levels of buffs also provide additional §Y10%§!of job alloy and consumer goods output(§Y this effect can be stacked§!)\n\nYou have §Y[from.uma_num_of_good_14]§!Pieces of this item!"

 uma_goods_15_description: "§YEndurance Secret Scroll§!\n\nA wonderful scroll that contains the method of stamina training, which can permanently increase the stamina of all Umamusume.\nPrice:§Y50§!£uma_shop_coin£\nEffect:Increase ship armor and ship shield value permanently§Y1.5%§!Army life permanently increased§Y2%§!.Every 10 levels of buffs also provide additional Daily §Y1%§! The automatic restoration of armor and shields(§Y this effect can be stacked§!)\n\nYou have §Y[from.uma_num_of_good_15]§!Pieces of this item!"

 uma_goods_16_description: "§YSpeed Secret Scroll§!\n\nA wonderful scroll that contains the speed training method and can permanently increase the speed of all Umamusume.\nPrice:§Y50§!£uma_shop_coin£\nEffect:Permanently increase the ship's firing speed and sublight speed§Y1%§!, all jobs output §Y0.25%§!.Every 10 levels of buffs also provide additional §Y2.5%§!all jobs output(§Y this effect can be stacked§!)\n\nYou have §Y[from.uma_num_of_good_16]§!Pieces of this item!"

 uma_goods_17_description: "Targeted recruitment: This will add a umamusume with a specific portrait to the Leader pool"
  
