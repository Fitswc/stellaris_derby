 #帝宝本地化/兔兔 
  
 #F:...... 
  
 uma_tokaiteio_anomoly: "§HGas giant in reverse flight§!"
 uma_tokaiteio_anomoly_desc: "When our research ship flew over the gas giant, it was discovered that there were high-molecular organic reactions in [event_target:tokaiteio_star_target.GetName]'s atmosphere, and our detectors could not penetrate its atmosphere, so it was necessary to conduct further investigation."
 #uma_tokaiteio2_anomoly: "调查异常读数"  <"Investigating unusual readings"
 #uma_tokaiteio2_anomoly_desc: "调查异常读数"  <"Investigating unusual readings"
  
 uma_tokaiteio_digsite: "Hot Syrup Sea"
 uma_tokaiteio_digsite_desc: "The heat from the stars scorched the surface of [event_target:tokaiteio_star_target.GetName]. Ammonia, methane and highly toxic hydrogen cyanide surged in the atmosphere. Beneath the atmosphere, liquefied 83 sugar alcohols tumbled under high pressure. The remains of the ancient civilization were in this surging 83 sugar alcohols."
 STUDY_SWEET: "Research on sweet solids"
 STUDY_SWEET_DESC: "Conduct research on the complex organic structure found on [event_target:tokaiteio_star_target.GetName] to make the most of it."
 thawing: "Building a Thawing Device"
 thawing_DESC: "According to the database, the last thing this unknown Umamusume did before entering the hibernation chamber was to take a cup of 83 sugar alcohol from the sugar alcohol synthesizer, and then lie down in the hibernation chamber. This saved her from the collision, but her built-in thawing system was damaged. We must re-study this hibernation system and develop a matching thawing device."
 FOUND_WRONG_NUM: "Investigating unusual readings"
 FOUND_WRONG_NUM_DESC: "The mining of octahedral sugar alcohol on [event_target:tokaiteio_star_target.GetName] seems to have had some impact on the planet. The instruments on the mining station have shown some abnormal readings. We need to figure out what is going on here."
 UMA_TEIO: "$uma_tokaiteio_anomoly$"
 UMA_TEIO_DESC: "$uma_tokaiteio_anomoly_desc$"
  
 welcome_tokaiteio: "Sweet"
 welcome_tokaiteio_1: "Sugar alcohol withdrawal"
 welcome_tokaiteio_2: "Thicker"
  
 #events 
 uma_tokaiteio_event.2.name: "Survey completed"
 uma_tokaiteio_event.2.desc: "After investigation, it was found that the inner atmosphere of the gas giant is rich in organic compounds with complex structures. It was preliminarily judged to be a low-toxic sweet solid at room temperature. Samples have been sent to the Traincent Central Laboratory, and further research on the properties of the substance is underway."
 uma_tokaiteio_event.2.name.a: "interesting"
 uma_tokaiteio_event.4.name: "Project Completed"
 uma_tokaiteio_event.4.desc: "Research on the compound sample on [event_target:tokaiteio_star_target.GetName] has been completed. The compound is a white crystal or crystalline powder, easily soluble in water, non-toxic in mouse experiments, and slightly sweeter than sucrose. \n Unlike other sugars and sweeteners, this sweet compound is extremely difficult to be metabolized by Umamusume, and may be used as an excellent source of sweetness. Scientists named it "83 sugar alcohol"."
 uma_tokaiteio_event.4.name.a: "Sweet"
 uma_tokaiteio_event.5.name: "Under the Sea of Sugar"
 uma_tokaiteio_event.5.desc: "The mining of octahedral sugar alcohol on [event_target:tokaiteio_star_target.GetName] seems to have had some impact on the planet. The instruments on the mining station have shown some abnormal readings. We need to figure out what is going on here."
 uma_tokaiteio_event.5.name.a: "I thought the 83 sugar alcohol was going to run out."
 ### 
 uma_tokaiteio_event.100.name: "Construction completed"
 uma_tokaiteio_event.100.desc: "After unremitting efforts, our scientists have finally developed a suitable thawing device. The thawing process will last for a whole week to ensure that the Umamusume's vital signs are stable."
 uma_tokaiteio_event.100.a.name: "start!"
 uma_tokaiteio_event.101.name: ""thaw……"
 uma_tokaiteio_event.101.desc: "A week later, [This.GetRulerName] arrived at the research department, and the thawing work was coming to an end. Everyone was paying close attention to the vital signs of the little Umamusume in the cabin. Her pulse and breathing were a little slow, but everyone knew that the most important thing to pay attention to during thawing was "brain waves". At this time, she had already produced intermittent delta waves, and was obviously on the verge of waking up."
 uma_tokaiteio_event.101.a.name: "She woke up!"
 uma_tokaiteio_event.102.name: "Little One"
 uma_tokaiteio_event.102.desc: "————Yes, President!"
 uma_tokaiteio_event.102.a.name: "？！"
 uma_tokaiteio_event.103.name: "Little One"
 uma_tokaiteio_event.103.desc: "As soon as this Umamusume woke up, she called out to our student council president. Although many people present, including the president, were shocked at first, scientists explained that it was likely that long-term hibernation had caused some cognitive problems for her. From some of her unclear words, we can roughly hear that her name is "East Sea Teio". Follow-up examinations are still being followed up. [This.GetRulerName] said that if conditions permit, he would be happy to adopt this little guy himself."
 uma_tokaiteio_event.103.a.name: "Welcome, little Teio~"
 uma_tokaiteio_event.104.name: "Withdrawal?"
 uma_tokaiteio_event.104.desc: "A terrible thing happened. Some of the umamusume who drank the sugar alcohol beverage had mild withdrawal symptoms, but our scientific research department denied that 83 sugar alcohol was addictive, on the grounds that no addictive substances were found in the initial safety test. \nBut in any case, the withdrawal reaction was a fact, so all sugar alcohol beverages circulating in the market were recalled."
 uma_tokaiteio_event.104.name.a: "What? (Put down the drink bottle in your hand)"
 uma_tokaiteio_event.105.name: "???"
 uma_tokaiteio_event.105.desc: "——How come all the Honey from the beverage store is gone?"
 uma_tokaiteio_event.105.name.a: "Who is yelling?"
 uma_tokaiteio_event.106.name: "???"
 uma_tokaiteio_event.106.desc: "——It’s me, I, Tokai Teio!"
 uma_tokaiteio_event.106.name.a: "Teio? Those sugar alcohols are addictive, just use honey instead."
 uma_tokaiteio_event.107.name: "Tokai Teio"
 uma_tokaiteio_event.107.desc: "——Impossible! I didn't react at all! There must be something wrong! \n〈Communication terminated〉"
 uma_tokaiteio_event.107.name.a: "Alas, when will the teio mature?"
 uma_tokaiteio_event.108.name: "Thicker"
 uma_tokaiteio_event.108.desc: "The scientific department sent a research report on the addictiveness of sugar alcohols. The report pointed out that the addictiveness comes from a microorganism that can reproduce in sugar alcohols. When the sugar alcohols remain in the original state or contain only a small amount of water, the microorganism will enter a dormant state. When the water content is too high, the microorganism will reproduce in large numbers and then affect the nervous system. \nIn the last attachment of the report, the scientific department mentioned that the Umamusume who discovered that drinking thick honey would not produce withdrawal reactions was the Tokai Teio. \nSo, the sugar alcohol withdrawal crisis was quickly resolved with the Teio's discovery. These sugar alcohols were prohibited from being sold in the form of beverages, but could only be sold in the form of crystals and syrups, and then diluted with water as needed before drinking."
 uma_tokaiteio_event.108.name.a: "Good"
  
 ### 
 uma_tokaiteio_event.200.name: "Take advantage of others"
 uma_tokaiteio_event.200.desc: ""After going through various inspections and formalities, the little emperor was granted citizenship of Traincent, and [This.GetRulerName] adopted the little emperor as promised. \nThe little emperor didn't seem to speak much, but was very clingy to [This.GetRulerName]. Students always saw her hugging [This.GetRulerName]'s neck and swinging around, even when [This.GetRulerName] was doing paperwork."
 uma_tokaiteio_event.200.name.a: "You can't do that, okay? If you can control yourself, you can have Honey drinks after get off work."
 uma_tokaiteio_event.200.name.b: "We can make a fake [This.GetRulerName] model and let her hang on it all the time."
 uma_tokaiteio_event.200.name.c: "Find an early childhood education teacher and try to read some books to her to attract her attention."
 uma_tokaiteio_event.201.name: "Half-day holiday"
 uma_tokaiteio_event.201.desc: "In order to reduce [This.GetRulerName]'s fatigue, the student council voted to enforce [This.GetRulerName]'s half-day vacation, so that she can take Teio out for a walk. Staying in the president's office all the time is obviously not conducive to the development of the Umamusume."
 uma_tokaiteio_event.201.name.a: "Go climb up, the night view of the city is worth seeing."
 uma_tokaiteio_event.201.name.b: "Let’s go to the amusement park. Being quiet all the time is not good for growth."
 uma_tokaiteio_event.201.name.c: "Let's go to the museum and let her see the stories of our predecessors."
 uma_tokaiteio_event.202.name: "Enroll!"
 uma_tokaiteio_event.202.desc: "The little emperor was old enough to go to school. On the first day of school, she had a fight with her classmates over the distribution of 83-sugar alcohol. The assistant rushed to the school and took the crying little emperor home."
 uma_tokaiteio_event.202.name.a: "If you want to drink more of the 8,300-yuan variety, you can exchange it with your classmates for something they like, right?"
 uma_tokaiteio_event.202.name.b: "Be good and don’t cry. The president will take you to drink Honey."
 uma_tokaiteio_event.202.name.c: "Teio should study hard so that he can drink as much as he wants when he grows up."
 uma_tokaiteio_event.203.name: "Slimy"
 uma_tokaiteio_event.203.desc: "The little emperor filled her quilt with a large cup of hot Honey. She tried carefully to prevent the alcohol from dripping out, but the alcohol that flowed from the edge of the cup burned her hands, causing her to throw the quilt out and spill it all over the floor."
 uma_tokaiteio_event.203.name.a: "Remember to wipe it clean and be careful next time not to overfill it."
 uma_tokaiteio_event.203.name.b: "(spanking)"
 uma_tokaiteio_event.203.name.c: "In fact, if you walk a few steps faster, it won’t spill."
 uma_tokaiteio_event.204.name: "Teio of the East Sea"
 uma_tokaiteio_event.204.desc: "President——Hey, I have a question. \nWhy Umamusume running?"
 uma_tokaiteio_event.204.name.a: "There are many reasons. You can ask the sisters and hear what they say."
 uma_tokaiteio_event.204.name.b: "For competition, victory and glory."
 uma_tokaiteio_event.204.name.c: "Running is a natural instinct that is embedded in the genes of Umamusumes, and it can bring them physical and mental satisfaction."
 uma_tokaiteio_event.205.name: "A sophisticated game..."
 uma_tokaiteio_event.205.desc: "Teio seems to have been attracted by a popular game recently, a historical game called "Steam Train". The timeline of this game runs through the early Steam Age to Mamusu New Order, vividly depicting the development of that period of history. \nThis game may be a little early for Teio, and we may be able to give her some guidance..."
 uma_tokaiteio_event.205.name.a: "This game allows her to experience the difficulties of governing a country."
 uma_tokaiteio_event.205.name.b: "This game can show her the cruelty of war in history."
 uma_tokaiteio_event.205.name.c: "This game allows her to appreciate the changes in times and technology."
 uma_tokaiteio_event.206.name: "Traincent"
 uma_tokaiteio_event.206.desc: "Time has passed, and Teio has reached the age to enter Traincent. Today is the first day of school. After finishing the course, Teio, wearing the Traincent school uniform, ran directly into the president's office to show off her new clothes. \n"President! How is it? Does it look good?"\nShe shook her skirt and shouted excitedly"
 uma_tokaiteio_event.206.name.a: "It looks nice, but you can’t just enter the president’s office casually, okay?"
 uma_tokaiteio_event.206.name.b: "I'm already looking forward to your winning suit!"
 uma_tokaiteio_event.206.name.c: "Although competition is important, in today's interstellar age, knowledge is equally important and cannot be left behind."
 uma_tokaiteio_event.207.name: "Classic Road"
 uma_tokaiteio_event.207.desc: "The Teio had reached the age to compete in the Classics, and after a physical examination, it was determined that although her physical functions were very strong, her factor composition was still within the range of a Teresin Umamusume, and because of this, she was allowed to compete in the Teresin Central Competition as a student."
 uma_tokaiteio_event.207.name.a: "Come on."
 uma_tokaiteio_event.208.name: "Gaoyue Shang dominates!"
 uma_tokaiteio_event.208.desc: "Teio won the first of the Classic Triple Crowns with a one-length advantage and an undefeated record. Although the lead was not obvious, she still showed her strength."
 uma_tokaiteio_event.208.name.a: "Yay, Teio!"
 uma_tokaiteio_event.209.name: "The Derby of TokaiTeio"
 uma_tokaiteio_event.209.desc: "In the highly anticipated Derby, Teio was at a disadvantage against the outsiders, but still won by three lengths, achieving her second undefeated championship! Friends and relatives came to celebrate, but the trainer noticed something was wrong with her, as her leg seemed to be injured during the race. \nAccording to the professional doctor's examination, she may need at least half a year to recuperate, which means she will miss the last championship of the classic route"
 uma_tokaiteio_event.209.name.a: "What? I won't allow this to happen. Go get a group of trained doctors."
 uma_tokaiteio_event.209.name.b: "Teio needs to overcome this difficulty on his own before he can grow into an independent Umamusume."
 uma_tokaiteio_event.300.name: "Seven battles and seven wins, the Tokai Teio!"
 uma_tokaiteio_event.300.desc: "Despite the injuries and setbacks, Teio finally recovered before the Chrysanthemum Festival. Although the audience cheered for Teio's performance at the Chrysanthemum Festival, the professionals were not optimistic about Teio, who had just recovered and was not good at long-distance competitions. \n Teio's performance shattered their doubts. Although she showed signs of exhaustion when entering the final straight line and even fell into the herd of umamusumes, she finally held on to her slight advantage with amazing perseverance and won the last championship of the classic route. \n "Seven wins in seven games, TokaiTeio! How is the view of the mountaintop that Teio once stepped on?!"
 uma_tokaiteio_event.300.name.a: "Congratulations, Teio, there are still distant stars above the mountain top."
 uma_tokaiteio_event.301.name: "Footnotes of the journey"
 uma_tokaiteio_event.301.desc: "Despite the injuries and setbacks, Teio finally recovered before the Chrysanthemum Festival. Although the audience cheered for Teio's performance at the Chrysanthemum Festival, the professionals were not optimistic about Teio, who had just recovered and was not good at long-distance competitions. \nUnfortunately, as expected by professionals, Teio, who had just recovered, lost by a nose in the final straight line and failed to achieve the undefeated triple crown."
 uma_tokaiteio_event.301.name.a: "Never mind, Teio , this is just a small footnote before you embark on your journey."
 uma_tokaiteio_event.302.name: "unyielding"
 uma_tokaiteio_event.302.desc: "Although the medical team did everything they could to help Teio recover, she was ultimately unable to catch up with the Chrysanthemum Festival. At her request, [This.GetRulerName] took her to the stands at the competition site. \n She watched the participating Umamusumes run without saying a word until they entered the final bend, tears silently sliding down her cheeks, the audience cheered, and the rumble of horseshoes on the ground echoed. \n Teio raised his head, and every Umamusume tried her best to the last bit of strength. This determination was also reflected in Teio's eyes. She cried and shouted at the sprinting girls."
 uma_tokaiteio_event.302.name.a: "……"
 uma_tokaiteio_event.303.name: "graduate"
 uma_tokaiteio_event.303.desc: "Time flies, and Teio's career as a Umamusume is drawing to an end. In three years, she suffered leg injuries three times and was even forced to recuperate for a whole year, but she still relied on her talent, hard work and tenacity to win her comeback match and her retirement match - Arima Kinen. \nPeople call it a miraculous resurrection, which is the beauty of Teio's final end, but the end of a Umamusume is never retirement. For Teio, this is a new starting point."
 uma_tokaiteio_event.303.name.a: "恭喜毕业。"  <"Congratulations on your graduation."
 uma_tokaiteio_event.304.name: "$TT$"  <"$TT$"
 uma_tokaiteio_event.304.desc: "In this way, can I be considered a capable Umamusume?"
 uma_tokaiteio_event.304.name.a: "certainly"
 uma_tokaiteio_event.305.name: "$TT$"
 uma_tokaiteio_event.305.desc: "Just the beginning of the journey, right?"
 uma_tokaiteio_event.305.name.a: "Has Teio decided what to do in the future?"
 uma_tokaiteio_event.306.name: "$TT$"
 uma_tokaiteio_event.306.name.desc.a: "In the future... I want to improve the lives of Umamusumes and make the city prosperous."
 uma_tokaiteio_event.306.name.desc.b: "In the future... I want to travel across the sea of ​​stars and protect everything I hold dear."
 uma_tokaiteio_event.306.name.desc.c: "In the future... I want to explore the unknown and uncover the secrets of Ma Musume."
 uma_tokaiteio_event.306.name.a: "Nice vision, now, start your journey."
  
  
  
  
  
  
  
 ### 
 uma_tokaiteio_event.1000.name: "Special log completed"
 uma_tokaiteio_event.1000.desc: "Scientists have detected the remains of ancient civilization buildings in the fluid layer of [event_target:tokaiteio_star_target.GetName]. As to the source of the building remains in the gas giant planet, scientists have different opinions. After discussion, they decided to organize an investigation team to enter [event_target:tokaiteio_star_target.GetName] for exploration."
 uma_tokaiteio_event.1000.name.a: "interesting"
  
 uma_tokaiteio_event.1001.name: "Crossing"
 uma_tokaiteio_event.1001.desc: "It was the first time for the archaeological team to conduct archaeological excavation in a hot and dangerous gas giant. In order to relieve the tension, the exploration ship carrying the archaeological team was equipped with 83 sugar alcohol purification equipment, so the crew could enjoy sweet syrup at any time. It takes a lot of time to maintain the energy shield and engine power stability in the dangerous environment of a hot gas giant. Scientists can use this time to analyze the movement trajectory of [event_target:tokaiteio_star_target.GetName]."
 uma_tokaiteio_event.1002.name: "Unknown energy source"
 uma_tokaiteio_event.1002.desc: "The scientists at the center encountered trouble when studying the trajectory of [event_target:tokaiteio_star_target.GetName] and [event_target:tokaiteio_star_target.GetName] - there seems to be some unknown energy in this system, which prevents the calculation from going smoothly. The good news is that the team has successfully arrived at the previously detected location and is using instruments to depict the main body of the building. Because the syrup blocks the line of sight, the team members can only observe the building through instruments. It is suspended in an area with the same density as itself. Most of the building has been damaged by high-speed moving solid matter, but there are still intact parts. We must find a way to get into it."
 uma_tokaiteio_event.1003.name: "Pressure bridge"
 uma_tokaiteio_event.1003.desc: "After investigation, it was found that the building did not have a transformer room like that of a space station, but only a reinforced door. Obviously, opening it at will would allow hot syrup to pour into the interior, which means that it was not designed to be in the extreme environment of a hot gas giant."
 uma_tokaiteio_event.1003.name.a: "Fortunately, our scientists were prepared for this. Our exploration ship was equipped with a "pressure bridge" that could fit tightly against the building surface and connect to the main cabin, which saved us a lot of time."
 uma_tokaiteio_event.1003.name.b: "The orbiting research ship launched a "pressure bridge" to our location, which can fit tightly against the surface of the building and establish a connection with the main cabin, but it will take some time to arrive here."
 uma_tokaiteio_event.1004.name: "Control Room"
 uma_tokaiteio_event.1004.desc: "The team members finally entered the main building. It was still powered. When it detected the team members entering, it started to operate at high speed. The scientists in the team skillfully followed the danger elimination plan and waited for the safety experts to eliminate the danger. Then they rushed into the building impatiently. This room seemed to be the control room of some equipment. A glowing holographic control terminal was suspended in the center of the hall. The decryption team began their work, and other members tried to find some clues."
 uma_tokaiteio_event.1005.name: "Across the Starry Sea"
 uma_tokaiteio_event.1005.desc: "破译工作几乎没有遇到什么阻碍，这个控制终端便被我们完全掌控了，它一共控制着三个部位：系团级跃迁引擎；糖醇合成器；基因库。其中，安置跃迁引擎和基因库都已经被恶劣环境摧毁，但糖醇合成器依然在数十万年间以最高功率不间断地运行着，形成了[event_target:tokaiteio_star_target.GetName]上满是糖醇的大气层。现在，我们只需要把糖醇合成器单独拆分出来就好了。"  <"The decoding work encountered almost no obstacles, and we had full control of this control terminal, which controls three parts in total: the system-level jump engine; the sugar alcohol synthesizer; and the gene library. Among them, the jump engine and the gene library have been destroyed by the harsh environment, but the sugar alcohol synthesizer has been running at the highest power for hundreds of thousands of years, forming an atmosphere full of sugar alcohols on [event_target:tokaiteio_star_target.GetName]. Now, we just need to separate the sugar alcohol synthesizer."
 uma_tokaiteio_event.1006.name: "Sleeping..."
 uma_tokaiteio_event.1006.desc: "The team members found something unexpected next to the sugar alcohol synthesizer: a young Umamusume. She was sleeping quietly in the hibernation chamber, and no one knew how many years had passed. The sudden appearance of other Umamusume species shocked everyone involved in the project. The news was reported to the higher authorities and then classified as confidential. The team first moved the Umamusume and the entire hibernation chamber onto the exploration ship and quickly sent it to the center of Traincent. They also increased the search intensity of the entire ruins. At the same time, the organization of the control terminal database was also sent to the research department as an urgent project."
 uma_tokaiteio_event.1007.name: "A seed"
 uma_tokaiteio_event.1007.desc: "Scientists have sorted out the source of the entire ruins from a large amount of redundant data: this Umamusume civilization was attacked by invaders and fell into war and was at a disadvantage. In order to continue the race, they launched several batches of special colony ships carrying factor libraries, fertilized eggs and some social elites to the young star cluster. It was affected by an unknown gravitational source during a long-distance jump and then collided with [event_target:tokaiteio_star_target.GetName]. All jump engines and most of the hull were destroyed, leaving only a solid control cabin and reactor. As for the sugar alcohol synthesizer, in addition to being edible, it can also be used to block most detections. The impact and the explosion of the reactor changed the orbit of this primitive planet at the time. It entered a reverse orbit and eventually became a hot gas planet close to the star. According to the database, the last thing this unknown little Umamusume did before entering the hibernation cabin was to take a cup of 83 sugar alcohol from the sugar alcohol synthesizer, and then lie down in the hibernation cabin nearby, which saved her from the impact, but the built-in thawing system has been damaged. We must re-study this hibernation system and develop a matching thawing device."
 uma_tokaiteio_event.1007.name.a: "I'll be there to see it when it thaws."
