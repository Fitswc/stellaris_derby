l_english:
 concept_uma_three_godnesses_concept: "Three goddesses"  #NT!
 concept_uma_three_godnesses_concept_desc: "Although the meaning of the "Three Goddesses" is slightly different in different cultural circles. But almost all Ma Niang agree that they are three goddesses, the sowers of the Ma Niang tribe and the creator of the world. Although many scientists used to think that this concept was just a lie that was made up by religious courts, as they understand the world more and more profoundly, the Ma girls believed that the "Three Goddesses" might be an ancient high-tech civilization entity... But who knows?"  #NT!
  
 concept_uma_race_course_concept: "Basic stadium"  #NT!
 concept_uma_race_course_concept_desc: "Although the stadium that is fully in line with the basic standards has never served as a stadium for any high-scale competition, countless ancestors in the past have started from this track and run towards their own brilliant period."  #NT!
  
 concept_uma_three_godnesses_deposit: "The ruins of the three goddesses"  #NT!
 concept_uma_three_godnesses_deposit_desc: "Here, the legendary ruins left by the three goddesses stand quietly, for countless days and nights."  #NT!
  
 concept_uma_cystal_carrot_mine: "Crystal carrot veins"  #NT!
 concept_uma_cystal_carrot_mine_desc: "Perhaps we are favored by the three goddesses, and countless shining crystal radishes are lying quietly in this mineral vein, and can be mined on a large scale at any time."  #NT!
  
 concept_uma_concept_crystal_carrot: "Crystal Carrot"
 concept_uma_concept_crystal_carrot_desc: "§gA magical mineral seems to have multiple uses. Although I don't know why this crystal can naturally grow into such a thick carrot shape, it feels very useful.§!"
  
