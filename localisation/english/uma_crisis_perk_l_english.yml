uma_menace_crisis_description_title: "The World of Umamusume"
uma_menace_crisis_description_intro: "Various strange phenomena and research have convinced us that the world we inhabit is not real. We have decided to make full use of our Realm abilities and break through the wall that leads us to a new world. Whoever stands in our way, we will bring them to ruin."
uma_menace_crisis_description: "$uma_menace_crisis_description_intro$\n\nOur goal is to collect Realm Energy as quickly as possible. We only need to find ways to make this speed faster and faster."
uma_menace_crisis_howto_title: "Realm Energy and a Brave New World"
uma_menace_crisis_howto: "You will complete §HCrisis Objectives§! as a regular country to generate £uma_menace£§HRealm Energy§!, allowing you to unlock various empire bonuses and complete the final crisis mission, bringing a new era to the Umamusume. It is worth noting that although these Crisis Objectives can be completed easily, you should still try to eliminate the fleet strength of other countries as much as possible, or you may face an overly powerful challenge in the final stage."

uma_crisis_path_orbital_ring: "Realm-Space Manipulator"
uma_crisis_path_orbital_ring_DESC: "Alias: Window Breaker. It can concentrate Realm Energy, distort or tear apart current space, and free our species from the uncertainty created by the object hidden beyond the rift."

