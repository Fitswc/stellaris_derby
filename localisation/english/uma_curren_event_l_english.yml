 uma_curren_arc_desc: "你的先遣队发现了一处遗迹，从返回的资料来看，是一个名叫香草星人的种族留下的——香草星人是个唯科学论的种族，曾以高超的科学技术闻名宇宙，但传说它们遭到了某种打击，整个香草星就此消失，香草星人也彻底变成茫茫星海中无数被遗忘的尘埃之一"  <"Your advance team discovered a ruin. Judging from the returned information, it was left by a race called Vanilla Stars. Vanilla Stars are a scientific-oriented race. They were once famous for their superb science and technology, but legend has it that they suffered a certain blow, and the entire Vanilla Stars disappeared, and Vanilla Stars completely became one of the countless forgotten dusts in the vast sea of ​​stars.">  #NT!
  
  
