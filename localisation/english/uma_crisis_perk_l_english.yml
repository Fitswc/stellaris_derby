uma_ap_bc_main_evt_chain_crisis_level_reached_discounting: "Megastructure Activation Progress (%)"
uma_ap_bc_main_evt_chain_crisis_resource_penatly: "External Country Interference Penalty Level"
UMA_AP_BC_RESEARCH_REALM: "Research Realms"
UMA_AP_BC_RESEARCH_REALM_DESC: "Through countless practices and records, we have found that whenever Umamusume use their Realms, they seem able to alter some characteristics of current spacetime to a certain extent. The most typical example is the inexplicable appearance of localized golden raindrops. Does this mean that if many Umamusume activate their Realms together, something special could happen, such as the appearance of another spatial passage? It always feels as though a thin white veil still separates us from the truth of Realms. This requires further research."

##Evt
uma_ap.300.title: "$UMA_AP_BC_RESEARCH_REALM$"
uma_ap.300.desc: "$UMA_AP_BC_RESEARCH_REALM_DESC$"
uma_ap.300.a: "Interesting."
uma_ap.301.title: "An Astonishing Discovery"
uma_ap.301.desc: "In one experiment, we gathered approximately one thousand Umamusume in a cafeteria and had them release their Realms simultaneously. Then, something strange happened! A tiny rift appeared almost instantly within the controlled area. Our scientists seemed somewhat slow to react, and only after observing it for quite some time did they begin to examine the inside of the rift. Through a pinhole observation camera, the scientists glimpsed a small area inside the rift: it was a racetrack, and from time to time, some unidentified quadrupeds walked across it. Immediately after the researchers recorded that image, the rift was sealed. Everything was silent, except for... some strange, periodic time-pausing phenomena, as if time had suddenly stopped for a few seconds. In many repeated experiments afterward, the researchers continuously glimpsed more information through one rift after another, until one researcher accidentally discovered a novel titled Records of StellarDerby lying where a rift had disappeared. She noticed that the book seemed to record everything this world had done. What terrified her was that the final sentence was actually:\n§g‘She opened Records of StellarDerby and read the text within. Hmm, the text in the book confused her.’§!\nShe picked up her pen and was about to write this phenomenon into her research report, when a sentence immediately appeared in the book:\n§g‘The confused researcher picked up her pen, turned to her research report, and tried to record this strange phenomenon.’§!\nTerrifying. A thing like this becomes more frightening the more one thinks about it. The poor researcher hurriedly closed the book, hastily recorded the phenomenon, and rushed out of the research center. The next day, she took an extended leave. We never saw her again.\n§g‘This researcher was scared out of her wits. Do not worry. Her worldview was merely dealt a tremendous shock. You only need to keep operating in front of your terminal. She is fine.’§!"
uma_ap.301.a: "If we concentrate more Realms....."
uma_ap.301.tt: "§g‘Oh-ho, this is going to be crazy.’§!"
UMA_AP_BC_RESEARCH_MEGASTRUCTURE: "Research Realm Energy Concentration"
UMA_AP_BC_RESEARCH_MEGASTRUCTURE_DESC: "The question now is how to collect Realms and release them at the same time. If we can achieve this, perhaps we can uncover the secret of that strange novel."
uma_ap.302.title: "Research Complete"
uma_ap.302.desc: "§g‘Very interesting. They seem determined to see the research through, though that is only natural.’§!\nOur researchers have discovered that collecting and releasing the energy produced when Umamusume release their Realms is feasible. When these energies are released in a concentrated burst, they can reproduce the mysterious rift observed previously. As a result, our researchers conducted more attempts, and they repeatedly observed such things as human-like species, unknown quadrupeds, and transistors. At the same time, our researchers also recorded regularly occurring time pauses and time stagnation, thanks to recorders that remained inside the rifts and were not affected by sealing. These findings inevitably made us begin to question the reality of the world we inhabit. Subsequent research confirmed this insane hypothesis: the world we inhabit seems to exist within a simulation running on a high-dimensional silicon-based transistor computer. The many recorded temporal phenomena from before may have been the result of this computer's operation.\nThis means the operation of this computer will directly affect our fate. That will not do. Perhaps we can try to concentrate our Realms and elevate our species into a world on the same level as that crystal computer.\n§g‘Now they are trying to break through this wall.’§!"
uma_ap.302.a: "Of course."
uma_ap.302.tt: "§g‘A grand voyage.’§!"
UMA_AP_BC_BUILD_MEGASTRUCTURE: "Build the Realm-Space Manipulator"
UMA_AP_BC_BUILD_MEGASTRUCTURE_DESC: "Now we must turn theory into practice: build a device in space powerful enough to send everyone, aliens excluded, into a higher space. Our unmanned machines and animal experiments have verified its feasibility. All that remains is to ensure this grand engineering project proceeds steadily."
uma_ap.303.title: "Ready"
uma_ap.303.desc: "The super-device is ready. Now we only need to focus on collecting Realm Energy. To defend against unforeseen consequences, we may need to use necessary force and build up the necessary military reserves."
uma_ap.303.a: "Understood."
uma_ap.303.tt: "§g‘...measures for what is to come.’§!"
uma_ap.400.name: "Reach the Milestone"
uma_ap.400.desc: "Realm Energy has begun to be collected from our Umamusume and transmitted through devices on starbases into the Realm-Space Manipulator, where it is stored for the final release. Every department has made tremendous efforts for this process, all for the day when we cross that wall."
uma_ap.400.a: "Forward."
uma_ap.401.name: "$uma_ap.400.name$"
uma_ap.401.desc: "Our R&D department has devised a way to make weapons and war machines as cheap as household goods."
uma_ap.401.a: "Why not?"
uma_ap.402.name: "$uma_ap.400.name$"
uma_ap.402.desc: "Our Realm Energy reserves are nearly complete. For efficiency, we can wage wars more frequently."
uma_ap.402.a: "OK"
uma_ap.403.name: "$uma_ap.400.name$"
uma_ap.403.desc: "We have finally reached this step! From now on, we will slowly release the stored Realm Energy and tear a rift into the space we inhabit. During this period, we expect to suffer fierce attacks. As long as §Rthe capital is not disturbed by enemy fleets§!, everything will function normally.\n\n§RRemember: the capital starbase must not be occupied/controlled/destroyed, or everything will end.§!\n§RRemember: the capital starbase must not be occupied/controlled/destroyed, or everything will end.§!\n§RRemember: the capital starbase must not be occupied/controlled/destroyed, or everything will end.§!"
uma_ap.403.a: "We are ready."
uma_ap.403.a.tt: "You can track the activation progress in the situation log. Activation will take about 72 months."

uma_ap.4122.desc: "......\nI need to talk to you about something......\nI... may not be able to depart with you for the next plane. Because I do not have a so-called ‘soul,’ unlike other Umamusume. I am only an empty shell driven by machinery.\nHmm..... What should I do? This is so troubling. If I pass through directly, I will definitely be vaporized instantly.\nHow about this? I will stay here and wait for you to come back. You must come back to find me, okay? See you at the old place!"
uma_ap.4122.a: "Okay......"

uma_ap.413.desc: "All devices have completed activation. Our species has gradually been elevated to a higher plane, and now we can try to coexist with humans in this place they dominate.\n......\nHey, you have read this far. Why not turn your head and look? There is nothing there, right? Of course. As three-dimensional beings, you cannot directly see lower-dimensional objects. But the place where we live is actually very, very close to you. As long as you want it, we are right beside you."
uma_ap.413.a: "......"

uma_ap.415.desc: "It is all over. §H[From.GetName]§! has completed the activation of the massive megastructure within their galaxy.\n\nAs they departed for a plane we could never even imagine and became rulers there, space itself began dissolving from the megastructure outward at an unbelievable speed. Like dropping an effervescent tablet into water, it swept across the entire galaxy, destroying everything in its path.\n\nFor the inhabitants of this galaxy, this is the end of all things."

uma_ap.416.name: "Game Over"
uma_ap.416.desc: "Our defensive line has been destroyed, and all Realm transmissions have been interrupted. But the Three Goddesses on the higher plane will surely not let us go. Before long, our entire civilization was erased in an instant.\n\n§g‘A regrettable ending. Of course, you can try reloading and giving it another attempt. If it is still too difficult, the corresponding aid will be placed in your hands.’§!"
uma_ap.416.a: "Regrettable."
uma_ap.416.a.tt: "Game over. Your civilization will be erased."

