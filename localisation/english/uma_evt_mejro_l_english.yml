l_english:
  uma_ar_mejro_ardan: "One-Way Ticket"
  uma_mejro_ardan.1.title: "Odysseus and Her One-Way Ticket"
  uma_mejro_ardan.1.desc: "When this rift tore through space, we received a faint neutrino signal. After decryption by the R&D department, we believe this signal originated from a private satellite launched last century by an aerospace group founded by the 'Mejro Family.' Its purpose was to verify the possibility of Umamusume spaceflight.\nFrom the records of that era, our database contains only a surviving transcript of the final dialogue between the astronaut and Mission Control:\n'Control, I'm not sure what is pulling me, but the only thing I know is... the rocket's power isn't enough to break free...'\n'...any way out...'\n'I don't think so.'\n'We are sorry... we... can only wish you luck.'\n'Please do not lose heart, nor be discouraged by the failure of this expedition. We have done the very best we could. True failure only begins when we resist and fear trying again because of a single defeat. I think I shall take a sleep. I hope that when I open my eyes again, our rockets will have already broken out of the solar system. I look forward to that day, and I am certain... convinced... confident... that we will achieve it...'\nWe are certain a craft exists within, but what kind? Is it related to that missing astronaut? Is she still alive? Or is this just another inexplicable transmission from within the event horizon?\nI wish to investigate. The Umamusume of the Mejro family seem exceptionally enthusiastic about this exploration."
  uma_mejro_ardan.1.a: "Let us go in and see."

  uma_mejro_ardan.2.title: "The Long Journey"
  uma_mejro_ardan.2.desc: "The Interdimensional Probe entered the rift carrying several members of the expedition team. Surprisingly, after a few minutes, the surrounding environment showed no significant change, remaining as calm as the space outside. Our team members soon felt drowsy, but according to flight regulations, sleeping during an investigation is prohibited. 'Ugh, I want to add a parfait to my dinner once we get out of here.'\nJust as they were dreaming of the taste of tonight's parfait, the gravity on the instruments suddenly surged. Our probe plunged into the atmosphere and crashed heavily onto a grassy field. Thanks to the probe's excellent performance, there was little damage other than a few wires tangled around the surface.\nMoments later, our expedition team set foot on this land."
  uma_mejro_ardan.2.a: "Tonight's parfait is cancelled."

  uma_mejro_ardan.3.title: "The Pioneer"
  uma_mejro_ardan.3.desc: "There are many strange species here. Some botanists and biologists, adhering to the principle of 'since we're already here,' collected local 'specialties' on the way to the destination. Please do not be too harsh; scientists always love these novelties.\nNot far away, a rocket covered in green vegetation and rust appeared before the crowd. The rocket was nearly snapped in two. The team members instinctively stood before the wreckage in a moment of silence, praying for the Three Goddesses to receive the soul of this hero.\nInside the rocket's control room, they found the astronaut sitting in her chair. Her original body had turned to bone, still clad in that heavy spacesuit; her motionless frame had become a sanctuary for vegetation. She had almost merged with nature, with a brilliant flower blooming from her hollow eye sockets.\nShe likely passed away due to lack of food or other causes before the rocket even reached this planet.\nIn her arms, she held a diary, recording everything from the first day of departure to the last day before her death. At the end of the diary, she wrote in shaky handwriting:\n'I am already too far... so far... from my motherland.' People back then thought she would be a figure like an interstellar Columbus or Magellan, never imagining she would fare worse than a Robinson Crusoe stranded on a desert island."
  uma_mejro_ardan.3.a: "We have come to take you home."

  uma_mejro_ardan.4.title: "The Iliad"
  uma_mejro_ardan.4.desc: "After several days of traveling toward the marked signal source, our expedition members found themselves in a crystal plain. The quality of crystals here is far superior to anything collected or purchased on the market; their hardness makes them suitable for forging ship shields, remaining resilient under any circumstances.\nNot forgetting their purpose, they continued their march with a touch of reluctance.\nAs they reached the depths of the planet, they found traces of life—evidence that someone had stayed here for a considerable time. Naturally, they thought of the astronaut. Portable survival tools and backpacks from that era found later confirmed this. Nearby, they also discovered the wreckage of a last-century rocket showing signs of attempted repairs, though she clearly had not succeeded.\nInvestigators found several notebooks in the toolkit. The pages were yellowed, looking as if they would crumble at a touch. In the area where the astronaut lived, they also found inscriptions carved into the ground, likely continuing the content of the notebooks. They carefully scanned the notebooks and other writings, syncing the data to the command center.\nPerhaps she once thought that one day her kin would surely find her—it was only a matter of time. She believed these writings would help them. At the beginning of every notebook and chapter, she wrote:\n'To my dear friends... Hey! If your surname is Mejro, no... even if it isn't...'"
  uma_mejro_ardan.4.a: "It should not be over yet."

  uma_mejro_ardan.5.title: "The Lady in the Painting"
  uma_mejro_ardan.5.desc: "As the expedition traveled toward the planetary core through surface caves, they discovered that the crystals here were mysteriously interconnected, like veins transporting something into the depths.\nAs they went deeper, the secret was unveiled. At the center of the planet lay a massive rhombohedral crystal, surrounded by other crystals as if in an embrace. When the investigators noticed what was inside the central crystal, they were speechless.\nEncased within was the very person they had been searching for: Mejro Ardan. She wore that 20th-century spacesuit; her eyes were closed, and her hands were peacefully folded, showing a childlike serenity. It made everyone feel that regardless of how she entered the crystal—whether forced or voluntary—she looked happy now. She was like a prehistoric creature trapped in amber, having bypassed aging and decay to remain preserved in the crystal. It was as if all the youth and beauty of the world permanently surrounded her, keeping her young, beautiful, and valiant. She looked exactly like the image of 'Mejro Ardan in a spacesuit' preserved in hearts and artwork. Who could have imagined she was an old soul from two or three centuries ago?\nThey couldn't help but marvel; the 'Lady in the Painting' who usually only appeared in book illustrations or murals was now standing before them. Many felt the excitement of a young idol meeting their hero.\nWhile official personnel were still debating if Ardan still had life signs and if moving the crystal would cause the planet to collapse, members of the Mejro family had already brought out cutting equipment, preparing to bring Ardan back to Tracen.\nOnly at times like this would the Mejro family set aside their usual reserve and elegance.\n'Hey! You're being too reckless!'"
  uma_mejro_ardan.5.a: "Our Sleeping Beauty."

  uma_mejro_ardan.6.title: "Time of Thawing"
  uma_mejro_ardan.6.desc_a: "The team entrusted Ardan's life to $AGT$, who was presiding over the project, giving her many instructions to be careful. Researchers familiar with $AGT$ often describe her experiments: 'Though the process is always thrilling, you'll realize her technique is almost like showmanship—frightening but actually efficient and safe.' Whether $AGT$ took the instructions to heart or simply knew this was a grave matter, she worked pragmatically without any unnecessary theatrics, putting the observers at ease.\nThe project took less than an hour; 'Operation Icebreak' was complete. Ardan now lies peacefully on a medical bed, her face slightly flushed. Her slow, steady breathing tells everyone: she is alive, merely sleeping. No one was more excited than the Mejro family; if they weren't right next to Mejro Ardan, they would have shouted for joy and run tens of thousands of meters on the track.\nNow, all Ardan needs is quiet rest until the day she wakes up on her own."
  uma_mejro_ardan.6.desc_b: "The team entrusted Ardan's life to the Lead Researcher, giving her many instructions to be careful. She knew this was an extremely serious and important matter that allowed no mistakes. Throughout the process, she worked pragmatically without any unnecessary actions, which put the observers at ease.\nThe project took less than an hour; 'Operation Icebreak' was complete. Ardan now lies peacefully on a medical bed, her face slightly flushed. Her slow, steady breathing tells everyone: she is alive, merely sleeping. No one was more excited than the Mejro family; if they weren't right next to Mejro Ardan, they would have shouted for joy and run tens of thousands of meters on the track.\nNow, all Ardan needs is quiet rest until the day she wakes up on her own."
  uma_mejro_ardan.6.a: "Well done."

  uma_mejro_ardan.7.title: "Old Era Citizen in a New Century"
  uma_mejro_ardan.7.desc: "Ardan has woken up. This is actually a secret known to few. She was soon able to get out of bed; though medical staff urged her to rest, she insisted otherwise, though she eventually compromised. To avoid disturbing her, the Mejro family sent only three small representatives.\nArdan often goes to the garden, and three little ones always sneak after her. She always invites them over, teasing: 'Why are you just standing there? Are you afraid of me?'\nWhenever Ardan is surprised by modern progress, they can't help but smile. Their nation's territory is no longer limited to one planet or system; they have become an interstellar civilization that the entire galaxy cannot ignore. She still needs to adapt—just as she only recently learned she had become a spiritual symbol for a generation.\nThinking of familiar people and things long gone with time, she is inevitably struck by grief, often sobbing in her room after the representatives leave.\nWhen asked why she was inside that crystal:\n'They... weren't ordinary. They could grow naturally, which is mind-boggling, but they lacked a pulsing heart like ours. I thought: Can I be that heart? I'd die here eventually from lack of food anyway. Once I had that thought, I actively reached out to them and merged into the crystal... It felt a bit like being in a coma. When the expedition arrived, I could feel them. They were like knights. Looking back, it wasn't a bad choice,' Ardan said with a light smile.\nThe vibrant energy that drove Ardan in her youth has resurfaced. She asked the representatives to buy her many books to study the science and humanities of two centuries later. It is clear that Ardan will never give everything up to live a quiet life somewhere."
  uma_mejro_ardan.7.a: "A remarkable soul."

  uma_mejro_ardan.adname: "Mejro Ardan"
  uma_mejro_ardan.8.desc: "First meeting, [Root.ruler.GetRulerTitle]. This communication is my personal request."
  uma_mejro_ardan.8.a: "What does Ardan need from us?"
  uma_mejro_ardan.9.desc: "I hope to be granted an opportunity for employment. I do not wish to live like a rare animal in a zoo. I wish to continue my career... If this profession requires an evaluation exam, please give me the chance. Even if I fail, I will not hold it against you. I have done my homework..."
  uma_mejro_ardan.9.a: "So, you still want to be a scientist?"
  uma_mejro_ardan.10.desc: "How could I not, [Root.ruler.GetRulerTitle]? This has been my ambition since I was a child, and I wish to strive for it my whole life."
  uma_mejro_ardan.10.a: "But your body... can it handle it?"
  uma_mejro_ardan.11.desc: "My health is no longer an issue... otherwise, I wouldn't have been the Chief Astronaut of the Tracen Union. These things can be proven."
  uma_mejro_ardan.11.a: "Even so, we still wish for you to rest well."
  uma_mejro_ardan.12.desc: "[Root.ruler.GetRulerTitle], I have already rested for over two hundred years."
  uma_mejro_ardan.12.a: "Very well. If you can pass the exam, we will accept you."
  uma_mejro_ardan.12.a.repo: "Thank you, [Root.ruler.GetRulerTitle]. I am glad I am about to return to my post."

  uma_mejro_ardan.13.title: "The Unified Exam"
  uma_mejro_ardan.13.desc: "News of Ardan's return has already spread through various channels, and official notices later confirmed its veracity. Though the people are enthusiastic, they are capable of independent thought; they don't form mobs with banners to disturb her rest. Only occasionally do small groups of fans gather nearby, hoping for a glimpse of her. Unfortunately, Ardan hasn't stepped out. People assume she is recovering, but she is actually studying this century's knowledge day and night. The 23rd-century knowledge easily overwhelmed her 20th-century brain.\nAs the unified exam for scientific and technical personnel concluded, some observant citizens noticed a familiar name on the National Academy of Sciences recruitment list: Mejro Ardan."
  uma_mejro_ardan.13.a: "She passed."

  UMA_MEJRO_ARDAN_SAVE_AD: "Melt"
  UMA_MEJRO_ARDAN_SAVE_AD_DESC: "Our expedition team brought back Ardan, who was encased in crystal within the rift. Obviously, we cannot leave this crystal coffin in a museum. To confirm if Ardan is still alive inside, we must rescue her."

  uma_mejro_ardan.14.desc: "§YMejro Ardan holds her textbook, walking with a light step, like a feather drifting to the ground, rising, and drifting again.\nShe has adapted remarkably well to the changes of this era. Her face is filled with childlike joy, liveliness, and curiosity.\nShe stops suddenly, looking surprised; she didn't realize the Student Council Secretary was standing there quietly.§!\n'Hello, [Root.ruler.GetRulerTitle]. Are you here on official business?\nIf you need, I can accompany you; I am familiar with every colleague and professor here.'"
  uma_mejro_ardan.14.a: "No, I'm just here to see how you are doing."
  uma_mejro_ardan.14.a.resp: "§YShe smiles softly, appearing grateful for the gesture.§!\n'Don't worry about me, [Root.ruler.GetRulerTitle]. After all, counting the time I was sealed, I'm hundreds of years old! The current knowledge and theories are dazzling. Honestly, the physics I learned back then feels like it was for nothing now, which makes me a bit sad. Because of that, I enjoy learning this advanced knowledge; it always benefits me. I believe I will be back at work soon.'"
  uma_mejro_ardan.14.b: "It seems you get along well with them."
  uma_mejro_ardan.14.b.resp: "'Yes, [Root.ruler.GetRulerTitle]. I can even proudly tell you that I recognize the face of every colleague in this facility and can call them by name!'\n§YHer face truly shows that pride, yet she remains gentle and humble.§!\n'They teach me modern physics and aerospace science, as well as modern common sense and the history from my generation to the present. Without them, I'd still be stumbling through textbooks. Yes... they have helped me a lot.'"
  uma_mejro_ardan.14.c: "I believe you can work, but we are afraid of another accident."
  uma_mejro_ardan.14.c.resp: "'In my time, I had already considered every hardship and despair I might face. Others said my body wouldn't survive the real space environment even if I passed the simulations. But even so, I chose to board that rocket.'\n§YHer gaze is so resolute that it reminds one of a photograph taken by a reporter two hundred years ago: she is in a heavy spacesuit, turned back, smiling, with her right hand raised in a 'V' for victory.§!\n'Taking a step back would mean completely denying my former determined self. We have developed to this point not by clinging to the past, but through the belief that we can stride forward with our heads held high.'"

  uma_mejro_ardan.14.hire: "Welcome back."
  uma_leader_ardan: "Aerospace Pioneer Mejro Ardan"
  uma_mejro_ardan.15.title: "A Century Ago Today"
  uma_mejro_ardan.15.desc: "At some point, a planet suddenly appeared before the rift where Ardan was found. It seems the rift spat out the planet the expedition had landed on. We aren't entirely sure why, but the fact remains: we have another planet available for colonization."
  uma_mejro_ardan.15.a: "Very good."

  uma_pc_ardan_planet: "Artroi"

