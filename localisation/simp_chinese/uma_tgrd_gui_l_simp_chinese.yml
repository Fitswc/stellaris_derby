l_simp_chinese:



tech_uma_atom_breker: "快速分子分裂剂"
tech_uma_atom_breker_desc: "这个神奇的药剂可以很快地将分子分裂成原子 \n\n修正:\n 气体精炼工维护费: §G-8%§!"
tech_uma_atom_sticker: "快速原子组合剂"
tech_uma_atom_sticker_desc: "正如其名——这个神奇的药剂可以将一堆原子轻松地组合成不同的分子 \n\n修正:\n $mod_planet_jobs_alloys_upkeep_mult$ §G-10%§!\n 巨型结构建造速度: §G+8%§!\n 军用舰船维护费 §G-6%§!"
tech_uma_effective_catalyst: "高效催化剂"
tech_uma_effective_catalyst_desc: "该催化剂可以大幅提升反应速度 \n\n修正:\n 星球专家人口资源产出: §G+7%§!"
tech_uma_tg_alloys_maker_Automatic: "TG-自动化合金制造厂"
tech_uma_tg_alloys_maker_Automatic_desc: "该合金工厂已经实现自动化，只需要通电就可以源源不断地产出大量的合金"
tech_uma_tg_alloys_maker_Automatic_2: "TG-自动化合金制造厂Ⅱ"
tech_uma_tg_alloys_maker_Automatic_2_desc: "该合金工厂已经实现自动化，只需要通电就可以源源不断地产出大量的£alloys£合金"
tech_uma_tg_custom_goods_productor: "TG-自动化消费品工厂"
tech_uma_tg_custom_goods_productor_desc: "该消费品工厂已经实现自动化，只需要通电就可以源源不断地产出大量的£consumer_goods£消费品"
tech_uma_tg_custom_goods_productor_2: "TG-自动化消费品工厂Ⅱ"
tech_uma_tg_custom_goods_productor_2_desc: "该消费品工厂已经实现自动化，只需要通电就可以源源不断地产出大量的£consumer_goods£消费品"
tech_uma_tg_industrial_complex: "TG-工业复合体"
tech_uma_tg_industrial_complex_desc: "这个工厂似乎什么都能生产！"
tech_uma_tg_planet_energy_extractor: "TG-行星能量提取器"
tech_uma_tg_planet_energy_extractor_desc: "这个建筑可以提取行星核的能量，以产出大量的£energy£能量"
tech_uma_tg_planet_energy_extractor_2: "$tech_uma_tg_planet_energy_extractor$Ⅱ"
tech_uma_tg_planet_energy_extractor_2_desc: "$tech_uma_tg_planet_energy_extractor_desc$"
tech_uma_tg_resource_soil: "TG-高压资源储存罐"
tech_uma_tg_resource_soil_desc: "这个储存罐可以以一种很高级的方法储存大量的物资"
tech_uma_super_high_temp_container: "高温容器"
tech_uma_super_high_temp_container_desc: "这个容器可以承受极端高温 \n\n修正:\n 星球工人人口资源产出: §G+7%§!"
tech_uma_high_presure_molt: "高能粒子浓缩工艺"
tech_uma_high_presure_molt_desc: "易爆微粒将会被高压压缩，以更小的体积容纳更多的高能微粒。\n\n修正:\n 舰船武器伤害 §G+20%§!\n 舰船武器射程 §G+7%§!"
tech_uma_weapon_controler: "武器控制系统"
tech_uma_weapon_controler_desc: "高级武器控制系统可以帮助我们更加便捷地控制各种武器 \n\n修正:\n 舰船武器射程 §G+3%§! \n 命中率 §G+10%§!"
tech_uma_energy_raiser_b70: "B70能量增幅器"
tech_uma_energy_raiser_b70_desc: "这个能量增幅器可以大幅度增强能量等级 \n\n修正:\n 基础舰船速度 §G+5%§! \n 恒星基地模块花费 §G-10%§!"
tech_uma_high_energy_electoric_projector: "高能电子流发射器"
tech_uma_high_energy_electoric_projector_desc: "这个装置可以快速发出高能电子流 \n\n修正:\n 舰船武器射速 §G+10%§!"
tech_uma_combine_light_projector: "集束光发生器"
tech_uma_combine_light_projector_desc: "这个装置可以发出强大的集束光，放出巨大的能量 \n\n修正:\n 舰船武器射速 §G+10%§!"
tech_uma_MAAM: "TG-MAAM导弹"
tech_uma_MAAM_desc: "TG多头子母导弹，可以对对象舰船进行密集打击"
tech_uma_QAAM: "TG-QAAM导弹"
tech_uma_QAAM_desc: "TG追踪强化导弹，可以精准地打击对象舰船"
tech_uma_tg_reaction: "TG-反应堆"
tech_uma_tg_reaction_desc: "TG强化型反应堆，能短时间产生巨大的能量"
tech_uma_arch_weapon: "TG-弧光武器"
tech_uma_arch_weapon_desc: "TG弧光武器，能够用短时间内发出的巨大能量击穿对象舰船"
tech_uma_tg_reaction_2: "TG-反应堆 GenⅡ"
tech_uma_tg_reaction_2_desc: "$tech_uma_tg_reaction_desc$"
tech_uma_arch_weapon_2: "$tech_uma_arch_weapon$ GenⅡ"
tech_uma_arch_weapon_2_desc: "$tech_uma_arch_weapon_desc$,与上一代相比可以使用同样数量的材料做出效能更高的反应堆"
tech_uma_tg_reaction_3: "TG-反应堆 GenⅢ"
tech_uma_tg_reaction_3_desc: "$tech_uma_tg_reaction_desc$,与上一代相比可以使用同样数量的材料做出效能更高的反应堆"
tech_uma_nice_nature_ring: "’优秀素质‘光环"
tech_uma_nice_nature_ring_desc: "来了就走不掉嗷"
tech_uma_energy_wall_shield: "TG-城墙护盾"
tech_uma_energy_wall_shield_desc: "似乎打穿不了？"
tech_uma_wall_armor: "TG-城墙装甲"
tech_uma_wall_armor_desc: "据说发明者将流式凝膏状物质填充入甲板中间，达到了意想不到的效果。不知道处于什么心理，发明者还将自己的肖像印在了装甲外。"
tech_uma_army_enhance_treatment: "陆军强化医疗剂"
tech_uma_army_enhance_treatment_desc: "我们承诺，治疗剂里没有添加任何奇怪的物质 \n\n修正:\n 进攻部队生命值 §G+40%§! \n 进攻部队伤害 §G+40%§! \n 陆军所受伤害 §G-20%§! \n 防御部队生命值 §G+40%§!"


