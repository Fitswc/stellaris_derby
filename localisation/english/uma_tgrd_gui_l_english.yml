 tech_uma_energy_wall_shield_desc: "It seems that it can't be penetrated?"  #NT!
 tech_uma_wall_armor: "TG-City Wall Armor"  #NT!
 tech_uma_wall_armor_desc: "It is said that the inventor filled the flow paste-like substance into the middle of the deck, achieving unexpected results. I don't know what mentality he is in, but the inventor also printed his portrait outside the armor."  #NT!
 tech_uma_army_enhance_treatment: "Army intensive medical agent"  #NT!
