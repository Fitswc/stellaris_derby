 uma_zephyr_unknown: "???" #NT!
 uma_zephyr_name: "Yamanin Zephyr" #NT!
  
 uma_zephyr.2.title: "Like the wind" #NT!
 uma_zephyr.2.desc: ""During the investigation of the star system, we discovered a strange spacecraft. After preliminary investigation, it was found that the ship had a strong Umamusume design style, but there was no record of the design of this type of spacecraft in our drawing library. But what is certain is that the owner of the ship must belong to a Umamusume. \nWe have initiated a contact with the vessel."  #NT!
 uma_zephyr.2.a: "I believe the other party will respond soon"  #NT!
  
  
 uma_zephyr.3.desc: "Oh, I didn’t expect that I could encounter the wind from my hometown in such a place. So, is it auspicious wind or a plum rain wind?"  #NT!
 uma_zephyr.3.a: "Please tell me your identity first and why you appeared here"  #NT!
  
  
 uma_zephyr.4.desc: "My bad. My name is Yamanin Zephyr. At present, I am following the guidance of the wind and becoming a cosmic traveler. \n\nYou have retrieved relevant information from Yamanin Zephyr. The information shows that the other party was once a well-known G1 Athlete in our country and has achieved brilliant results in short, miles and mid-range routes. However, after the competition career, Yamanin Zephyr quickly disappeared and no relevant information was leaked."  #NT!
 uma_zephyr.4.a: "The guidance of the wind?"  #NT!
  
 uma_zephyr.5.desc: "Yes. when I was very young, I could receive messages from the wind. The wind is my pursuit. \nAfter I retired, I decided to pursue a free life like the wind and see everything the wind saw. So, I learned about the construction and driving technology of the spacecraft and built the UMAS Zephyr myself. The UMAS Zephyr not only fully meets all indicators of all Umamusume spacecraft, but also has a weapon system for self-defense."  #NT!
 uma_zephyr.5.a: "So, what are you going to do after that?"  #NT!
  
 uma_zephyr.6.desc: "Of course, it is to follow the guidance of the wind and explore in the infinite universe."  #NT!
 uma_zephyr.6.a: "Although we don't know what the wind is, we can allow you to travel in space"  #NT!
 uma_zephyr.6.b: "Folk spacecraft cannot enter unknown galaxies at will. We ask you to return immediately"  #NT!
 uma_zephyr.6.a.repo: "Thank you, you are such a warm person as the wind. Then, I will set off first. Maybe we will have another day to meet during the cosmic journey. May Egypt and Russia bless you, goodbye."  #NT!
 uma_zephyr.6.b.repo: "Uh... It's really... awful Storm. Then, goodbye."  #NT!
  
  
 uma_zephyr.11.title: "Pothos"  #NT!
 uma_zephyr.11.desc: "A spacecraft was found near our newly built observatory. After observation, it was confirmed that the Zephyr, which was also photographed."  #NT!
 uma_zephyr.11.a: "What a coincidence"  #NT!
  
 uma_zephyr.12.desc: "I'm very happy to see you, a person like Kaifeng."  #NT!
 uma_zephyr.12.a: "nice to meet you too. What are you doing here?"  #NT!
 uma_zephyr.13.desc: "As you can see, I am observing this indigenous civilization. Before you came here, I had observed this young civilization for a long time. Are we in the past, just like them now, ignorant, but full of vitality and desire for the unknown? And do we still have this desire now?"  #NT!
 uma_zephyr.13.a: "If you prefer, welcome to our observer"  #NT!
 uma_zephyr.14.desc: "Thank you very much, you are indeed a person as warm as the wind."  #NT!
 uma_zephyr.14.a: "You're welcome"  #NT!
 uma_zephyr.15.desc: "Then, let me observe this young civilization for a while. I will continue my journey after that and I think we will definitely meet again. May Niold protect you."  #NT!
 uma_zephyr.15.a: "Then I won't bother you anymore, I wish you a good trip~"  #NT!
  
  
 uma_zephyr.21.desc: "It take a long time, I didn't expect to see you here."  #NT!
 uma_zephyr.21.a: "I am very happy to see you, Miss Yamanin, why do you get involved in Tiyanki team?"  #NT!
  
 uma_zephyr.22.desc: "I encountered their cemetery during my trip, and all Tiyanki would swim here when she was about to die. I want to observe them this quiet farewell ceremony"  #NT!
 uma_zephyr.22.a: "Your spaceship sends radio waves the same as those of Tiyanki and others. Can you communicate with each other?"  #NT!
  
 uma_zephyr.23.desc: "Yes. I have been observing the lives of Tiyanki and others for a long time, and roughly figured out the communication methods between Tiyanki and others. Now I can have a simple communication with Tiyangqi and others through the Zephyr."  #NT!
 uma_zephyr.23.a: "Really...awesome."  #NT!
  
 uma_zephyr.24.desc: "Maybe one day the wind will guide me in scientific research. Oh, Tiyanki and the others have gone far away, I am going to chase them. Goodbye, I bless you with my wishes."  #NT!
 uma_zephyr.24.a: "Bye"  #NT!
  
  
 uma_zephyr.30.title: "Storm that approaching"  #NT!
 uma_zephyr.30.desc: "A huge space storm occurred in our country, which had a serious impact on the waterway and even caused a certain degree of damage to various planets. The Student Union has issued a storm warning to warn residents to avoid storm disasters. \nHowever, there are always unexpected situations, for example, now we find that the Zephyr is traveling through the storm!"  #NT!
 uma_zephyr.30.a: "What's going on"  #NT!
  
 uma_zephyr.31.desc: "What a huge storm, right!"  #NT!
 uma_zephyr.31.a: "Miss Yamanin is about to leave here, it's very dangerous!"  #NT!
  
 uma_zephyr.32.desc: "I-know, don't worry, this is the unique wind, it is a rage, madness, creation, I must be close to the distance and feel everything about this space storm!"  #NT!
 uma_zephyr.32.a: "But this is not the real wind"  #NT!
 uma_zephyr.33.desc: "Wrong, this is undoubtedly the real wind! \nIf something happened, I will start the jump engine to escapes! The signal--it's really--so bad--I'm going to terminate the communication, see you again! "  #NT!
 uma_zephyr.33.a:  "Well, I hope she is really know that"  #NT!
  
 uma_zephyr.41.title: "Star beast"  #NT!
 uma_zephyr.41.desc: "The huge star beast discovered recently has become the biggest topic among Tracen's folk in recent days. Let’s take a look at the comments from the former G1 Athlete, Yamanin Zephyr, who always wants to do whatever he wants, commented that such a big star beast is probably even able to eat stars.\n Of course, we received this comment  because we found the Zephyr passing near the system where the star beasts exist!"  #NT!
 uma_zephyr.41.a: "Where have you been again this time"  #NT!
  
 uma_zephyr.42.desc: "This is the first time we have met, the gentle wind?"  #NT!
 uma_zephyr.42.a: "Miss Yamanin, are you here to observe the Star Beast?"  #NT!
 uma_zephyr.43.desc: "I'm very happy to see you again. As you said, I am observing the star beast. If evaluated by the wind standards, this star beast is a well-deserved hurricane. It's so huge. In front of it, we are really entrusting the mayflies in the world, a drop in the vast ocean. However, even so small, we can achieve such a great cause as the Interstellar Empire."  #NT!
 uma_zephyr.43.a: "Don't get too close to the other party, it will be troublesome if you are attacked."  #NT!
 uma_zephyr.44.desc: "I will keep an observation at a safe distance, rest assured. Then, I'll take a step first. May Ehkat bless you, goodbye!"  #NT!
 uma_zephyr.44.a: "Goodbye ~"  #NT!
  
 uma_zephyr.50.desc: "It has been three years since the last time I received the news that I took the photo. In these three years, Yamanin Zephyr lost all the news as if it had evaporated. We think we can still travel to a very far place from Tracen. Maybe one day she will contact us again, maybe it’s now? \n'The west wind has brought guidance. ’\n’I haven’t contacted me for a long time, Miss Yamanin. What have you experienced in the past three years? ’\n’I think the wind guides me to the other end of the universe. But now, the guidance of the wind has changed its direction and is heading towards its hometown. Maybe, I've already arrived at the day I'm going home. ’\n’Is Miss Yamanin finally going back to her hometown? What about joining the student union after you come back? We need your wisdom and experience. ’\n’ Then before the wind changes again, I will stay in the student union to work. Then, [This.Ruler.GetName], please give me some advice~’"  #NT!
 uma_zephyr.50.title: "The way back"  #NT!
 uma_zephyr.50.a: "Welcome, Miss Yamanin"  #NT!
 uma_zephyr.50.a.tt: "Yamanin Zephyr will join us after 90 days"  #NT!
  
 uma_zephyr.51.title: "The dear to the west wind"  #NT!
 uma_zephyr.51.desc: "Three months later, UMAS Zephyr landed near the Tresen Student Union office. What we didn't expect was that Yamanin Zephyr did not have the intention to work in the Academy of Sciences, but instead learned administrative management knowledge from scratch. She is even more skillful in learning, and her ability to handle government affairs has become comparable to that of an elderly person who has been on duty for more than ten years after just a few weeks. \nWhile studying, she compiled her experiences from many years of travel into the publication of "The Story of Zephyr", which also received a warm response in the market. Readers said that although some of the rhetorical sentences in the book are obscure and difficult to understand, the content is detailed and colorful, and truly records the scenery and scenery of the universe. "The Story of Zephyr" became the book sales champion of that year."  #NT!
 uma_zephyr.51.tt: "§R New ship type: Armed science ship has been added to the design library§!"  #NT!
  
 uma_zephyr_catch_phrase: "This soul burns like restlessness... like the strong wind, running forward hard!"  #NT!
 uma_zephyr_backstory: "...I'm Yamanin Zephyr \nWhat I pursue is the wind...the wind faster than anything else, \nI want to turn into a style - the wind that runs freely."  #NT!
  
 uma_official_trait_sp_zephyr: "The dear to the west wind"  #NT!
 uma_official_trait_sp_zephyr_desc: ""
