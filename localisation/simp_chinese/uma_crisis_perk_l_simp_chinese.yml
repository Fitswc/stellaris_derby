uma_menace_crisis_description_title: "马娘的世界"
uma_menace_crisis_description_intro: "种种怪异现象和研究让我们确信我们所处的世界并非真实，我们决定充分利用我们的领域能力，打破我们前往新世界的那面墙。无论谁将阻挡我们，我们都会让他们走向灭亡。"
uma_menace_crisis_description: "$uma_menace_crisis_description_intro$\n\n我们的的目标在于如何快速收集领域能，我们只需要找到办法让这个速度加快再加快"
uma_menace_crisis_howto_title: "领域能和美丽新世界"
uma_menace_crisis_howto: "您将会作为常规国家完成§H天灾目标§!以产生£uma_menace£§H领域能§!，这样便能在解锁帝国的各种增益，助您完成最终的天灾任务，为马娘们带来一个新的时代。值得注意的是，尽管这个天灾目标可以轻易完成，但是请尽量消灭他国的舰队实力，否则在最终阶段可能面临过于强大的挑战。"

uma_crisis_path_orbital_ring: "领域空间篡改器"
uma_crisis_path_orbital_ring_DESC: "别名破窗锤，可以将领域能集中起来，扭曲或者撕裂当前的空间，将我们的种族从这由藏在裂隙后的物体制造的不确定性中解放出来"

