zone_uma_energy_venus_desc: "卓芙来啦！全部发电工人都不允许在这个区域工作！全——部，靠爱发电！"

##ring world
zone_uma_industrial_ring_world: "工业区段"
zone_uma_industrial_ring_world_desc: "数以万计的工厂正在这个区段马力全开，生产着上至战争机器下至生活用品的工业产品。"

zone_uma_research_ring_world: "研究区段"
zone_uma_research_ring_world_desc: "这里聚集了所有马娘的智慧结晶，许多研究成果将在这里产生。"

zone_uma_unity_ring_world: "文娱与政府区段"
zone_uma_unity_ring_world_desc: "这里不仅可以召开盛大的演唱会，也可以变为官僚和权力机构的主场。"

zone_uma_fortress_ring_world: "防御区段"
zone_uma_fortress_ring_world_desc: "这里充满着星球防御设施。"

zone_uma_trade_ring_world: "贸易区段"
zone_uma_trade_ring_world_desc: "这里充斥着商业建筑，各种商战手段和心机在这里的得到了集中体现。"

zone_uma_food_ring_world: "食品区段"
zone_uma_food_ring_world_desc: "无尽的原野铺满了这一个区段，为整个环带提供源源不断地食物产出。值得一提的是，整个区段本身就是个巨大的温室。"

zone_uma_energy_ring_world: "发电区段"
zone_uma_energy_ring_world_desc: "各种发电设施占据了这个区段，这里将成为整个环带的能量中枢。"

zone_uma_training_ring_world: "训练与教学区域"
zone_uma_training_ring_world_desc: "这个区段耸立着众多学校和训练场所，简直是学生们的福地。"

zone_uma_housing_ring_world: "卫星城区段"
zone_uma_housing_ring_world_desc: "这个周边城市可以有效拓展这个环带的城市功能，甚至可以起到分担城市职能的作用。"

