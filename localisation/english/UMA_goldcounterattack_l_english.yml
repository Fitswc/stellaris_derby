 uma_crisis.7001.desc: "As far as I can remember, the Golden Family has been on the Homeland Ship. Few people still remember the past events, and the only thing they are thinking about is the journey back home."
 uma_crisis.7002.desc: "We all have pretty quirky personalities, so even our daily lives can be full of ups and downs, but we still get along pretty well, so it’s pretty enjoyable all in all."
 uma_crisis.7003.desc: "Achuan is probably the most out of line one, even I can't do anything about her."
 uma_crisis.7004.desc: "When the Overfer wears a mask, her personality is relatively gentle, but when she takes it off, she becomes very irritable. If you pay attention to this, you can get along well with her."
 uma_crisis.7005.desc: "The journey will be very chaotic, so I suggest you don't go to see her if you have nothing to do."
