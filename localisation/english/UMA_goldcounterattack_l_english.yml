 uma_crisis.6661.desc: "Get out of here."
 uma_crisis.6661.a: "You come here to rob people in a brazen manner and want to leave without leaving anything behind?"
 uma_crisis.6661.b: "The powerful Golden Family was unable to defeat a young civilization."
 uma_crisis.6661.a.repo: "Come if you dare."
 uma_crisis.6662.desc: "Who do you think can't be defeated?"
 uma_crisis.6662.a: "If you can win, why bother to live on such a small piece of land?"
 uma_crisis.6663.desc: "Before that, I will grind you into dust!"
 uma_crisis.6663.a: "Then you are one step further away from your goal?"
 uma_crisis.6663.b: "Then look who gets crushed into dust!"
 uma_crisis.6664.title: "The signal band has been switched"
 uma_crisis.6664.desc: "Please...please wait a moment, I will communicate with them..."
 #uma_crisis.6664.a: "The loser should surrender!"
 uma_crisis.6664.a: "Who are you?"
 #uma_crisis.6664.b: "Is there a possibility that we can actually cooperate..."
 #uma_crisis.6665.desc: "Cooperation? Okay, if you are willing to accept the golden factor, I will agree to your cooperation."
 uma_crisis.6665.desc: "Nice to meet you. I am Dream Journey, the eldest sister of the 935th generation of the Golden Family. The one who just quarreled with you is my younger sister."
 #uma_crisis.6665.a: "That's impossible, you need something from me."
 uma_crisis.6665.a: "Hello, Dream Journey"
 uma_crisis.6666.desc: "Wait. Please wait a moment."
 uma_crisis.6666.a: "?"
 uma_crisis.6667.desc: "Well, since you have followed the wormhole trail and come here, you must have many things you want to know. Please feel free to ask me any questions I have."
 uma_crisis.6667.a: "Why are all the other horse girls acting crazy, but you can communicate normally?"
 uma_crisis.8000.desc: "This is the effect of strengthening the gold factor, and I suppressed some of the factors because of an exploration of the Three Goddesses ruins. Of course, this suppression will also be affected by emotions. \nThere is nothing important about me, let's get back to the topic."
 uma_crisis.8000.a: "Why attack us?"
 uma_crisis.8000.b: "Tell me about the Golden Family."
 uma_crisis.8000.c: "Who is the "scary Umamusume" that Nakayama mentioned?"
 uma_crisis.8000.d: "What are your plans next?"
 uma_crisis.8000.e: "The golden factor?"
 uma_crisis.8000.a.repo: "The Golden Fleet lacks population and resources. Generally speaking, our route will pass through the weak Ma Niang civilization and merge them into the Golden Family; I made the judgment not to provoke the powerful space civilization. \nHowever, it is common for routes to deviate in the universe. This incident was caused by the combat department not obeying the "standby" order and attacking without authorization during the process of adjusting the route. \nWe will make up for the losses caused to your country as much as possible."
 uma_crisis.8000.b.repo: "We were once a brilliant civilization. While exploring the universe, we also developed and screened factors like most of the horse girl civilizations. At that time, scientists were obsessed with the power of the gold factor. The factor called "gold" made the horse girls brave, resolute, and shining, although accompanied by some temper or stubbornness. \nIn the long inheritance, "gold" is always the most complete, with the most significant characteristics. It overshadows all other factors, making the next generation of horse girls more irritable, stubborn, crazy, extreme, or develop various bad habits. \nScientists tried every way, but failed to reverse this trend. The Golden Family began to invade the outside world, and the internal situation became more and more chaotic. It was not even a pile of loose sand. Until now, the factors of other horse girl civilizations have been used to minimize the influence of "gold"."
 uma_crisis.8000.c.repo: "That's why we started wandering. \nWhen we expanded to the extreme, they appeared. That war was completely aimed at destruction. The loose Golden Family was unable to resist such a powerful enemy that obeyed orders like a machine. The surviving ancestors left their homeland on the home fleet, hoping to return home one day, but... the influence of the factor still exists. The three commanders you saw are already quite outstanding horse girls. \nSince I got rid of the influence of the golden factor, I have been studying the history of that period. The conclusion is that if we can unite, even the opponents who are like gods in the records are not invincible."
 uma_crisis.8000.d.repo: "Although we have settled here temporarily, we also know that this is just a temporary rest. In the near future, we will set sail again. \nTraveling, dreaming of returning home, until the last fleet is lost in the sea of stars, the last ship falls into the star, and the last horse girl dies, this is the fate of gold..."
 uma_crisis.8001.desc: "It seems you are interested, but I suggest you do not use it, let alone incorporate it into your people's intrinsic factors. \nPlease..."
 uma_crisis.8001.a: "We will control the intensity."
 uma_crisis.8001.b: "We will only study it"
 uma_crisis.8001.a.resp: "I hope so. \nIf you have any questions in the future, please contact Nakayama. \nThen, the communication ends, and I wish you a good day."
 uma_crisis.7000.b_Fail: "We chose to study only the golden factor"
 uma_crisis.7000.b_Fail_two: "No new factors can be obtained."
  
 uma_crisis.9000.desc: "Dear Sir, I am contacting you this time to inform you that our journey has begun. We will keep searching for our former home. Until... until... the arrival of 'destiny'. \n... The starry sky in front of me slowly turns blue. Goodbye - my friends - I wish you a bright future that shines like gold - |TRANSMISSION TERMINATED|"
 uma_crisis.9000.a: "......"
  
