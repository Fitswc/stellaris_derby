l_english:
  
 uma_curren_name: "Curren Chan"  #NT!
  
  
 uma_curren.1.title: "The lovely true meaning"  #NT!
 uma_curren.1.desc: "Under your leadership, your country is booming and your strength map is gradually expanding. You have also heard many stories and legends, most of which have no effect except providing free adjustments. A legend about "cute" is buried deep in your memory."  #NT!
 uma_curren.1.a: "..."  #NT!
  
 uma_curren.2.title: "Lovely visit"  #NT!
 uma_curren.2.desc: "Your subordinates said that someone wanted to meet you, and the other party was a "Umamusume" on this ship."  #NT!
 uma_curren.2.a: "Why do you laugh like this? What is the origin of this "Umamusume"?"  #NT!
 uma_curren.2.b: "I was very busy and asked her to make an appointment in advance."  #NT!
  
 uma_curren.3.title: "Curren Chan"  #NT!
 uma_curren.3.desc: "Are you the leader of this country? Jiling is very happy to see you."  #NT!
 uma_curren.3.a: "What's wrong with you looking for me?"  #NT!
  
  
 uma_curren.4.desc: "Well... I don’t know if I don’t know, I said that I was practicing under the waterfall before."  #NT!
 uma_curren.4.a: "no idea?"  #NT!
  
 uma_curren.5.desc: "Curren, I want to stay here, but I don’t know if it’s OK?"  #NT!
 uma_curren.5.a: "Why do you want to stay?"  #NT!
 uma_curren.5.b: "Of course"  #NT!
 uma_curren.5.c: "Sorry, I'm sorry to refuse"  #NT!
  
 uma_curren.6.desc: "因为机伶想让全宇宙的大家都因为机伶的可爱变得幸福起来，也就是——可爱的终点！"  <"Because of cleverness, I want everyone in the universe to become happier because of cleverness and cuteness, that is, the end of cuteness!">  #NT!
 uma_curren.6.a: "既然如此，你就陪在我的身边吧"  <"That being the case, you should be by my side">  #NT!
 uma_curren.6.b: "不好意思，恕我拒绝"  <"Sorry, I'm sorry to refuse">  #NT!
  
 uma_curren.6.a.tt: "机伶好开心，有什么机伶能帮忙的，请尽管拜托我吧~"  <"I am so happy to be Curren. If you have any Curren things to help, please ask me.">  #NT!
  
 uma_curren.7.title: "End"  <"End">  #NT!
 uma_curren.7.desc: "真机伶对你的决定似乎并不意外，只是失落地自言自语道：“还是没有办法实现吗。”你将她安排在专人看管的房间中。可没等你想好如何处理，第二天真机伶便从房间中消失。床上只留着一张用鎏金字体写着“香草度假村”的白色小纸片。"  <"Zhen Jiling didn't seem surprised by your decision, but just said to herself in disappointment: "Is it still impossible to achieve it?" You arranged her in a room with dedicated care. But before you could figure out what to do, Zhenzhi disappeared from the room the next day. There was only a small white piece of paper written in gilded font on the bed with "Vanilla Resort".">  #NT!
 uma_curren.7.a: "……"  <"...">  #NT!
  
 uma_curren.8.desc: "§Y来自特雷森学园，在马推拥有百万级粉丝的“可爱の天使”。为了迈向更高的“可爱”而来到宇宙的舞台。\n借助她“可爱”的力量，更好地统治国家，并和她一同探寻未知的前方吧。§!\n“啊，欧尼酱！”\n§Y她轻跳着跑过来，用清澈的眼睛盯着你。§!"  <"§Y来自特雷森学园，在马推拥有百万级粉丝的“可爱の天使”。为了迈向更高的“可爱”而来到宇宙的舞台。\n借助她“可爱”的力量，更好地统治国家，并和她一同探寻未知的前方吧。§!\n"Ah, Onissang!"\n§Y她轻跳着跑过来，用清澈的眼睛盯着你。§!">  #NT!
 uma_curren.8.a: "谢谢你，真机伶。顺便也恭喜你赢下URA。"  <"Thank you, so Curren. By the way, congratulations on winning URA.">  #NT!
 uma_curren.8.a.resp: "“嗯嗯，大家都因为机伶的可爱露出了笑容呢。”\n§Y机伶向后跳了两步，在原地转了个圈。§!\n“不过那还不够，要让全宇宙——都认识到机伶的可爱才行。”"  <""Well, everyone smiled because of their clever cuteness."\n§Y机伶向后跳了两步，在原地转了个圈。§!\n"But that's not enough. You have to let the whole universe realize the clever cuteness."">  #NT!
 uma_curren.8.b: "就像那个‘可爱的终极’的传说吗。"  <"Like that 'lovely ultimate' legend.">  #NT!
 uma_curren.8.b.resp: "“这回可不一样，你要和机伶酱一起把那些传说变成现实哦。”"  <""This time is different. You have to work with Ji Lingjiang to turn those legends into reality."">  #NT!
 uma_curren.8.hire: "欢迎!"  <"welcome!">  #NT!
  
  
  
  
 uma_curren.10.title: "可爱的扩散"  <"Lovely diffuse">  #NT!
 uma_curren.10.desc: "真机伶被你收留之后，十分主动地了解起你的国家的现状。除了非常机密的部分，你对真机伶知无不言，没想到她却意外的机敏，在很多领域亟待突破的问题给予了奇特的角度，令你也有所启发。政事之外，真机伶似乎非常热衷于提高自己在你的臣民间的知名度，并称之为“专属于机伶的可爱”。"  <"After you took in real martial arts, you will be very proactive in understanding the current situation of your country. In addition to the very confidential part, you know everything about true intelligence. Unexpectedly, she was unexpectedly agile and gave a unique perspective on issues that need to be broken through in many fields, which inspires you. In addition to political affairs, Zhen Ji Ling seems to be very keen on increasing your popularity among your subjects and calls it "a cute and cute person who is exclusively Curren."">  #NT!
 uma_curren.10.a: "什么叫专属于机伶的可爱？去调查一下"  <"What is cute and cute? Go and investigate">  #NT!
 uma_curren.10.b: "她确实挺可爱的......"  <"She is really cute...">  #NT!
  
 uma_curren.11.title: "Research Completed"  <"Research Completed">  #NT!
 uma_curren.11.desc: "从收集到的反馈意见来看，群众对于“可爱”这一词汇的定义可能不甚了然，但看见真机伶时总能莫名其妙的或打起精神，或情绪平复，单从这一点来看，她似乎并未带来任何不良影响。"  <"Judging from the feedback collected, the public may not know much about the definition of the word "cute", but when they see real cleverness, they can always inexplicably cheer up or calm down. From this point of view alone, she does not seem to have any adverse effects.">  #NT!
 uma_curren.11.a: "真不错"  <"Really good">  #NT!
  
 uma_curren.12.desc: "在你的国家的生活真的很奇妙呢。不过比那更让机伶开心的，果然还是在这里也能让大家感受到机伶的‘可爱’。"  <"Life in your country is really amazing. But what makes you happier than that is, it is true that you can still feel the cleverness of "cute" here.">  #NT!
 uma_curren.12.a: "希望这个国家日后也能得到你的认可。"  <"I hope this country will also be recognized by you in the future.">  #NT!
 uma_curren.12.a.repo: "呵呵，大家也都是很好的人，你的领导能力真的很厉害呢。"  <"Haha, everyone is also very good people, your leadership skills are really great.">  #NT!
 uma_curren.12.b: "说起来，真机伶为什么要这么执着于‘可爱’呢？"  <"Speaking of which, why should I be so persistent in "cute" when I am Curren Chan?">  #NT!
 uma_curren.12.b.repo: "机伶呢，在小的时候就因为非常可爱，总是能让家里人变得开心。机伶就想，这份能力，如果扩散开来，那么不仅是机伶身边的人，还有更多的人，大家都可以因为机伶感到幸福。\n还有就是，机伶的训练员，也就是哥哥，他为了机伶，也付出过很多……机伶不想让他失望。"  <"As for being Curren, when I was very cute, I always make my family happy because I was very cute. Jiling just thinks that if this ability spreads, it will not only be the people around Jiling, but also more people, and everyone can feel happy because of Jiling. \nAnd that is, the Curren trainer, that is, his brother, has also paid a lot for his Currenness... The Currenness doesn't want to disappoint him.">  #NT!
 uma_curren.12.c: "不知道真机伶你有没有听说过那个关于‘可爱’的传说？"  <"I wonder if you have ever heard of the legend about ‘cute’?">  #NT!
 uma_curren.13.desc: "嗯……不知道呢。机伶应该还没到变成传说的程度吧。"  <"Well...I don't know. The cleverness probably hasn't reached the point where it becomes a legend.">  #NT!
 uma_curren.13.a: "§g她似乎了解些什么，但现在显然不是谈这个的时候。§!"  <"§g她似乎了解些什么，但现在显然不是谈这个的时候。§!">  #NT!
  
 uma_curren.20.title: "遗迹"  <"remains">  #NT!
 uma_curren.20.desc: "你的先遣队发现了一处遗迹，从返回的资料来看，是一个名叫香草星人的种族留下的——香草星人是个唯科学论的种族，曾以高超的科学技术闻名宇宙，但传说它们遭到了某种打击，整个香草星就此消失，香草星人也彻底变成茫茫星海中无数被遗忘的尘埃之一。不知为何真机伶一定要在现场亲自参与。"  <"Your advance team discovered a ruin. Judging from the returned information, it was left by a race called Vanilla Stars. Vanilla Stars are a scientific-oriented race. They were once famous for their superb science and technology, but legend has it that they suffered a certain blow, and the entire Vanilla Stars disappeared, and Vanilla Stars completely became one of the countless forgotten dusts in the vast sea of ​​stars. For some reason, Zhen Zhixing must participate in it in person.">  #NT!
 uma_curren.20.a: "……机伶也有听说，香草星人是自己选择毁掉整个星球的。"  <"...There are also heard that the Vanilla Stars chose to destroy the entire planet by themselves.">  #NT!
  
 uma_curren.21.title: "更进一步"  <"Going further">  #NT!
 uma_curren.21.desc: "随着你的部下对遗迹的逐渐发掘，越来越多香草星人的科学技术得以为你所用。休息时间，你和真机伶聊起了得到的成果——现在的真机伶已经是你的国家里闻名遐迩的偶像了，甚至在星际间也有相当的知名度，无论冷清还是繁荣，几乎每个空间交易站，都能找到真机伶传播“可爱”的影子。真机伶本人一直挂念的“可爱的终点”似乎已经很近很近了。\n‘那它们为什么要毁掉自己族人奋斗几代得来的知识呢？’"  <"As your subordinates gradually discover the remains, more and more vanilla star people's science and technology will be used by you. During the break, you talked about the results you got - Zhen Ji Ling is now a well-known idol in your country, and even has a considerable reputation among the stars. Whether deserted or prosperous, almost every space trading station can find the shadow of Zhen Ji Ling spreading "cute". The "lovely end point" that Zhen Jiling has always been concerned about seems to be very close. \n'Then why do they destroy the knowledge gained from their tribe’s struggle for generations? ’">  #NT!
 uma_curren.21.a: "因为人们总是对自己未知的事情感到恐惧"  <"Because people are always afraid of what they don't know">  #NT!
  
 uma_curren.22.title: "未知邀请"  <"Unknown invitation">  #NT!
 uma_curren.22.desc: "早在你和真机伶见面之前，留驻遗迹内的部下给你发送来一张图片——纯白色的邀请函在碎石瓦砾中显得格外突兀，但鎏金的“香草度假村”大字似乎从未被岁月洗礼过。邀请函的背面，赫然写着“真机伶”的这三个字。"  <"Long before you met Zhen Jiling, the subordinates who stayed in the ruins sent you a picture - the pure white invitation letter seemed particularly abrupt among the gravel rubble, but the gilded "Vanilla Resort" big word never seemed to have been baptized by time. On the back of the invitation letter, the three words "Curren Chan" are clearly written.">  #NT!
 uma_curren.22.a: "但也会有人为了那一瞬的可能去努力，哪怕未知的尽头是连想象力都触及不到的深处"  <"But there will be people working hard for that moment, even the end of the unknown is the depths that cannot even reach even imagination.">  #NT!
  
 uma_curren.23.title: "隐瞒"  <"hide">  #NT!
 uma_curren.23.desc: "你姑且将看到的事情瞒了下来，随着队伍继续探索，你们发现了一处叫做“香草星技术博物馆”的奇怪建筑。"  <"You hide what you saw and as the team continues to explore, you discover a strange building called the "Vanilla Star Technology Museum".">  #NT!
 uma_curren.23.a: "让我们继续"  <"Let's continue">  #NT!
  
 uma_curren.24.title: "α=1"  <"α=1">  #NT!
 uma_curren.24.desc: "香草星人的遗迹已基本被搜索干净，但正所谓“知道得越多越感觉自己无知”，香草星人的科技仿佛一个辐射图，浅显发掘得到的那些成果只是绕着外围走了一圈。除了一个巨大的由无数反射率几乎为0的平面所组成的类球体以外，科学家没有带回来任何有价值的东西。"  <"The remains of the Vanilla Star Man have been basically searched, but as the saying goes, "The more you know, the more you feel ignorant," the Vanilla Star Man's technology is like a radiation map, and the results obtained from the simple excavation are just walking around the periphery. Scientists have brought back nothing of valuable except a huge sphere-like body composed of countless planes with almost zero reflectivity.">  #NT!
 uma_curren.24.a: "这是个什么玩意，必须全力解析！"  <"What is this thing? You must analyze it with all your strength!">  #NT!
  
 uma_curren.30.title: "可爱的未知"  <"Cute unknown">  #NT!
 uma_curren.30.desc: "研究所建成后，全国数十名最顶尖的科学家开始了夜以继日的研究，可仍然没有任何实质性的进展。某天你正在为此事发愁时，突然注意到装着那个“类球体”的核心区域的监视器里出现了熟悉的身影。\n奇妙的是，在几个月内对所有连接方式都没有任何反应的类球体。真机伶没有带着任何护具，就这么触摸上了类球体表面。当你带着卫队赶到现场时，类球体已经变成了曾经只在量子计算机模拟中出现过的纯黑色高维几何体。"  <"After the completion of the institute, dozens of the top scientists in the country began research day and night, but there was still no substantial progress. One day when you were worried about this, you suddenly noticed a familiar figure appeared in the monitor in the core area of ​​the "spheric-like" installation. \nThe wonderful thing is that a sphere-like body that has no response to all connection methods in a few months. Zhen Ji Ling didn't bring any protective gear, and just touched the surface of the sphere like this. When you arrive with the guard, the sphere-like body has become a pure black high-dimensional geometry that has only appeared in quantum computer simulations.">  #NT!
 uma_curren.30.a: "真机伶？！她怎么进去的！"  <"Curren Chan? ! How did she get in!">  #NT!
  
 uma_curren.31.desc: "'伯列恒之星哟，接下来只要……'\n你看到真机伶掏出一张白色的卡片，烫金的“香草度假村”字样在光线照射下显得格外晃眼，将手一抬，卡片便缓缓浮起，直向着伯列恒之星制造出的锁孔飞去。刹那间，一股能量涌向真机伶。"  <"'Star of Berehen, then just...'\nYou see Zhen Ji Ling taking out a white card. The gilded "Vanilla Resort" looks particularly dazzling under the light. When you lift your hand, the card slowly floats up and flies straight towards the keyhole created by Berehenheng. In an instant, a stream of energy surged towards the true wisdom.">  #NT!
 uma_curren.31.a: "真机伶！"  <"Curren Chan!">  #NT!
  
 uma_curren.32.desc: "不，不对，这不是“未来”！"  <"No, no, this is not the "future"!">  #NT!
 uma_curren.32.a: "你到底在干什么？"  <"What the hell are you doing?">  #NT!
 uma_curren.33.desc: "对不起，这么久以来都在利用你们。"  <"Sorry, I've been using you for so long.">  #NT!
 uma_curren.33.a: "利用我们，是为了那个装置吗？"  <"Is it for the device to use us?">  #NT!
 uma_curren.34.desc: "没错，为了找到伯利恒之星。"  <"That's right, to find the Star of Bethlehem.">  #NT!
 uma_curren.34.a: "为了‘可爱’的终极？"  <"For the ultimate of ‘cute’?">  #NT!
 uma_curren.35.desc: "没错，为了找到伯利恒之星。"  <"That's right, to find the Star of Bethlehem.">  #NT!
 uma_curren.35.a: "我们的研究员全力以赴，也无法对其进行解析。应该说，它在等你!"  <"Our researchers went all out and could not analyze it. It should be said that it is waiting for you!">  #NT!
 uma_curren.36.desc: "……香草星人，其实很可怜呢。为了那么缥缈的‘未来’就能付出全族人的力量。千年，万年，不，已经比那还要久了。这个‘伯列恒之星’，是一个时间线跨越装置，以使用者的三项特质为燃料，便可以知晓无数可能的未来。"  <"...Vanilla Star Man is actually very pitiful. For such a vague "future", we can give the strength of the whole clan. Thousands of years, ten thousand years, no, it has been longer than that. This ‘Belleheng Star’ is a timeline spanning device that uses the user’s three qualities as fuel to know countless possible futures.">  #NT!
 uma_curren.36.a: "听起来非常诱人"  <"Sounds very tempting">  #NT!
 uma_curren.37.desc: "机伶觉得，为了在万千选择里面选中那个正确的答案，首先排除错误答案是很重要的。\n这张写着‘香草度假村’和你名字的卡片它有释放出一种特殊信号。对其进行追踪得到的结果是，这样的信号几乎遍布整个宇宙——香草星人的技术并不完满。你追踪到的那些信号是机伶存在过的时间线的残余。但只要机伶找到正确的时间线，宇宙会自动消除这些残余，仅仅留下最终的路径。"  <"Ji Ling thinks that in order to select the correct answer among the thousands of choices, it is important to first eliminate the wrong answer. \nThis card with the words ‘Vanilla Resort’ and your name it releases a special signal. The result of tracking it is that such signals are almost all over the universe - the technology of the Vanilla Stars is not perfect. The signals you tracked are the remnants of the timeline that has existed in a clever way. But as long as the correct timeline is found cleverly, the universe will automatically eliminate these remnants, leaving only the final path.">  #NT!
 uma_curren.37.a: "为什么是邀请函，而且还叫什么‘度假村’。"  <"Why is it an invitation letter, and it is also called a ‘resort’.">  #NT!
 uma_curren.38.desc: "那是第一次尝试的时候，香草星人给机伶的幻觉引导，伯列恒之星应该是记住了这一设定。本来机伶……应该在那个精神的‘度假村’里面因为无穷尽的时间线跨越，被当成燃料燃烧殆尽的。可机伶抓住机会逃了出来，而香草星人被留在那里，应该是连同坏掉的伯列恒之星一起消失了吧。逃出来之后的事情，你也都知道了。"  <"That was the first time I tried it, the Vanilla Stars guided the clever illusion, and the Star of Berehen should have remembered this setting. Originally, cleverness... should have been burned out as fuel in that spiritual ‘resort’ because of the endless timeline. But Jiling seized the opportunity and escaped, and the Vanilla Star was left there, probably disappeared along with the broken Star Berehen. You know everything after you escape.">  #NT!
 uma_curren.38.a: "既然逃出来了，为什么还要把它找回来。"  <"Since I escaped, why do I still need to find it back?">  #NT!
 uma_curren.39.desc: "这个时间线并不属于机伶，也没有对于机伶很重要的那个人。机伶再怎么‘可爱’也好，如果没有她在，一切就都没有任何意义。"  <"This timeline does not belong to the cleverness, nor does it mean that people are very important to cleverness. No matter how clever he is, it is better to be "cute" or not, without her, nothing will make any sense.">  #NT!
 uma_curren.39.a: "你就不怕失败？"  <"Are you not afraid of failure?">  #NT!
 uma_curren.40.desc: "如果机伶没有在某个节点之前完成，那宇宙时间线的自我修复机制会将机伶视为威胁，在不知在哪个时间线的哪个事件，把机伶本身连同所有残余一起，全都抹消掉。"  <"If the cleverness is not completed before a certain node, the self-healing mechanism of the cosmic timeline will regard the cleverness as a threat, and eliminate the cleverness itself and all the remnants in unknown events in which timeline.">  #NT!
 uma_curren.40.a: "你疯了……"  <"You're crazy...">  #NT!
 uma_curren.41.desc: "机伶，很喜欢在你的国家生活的日子。每个人都因为机伶的可爱而感觉到幸福，也都因为你的领导而感到幸福……但你终究是个外来人。你说的那些故事也可能都是随口而来。"  <"Curren, I like the days of living in your country. Everyone feels happy because of their cleverness and cuteness, and they feel happy because of your leadership... But you are an outsider after all. The stories you tell may also come out casually.">  #NT!
 uma_curren.41.a: "我承认对你有所隐瞒，但从未说过谎。"  <"I admit to hiding something from you, but never lie.">  #NT!
 uma_curren.42.desc: "选择权在你，朋友。但就像机伶刚刚想说的，无论你怎么选，机伶都不会后悔过去的那些时光。"  <"The choice is up to you, your friend. But just like Ji Ling just said, no matter how you choose, Ji Ling will not regret the past time.">  #NT!
 uma_curren.42.a: "我很抱歉，朋友。但这个装置我们必须把它研究透彻。"  <"I'm sorry, friend. But we must study this device thoroughly.">  #NT!
 uma_curren.42.b: "如果可以的话，请让我们也帮忙。"  <"If possible, please let us help too.">  #NT!
  
 uma_curren.43.title: "可爱的终末"  <"A cute end">  #NT!
 uma_curren.43.desc: "真机伶眼帘低垂，无声注视着研究所的地面，任由赶来的研究人员们将伯利恒之星关停。伯列恒之星表面的锁孔碎裂开来，重新分解为无数的平面。\n“如果你想，我和我的人民依然欢迎你。”\n真机伶摇摇头，接着又点头，低声道：“谢谢你，但是机伶，现在想休息一下。”\n“如你所愿。”\n真机伶没走出几步，突然从虚空传来了熟悉的声音：“果然你也失败了。”\n突然出现的“§R真机伶§!”从身后抱住了真机伶，脸上带着得意的笑容。\n“那么，该清扫垃圾啦~”\n“等等，你是谁！”\n二人在消失的瞬间。望着空无一物的实验室，你和士兵们面面相觑。"  <"Zhen Jiling's eyes drooped, staring silently at the ground of the institute, allowing the researchers to shut down the Star of Bethlehem. The keyhole on the surface of the Star Berehend broke and re-decomposed into countless planes. \n"If you want, my people and I will still welcome you." \nZhen Jiling shook his head, then nodded, and whispered: "Thank you, but Jiling, I want to take a break now." \n"As you wish." \nZhen Jiling didn't take a few steps, and suddenly a familiar voice came from the void: "Sure enough, you failed." \nThe sudden appearance of "§R真机伶§!" hugged Zhen Jiling from behind, with a smug smile on her face. \n"Then, it's time to clean up the garbage~"\n"Wait, who are you!"\nThe two disappeared in the moment. Looking at the empty laboratory, you and the soldiers looked at each other.">  #NT!
 uma_curren.43.a: "Where is this? What are we doing?"  #NT!
  
 uma_curren.44.title: "Lovely future/past"  #NT!
 uma_curren.44.desc: "No! It's okay for me, the user. If something happens, you may be the same as the Vanilla Starman...\n"So, I need to ask you, the person who knows the Vanilla Starman's device, to lead us. I think others should not have any objections."\n"Always support Miss Jiling!"\n"Thank you..."\n"You're welcome, we are friends, right?"\n\nThe white invitation seemed to flash a light of recognition when he was taken over by Jiling. After swallowing the invitation, the star Berehen began to tremble gradually, and the fluctuations emitted spread from the institute and spread to the edge that the perception radar could not reach. True Curren, you, the soldiers you follow, researchers in the institute, the people of your country, the space caravans stationed at the edge of the wormhole, the black hole worms being hunted, and the galaxy group being hunted... The "cute" footsteps all over the place, and they all felt a certain calm, and they all turned their sights and perceptions to the direction where the star of Berehen is located. \nThe crisp "click" sound gently hit the spirits of all living beings. The Star of Bethlehem gradually melted from the eyes of everyone present, without the pure whiteness of the body, and was little by little applied to the surface of the space, sticking to the sight. When I came back to my senses, I was already in conceptualized ⌈⌋. \nYou look back and look behind you. \nTwo you look behind you. \nFour you look behind you. \n46.5 billion light years away, you look behind you. \n\nCountless timelines are displayed in front of you. Seeing so many of your backs must be not so comfortable, so you turn your head and look in a real Curren direction—"  #NT!
 uma_curren.44.a: "Welcome to Vanilla Resort."  #NT!
 uma_curren.50.title: "Win!"  #NT!
 uma_curren.50.desc: ""Everyone, the Star of Berehend has finally been destroyed by us. It depends on your full help to achieve the current results. It is great to meet you all."\n"Cute and Curren!"\n"You are so handsome when you command the fleet just now. Thank you, for your willingness to trust Curren."\nI'm too modest. If you don't have your opinion, the results will be different. \n"Hehe, if you only have a clever mind, you will definitely not be able to reach today." \n Are you going back? \n"Well, because my brother will witness the Curren future together."\nI wish you happiness. \n"Don't be so sad! This is the contact information of Ji Ling. If you need Ji Ling, just call Ji Ling~""  #NT!
 uma_curren.50.a: "Eh?"  #NT!
  
  
