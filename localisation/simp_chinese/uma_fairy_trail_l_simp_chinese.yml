l_simp_chinese:

uma_f_t.2.title: ""
uma_f_t.2.desc: "我们在[event_target:uma_fairy_trail_system_here.GetName]的恒星基地检测到[event_target:uma_fairy_trail_planet_here.GetName]上传来断续的引力波。经过精细的拍摄，我们发现了一座古代遗迹高耸入云的远古遗迹。它如针一般刺入云霄，像是为向这太空中一个目标传输信号而建造的。可惜我们没有在这个建筑所对准的方向——包括太空里找到任何用于接收或者可能用于接受信号和能量的建筑。这值得我们派科学家去实地考察下。"
uma_f_t.2.a: "批准"
uma_f_t.2.b: "又是一座平平无奇的建筑罢了"

uma_f_t.3.name: "建筑"
uma_f_t.3.desc: "我们由[This.leader]带领的科考队成功到达地面。我们发现这座建筑拥有者极佳的地理位置，傍水而建且纬度适中。在进入这座建筑进行更详尽的考察前，我们的科考团队发现它的外墙所用的材料似乎是一种我们尚未知晓的合金-水晶材料，而且其隔热性和硬度惊人。尽管目前还没有手段采集样本进行详尽的研究，但科考队中略懂一些材料学的科学家感叹道：“这似乎有点超乎现在和我们已知的过去的科技水平”"

uma_f_t.4.name: "第0层"
uma_f_t.4.desc: "我们的科考队进入了这座建筑——它居然没有关门！经过技术评估，这座建筑至少有上万年的历史。但奇怪的是，内部的电路和机械结构却能正常运转。大厅里陈列着不少看起来属于马娘的物体，比如不知道放了多久的跑鞋、已经生锈的蹄铁、一座已经快化成土的奖杯，但上面的字已经看不清了，还有已经坏掉的个人电子设备，一些常用的工具，看起来这个地方是马娘曾经生活过的地方。在一个角落，我们的科考队找到了一部还能正常使用的电梯，看起来它还能带我们探索这个建筑的下层。“这个建筑内部的温度总是十分舒适”"
uma_f_t.4.a: "继续前进"

uma_f_t.5.name: "地下一层-室内奔跑设备"
uma_f_t.5.desc: "由于团队成员对这台上古电梯安全性的高度怀疑，[This.Leader]不情愿地走进了电梯旁边的楼梯，经过长达数分钟枯燥的楼道后，她们终于到达了一个类似控制室的地方，这里年久失修，灰尘落满了地板，但是还是能看到这里些许曾经的模样：数台全向跑步机和增强现实设施整齐的摆放在房间内。不管以前有没有马娘曾经使用过这些设施，现在都被时间抹去了痕迹。除此之外，我们还发现了一处墙壁被明显改造的痕迹，但是我们没有工具能够破开这些坚硬的材料，只能得出结论：这是一处让马娘们能够在室内尽情奔跑的地方。"

uma_f_t.6.name: "地下三层-温室"
uma_f_t.6.desc: "“我们也没想到这里还能种东西，或许隔热材料就是这么用的。”是的，我们的科考团队在经过数分钟步行后到达了一个类似温室的地方，只可惜的是，由于缺乏维护，这里的植物早已全部枯萎，只剩下洒水器正在机械的抽取从外部引来的水，麻木地喷洒在这片毫无生机的土地上。"
uma_f_t.6.a: "这竟然还能正常运转"

uma_f_t.7.name: "地下五层-卧室"
uma_f_t.7.desc: "稍作休整，科考队向下来到远离地面的地方，当考察结束返回时，这段楼梯对某些缺乏锻炼的马娘来说一定十分困难。言归正传，科考队到达了一处类似个人生活场所的地方，即使久经风尘，可是这个房间里的一切物品都反映了在这里生活的马娘的习惯——干净整洁。唯一不足的是，所有衣柜里的衣服只是凌乱地堆在一起，更糟糕的是，无论是配色还是款式，居然都大差不差。和预想的一样，我们很快找到了一排同样的外套。"
uma_f_t.7.a: "真糟糕"

uma_f_t.8.name: "深度数据不可信"
uma_f_t.8.desc: "理论上我们的科考队已经到达了深度探测的最后一层，而现实是，似乎距离目的地还有一段距离。不得不说，电梯真是个伟大的发明。"

uma_f_t.9.name: "最深层-大厅"
uma_f_t.9.desc: "终于，我们带着所有的疑问来到了最后一层，这里居然空空荡荡，就在队员们在一声声“不是吧”中安顿休息，准备传送“这里出了马娘的生活痕迹什么都没有“的信息到母星时，一位注意力惊人的队员发现了一块石板，上面用我们能看得懂的语言刻着”注意观察墙壁“几个大字，背后还写着一串读起来让人感到无比尴尬的句子。这一下就激起了队员们的兴趣，是谁会这么刻意地留一块写着字石板在地上呢？"

uma_f_t.10.name: "最深层-大厅"
uma_f_t.10.desc: "经过数日的敲敲打打，我们终于找到了那块伪装成墙壁的暗门。只是打开方式相当有趣：需要一名马娘在门前发动领域并念出类似咒语一样的东西。整个过程十分尴尬，但是又异常好笑，毕竟我们的科考队的科考队可不只有书呆子；你能想象到一名马娘对着门摆好阵仗，大口进食的同时，满脸通红地大喊这段神秘的咒语吗。总之，最后门打开了。"
uma_f_t.10.a: "全部不准笑"

uma_f_t.11.name: "金属棺椁"
uma_f_t.11.desc: "我们在这个暗门后找到了个类似棺材的容器停放在中央，周围散落着不少器件。只是能从这个房间获得的信息很少，因为唯一连接到这个容器的屏幕已经损坏。虽然这个设施本身似乎通过地热和太阳能发电，但是由于未知原因，我们在金属容器的电源接口上没有检测到任何电压，只有一种可能，这个东西已经断电很久了。但是鉴于内容物的未知性，科考队申请将这个金属容器运会到首都进行研究。"
uma_f_t.11.a: "当然"
uma_f_t.11.b: "这个就不搬了"

uma_f_t.12.title: "马娘激活手册"
uma_f_t.12.desc: "在到达首都科学院后，我们的科学家们使用水晶萝卜增幅了现有的电力后成功打开了金属容器，在容器缓缓打开后，里面整齐的摆放着一副马娘仿生躯体，外部皮肤的材质与皮肤极度相似，经过X光扫描发现内部结构与正常的马娘无异，只不过组成这具身体的似乎不是细胞，而是一种特殊的像是纳米材料的金属。\n在容器内部还放着一本手册，里面详细描述了一系列的流程，似乎是用来激活这具身体的。"
uma_f_t.12.a: "有点意思"
uma_f_t.12.b: "还要消耗这么多资源，放弃吧"

uma_f_t.13.title: "时隔万年的苏醒"
uma_f_t.13.desc: "随着流程的一步步完成，容器里的马娘还是没有任何动静。说明书在写出“最后一步：一个吻”后便截然而止。就在科学家们在猜拳结束后，最后的败者在众目睽睽之下准备给予容器里已经开始发出体温的“机器”一个吻时，容器中的马娘突然伸出手捂住了那名马娘的嘴，并俏皮的wink~了一下\n“谢谢，这个免了”\n接着她缓慢地坐起身，环视了一圈，然后轻轻地说道\n“又见面了，这里果然还是没有什么变化呢。”"
uma_f_t.13.a: "又见面了是什么意思？让我来和她说说"

uma_f_t.14.title: "???"
uma_f_t.14.desc: "“呀，又见面了，[This.Ruler.GetRulerTitle][This.Ruler.GetName]，当时我可是答应了你的，现在看看……我是不是个诚实的孩子？”\n“还有还有，在你走后，我用咱们剩下的材料加固了外墙，然后在地下种起了地。对对，因为温度、水分……”"
uma_f_t.14.a: "呃，那个……"

uma_f_t.15.desc: "“超级好吃！特别是大蒜温泉蛋拉面，虽然没有你和我第一次去吃的时候那个味道，但我觉得已我这半吊子厨艺来说的确不赖”\n“那个那个，我把跑步机那层的的全向跑步机全——部跑了一遍，左边第一个阻力比较大，第二个比较松……“\n你想插上话，但是止不住她那喋喋不休的嘴\n”哼哼~我还把所有内置的挑战者全部刷了100次！那可太简单了……“"
uma_f_t.15.a: "我说……"

uma_f_t.16.desc: "“……对对，在你们走后第一个50年，整——个星球居然像以前那样慢慢被植物占领了欸，但是每次占多数的植物都不一样，河床里的水慢慢多了起来，甚至慢慢出现了很多小动物，虽然钓鱼是很有意思……但是总是钓鱼是很无趣的啦。所以我开始学园艺啦，把门前整理整理，这样心情也舒坦不少。”\n“……然后我就出发了……最后走完了整个星球，说实话，大自然真的很神奇！只可惜没有星际飞船…… “"
uma_f_t.16.a: "所以……"

uma_f_t.17.desc: "“……后来啊，大概在你们离开后的第7个千年，我自己的能源也扛不住了呢，然后只能回去睡觉了嘛……毕竟我要留最后一点能量来见你们嘛。嘿嘿……”\n“看来这次我又搞砸了……“\n在滔滔不绝说了这么多后，眼前的马娘看了看你，希望你能说什么。"
uma_f_t.17.a: "那个……怎么称呼"

uma_f_t.18.desc: "“欸？”\n她似乎感到很惊讶，但是片刻后便缓过神来\n“……哈哈……原来是这样，我……我又忘了。我…我说这么多干什么……真是的……每次都这样。”\n接着，就是长达数分钟的沉默，这个小小的房间里竟没有一点声音。"
uma_f_t.18.a: "……之前的那个问题……"

uma_f_t.19.desc: "她终于深吸了一口气，直起身，严肃但不失俏皮地对你说\n”我叫['concept_uma_member_f_concept',$FT$]，如你所见，是一名马娘，但是嘛…也不能真正意义上马娘，至于为什么这么说，这可是秘密哦~”\n“…什么，你们笑什么，已经知道了？”\n她张开双臂，故意摆出很凶的表情\n§E“咬死你哦”§!\n但很快她就继续了她的自我介绍\n“以前的职业是……我记得是舰队指挥官来着。兴趣爱好…吃饭睡觉打电动，大概没有别的了吧。”"
uma_f_t.19.a: "你似乎对这里的一切都很熟悉"
uma_f_t.19.b: "你是什么笨狗嘛"

uma_f_t.20.desc: "我可是对这里都记得清清楚楚，你的名字、学院的地址、作息表、飞船的基本维修思路，我都知道！原因嘛，毕竟这已经不是第一次像这样见到你了。至于你不记得我……我其实早就料到啦……\n前几次我还会大吵大闹，但是经过了这么§I多次的重复§!，差不多都已经习惯啦；再幼稚的小孩经过时间和事情的打磨也会变得成熟，不是嘛。\n对了对了，虽然每次都会问你同样的问题，但是，我可以在这里住下来嘛，我已经好久没有泡过温泉了，这是我的小小愿望，不知道……能不能实现呢~"
uma_f_t.20.desc.a: "§E“哼……你还不是像那笨猫一样难伺候”§!\n我可是对这里都记得清清楚楚，你的名字、学院的地址、作息表、飞船的基本维修思路，我都知道！原因嘛，毕竟这已经不是第一次像这样见到你了。至于你不记得我……我其实早就料到啦……\n前几次我还会大吵大闹，但是经过了这么多次，差不多都已经习惯啦；再幼稚的小孩经过时间和事情的打磨也会变得成熟，不是嘛。\n对了对了，虽然每次都会问你同样的问题，但是，我可以在这里住下来嘛，我已经好久没有泡过温泉了，这是我的小小愿望，不知道……能不能实现呢~"
uma_f_t.20.a: "当然，我们欢迎旅径女士"
uma_f_t.20.a.repo: "嘛嘛，怎么还是这么客气，以后不准加女士、小姐后缀了哦。那，以后请多指教啦。"

uma_f_t.21.desc: "§Y她正在你分配给她的房间里收拾着自己的物品。不幸的是，你发现她收拾衣柜的能力似乎和在遗迹里所体现出来的一样糟糕。敏锐的她听到你发出的响动后探出头来§!\n“啊，是你”\n§Y她一脚踢上衣柜门，闪到你面前。§!\n”怎么了怎么了，有什么消息嘛。”"
uma_f_t.21.a: "那边的衣柜是什么回事"
uma_f_t.21.a.resp: "§Y她顺着你指的方向看去，脸色立刻阴沉了下来。她扭过头来，把你的头强行掰正了过来§!\n“你，什，么，都，没，看，到，清楚了吗”\n§Y她的眼睛死死盯着你，终于，在强大的压力下，你不得不从嘴里突出知道了这三个字。§!"
uma_f_t.21.b: "重复了这么多次相似的生活，不会感到无聊吗"
uma_f_t.21.b.resp: "“大概不会吧”\n§Y她用一只手指抵住鼓起的脸颊，做出思考的动作§!\n“虽然说大体上都差不多，但是其实每次都不一样呢，或许有新的事件，新的机会和危机。虽然剧本大纲已经写好了，可是未来谁都说不准呢。”"
uma_f_t.21.c: "未来你想做什么"
uma_f_t.21.c.resp: "“以后再想？总之现在先睡觉吧。”\n§Y说完她居然真的躺到了床上，没过多久，轻柔的呼吸声便从床上传来，真的睡着了！§!"


UMA_FT_SP: "运送金属容器"
UMA_FT_SP_DESC: "这东西意外地重，幸好我们的地面支援给我们带来了可以自己爬楼梯的机械设备。"
UMA_FT_SP_2: "激活金属容器里的马娘"
UMA_FT_SP_2_DESC: "在到达首都科学院后，我们的科学家们使用水晶萝卜增幅了现有的电力后成功打开了金属容器，在容器缓缓打开后，里面整齐的摆放着一副马娘仿生躯体，外部皮肤的材质与皮肤极度相似，经过X光扫描发现内部结构与正常的马娘无异，只不过组成这具身体的似乎不是细胞，而是一种特殊的像是纳米材料的金属。\n在容器内部还放着一本手册，里面详细描述了一系列的流程，似乎是用来激活这具身体的。"

uma_fairy_trail_arch: "空间探针"
uma_fairy_trail_arch_desc: "我们在这颗星球上发现了一座古代遗迹高耸入云的远古遗迹。它如针一般刺入云霄，像是为向这太空中一个目标传输信号而建造的。可惜我们没有在这个建筑所对准的方向——包括太空里找到任何用于接收或者可能用于接受信号和能量的建筑。这值得我们派科学家去实地考察下。"

uma_fairy_catch_phrase: "嘛，很高兴再次见面。"
uma_fairy_backstory: "一位旧友，在无数次的陪伴和孤独的循环中始终等待着你的到来。"

uma_commander_trait_sp_ft_desc: ""
uma_commander_trait_sp_ft: "轻灵"