uma_zephyr_unknown: "???"
uma_zephyr_name: "也文摄辉"

uma_zephyr.2.title: "Like the wind"
uma_zephyr.2.desc: "在调查恒星系的过程中，我们发现了一艘奇特的飞船。经过初步调查后显示，该船只带有浓厚的马娘设计风格，但是我们的图纸库中并没有该类飞船设计的记载。不过可以确定的是，船的主人肯定属于一位马娘。\n我们已经发起了对该船只的联络。"
uma_zephyr.2.a: "相信对方很快就会给予回应"


uma_zephyr.3.desc: "哎呀，没想到在这种地方也能遭遇来自故乡的风呢。那么，究竟是瑞风，还是梅雨的雨风呢？"
uma_zephyr.3.a: "请先告诉我你的身份，以及你出现在此地的原因"


uma_zephyr.4.desc: "失礼了。我的名字是也文摄辉。目前的话，正在追随风的指引，做一名宇宙旅行者。\n\n你调出了也文摄辉的相关资料，资料显示，对方曾是国内的知名G1赛马娘，在短距离、英里和中距离路线都取得了辉煌的成绩。不过，在竞赛生涯结束后，也文摄辉很快就销声匿迹，不再有任何相关信息流出。"
uma_zephyr.4.a: "风的指引？"

uma_zephyr.5.desc: "是的。从我很小的时候，我就能接受到来自风的讯息。风就是我的追求。\n在我退役之后，我决定像风一样，追寻自由自在的生活，去看风所看到的一切。于是，我学习了飞船的建造和驾驶技术，自己建造了这艘仄费罗斯号。仄费罗斯号不但完全符合所有马娘飞船的各项指标，还有武器系统用于自卫哦。"
uma_zephyr.5.a: "那么，之后你准备怎么办？"

uma_zephyr.6.desc: "当然是跟随风的指引，在无限宇宙中探索了。"
uma_zephyr.6.a: "虽然不知道风的指引是什么，不过我们可以允许你在太空中旅行"
uma_zephyr.6.b: "民间飞船是不能随意进入未知星系的。我们要求你立刻返航"
uma_zephyr.6.a.repo: "谢谢你，你真是一个像凯风一样温暖的人呢。那么，我就先行启程了，也许在宇宙旅行的过程中，我们还有再见面的一天。愿埃俄罗斯保佑你，再见了。"
uma_zephyr.6.b.repo: "呃……真是……糟糕透顶的暴风呢。那么，再见了。"


uma_zephyr.11.title: "Pothos"
uma_zephyr.11.desc: "在我们刚刚建成的观测站附近发现了一艘飞船。经过观察，确认为也文摄辉的仄费罗斯号。"
uma_zephyr.11.a: "真巧"

uma_zephyr.12.desc: "很高兴见到你，凯风一样的人。"
uma_zephyr.12.a: "也很高兴见到你。你在这里做什么呢？"
uma_zephyr.13.desc: "如你所见，我在观测这个土著文明。在你来到这里之前，我已经观察了这个年轻的文明许久。是否过去的我们就像现在的他们一样，懵懂，无知，但充满了朝气和对未知的渴望呢？而这份渴望，现在的我们是否仍然具备呢？"
uma_zephyr.13.a: "如果你愿意的话,欢迎来到我们的观测站"
uma_zephyr.14.desc: "真是谢谢你，你果然是一位如同凯风一样温暖的人呢。"
uma_zephyr.14.a: "不客气"
uma_zephyr.15.desc: "那么，就让我再观察这个年轻的文明一段时间吧。在之后我将继续我的旅程，我想我们肯定会再次见面的。愿尼奥尔德保护你。"
uma_zephyr.15.a: "那么我也不打扰你了，祝你一路顺风~"


uma_zephyr.21.desc: "好久不见呢，没想到能在这里见到你。"
uma_zephyr.21.a: "很开心见到你，也文小姐，为什么你会混在缇杨奇的队伍里？"

uma_zephyr.22.desc: "我在旅途中遇到它们的坟场呢，所有的缇杨奇都会在将死的时候游到这里。我想观察它们这场安静的告别仪式"
uma_zephyr.22.a: "你的飞船发送电波和缇杨奇们的相同呢,难道你们之间可以互相交流？"

uma_zephyr.23.desc: "是的。我已经观察了很久缇杨奇们的生活，大致摸清了缇杨奇们之间的交流方式。现在我可以通过仄费罗斯号与缇杨奇们进行简单的交流。"
uma_zephyr.23.a: "真是...厉害呢。"

uma_zephyr.24.desc: "也许终有一日风会指引我搞科研也说不定哦。哎呀，缇杨奇们已经走远了，我要去追赶它们了。再见，愿志那都彦保佑你。"
uma_zephyr.24.a: "再见"


uma_zephyr.30.title: "Storm that approaching"
uma_zephyr.30.desc: "国内出现了一场巨大的太空风暴，对航道造成了严重影响，甚至对各星球都造成了一定程度的破坏。学生会已经发布了风暴预警，警告居民注意躲避风暴灾害。\n然而总有意外情况发生，比如现在，我们发现仄费罗斯号正在风暴里穿行！"
uma_zephyr.30.a: "什么回事"

uma_zephyr.31.desc: "真是--一场巨大--的风暴，对---吧！"
uma_zephyr.31.a: "也文小姐快离开这里，很危险！"

uma_zephyr.32.desc: "我--有--分寸，放心--吧，这是独一无---二的暴-风，是特--斯卡特-利波--卡的怒-火、是--卡雷的-疯狂、是胡--拉坎的--创世，我一--定要近-距-离感受这--太空--风暴的-一切！"
uma_zephyr.32.a: "可是这并不是真正的风啊"
uma_zephyr.33.desc: "错-了，在--我--看来，这-无疑--是真正的--风！\n如果--有意--外-发生，我--会启--动仄费--罗斯号--上的跃迁--系统逃走--的！信号--实在是--太差-了，我要--终止通讯了，再-见！愿--飞廉--保护你！"
uma_zephyr.33.a: "唉，希望她真的有分寸吧"

uma_zephyr.41.title: "星神兽"
uma_zephyr.41.desc: "近来发现的巨大星神兽已经成为了这几天特雷森民间最大的话题。我们来看一下前G1赛马娘也文摄辉对此的点评。一向随心所欲的也文摄辉评价道，这么大的星神兽，只怕是连恒星都能吃了。\n什么，你问为什么会有也文摄辉的评价？当然是因为我们在星神兽存在的星系附近发现了正在穿行的仄费罗斯号！"
uma_zephyr.41.a: "这次又去哪了"

uma_zephyr.42.desc: "这是我们第几次见面了，温和的凯风？"
uma_zephyr.42.a: "也文小姐,你是来观察星神兽的吗？"
uma_zephyr.43.desc: "能再见到你我也很高兴。正如你所说，我正在观察星神兽。以风的标准来评价的话，那这星神兽真是当之无愧的飓风。真是庞大啊，在它的面前，我们真是寄蜉蝣于天地，渺沧海之一粟。不过，即使是如此渺小的我们，也能达成星际帝国这样的伟业呢。"
uma_zephyr.43.a: "不要太靠近对方哦,如果遭到攻击就麻烦了。"
uma_zephyr.44.desc: "我会保持在安全距离进行观测的，放心。那么，我就先走一步了。愿埃赫卡特保佑你，再见了！"
uma_zephyr.44.a: "再见~"

uma_zephyr.50.desc: "距离上次收到也文摄辉的消息已经过了三年时间。在这三年里，也文摄辉就像是蒸发了一样失去了一切消息。我们认为也文摄辉还可以已经旅行到了距离特雷森极其遥远的地方。也许总有一天她会再次联系我们，说不定就是现在呢？\n‘西风传来了指引。’\n‘真是好久没有过联系了呢，也文小姐。这三年你都经历了什么？’\n‘我想风指引着我到达了宇宙的另一头。不过事到如今，风的指引已经更改了方向，朝向了故乡。也许，我已经到了回家的那一天。’\n‘也文小姐终于要返回故乡了吗？回来之后加入学生会如何？我们需要你的智慧与见闻。’\n‘那么在风向再次变化之前，我就留在学生会里工作吧。那么，[This.Ruler.GetName]，请多指教~’"
uma_zephyr.50.title: "归途"
uma_zephyr.50.a: "请多指教，摄辉。"
uma_zephyr.50.a.tt: "也文摄辉将会在90日后加入我们"

uma_zephyr.51.title: "西风的宠儿"
uma_zephyr.51.desc: "三个月后，仄费罗斯号降落在了特雷森学生会办公地点的附近。让我们没想到的是，也文摄辉并没有进入科学院工作的意愿，而是从零开始学习起了行政管理的知识。而她学习起来更是得心应手，经过短短数周学习处理政务的能力变堪比在岗十几年的老人。\n在学习期间，她将自己旅行多年的见闻整理为了《西风行记》出版，在市场上也得到了热烈反响。读者们纷纷表示，虽然书中部分修辞语句比较晦涩难懂，但内容翔实，丰富多彩，真实的记录了宇宙各地的风物风貌。《西风行记》一举成为了当年的图书销量冠军。"
uma_zephyr.51.tt: "§R新舰船类型：武装科研船 已加入设计库§!"

uma_zephyr_catch_phrase: "这份灵魂，好似躁动般地燃烧着……有如烈风一样，努力奔跑向前！"
uma_zephyr_backstory: "……我是也文摄辉。\n我所追求的，是风……比一切都要更快的风，\n我想要化作风——自由奔驰的风。"

uma_official_trait_sp_zephyr: "西风的宠儿"
uma_official_trait_sp_zephyr_desc: ""