zone_uma_industry: "马娘特色工业"
zone_uma_industry_desc: "这里承载着庞大的工业体系 \n§Y本特化会根据已有的['trait:uma_trait_musume']工业类别建筑给予§!§G200§!§Y对应的岗位§!,如果没有，则给予§G100§!工匠和冶金工\n\n已有的['trait:uma_trait_musume']工业类别建筑有:\n-['building:building_uma_crystal_carrot_producing_lab']\n-['building:building_uma_crystal_alloy_workhouse']\n-['building:building_uma_crystal_consumer_goods_workhouse']\n-['building:building_uma_chemical_plant']\n-['building:building_uma_crystal_plant']\n-['building:building_uma_gas_plant']\n-['building:building_uma_dark_matter_plant']\n以及它们的升级建筑"

