 uma_ar_mejro_ardan: "单程票"  <"A one-way ticket">  #NT!
 uma_mejro_ardan.1.title: "奥德修斯和他的单程票"  <"Odysseus and his one-way ticket">  #NT!
 uma_mejro_ardan.1.desc: "当这个裂隙撕开宇宙空间的时候，我们收到了一丝微弱的中微子信号。经过R&D部门的解密，我们最终认为这束信号来自于上个世纪由‘目白家族’创立的航天集团所发射的一颗私人卫星，其目的就是验证载马娘飞行的可能性。\n对于那个年代的记录，我们的资料库只遗存下来一份记录了航天员和控制中心的最后一段对话的时间轴录本：\n“控制中心，我不太清楚我被什么东西牵引住了，但我唯一清楚的是......以火箭的动力无法摆脱它......”\n“.....办法....”\n“我想没有了。”\n“很抱歉......我们......只能祝您好运。”\n“请不要灰心，也不要因为这场远征的失败而气馁，我们已经做到了我们能够做到的极致，当我们因为这一次失败便抗拒且惧怕尝试下一次，那才是真正失败的开始。我想我会睡上一觉，希望在我再度睁眼时，我们的火箭已经能够冲出太阳系了。我期待着这一天的到来，并且坚信......确信......自信......我们一定能够做到......”\n我们确定里面肯定存在一艘飞行器，但是到底是哪种飞行器？和那名失踪的宇航员有关吗？那名宇航员是否还活着？亦或，这只是又一条来自视界内的一条莫名其妙的通信？\n我想一探究竟。目白家的马娘们似乎对这次探索积极性异常地高。"  <"When this rift tear opens the universe, we receive a faint neutrino signal. After decryption by the R&D department, we finally believe that this beam of signal came from a private satellite launched by the Aerospace Group founded by the "Mubai Family" in the last century, and its purpose was to verify the possibility of flying on Ma Niang. \nFor records of that era, our database only retains a timeline record that records the last conversation between the astronaut and the Control Center: \n "Control Center, I don't know exactly what I was pulled by, but the only thing I know is that... cannot get rid of it with the power of the rocket..."\n"... Method..."\n"I think there is no more."\n"I'm sorry...we... can only wish you good luck."\n" Please don't be discouraged, and don't be because of this Disdained by the failure of the expedition, we have achieved the ultimate we can do. When we resist and fear trying the next one because of this failure, that is the beginning of the real failure. I think I will sleep, hoping that when I open my eyes again, our rockets will be able to break out of the solar system. I look forward to the arrival of this day and firmly believe... Confidence... Confidence... We will definitely be able to do..."\nWe are sure there must be an aircraft inside, but which one? Is it related to the missing astronaut? Is that astronaut still alive? Or is this just another inexplicable communication from within the vision? \nI want to find out. The Ma girls in the Mubai family seemed to be extremely enthusiastic about this exploration.">  #NT!
  
 uma_mejro_ardan.1.a: "让我们进去看看吧"  <"Let's go in and take a look">  #NT!
  
  
 uma_mejro_ardan.2.title: "漫漫路途"  <"The long journey">  #NT!
 uma_mejro_ardan.2.desc: "异界探球带着数名考察队的成员进入裂隙。意外的是，在数分钟后，周围的环境并没有出现明显的变化，依然如外面的宇宙一般平静，我们的考察队员很快产生了睡意，但是按照航行规则，在考察中睡觉是不被允许的。“呃，出去之后我想在我的晚餐上加上一杯芭菲”\n就在她们畅想今晚芭菲的味道时，仪表中的重力突然激增，我们的探球一头扎进了大气层，重重摔在草地上。幸好探球出色的性能，除了球表面被绕了几圈线之外，并无太大损失。\n片刻，我们的考察队就踏上了这片土地"  <"The ball in another world brought several members of the expedition team into the rift. Surprisingly, after a few minutes, the surrounding environment did not change significantly, and it was still as calm as the universe outside. Our expedition members quickly became sleepy, but according to the navigation rules, sleeping during the expedition was not allowed. "Uh, after I go out I want to add a Bafil to my dinner"\nJust as they imagined the taste of Bafil tonight, the gravity in the instrument suddenly surged, and our scouts plunged into the atmosphere and fell heavily on the grass. Fortunately, the ball has excellent performance, and there is no big loss except that the ball surface is wrapped around several circles. \nIn a moment, our expedition team set foot on this land">  #NT!
 uma_mejro_ardan.2.a: "今晚的芭菲取消"  <"Tonight's Parfil cancelled">  #NT!
  
 uma_mejro_ardan.3.title: "先驱"  <"pioneer">  #NT!
 uma_mejro_ardan.3.desc: "这里有着许多稀奇的物种，其中一些植物学家或生物学家便秉持着“来都来了”的原则，在前往目的地的道路中，也随带着取走此处的“特产”。也请不要太苛责，科学家们总喜欢这些新奇的玩意儿。\n不远处，一艘长满了绿色植被以及生了铁锈的火箭出现在众人面前。这艘火箭近乎断成两截。队员们下意识地站在火箭的残骸前默哀，并祈祷着三女神收去这位勇者的英魂。\n队员们在火箭的控制室找到了坐在椅子上的航天员，她原有的身躯已化作白骨，身上任穿着那身笨重的宇航服；她不再动弹的躯体也化作了植被的安身之所，现在的她简直已与大自然融为一体，自那空洞的眼眶之中生长着一朵开得灿烂的花儿。\n她可能在火箭抵达这座星球之前就因为食物的缺乏或是别的什么原因而逝去了\n在她的怀中抱着她的日记本，上面记录着她自始发的第一天，直到她离世前的最后一天。在日记的末尾，她用歪歪扭扭的字迹写着：\n“我已经离我的祖国，太远......太远...... ”当时的人们曾以为，她将会是星际版本的哥伦布或是麦哲伦这样的人物，却没想到，她连流落孤岛的鲁滨逊都不如。"  <"There are many rare species here, and some botanists or biologists adhere to the principle of "all come" and take away the "special products" here on the way to their destination. Please don't be too harsh, scientists always like these novel things. \nNot far away, a rocket covered with green vegetation and rust appeared in front of everyone. The rocket was almost broken into two pieces. The team members subconsciously stood in front of the rocket's wreckage and observed silently, praying that the three goddesses would take away the hero's heroic soul. \nThe team members found the astronaut sitting on the chair in the rocket's control room. Her original body had turned into bones, and she could wear the bulky space suit; her no longer moved body also turned into a place for vegetation. Now she is simply integrated with nature, and a brilliant flower grows from her empty eyes. \nShe may have passed away due to lack of food or something before the Rockets arrived on the planet\nHold her diary in her arms, which records the first day she sent and the last day before her death. At the end of the diary, she wrote in crooked handwriting: \n "I am already from my motherland, too far... too far..." People at that time thought that she would be a star version of Columbus or Magellan, but she did not expect that she was not even as good as Robinson on the isolated island.">  #NT!
 uma_mejro_ardan.3.a: "我们来接您回家了"  <"We're here to pick you up home">  #NT!
  
 uma_mejro_ardan.4.title: "伊利亚特"  <"Iliad">  #NT!
 uma_mejro_ardan.4.desc: "在经过数日向标记信号源的行进后，我们的考察队员发现自己正处在一片水晶原，其品质也与如今采集到或从市场收购到的不同，这里的品质要较之外面更为上乘，其坚硬程度也可用作铸造船体护盾，不管任何情况下都是坚韧的。\n她们还没有忘记自己的目的，只能带着些恋恋不舍，继续行进。\n当她们行走至星球深处时，她们找寻到了一丝生活痕迹，有起来谁曾经在这里待过，并且时间不短。她们自然想到了那名航天员，而后续从中发现的符合当时年代的便携式生存工具与背包也证实了这一点。而在稍远处，她们也发现了一个上世纪火箭残骸，上面留有维修过的痕迹，但显然她并未成功。\n调查员们在工具包中找到了数本笔记本，页纸都已泛黄，仿佛轻轻翻动便能将纸捏成碎片。而在那名航天员生活的地方，她们也在一部分地面的刻痕上发现了字迹，可能是续着笔记本写下的内容。她们小心地扫描着笔记本与其他遗留有笔迹的地方，并同步传输至指挥中心。\n可能她曾想过，自己有朝一日肯定能被同族的人找着的，只是时间问题罢了，而她自己也相信，自己写下来的这些东西也能够稍微帮上她们的忙。她在每本笔记的开头与每一章节的开头都写着：\n“致我敬爱的祖国与同志们......嘿！如果您姓目白，不......哪怕您不姓目白......”"  <"After several days of traveling to the marked signal source, our team members found that they were in a crystal field, and their quality was different from what they collected or purchased from the market. The quality here was better than outside, and its hardness could also be used as a shield for casting hulls, which was tough under any circumstances. \nThey haven't forgotten their purpose yet, so they can only continue to move forward with some reluctance. \nWhen they walked to the depths of the planet, they found a trace of life, and who had been here before, and for a long time. They naturally thought of the astronaut, and the portable survival tools and backpacks they discovered later in the era also confirmed this. A little further away, they also found a rocket wreckage in the last century with traces of repairs on it, but obviously she did not succeed. \nInvestigators found several notebooks in the toolkit, and the pages were yellowed, as if they could pinch the paper into pieces by turning it gently. And where the astronauts lived, they also found handwriting on some of the marks on the ground, perhaps continuing the content written in the notebook. They carefully scan the notebook and other places with leftover handwriting and transmit it to the command center simultaneously. \n Maybe she had thought that one day she would definitely be found by people of the same clan, it was just a matter of time, and she herself believed that the things she wrote could also help them a little. She wrote at the beginning of each note and at the beginning of each chapter: \n "To my dear motherland and comrades... Hey! If your surname is Mubai, not...even if you don't surname Mubai..."">  #NT!
 uma_mejro_ardan.4.a: "应该还未到结束的时候"  <"It shouldn't be the end yet">  #NT!
  
 uma_mejro_ardan.5.title: "画中人"  <"The man in the painting">  #NT!
 uma_mejro_ardan.5.desc: "在考察队通过在星球表面的地洞前往星球核心位置时，她们在路上发现这里的晶体奇妙的相连接在一起，像是血管一般往更深处输送着什么。\n随着她们的深入，此处的秘密面纱也逐渐被揭晓。\n位于星球中央的核心，在那里有着一颗巨大的菱形水晶，而四周的晶体也似环抱一般簇拥在它的周围。当调查员们注意到菱形水晶中的事物时，无不瞠目结舌。\n那颗菱形的晶体被安置在最中央，被包裹在其中的正是她们找寻已久的目白阿尔丹。她穿着那身二十世纪的航天服；她闭着双眼，双手平静交叠在一起，显现出她孩童般的娴静，让众人觉得，不管她如何进入晶体其中的，那时的情绪是如何的，可能是被强迫，可能是主动接受，但至少她此刻的模样，她表现的很幸福。现在的她，模样就像被浸在琥珀中的史前生物，没有经过衰老、腐朽，继而变成一个骨头架子，而是浸润在晶体之中，仿佛世间一切青春与美好都永久地环绕在她的周围，以令她保持着自身的年轻靓丽、英姿飒爽。就像永远活在人们心里与艺术创作中的：“身着航天服的目白阿尔丹”形象。这时谁又能想到她是一位生活在近两三百年前的老人呢？\n她们不由感叹着，往常只在书本插画或是类似墙绘横幅等等地方的“画中人”阿尔丹，此时真真正正地出现在了众人的面前，多少有着些小偶像亲眼见到自己的崇拜对象的兴奋情绪。\n当官方的人员还正思考着现在的阿尔丹还是否留有生命体征，若是擅自挪动这块中央晶体的话是否会导致星球的崩溃？在另一边，目白家的成员已经取出切割设备，准备将阿尔丹送回特雷森了。\n只有这种时候目白家族的她们才会搁下自己的矜持与风雅。\n“喂！你们这样可太莽撞啦！”"  <"When the expedition team went to the core of the planet through the hole on the surface of the planet, they found on the way that the crystals here were strangely connected together, transporting something deeper like blood vessels. \nAs they deepened, the secret veil here was gradually revealed. \n Located in the heart of the planet, there is a huge diamond crystal there, and the crystals around it are clustered around it. When investigators noticed the things in the diamond crystal, they were all dumbfounded. \nThe diamond-shaped crystal was placed in the center, and what was wrapped in it was the Meba Ardan they had been looking for for a long time. She was wearing the 20th century space suit; she closed her eyes and her hands were quietly overlapping, showing her childlike demise, making everyone feel that no matter how she entered the crystal, how she was emotional at that time, it might be forced or actively accepted, but at least she was very happy as she looked at the moment. Now she looks like a prehistoric creature immersed in amber. She has not been aged or decayed, but has become a bone frame, but is immersed in crystals, as if all the youth and beauty in the world are permanently surrounded by her, so that she can maintain her youthful, beautiful and heroic appearance. Just like the image of "My White Ardan, wearing a space suit, is always in people's hearts and artistic creations. Who could have thought that she was an old man who lived nearly two or three hundred years ago? \nThey couldn't help but sigh that Ardan, the "painted man" who used to be only in book illustrations or similar wall-painted banners, really appeared in front of everyone, and there was some excitement of the little idol seeing their worship object with their own eyes. \n When the official staff is still thinking about whether Aldan still has vital signs. If he moves this central crystal without authorization, will it lead to the collapse of the planet? On the other side, members of the Mubai family have taken out the cutting equipment and are ready to send Ardan back to Tresen. \nOnly at this time, the Megumi family will put aside their reserve and elegance. \n"Hey! You guys are so reckless!"">  #NT!
 uma_mejro_ardan.5.a: "我们的睡美人"  <"Our Sleeping Beauty">  #NT!
  
 uma_mejro_ardan.6.title: "融冰之时"  <"Time of melting ice">  #NT!
 uma_mejro_ardan.6.desc_a: "众人将阿尔丹的性命托付给主持项目的爱丽速子，并且嘱咐了她许多话，像是稍微小心点啦云云。\n熟悉爱丽速子的科研人员常形容爱丽速子的实验：“虽然过程总是如此惊险，但你会发现她那是近似于炫技、唬人的技巧，实际上她的效率与成功率都是迅速且安全无险的。她就是那种极具恶趣味的人。”不知是爱丽速子认真听取了嘱咐的话，还是她自己也知道这是一件极其严肃且认真的重要事项，不容马虎。整场下来可以看见她很务实地做着，没有搞多余的事情，这也让从旁的人放下了点儿心。\n项目持续仅不到一小时，“破冰行动”宣告完成。现在的阿尔丹正平静地躺在疗养床上，面色带着些红润，缓慢且平稳的呼吸让众人晓得：她现在还活着，正睡着。没有谁是比目白家的人要来的兴奋的了，要不是现在就在目白阿尔丹身边，她们准要大声呼喊上几句，再到大操场上跑上个几千几万米路。\n现在阿尔丹所要做的便是静静修养，等到哪一天她自己醒来的时候。"  <"Everyone entrusted Aldan's life to Ali Suzi, who was in charge of the project, and told her a lot of words, as if she was a little careful. \nScientific researchers familiar with Alice Suzi often describe Alice Suzi's experiments: "Although the process is always so thrilling, you will find that she is a technique similar to showing off skills and bluffing. In fact, her efficiency and success rate are both fast and safe. She is the kind of person who is extremely terrible." I don't know if Alice Suzi listened carefully to the instructions, or if she herself knew that this was an extremely serious and serious important matter, and she should not be careless. Throughout the whole show, you can see that she was doing it pragmatically and did not do anything extra, which also made the people from the side feel relieved. \nThe project lasted for less than an hour and the "Ice Breaking Operation" was announced to be completed. Ardan is now lying calmly on the recuperation bed, her face is a little rosy, and her slow and steady breathing makes everyone know: she is still alive and is asleep. No one is excited about the people of the Mubai family. If they weren't by Mubai Ardan now, they would have shouted a few words and then ran thousands or tens of thousands of meters on the playground. \nWhat Ardan has to do now is to calm down and cultivate herself, and when one day she wakes up herself.">  #NT!
 uma_mejro_ardan.6.desc_b: "众人将阿尔丹的性命托付给主持项目的科研总管，并且嘱咐了她许多话，像是稍微小心点啦云云。\n她自己也知道这是一件极其严肃且认真的重要事项，不容马虎。整场下来可以看见她很务实地做着，没有搞多余的事情，这也让从旁的人放下了点儿心。\n项目持续仅不到一小时，“破冰行动”宣告完成。现在的阿尔丹正平静地躺在疗养床上，面色带着些红润，缓慢且平稳的呼吸让众人晓得：她现在还活着，正睡着。没有谁是比目白家的人要来的兴奋的了，要不是现在就在目白阿尔丹身边，她们准要大声呼喊上几句，再到大操场上跑上个几千几万米路。\n现在阿尔丹所要做的便是静静修养，等到哪一天她自己醒来的时候。"  <"Everyone entrusted Ardan's life to the scientific research manager who was in charge of the project, and told her a lot of words, as if she was a little careful. \nShe herself knew that this was an extremely serious and serious important matter and should not be careless. Throughout the whole show, you can see that she was doing it pragmatically and did not do anything extra, which also made the people from the side feel relieved. \nThe project lasted for less than an hour and the "Ice Breaking Operation" was announced to be completed. Ardan is now lying calmly on the recuperation bed, her face is a little rosy, and her slow and steady breathing makes everyone know: she is still alive and is asleep. No one is excited about the people of the Mubai family. If they weren't by Mubai Ardan now, they would have shouted a few words and then ran thousands or tens of thousands of meters on the playground. \nWhat Ardan has to do now is to calm down and cultivate herself, and when one day she wakes up herself.">  #NT!
 uma_mejro_ardan.6.a: "做的好"  <"Well done">  #NT!
 uma_mejro_ardan.7.title: "新世纪的旧时代公民"  <"Citizens of the Old Age of the New Century">  #NT!
 uma_mejro_ardan.7.desc: "阿尔丹醒过来了。这其实是个秘密，并没有多少人知道。她很快就能下床了，医护人员都劝她先休息，可她偏不，最后倒也同意了。\n为了不惊扰到阿尔丹的休息，目白家只派了三位小代表。\n阿尔丹总会到外面的花园子里，这时候总会有三个小家伙偷偷摸摸地跟过来。她总招呼着她们过来，打趣说：\n“老是傻站在那儿干吗呢？难道是怕我吗？”\n每当阿尔丹对当下进步感到惊讶时，她们不免哑然失笑，她们国家的疆域也早不局限于一个星球、一个星系，她们早已一跃成为整个银河系都不容忽视的星际文明。她仍需要适应。就像她不久前才知道自己成为了一代人的精神象征一样\n想到熟悉的人与物都早早地随时间逝去了，不免悲戚，常趁着三位小代表离开时自己在房间里抽泣。\n当她们问起阿尔丹当时为什么会在那块晶体里面。\n“它们......不太平常，它们能够自然生长，这一点匪夷所思，但它缺少一个像我们一样脉动着的心脏，我就想：‘我能不能呢？反正我待在这里也会有一天因为食物匮乏而死去。’想到这里之后，我就主动与它们接触了，最终融入到晶体里面去......实际上这种体验可能有些类似于植物人，当时调查队来的时候，我能够感受到她们，她们就像骑士一样。现在看来，这个选择不坏。”阿尔丹轻笑着说道。\n幼时怂恿着阿尔丹的蓬勃朝气此时又在心底里显现了。她托小代表为她购来许多书籍，学习起这两百年后的科学与人文。\n看得出来，阿尔丹是绝不会放下一切去某个地方平静生活的。"  <"Ardan woke up. This is actually a secret, not many people know it. She was able to get out of bed soon, and the medical staff advised her to rest first, but she refused, and finally agreed. \nIn order not to disturb Ardan's rest, the Mubai family sent only three small representatives. \nAldan always goes to the garden outside, and at this time there will always be three little guys following him secretly. She always greeted them and joked: "What are you always standing there stupidly? Are you afraid of me?"\n Whenever Ardan was surprised by the current progress, they couldn't help laughing. The territory of their country was no longer limited to one planet or one galaxy. They had already become an interstellar civilization that the entire Milky Way could not ignore. She still needs to adapt. Just like she only realized that she had become a spiritual symbol of a generation not long ago\nThinking that familiar people and things had passed by early with time, she couldn't help but feel sad. She often sobbed in the room when the three little representatives left. \nWhen they asked why Ardan was inside the crystal at that time. \n "They... are not very ordinary, they can grow naturally, which is incredible, but they lack a heart that pulsates like us, and I thought, 'Can I? Anyway, I will die from food scarcity any day.' After thinking about this, I took the initiative to contact them and finally integrated into the crystal... In fact, this experience may be somewhat similar to vegetatives. When the investigation team came, I could feel them, they were like knights. Now it seems that this choice is not bad." Ardan said with a chuckling. \nThe vigorous vitality that encouraged Ardan when he was young appeared in his heart again. She asked a representative to buy many books for her and learn about science and humanities in the past two hundred years. \nIt can be seen that Ardan will never let go of everything and live a peaceful life somewhere.">  #NT!
 uma_mejro_ardan.7.a: "了不起的人儿"  <"Awesome person">  #NT!
  
  
  
 uma_mejro_ardan.adname: "目百阿尔丹"  <"Meba Aldan">  #NT!
 uma_mejro_ardan.8.desc: "初次见面，书记同志。本次我与您沟通，实属我的个人请求。"  <"First meeting, Comrade Secretary. This time I communicated with you is my personal request.">  #NT!
 uma_mejro_ardan.8.a: "阿尔丹同志找我们有什么事呢？"  <"What's the matter with Comrade Ardan?">  #NT!
 uma_mejro_ardan.9.desc: "我希望得到一个就职的机会，我不希望我只是像一个动物园里的珍稀动物一样好好过活着，我希望能够继续从事我的事业......如果这项职业需要进行考试评测，请给我这样的一个机会，即便我考试不过，我也不会迁怒于同志你，为此我已做足了功课......"  <"I hope to get a chance to take the job. I don’t want me to live a good life like a rare animal in a zoo. I hope to continue to engage in my career... If this profession requires examination and evaluation, please give me such an opportunity. Even if I fail the exam, I will not take my anger on you. I have done my best to do this...">  #NT!
 uma_mejro_ardan.9.a: "那么你还想要成为一名科学家吗？"  <"So do you still want to become a scientist?">  #NT!
 uma_mejro_ardan.10.desc: "怎么不想呢，书记同志？我打小便填上这个志愿，并希望为其奋斗终生。"  <"Why don’t you think about it, Comrade Secretary? I filled in this choice when I urinated and hoped to fight for it for the rest of my life.">  #NT!
 uma_mejro_ardan.10.a: "可是你的身体......能够支持吗？"  <"But can your body...support it?">  #NT!
 uma_mejro_ardan.11.desc: "我的身体早已不碍事......不然特雷森联盟号的首席航天员便不会是我了，这些都是可以证明的。"  <"My body is no longer in the way... Otherwise, the chief astronaut of the Traseson Soyuz would not be me, and these can be proven.">  #NT!
 uma_mejro_ardan.11.a: "尽管如此，我们仍希望同志你好好休息"  <"Despite this, we still hope that comrades, you have a good rest">  #NT!
 uma_mejro_ardan.12.desc: "书记同志，我已经休息了两百多年了。"  <"Comrade Secretary, I have been resting for more than two hundred years.">  #NT!
 uma_mejro_ardan.12.a: "好吧，如果阿尔丹同志你能通过考试，那么我们就接收你"  <"Well, if you can pass the exam, then we will accept you">  #NT!
 uma_mejro_ardan.12.a.repo: "感谢你，书记同志。我很高兴我即将要回到我的位置上去。"  <"Thank you, Comrade Secretary. I'm glad I'm about to go back to my position.">  #NT!
 uma_mejro_ardan.13.title: "统一考试"  <"Unified Exam">  #NT!
 uma_mejro_ardan.13.desc: "阿尔丹即将复出的消息早已通过各式各样的门道给传遍了，而之后官方也发表了正式的通知来证实消息的属实。人们虽然热情，但能够独立思考，她们并不会组团打着横幅到阿尔丹休息的地方去吵吵闹闹，只是偶尔会有一些小粉丝，三三两两的凑到那附近，看看有没有机会一睹真容。但可惜的是，阿尔丹一直未曾出门。人们猜测她正在好生修养，但实际上她正日夜兼程、如饥似渴地学习着本世纪的知识。来自二十三世纪的知识只要轻轻一推便冲垮了她二十世纪的大脑。\n随着一届科学技术人员统一考试的落幕，一些格外细致群众从国立科学院的招收名单上看到了熟悉的名字：\n目白阿尔丹。"  <"The news that Ardan is about to come back has been spread through various tricks, and the official later issued a formal notice to confirm the truth of the news. Although people are enthusiastic, they can think independently. They don’t form a group to play banners to go to the place where Ardan rests, but occasionally some small fans will come to the vicinity in groups of three or three to see if they have the chance to see the true appearance. But unfortunately, Ardan has never gone out. People guess she is cultivating well, but in fact she is learning the knowledge of this century day and night. Knowledge from the 23rd century crashed into her 20th century brain with just a slight push. \n With the end of a unified examination for scientific and technical personnel, some particularly meticulous people saw a familiar name from the recruitment list of the National Academy of Sciences: \nMubai Ardan.">  #NT!
 uma_mejro_ardan.13.a: "她考上了"  <"She passed the exam">  #NT!
  
  
 UMA_MEJRO_ARDAN_SAVE_AD: "Melt"  <"Melt">  #NT!
 UMA_MEJRO_ARDAN_SAVE_AD_DESC: "我们的考察队在裂隙中将包裹在水晶中的阿尔丹带了回来。显而易见，我们不可能将这具水晶棺放在博物馆中，为了确认被困在里面的阿尔丹是否存活，我们必须要把她从里面救出来。"  <"Our expedition brought Ardan, wrapped in crystals, back in the rift. It is obvious that it is impossible for us to put this crystal coffin in the museum. In order to confirm whether Ardan was trapped inside survived, we must rescue her from it.">  #NT!
  
  
  
 uma_mejro_ardan.14.desc: "§Y目白阿尔丹捧着教科书，步履轻盈，像羽毛飘落地面，随后又升起，又飘落。\n她对如今时代的变化适应的相当好，脸上都充斥着孩童似的欢快与活泼，还有少不了的好奇。\n随后她立马站住了，面露惊讶，她可不知道学生会书记居然悄无声息地站在这儿呢。§!\n“你好，书记同志，是有公务要来这里吗？\n如果需要的话，我可以陪同着，这里的每一位同事与教授我都很熟悉。”"  <"§Y目白阿尔丹捧着教科书，步履轻盈，像羽毛飘落地面，随后又升起，又飘落。\n她对如今时代的变化适应的相当好，脸上都充斥着孩童似的欢快与活泼，还有少不了的好奇。\n随后她立马站住了，面露惊讶，她可不知道学生会书记居然悄无声息地站在这儿呢。§!\n"Hello, Comrade Secretary, do you have official duties here?\nIf you need it, I can accompany you. I am very familiar with every colleague and professor here."">  #NT!
 uma_mejro_ardan.14.a: "不，我只是来看看你的情况怎么样"  <"No, I'm just here to see how you are">  #NT!
 uma_mejro_ardan.14.a.resp: "§Y她很柔和地笑了起来，像是很感激这样的举措。§!\n“不用为我担心，书记同志。再怎么说，算上被封住的时间，我也是个几百岁的人了！现在的各种知识学说令我眼花缭乱，老实讲，以前我学的物理知识，放到现在就跟白学过似的，其实这多少令我有些难过。也正因如此，我乐于接受现在如此先进的知识，它们总让我受益良多。我相信再过不久，我就能重回岗位工作。”"  <"§Y她很柔和地笑了起来，像是很感激这样的举措。§!\n "Don't worry about me, Comrade Secretary. Anyway, I'm a hundred years old in terms of the time I was sealed! The various knowledge and theories of the present dazzled me. To be honest, the physics knowledge I learned in the past is like a waste of time. In fact, this makes me feel a little sad. It is for this reason that I am willing to accept such advanced knowledge now, and they always benefit me a lot. I believe that in the near future, I will be able to return to my job."">  #NT!
 uma_mejro_ardan.14.b: "看来你和她们相处的很好"  <"It seems you get along well with them">  #NT!
 uma_mejro_ardan.14.b.resp: "“是的，书记同志。我甚至可以很自傲地同你说，这处设施里每一位同事的脸我都能够认得，并且叫出名字来！”\n§Y她的脸上果真浮现出了那般骄傲的神情，但看上去仍是那么温和、那么谦卑。§!\n“她们教我现在的物理学与航天科学，还教我现代的常识与自我那一代往后到现在的历史，没有她们，我现在指定还蹒跚学步地读着课本呢。是的......她们帮了我许多忙。”"  <""Yes, Comrade Secretary. I can even proudly tell you that I can recognize the faces of every colleague in this facility and call them out!"\n§Y她的脸上果真浮现出了那般骄傲的神情，但看上去仍是那么温和、那么谦卑。§!\n"They taught me the current physics and aerospace science, and taught me the modern common sense and the history of that generation to the present. Without them, I am still trying to read the textbooks to the point. Yes...they helped me a lot."">  #NT!
 uma_mejro_ardan.14.c: "我相信你仍能工作，但我们害怕，你再出现那样的意外"  <"I believe you can still work, but we are afraid that you will have such an accident again">  #NT!
 uma_mejro_ardan.14.c.resp: "“在我那时候，我已经把我可能会遭遇到的一切困境与绝望都想了个遍，别人也说我的身体哪怕挺过模拟测试，也不太能挺过真实的太空环境。但即便如此，我仍然选择登上火箭。”\n§Y她的眼神那样坚毅，使人不知不觉联想到两百年前某位记者留下的一张照片：她穿着笨重的航天服，转过身去，作出微笑，抬起的右手比着代表胜利的“V”。§!\n“往后退一步，就是要把曾经意志坚定的自己彻底否决掉；我们发展到现在，绝不是靠着对过去的留念，而是我们能够昂首阔步向前走的信念。”"  <""At that time, I had thought of all the difficulties and despair that I might encounter. Others also said that even if my body survived the simulation test, I would not survive the real space environment. But even so, I still chose to board the Rockets."\n§Y她的眼神那样坚毅，使人不知不觉联想到两百年前某位记者留下的一张照片：她穿着笨重的航天服，转过身去，作出微笑，抬起的右手比着代表胜利的“V”。§!\n"A step back means completely rejecting the once firm-willed self; we have developed to the present, not by souvenirs of the past, but by our belief that we can strode forward with our heads raised."">  #NT!
  
 uma_mejro_ardan.14.hire: "欢迎回来"  <"Welcome back">  #NT!
 uma_leader_ardan: "航天先驱目白阿尔丹"  <"Aerospace pioneer Bai Ardan">  #NT!
 uma_mejro_ardan.15.title: "百年前的今天"  <"Today a hundred years ago">  #NT!
 uma_mejro_ardan.15.desc: "不知何时，在发现阿尔丹的裂隙前突然出现了一个星球。似乎是裂隙将科考队登上的星球吐了出来，至于原因我们不甚清楚，但是是事实是，我们又多了一处可以殖民的星球。"  <"At some point, a planet suddenly appeared before discovering Ardan's rift. It seems that the rift spit out the planet that the scientific expedition team boarded. We are not very clear about the reason, but the fact is that we have another planet that can be colonized.">  #NT!
 uma_mejro_ardan.15.a: "甚好"  <"Very good">  #NT!
  
 uma_pc_ardan_planet: "奥特洛伊"  <"Otroy">  #NT!
  
  
