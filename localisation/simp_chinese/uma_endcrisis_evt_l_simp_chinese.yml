###EVT
uma_ec_3.20.title: "空间异动"
uma_ec_3.20.desc: "位于[event_target:uma_ec3_first_system.GetName]的黑洞出现了瞬时强大的亚空间波动。这次波动使得周边星系受到了强电磁暴的影响——所有的电子设备在一瞬间集体短暂罢工。这会是什么原因导致的？"
uma_ec_3.20.a: "不安"
uma_ec_3.21.title: "警戒！"
uma_ec_3.21.desc: "大量舰队从[event_target:uma_ec3_first_system.GetName]的黑洞中折跃出来，并迅速建造了指挥中心。\n令人惊奇的是，它们似乎并不需要工程船就能建造太空建筑而是从舰船上直接释放自组装构件在太空中自己拼装起来。"
uma_ec_3.21.a: "进入警戒"
uma_ec_3.22.title: "???"
uma_ec_3.22.desc: "没想到这里也有马娘同胞，还是一个年轻的文明。先介绍下自己：我们来自与你们同级的”另外一个宇宙“。虽然我们在外表和经历上十分相似，不过很遗憾，严格意义上来说，我们终究不是同样一个种族，不过在我们击败你们后我们会给你们提供相应的优待.....\n\n......不过你们的星区，资源，殖民地，星球上的一草一木，都将会是我们的财产！这篇宇宙的恒星将会变为我们的发电厂，行星将会变为矿场！"
uma_ec_3.22.a: "必须阻止它们！"

uma_ec_3.23.title: "???"
uma_ec_3.23.desc: "你们坐拥着一片丰饶的领地，外星人......不过很快，你们的星区，资源，殖民地，星球上的一草一木，都将会是我们的财产！这篇宇宙的恒星将会变为我们的发电厂，行星将会变为矿场！"
uma_ec_3.23.a: "必须阻止它们！"
uma_ec_3.24.title: "焦土计划"
uma_ec_3.24.desc: "在一片耀眼的亮光之下，[From.GetName] 的所有星球都变为荒芜，所有生命都被全部抹除，甚至恒星也变为黑洞。难道这就是它们的焦土计划？"
uma_ec_3.24.desc.swap: "在一片耀眼的亮光之下，[From.GetName] 的所有殖民地都归于寂静，所有生命都被全部抹除。难道这就是它们的焦土计划？"
uma_ec_3.24.a: "令人震惊"
uma_ec_3.28.title: "突然出现的庞然大物"
uma_ec_3.28.desc: "在这些从另一个维度来的马娘到达这个宇宙的瞬间，一个巨大的哨所就跃迁到我们的首都星系。它只是静静地呆在那里，我们暂时不知道这个凭空出现的庞然大物究竟是用来做什么的。但冥冥之中感觉这不是个好东西......"
uma_ec_3.28.a: "必须立刻研究"
uma_ec_3.29.title: "定时炸弹"
uma_ec_3.29.desc: "经过对这个庞然大物的探索与技术逆向我们发现，这个驻足在我们星系的庞然大物其实是一颗定时炸弹！它从一定范围内的其他焦土锚获取电力，然后等到电量达到一定程度时将会释放一阵强大的能量将这颗星系的所有生命全部抹除，并且，如果在任何拥有焦土锚的星系拥有殖民地，那该殖民地上的人口将会瞬间大量流失。现在，我们可以通过每月一次的连接扫描，来定位为这个死亡兵器供能的其他焦土锚的位置。\n希望我们的速度够快"
uma_ec_3.29.a: "好的"


uma_ec_3.25.title: "溃退"
uma_ec_3.25.desc: "来自另一个宇宙的邪恶马娘们在这个宇宙建立的基地终于被一举拿下。一场浩劫终于结束了......"
uma_ec_3.25.a: "万幸"

uma_ec_3.26.title: "???"
uma_ec_3.26.desc: "年轻的马娘们......你们听过三女神嘛？我们通过领域发现三女神似乎......是一个独立于我们所有宇宙之外的......监【通信被外部阻断】......她们正在看着你们"
uma_ec_3.26.a: "什么？"

