crisobj_uma_destroy_country_name: "毁灭帝国"
crisobj_uma_destroy_country_desc: "文明的覆灭可以提升我们处理异种领域能的效率。\n\n摧毁其他帝国来获得进度奖励。"
crisobj_uma_pugre_name: "净化异种"
crisobj_uma_pugre_desc: "在这些外星人死亡的瞬间会产生少量的领域能，这会很有帮助\n\n以濒死体验净化方式净化其他物种的人口来获得进度奖励。"
crisobj_uma_realm_power_name: "领域能产出"
crisobj_uma_realm_power_desc: "领域马娘们通过模拟一场场激烈的比赛来产出可观的领域能\n\n设立领域马娘岗位来获得进度奖励。"
crisobj_uma_destroy_fleet_name: "摧毁舰队"
crisobj_uma_destroy_fleet_desc: "摧毁舰队可以提升我们处理异种领域能的效率。\n\n摧毁其他帝国的舰队来获得进度奖励。"
crisobj_uma_build_building_name: "建造领域传输中心"
crisobj_uma_build_building_desc: "这是向巨构传输领域能的基础\n\n建造该建筑来获得进度奖励。"
crisobj_uma_realm_power_natural_name: "自然领域能增长"
crisobj_uma_realm_power_natural_desc: "除了通过领域传输建筑向巨构传输领域能外，他也能自然收集马娘们领域产生的能量。\n\n该项为自然增长。"

