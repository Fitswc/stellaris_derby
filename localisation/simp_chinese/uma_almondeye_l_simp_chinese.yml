l_simp_chinese:
##Anomalies
uma_ale_anomoly: "吐息"
uma_ale_anomoly_desc: "科研船分析该黑洞时发现了异常粒子流，有必要对其进行进一步研究。"
uma_ale_2_anomoly: "时空勘探"
uma_ale_2_anomoly_desc: "尽管星系结构与$UMA_ALE_PAST_EYE$相同，此处的时间似乎较标准时间快9天，我们将该星系命名为$UMA_ALE_FUTURE_EYE$。而想要确定下一步研究方向，必须找到一个突破口，这些工作将由先前进入的科学家完成。"

UMA_ALE_PAST_EYE: "过去眼"
UMA_ALE_FUTURE_EYE: "未来眼"

##EVT
uma_ale.2.title: "$uma_ale_anomoly$"
uma_ale.2.desc: "科学家[This.Fleet.GetLeaderName]完成了对该黑洞的研究，结果显示，尽管该黑洞正在不断地吸收物质，其引力却在逐渐下降，这意味着它正在失去质量，这显然并非黑洞辐射的范畴。\n科学家[This.Fleet.GetLeaderName]提议将量子信标投放进入黑洞中，这或许对于我们的黑洞学研究有帮助。"
uma_ale.2.a: "批准"
uma_ale.2.b: "监视就好"
uma_ale.3.title: "物质大爆炸"
uma_ale.3.desc.a: "我们的信标进入视界的刹那便如往常一般失去了量子反应，但在一段时间后，它似乎又有效了，只是我们完全无法判断其所处的位置，它也没有任何特殊反应。\n然而，就在刚刚，它忽然发生了奇异的变化，原本因引力扭曲的光线落回了黑洞的“后方”，随后，它开始爆发出猛烈的、如同超新星爆发一般光芒。\n大量的物质开始向外喷发，其中有许多熟悉的元素和矿物，也有从未见过的化合物，甚至还有水晶萝卜！\n我们的科学家难以解释这种现象，她们认为这个黑洞的特殊结构使得该黑洞的时空发生了逆向进行，但无论如何，它给我们提供了大量的资源。"
uma_ale.3.a: "这太神奇了"
uma_ale.4.title: "时空风暴"
uma_ale.4.desc: "一种特殊的风暴在「$UMA_ALE_PAST_EYE$」形成，科学家们认为这是由于黑洞的异常活动造成的时空紊乱，因此将这种风暴命名为“时空风暴”。\n在这种风暴的影响范围中，我们的FTL引擎大多难以启动，但经过测算，它的影响范围将局限在星系中。\n被困在星系内的船只可以等待风暴结束，或者经过长时间的坐标测算以启动FTL。"
uma_ale.4.a: "$OK$"
uma_ale.5.title: "超空间航道重组"
uma_ale.5.desc: "在对时空风暴的持续观测中，我们逐渐发现了这种风暴更多的特性，尤其是其对超空间航道的影响，尽管在「$UMA_ALE_PAST_EYE$」内无法进行超光速航行，但滞留在其中的舰船发现了异常的时空波动，似乎预示着其通往某个未曾被探测到的星系。"
uma_ale.5.a: "不应将科学家置于危险的环境中"
uma_ale.5.b: "尝试定位超空间航道"
uma_ale.6.title: "定位完成"
uma_ale.6.desc: "科学家[This.Fleet.GetLeaderName]成功定位了时空风暴下的超空间航道，尽管我们强调不要尝试进入航道，但科学家[This.Fleet.GetLeaderName]似乎遭遇了某种强大的牵引力，并且在没有启动超空间引擎的情况下进入了航道中。"
uma_ale.6.a: "尝试建立通讯"
uma_ale.7.title: "[From.Fleet.GetLeaderName]"
uma_ale.7.desc: "......，我并不是很清楚现在的情况，尽管确信自己进入了超光速航道，但是似乎又回到了这个星系里……一定有哪里出了问题，我需要检查一下仪器。"
uma_ale.7.a: "（等待）"
uma_ale.8.title: "[From.Fleet.GetLeaderName]"
uma_ale.8.desc: "坐标……引力参数……时间……时间？我好像明白了，请告知我标准时间。"
uma_ale.8.a: "现在是[GetDate]"
uma_ale.9.title: "[From.Fleet.GetLeaderName]"
uma_ale.9.desc: "科研船上的仪器显示，当前时间是标准时间的9天后，我确信这不是因为引力导致的。虽然可能性有很多，但我倾向于……这是一种「超时间航道」，至于进一步的研究，我认为可以§Y在$UMA_ALE_PAST_EYE$和$UMA_ALE_FUTURE_EYE$建立前哨站§!，方便我们的进一步研究。"
uma_ale.9.a: "准许"
uma_ale.10.title: "时空恒定"
uma_ale.10.desc: "一般而言，时空异常的星系往往会出现各种各样的紊乱现象，譬如时间流速异常、空间折叠等，但$UMA_ALE_FUTURE_EYE$的时空结构相当稳定，这让调查陷入了瓶颈。\n国内的科研总部也吵翻了天，除去各种各样的猜想外，还有许多科学家认为是仪器出了问题，她们要求再派出科研船前去探查。"
uma_ale.10.a: "我们在那里§Y建立一个恒星基地§!就可以继续研究了"
uma_ale.12.title: "未来的眼睛"
uma_ale.12.desc: "所有进入该星系的设备哪怕内外对照时间相同，体感上也明明没有经过如此长的时间，仪表盘就是无一例外、毫无感情地比标准时间快出九天。\n科学家们已经搜索了这个星系的每一寸，没有发现其他任何异常，货运船倒是正在愉快地将星系中的资源运输出去。\n有研究人员提出，$UMA_ALE_FUTURE_EYE$与$UMA_ALE_PAST_EYE$极其相似，或许是黑洞形成的两条时间线，它们或许会在一定周期内进行“时空同步”。\n经过商议，我们决定在$UMA_ALE_PAST_EYE$建立一处物资回收处理站，将废弃的资源在这个星系中进行处理和销毁，如果两个星系发生时空同步，星系中新增的质量会产生一定干扰，收集这些数据或许能对物理学的发展有所帮助。\n\n§Y可以通过法令界面开启溢出物资回收处理站的界面§!"
uma_ale.12.a: "$OK$"

uma_ale.31.title: "神秘的低语"
uma_ale.31.desc: "最近，我们在$UMA_ALE_PAST_EYE$的资源回收站中不时能听到一些来自黑洞的神秘低语。它们表现为一些轻微的，断断续续的信号，神奇的是，这些神秘的信号被翻译过来后居然是'呜呜......吃不下了......不要再掉下来了'\n或许使用一下提取会发生什么神奇的事情？"
uma_ale.31.a: "什么回事"

uma_ale.32.title: "富足的马娘?"
uma_ale.32.desc: "正在我们接收来自未来眼的资源时，只听到扑通一声，一个陌生的马娘随着这一堆物资掉了出来，她双眼紧闭，嘴里还在念叨着什么天上掉下来的食物已经吃腻了什么的......我们的工作人员立刻上报并且将她带到了最近星球的医务室上进行观察。虽然不清楚这个马娘到底是从哪里来的，但是经过细致的检查，这名马娘的营养十分均衡，并且完全没有任何异常状况，看样子只是睡着了。\n短短几个小时后，这么马娘从床上蹦了起来，充满好奇的打量着我们所有人。\n‘啊，有人告诉我这是哪里吗。’"
uma_ale.32.a: "早上好!"
uma_ale.33.title: "???"
uma_ale.33.desc: "啊嘞？我只记得我要小睡一会，怎么就身边多出这么多人了？还是在不熟悉的地方呢，难道......被救回家啦！？。\n啊，你好，帝国第三打击舰队，指挥官杏目，向您报道！请问您是......"
uma_ale.33.a: "我是[Root.GetRulerTitle][Root.GetRulerName]"
uma_ale.34.title: "杏目"
uma_ale.34.desc: "呀！是[Root.GetRulerTitle]，那现在帝国还在嘛，我不清楚过了过久了。\n......看你的表情，似乎你对帝国这个概念很迷茫，难道说，这里不是我认识的马娘帝国嘛......呜......要不是掉进了那个黑洞里......"
uma_ale.34.a: "掉进了那个黑洞?"
uma_ale.35.desc: "就是那个黑洞啦，当时我们在修建一个时空稳定锚，用来延缓由于外部力量导致的时空错位，具体方法就是......把这个星系里的恒星炸成黑洞！只是在准备撤离的时候，这个黑洞产生了强大的吸力，把我连人带船扯进了这个黑洞。奇怪的是，黑洞里面居然是一个巨大的空间，然后我就被困在了那个地方。直到某一天，天上居然下起了各种资源，我刚刚注意到你们好像把一些资源丢进这个黑洞里，那些该不会......"
uma_ale.35.a: "大概是我们的过剩资源"
uma_ale.36.desc: "那那......多谢你们！只可惜我并不知道黑洞中的时间流速，不过根据各种迹象看来，我熟悉的‘家’看来已经被埋没在时间的尘埃里了，那些情感，回忆都不见咯~"
uma_ale.36.a: "杏目小姐，我们都可以成为你的家人和朋友"
uma_ale.37.desc: "真的嘛！？那，那容我重新介绍一下自己"
uma_ale.37.a: "当然"

uma_ale.38.desc: "§Y她自信的站立在你的面前，转过身，金黄的长发随即飘动起来，睁开眼，你看到了她那晶莹剔透，饱含决心的眼睛，那如十字星般闪耀的瞳孔正紧紧地盯着你。接着她用手指了指自己§!\n“我叫杏目，是一名舰长。”\n§Y她短短几句话中透露出来的非凡气质很快感染了周围的马娘们§!\n“当然，我比较追求完美，毕竟只有完美无缺，才能让敌人......对手心服口服。\n§Y她眨了眨眼§!\n无论是赛跑，演练，我都绝绝绝绝绝绝绝绝绝对不会输！”"
uma_ale.38.a.a: "未来有什么打算"
uma_ale.38.a.a.resp: "“那当然是先习惯这里的生活啦！”\n§Y她轻轻一笑§!\n“但是，我赢过这里所有人。”"
uma_ale.38.b: "这里可是有很多高手的哦"
uma_ale.38.b.resp: "“那更有趣了，我很享受这样有趣的较量”"


