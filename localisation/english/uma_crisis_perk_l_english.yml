uma_ap_bc_main_evt_chain_title: "£uma_sd£StellarDerby Crisis: Kaleidoscope"
uma_ap_bc_main_evt_chain_desc: "£uma_sd£§gUmamusume: StellarDerby Content§!\n\n"
