uma_endcrisis_ec3_main_chain_title: "£uma_sd£星海德比末期危机:焦土"
uma_endcrisis_ec3_main_chain_desc: "当前天灾强度[]\n从平行位面来的马娘们，意图占领所有的土地，并将所有的星球的生命抹除作为殖民地以及矿场."
