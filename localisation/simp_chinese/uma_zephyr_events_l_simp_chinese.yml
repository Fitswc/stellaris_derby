uma_zephyr_unknown: "???"
uma_zephyr_name: "也文摄辉"

uma_zephyr.2.title: "Like the wind"
uma_zephyr.2.desc: "在调查恒星系的过程中，我们发现了一艘奇特的飞船。经过初步调查后显示，该船只带有浓厚的马娘设计风格，但是我们的图纸库中并没有该类飞船设计的记载。不过可以确定的是，船的主人肯定属于一位马娘。\n我们已经发起了对该船只的联络。"
uma_zephyr.2.a: "相信对方很快就会给予回应"


uma_zephyr.3.desc: "哎呀，没想到在这种地方也能遭遇来自故乡的风呢。那么，究竟是瑞风，还是梅雨的雨风呢？"
uma_zephyr.3.a: "请先告诉我你的身份，以及你出现在此地的原因"


uma_zephyr.4.desc: "失礼了。我的名字是也文摄辉。目前的话，正在追随风的指引，做一名宇宙旅行者。\n\n你调出了也文摄辉的相关资料，资料显示，对方曾是国内的知名G1赛马娘，在短距离、英里和中距离路线都取得了辉煌的成绩。不过，在竞赛生涯结束后，也文摄辉很快就销声匿迹，不再有任何相关信息流出。"
uma_zephyr.4.a: "风的指引？"

uma_zephyr.5.desc: "是的。从我很小的时候，我就能接受到来自风的讯息。风就是我的追求。\n在我退役之后，我决定像风一样，追寻自由自在的生活，去看风所看到的一切。于是，我学习了飞船的建造和驾驶技术，自己建造了这艘仄费罗斯号。仄费罗斯号不但完全符合所有马娘飞船的各项指标，还有武器系统用于自卫哦。"
uma_zephyr.5.a: "那么，之后你准备怎么办？"

uma_zephyr.6.desc: "当然是跟随风的指引，在无限宇宙中探索了。"
uma_zephyr.6.a: "虽然不知道风的指引是什么，不过我们可以允许你在太空中旅行"
uma_zephyr.6.b: "民间飞船是不能随意进入未知星系的。我们要求你立刻返航"
uma_zephyr.6.a.repo: "谢谢你，你真是一个像凯风一样温暖的人呢。那么，我就先行启程了，也许在宇宙旅行的过程中，我们还有再见面的一天。愿埃俄罗斯保佑你，再见了。"
uma_zephyr.6.b.repo: "呃……真是……糟糕透顶的暴风呢。那么，再见了。"


uma_zephyr.11.title: "Pothos"
uma_zephyr.11.desc: "在我们刚刚建成的观测站附近发现了一艘飞船。经过观察，确认为也文摄辉的仄费罗斯号。"
uma_zephyr.11.a: "真巧"

uma_zephyr.12.desc: "很高兴见到你，凯风一样的人。"
uma_zephyr.12.a: "也很高兴见到你。你在这里做什么呢？"
uma_zephyr.13.desc: "如你所见，我在观测这个土著文明。在你来到这里之前，我已经观察了这个年轻的文明许久。是否过去的我们就像现在的他们一样，懵懂，无知，但充满了朝气和对未知的渴望呢？而这份渴望，现在的我们是否仍然具备呢？"
uma_zephyr.13.a: "如果你愿意的话,欢迎来到我们的观测站"
uma_zephyr.14.desc: "真是谢谢你，你果然是一位如同凯风一样温暖的人呢。"
uma_zephyr.14.a: "不客气"
uma_zephyr.15.desc: "那么，就让我再观察这个年轻的文明一段时间吧。在之后我将继续我的旅程，我想我们肯定会再次见面的。愿尼奥尔德保护你。"
uma_zephyr.15.a: "那么我也不打扰你了，祝你一路顺风~"


uma_zephyr.21.desc: "好久不见呢，没想到能在这里见到你。"
uma_zephyr.21.a: "很开心见到你，也文小姐，为什么你会混在缇杨奇的队伍里？"

uma_zephyr.22.desc: "我在旅途中遇到它们的坟场呢，所有的缇杨奇都会在将死的时候游到这里。我想观察它们这场安静的告别仪式"
uma_zephyr.22.a: "你的飞船发送电波和缇杨奇们的相同呢,难道你们之间可以互相交流？"

uma_zephyr.23.desc: "是的。我已经观察了很久缇杨奇们的生活，大致摸清了缇杨奇们之间的交流方式。现在我可以通过仄费罗斯号与缇杨奇们进行简单的交流。"
uma_zephyr.23.a: "真是...厉害呢。"

uma_zephyr.24.desc: "也许终有一日风会指引我搞科研也说不定哦。哎呀，缇杨奇们已经走远了，我要去追赶它们了。再见，愿志那都彦保佑你。"
uma_zephyr.24.a: "再见"