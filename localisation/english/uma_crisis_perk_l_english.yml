menp_uma_objectives_desc: "Congratulations! You have now begun the Crisis Ascension.\nYou can now build progress through the Crisis Objectives and achieve final victory. Detailed instructions can be viewed in the overview."
uma_unlocks_menace_objectives: "Allows completion of §HObjectives§! to accumulate £uma_menace£§Y$uma_menace$§!.\n"
menp_uma_undertaker_desc: "To collect a vast amount of Realm Energy, we must have a large Umamusume population. Fortunately, for this problem, we can force xenos to join us."
menp_uma_undertaker_tt: "Allows the use of content unlocked by ['technology:tech_uma_tranform'] technology."
menp_uma_base_breaker_desc: "To quickly cut off the enemy's source of support, we must strike fast and directly target starbases capable of ship production."
menp_uma_relentless_aggression_desc: "For our common goal, we can wager everything."
menp_uma_easily_replaced_desc: "We have modularized our ship production line: we can now build a standard-spec ship at a faster rate."
menp_uma_death_from_above_desc: "The collection efficiency of Realm Energy has now been greatly improved."
menp_uma_death_from_above_tt: "Realm Energy produced by Umamusume will now increase."
menp_uma_ship_chipper_desc: "Thanks to our improvements to weapons and ships, both the quantity of ammunition they can carry and the explosive charge of that ammunition have been greatly increased. We have made our soldiers understand that our weapons factories can produce several times more ammunition each day than before."
menp_uma_paid_in_ambition_desc: "Due to the demands of high-intensity warfare, we have abandoned the cumbersome maintenance inspection procedures of the past. Although this carries some risk, our maintenance costs have indeed fallen considerably."
menp_uma_star_eater_desc: "Today, we shall revisit the romance of heavy firepower and giant cannons."
menp_uma_star_eater_tt: "Heavy artillery ship sections can be used."
menp_uma_megastructure_desc: "After a long period of Realm Energy collection, we can finally activate this device that has existed in our galaxy for so long. Hopefully, we are ready."
menp_uma_megastructure_tt: "Start the final stage of the crisis. Realm Energy will be consumed to activate the device. Hopefully, we are ready."


crisobj_uma_destroy_country_name: "Destroy Empires"
crisobj_uma_destroy_country_desc: "The collapse of civilizations can improve our efficiency in processing Realm Energy.\n\nDestroy other empires to gain progress rewards."
crisobj_uma_pugre_name: "Assimilate/Purge Xenos"
crisobj_uma_pugre_desc: "Since we need a vast amount of Realm Energy, population size has become extremely important. Of course, eliminating them all is also a decent option.\n\nAssimilate pops of other species through Transform, or process them using the Huskfire purge method, to gain progress rewards."
crisobj_uma_realm_power_natural_name: "§YRealm Energy§!"
crisobj_uma_realm_power_natural_desc: "Naturally collect the energy generated by the Realms of Umamusume.\n\nMore Umamusume will produce more Realm Energy."
crisobj_uma_destroy_fleet_name: "Destroy Fleets"
crisobj_uma_destroy_fleet_desc: "Destroying fleets can improve our efficiency in processing xeno Realm Energy.\n\nDestroy the fleets of other empires to gain progress rewards."
crisobj_uma_destroy_starbases_name: "Destroy Starbases"
crisobj_uma_destroy_starbases_desc: "Starbases are the anchors of empires. Removing these anchors can improve our efficiency in processing xeno Realm Energy.\n\nDestroy starbases to gain progress rewards."
crisobj_uma_purge_pops_name: "Transform Other Species into Umamusume"
crisobj_uma_purge_pops_desc: "More Umamusume!\n\nTransform other species into Umamusume to gain progress rewards."
crisobj_uma_conquer_worlds_name: "Occupy Planets"
crisobj_uma_conquer_worlds_desc: "Occupy other planets so that we can obtain more resources capable of producing Realm Energy.\n\nOccupy planets to gain progress rewards."

##Ascension Perk
ap_uma_become_the_crisis: "Shatter the Mirror"
ap_uma_become_the_crisis_desc: "What lies hidden behind the many phenomena once caused by Realms? Today, we will unravel this secret through our own bodies."

