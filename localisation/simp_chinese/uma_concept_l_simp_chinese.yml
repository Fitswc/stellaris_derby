l_simp_chinese:
concept_uma_three_godnesses_concept: "三女神"
concept_uma_three_godnesses_concept_desc: "“三女神”，虽然在不同的文化圈内的含义存在些许差别。但几乎所有马娘都认同，她们是三位女神，是马娘族群的播种者和世界的创造者。尽管在以前有不少科学家认为这个概念只是宗教法庭编出来糊弄人的假话，但随着对这个世界的了解愈发深刻，马娘们认为“三女神”可能是古代的高科技文明实体....但，谁知道呢?"

concept_uma_race_course_concept: "基础赛场"
concept_uma_race_course_concept_desc: "完全符合基础标准而落成的赛场，虽不曾担任过任何高规模比赛的赛场，但以往的无数先辈们都是从这条跑道开始，跑向属于自己的辉煌时段"

concept_uma_three_godnesses_deposit: "三女神遗迹"
concept_uma_three_godnesses_deposit_desc: "在这里，传说是三女神所留下来的遗迹静静地矗立着，不知多少个日夜。"

concept_uma_cystal_carrot_mine: "水晶萝卜矿脉"
concept_uma_cystal_carrot_mine_desc: "或许是我们受到了三女神的眷顾，无数闪闪发光的水晶萝卜正静静地躺在这片矿脉中，随时都可以进行大规模的开采。"

concept_uma_concept_crystal_carrot: "水晶萝卜"
concept_uma_concept_crystal_carrot_desc: "§g一种神奇的矿物，似乎拥有多种用途。虽然不知道为什么这水晶能自然生长成这么粗的胡萝卜形状，但是感觉很有用。§!\n\n 咳咳，水晶胡萝卜是一种较稀有的高级资源。\n\n主要用于['concept_component'], ['concept_building'], ['concept_job'] 的建造和维护等。"

concept_uma_member_f_concept: "F"
concept_uma_member_f_concept_desc: "于mod组青黄不接时加入，此后数年间成为事实上唯一的代码维护者，\n 如今mod能够发展到今日之地步，F功不可没。 \n ————挽狂澜于既倒，扶大厦之将倾。 \n ————很可爱，cos照也很可爱  \n ————不过是个笨狗罢了 \n ————咬死你哦!"

concept_uma_member_564_concept: "格鲁希"
concept_uma_member_564_concept_desc: "缔造了海量剧情记录的前线档案员（文案），马圈星海著名学者，以其灵动的文笔和对事件深邃的洞察而闻名全银河。 \n ————“请支持赛马娘小说史谢谢喵！”"

concept_uma_member_tamatsuru_concept: "玉鹤"
concept_uma_member_tamatsuru_concept_desc: "早期贡献者，元老之一。在音乐方面展现出了卓越的才能，为这段群星之旅奏响了早期的序曲。 \n ————实际上则是FPS星际战场的特级神射手"

concept_uma_member_kagami_concept: "雲鏡子"
concept_uma_member_kagami_concept_desc: "早期文案,豚鼠君,特別高等速碼科。 \n ————介绍？你随便写吧。"

concept_uma_member_rabbit_concept: "兔兔"
concept_uma_member_rabbit_concept_desc: "代码。会和赛马娘抢胡萝卜吃。 \n ——传闻是洛洛不可分割的“半身”。 \n ————这群小屁孩上课又看手机！"

concept_uma_member_ling_concept: "棂"
concept_uma_member_ling_concept_desc: "尽职尽责(也许吧)的Wiki大图书馆维护者。\n 坊间传闻似乎与F有着“绝不一般”的深厚羁绊……（本人对此极度否认并随时准备跃迁逃离）。"

concept_uma_member_nrs_concept: "年若水"
concept_uma_member_nrs_concept_desc: "早期贡献者。在漫长的离线后重新连接入主机，再次接手部分代码的更新与维护工作。"

concept_uma_member_tom_concept: "TOM"
concept_uma_member_tom_concept_desc: "早期代码与元老之一。 \n 曾立下汗马功劳，已进入半隐退的休眠状态。"

concept_uma_member_luo_concept: "洛洛"
concept_uma_member_luo_concept_desc: "F教核心传教士，热衷于在宇宙各处传播F的美好。 \n 目白阿尔丹单推人。 \n 兔兔的半身。"

concept_uma_member_doc_concept: "文博书轩"
concept_uma_member_doc_concept_desc: "文案。 喜欢帅气的马娘。"

concept_uma_member_digtal_concerpt: "数码(不是爱丽那个)"
concept_uma_member_digtal_concept_desc: "主催，奠定了一切的元老。\n 不过现在其个人信号总是被侦测到频繁活跃于隔壁“钢铁雄心4”与“欧陆风云5”星系群中。"

concept_uma_member_white_concept: "白刃"
concept_uma_member_white_concept_desc: "大不列颠在留，本MOD首个拓展子模块的缔造者，疑似【曼城茶座】在现实维度的三维投影实体。"

