 ##Building 
 building_uma_tg_alloys_maker_Automatic: "TG-自动化合金制造厂"  <"TG-Automated Alloy Manufacturing Factory">  #NT!
 building_uma_tg_alloys_maker_Automatic_desc: "该合金工厂已经实现自动化，只需要通电就可以源源不断地产出大量的合金\n§R建筑带有自动止损机制：在所需维护资源储量<=400时将自动禁用建筑！§!"  <"The alloy factory has been automated and can continuously produce a large amount of alloys by simply powering up.">  #NT!
 building_uma_tg_alloys_maker_Automatic_tt: "本建筑的产出为:基础值(8£alloys£)*(§Y收入的£energy£能量*0.03+总£pop£人口*0.1§!)\n维护为:基础值(5£minerals£,0.3£uma_crystal_carrot£)*(§Y收入的£energy£能量*0.03+总£pop£人口*0.1§!)"  <"The output of this building is: base value (8£alloys£)*(§Y收入的£energy£能量*0.03+总£pop£人口*0.1§!)\n Maintenance is: base value (5£minerals£,0.3£uma_crystal_carrot£)*(§Y收入的£energy£能量*0.03+总£pop£人口*0.1§!)">  #NT!
 building_uma_tg_alloys_maker_Automatic_2: "TG-自动化合金制造厂GenⅡ"  <"TG-Automated Alloy Manufacturing Factory GenⅡ">  #NT!
 building_uma_tg_alloys_maker_Automatic_2_desc: "该合金工厂已经实现自动化，只需要通电就可以源源不断地产出大量的合金\n§R建筑带有自动止损机制：在所需维护资源储量<=400时将自动禁用建筑！§!"  <"The alloy factory has been automated and can continuously produce a large amount of alloys by simply powering up.">  #NT!
 building_uma_tg_alloys_maker_Automatic_2_tt: "本建筑的产出为:基础值(12£alloys£)*(§Y收入的£energy£能量*0.03+总£pop£人口*0.1§!)\n维护为:基础值(8£minerals£,0.5£uma_crystal_carrot£)*(§Y收入的£energy£能量*0.03+总£pop£人口*0.1§!)"  <"The output of this building is: base value (12£alloys£)*(§Y收入的£energy£能量*0.03+总£pop£人口*0.1§!)\n Maintenance is: base value (8£minerals£,0.5£uma_crystal_carrot£)*(§Y收入的£energy£能量*0.03+总£pop£人口*0.1§!)">  #NT!
 building_uma_tg_custom_goods_productor: "TG-自动化消费品工厂"  <"TG-Automated Consumer Products Factory">  #NT!
 building_uma_tg_custom_goods_productor_desc: "该消费品工厂已经实现自动化，只需要通电就可以源源不断地产出大量的£consumer_goods£消费品\n§R建筑带有自动止损机制：在所需维护资源储量<=400时将自动禁用建筑！§!"  <"The consumer goods factory has been automated and can continuously produce a large number of consumer goods\n§R建筑带有自动止损机制：在所需维护资源储量<=400时将自动禁用建筑！§ if you only need to power on!">  #NT!
