l_simp_chinese:


uma_duramente_anomoly: "战争遗骸"
uma_duramente_anomoly_desc: "在三女神遗迹考古完毕后我们得到的不仅仅是遗留下的知识，我们还从中解密出了一个位于领地内的神秘坐标。通过对坐标的追踪我们发现了一颗平平无奇的星球。"

uma_duramente_relic: "远古残骸"
uma_duramente_relic_desc: "我们的科研船传感器对该行星扫描时意外发现了星球上存在非自然存在的的合金碎片，该合金与现代舰船使用的合金几乎别无二致，科学家猜测这颗行星曾经发生过大规模会战，所以才会遗留下如此庞大数量的的合金碎片。\n经过更加精细的扫描，我们竟然在星球表面下方发现了类似舰船的构造！\n难道是远古避难所吗？"

uma_duramente.3.desc: "我们的科研船传感器对该行星扫描时意外发现了星球上存在非自然存在的的合金碎片，该合金与现代舰船使用的合金几乎别无二致，科学家猜测这颗行星曾经发生过大规模会战，所以才会遗留下如此庞大数量的的合金碎片。\n经过更加精细的扫描，我们竟然在星球表面下方发现了类似舰船的构造！\n难道是远古避难所吗？"
uma_duramente_sp_everywhere: "远古残骸"
uma_duramente_sp_everywhere_DESC: "我们的科研船传感器对该行星扫描时意外发现了星球上存在非自然存在的的合金碎片，该合金与现代舰船使用的合金几乎别无二致，科学家猜测这颗行星曾经发生过大规模会战，所以才会遗留下如此庞大数量的的合金碎片。\n经过更加精细的扫描，我们竟然在星球表面下方发现了类似舰船的构造！\n难道是远古避难所吗？"
uma_duramente.3.title: "到处都是"
uma_duramente.3.a: "真的假的？"
uma_duramente.3.b: "稀奇古怪的事可见多了"

uma_duramente.4.name: "纳米合金飞船"
uma_duramente.4.desc: "我们的科学家绝对没有见到过这种战舰设计，它们太奇妙了！像是有生命一样，哪怕是已经过去了几千年！\n当我们破开一道铁壁之后它仅仅用了一天就恢复了，或许它们是一种记忆纳米合金，或许专家们要速战速决了，否则很可能会被困在这些战舰遗骸里"
uma_duramente.4.a: "或许一枚炸弹可以帮助我们"

uma_duramente.5.name: "Non-exist"
uma_duramente.5.desc: "太恐怖了！越往下深入越觉得心神不安，像是有谁在看着我们一样。一些专家甚至会在安静休息的时候听到奇异的声音。尽管如此，我们还是选择继续接近地下建筑的入口；或许几天后我们就可以破开最后的阻碍，进入地下设施。"
uma_duramente.5.a: "继续前进"

uma_duramente.6.name: "门后"
uma_duramente.6.desc: "钻机成功破开了地下建筑的大门，很难想象如此巨大的门后的通道竟然只容得一人通行。在向前探索的路上，专家们看到了许多倒在隧道中且被金属同化了的骨骸，她们或需生前都是马娘；这番景象让专家们不由得陷入沉思：这些金属为什么会同化这些马娘士兵呢？ 这些马娘士兵是死后被同化，还是说同化后才死亡的？"
uma_duramente.6.a: "太匪夷所思了"

uma_duramente.7.name: "生活的痕迹"
uma_duramente.7.desc: "道路尽头豁然开朗，我们的专家在里面发现了马娘的生活痕迹,并且痕迹看起来很新。这可能说明，在我们刚开始挖掘的时候，生活在这里的生物就察觉到异常并提前离开了！而在现场发现的设备皆由电力驱动，而电力来源是战舰内尚未损毁的冷聚变电池；食物则是由藻类压缩而来。这里的主人离开得似乎很匆忙，不知道会不会再回来呢？"
uma_duramente.7.a: "那就守株待兔"
uma_duramente.7.b: "四处找找"

uma_duramente.8.name: "暗道里"
uma_duramente.8.desc: "驻守的安保队在隐蔽的暗道中发现了一位昏厥的马娘！经过专家检查过后发现她昏迷的原因是饥饿与脱水，而令人诧异的是，在血清检测重，发现相较于现代马娘的因子组而言，这名马娘的因子似乎大有不同。她在暗道里躲了不知道多久，以至于暗道里的藻类都被她吃光了！\n将其带回特雷森进行进一步医疗固然是一种选择，但是现代社会中的各类微生物和病毒或许对她的身体来说就是一项严峻的挑战。"
uma_duramente.8.a: "把她带回来吧"
uma_duramente.8.b: "给她注射葡萄糖，留一些吃的，然后离开"


uma_duramente.10.title: "远古萝卜"
uma_duramente.10.desc: "送出那位马娘以后我们的专家便可以大展拳脚了！将整个战舰遗址研究过后我们发现里面蕴含的科技比我们现阶段的要高深的多，而从中我们发现了一颗特殊的水晶萝卜，它能将同质的水晶萝卜能量放大！\n\n现在，那名马娘正在被我们精心照顾，过不了多久大概就能醒过来了吧"
uma_duramente.10.a: "意义重大"

uma_duramente.11.title: "旧日马娘"
uma_duramente.11.desc: "那名马娘在我们的悉心照料下终于苏醒了过来。面对陌生的环境，她似乎很平静，待到太阳将落时分，她要求拜见[Ruler.GetTitle]"
uma_duramente.11.a: "当然可以，虽然我想吃饭"

uma_duramente.12.desc: "……你们是新生的马娘文明？信奉着什么？三女神……还是……"
uma_duramente.12.a: "当然；另外，我们是在三女神遗址内标记的一个遗骸下发现了你"
uma_duramente.13.desc: "三女神遗址…看来时间已经过去几万年了…既然你们是女神的后代，那么也便是我当年为之战斗的意义，虽然前文明已经消失，但火种遗留了下来。我在遗骸下生活的早已不知晓时间观念了……但现在，或许我能做些更有意义的事情。能让我留下来么？如果相信女神的话…就让我以舰队司令的身份留下吧。以及，我的名字叫做大鸣大放。"
uma_duramente.13.a: "三女神让我们相遇，[This.GetName]欢迎你的加入"
uma_duramente.13.b: "不，女士，特雷森可没有让老年人上场的规矩。"
uma_duramente.13.b.tt: "获得帝国修整：危机思想论\n进入战争时获得加成: \n$mod_country_unity_produces_mult$+60\n$mod_planet_jobs_alloys_produces_mult$+20%\n$mod_planet_jobs_consumer_goods_produces_mult$+20%"

