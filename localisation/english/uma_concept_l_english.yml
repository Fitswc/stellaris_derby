l_english:
 concept_uma_three_godnesses_concept: "Three goddesses"  #NT!
 concept_uma_three_godnesses_concept_desc: "Although the meaning of the "Three Goddesses" is slightly different in different cultural circles. But almost all Ma Niang agree that they are three goddesses, the sowers of the Ma Niang tribe and the creator of the world. Although many scientists used to think that this concept was just a lie that was made up by religious courts, as they understand the world more and more profoundly, the Ma girls believed that the "Three Goddesses" might be an ancient high-tech civilization entity... But who knows?"  #NT!
  
 concept_uma_race_course_concept: "Basic stadium"  #NT!
 concept_uma_race_course_concept_desc: "Although the stadium that is fully in line with the basic standards has never served as a stadium for any high-scale competition, countless ancestors in the past have started from this track and run towards their own brilliant period."  #NT!
  
 concept_uma_three_godnesses_deposit: "The ruins of the three goddesses"  #NT!
 concept_uma_three_godnesses_deposit_desc: "Here, the legendary ruins left by the three goddesses stand quietly, for countless days and nights."  #NT!
  
 concept_uma_cystal_carrot_mine: "Crystal carrot veins"  #NT!
 concept_uma_cystal_carrot_mine_desc: "Perhaps we are favored by the three goddesses, and countless shining crystal radishes are lying quietly in this mineral vein, and can be mined on a large scale at any time."  #NT!
  
 concept_uma_concept_crystal_carrot: "Crystal Carrot"
 concept_uma_concept_crystal_carrot_desc: "§gA magical mineral seems to have multiple uses. Although I don't know why this crystal can naturally grow into such a thick carrot shape, it feels very useful.§!"
  
 concept_uma_member_f_concept: "F"
 concept_uma_member_f_concept_desc: "Author; Main maintainer"
 concept_uma_member_564_concept: "Gruxi"
 concept_uma_member_564_concept_desc: "A frontline archivist and writer who has created an enormous number of story records. A renowned scholar in the Umamusume community, celebrated across the galaxy for a lively writing style and keen insight into events.\n ————“Please support the history of Umamusume fiction, meow!”"
 concept_uma_member_tamatsuru_concept: "Tamatsuru"
 concept_uma_member_tamatsuru_concept_desc: "An early contributor and one of the veterans. They demonstrated exceptional musical talent, composing the opening movement of this Stellaris journey.\n ————Actually an ace sharpshooter in FPS interstellar battlefields."
 concept_uma_member_kagami_concept: "Kagamiko"
 concept_uma_member_kagami_concept_desc: "An early writer, guinea pig, and specialist in extremely high-speed coding.\n ————An introduction? Write whatever you like."
 concept_uma_member_rabbit_concept: "Rabbit"
 concept_uma_member_rabbit_concept_desc: "Code. Competes with Umamusume for carrots.\n ——Rumored to be Luo Luo's inseparable “other half”.\n ————These brats are checking their phones in class again!"
 concept_uma_member_ling_concept: "Ling"
 concept_uma_member_ling_concept_desc: "The diligent (perhaps) maintainer of the Wiki Great Library.\n Rumor says she has an “anything but ordinary” bond with F... (which she vehemently denies, always ready to jump away)."
 concept_uma_member_nrs_concept: "Nian Ruoshui"
 concept_uma_member_nrs_concept_desc: "An early contributor. After a long absence, they reconnected to the host and resumed updating and maintaining parts of the code."
 concept_uma_member_tom_concept: "TOM"
 concept_uma_member_tom_concept_desc: "An early coder and one of the veterans.\n Once rendered great service; now in a semi-retired state of hibernation."
 concept_uma_member_luo_concept: "Luo Luo"
 concept_uma_member_luo_concept_desc: "A core missionary of the F cult, keen to spread F's splendor throughout the universe.\n A devoted Mejiro Ardan fan.\n Rabbit's other half."
 concept_uma_member_doc_concept: "Wenbo Shuxuan"
 concept_uma_member_doc_concept_desc: "A writer. Likes handsome Umamusume."
 concept_uma_member_digtal_concept: "Digital (not Agnes)"
 concept_uma_member_digtal_concept_desc: "The organizer and founding veteran who laid the foundation for everything.\n Recently, their signal is often detected active in the neighboring “Hearts of Iron IV” and “Europa Universalis V” galaxy clusters."
 concept_uma_member_white_concept: "White Blade"
 concept_uma_member_white_concept_desc: "A resident of Great Britain and creator of this mod's first expansion submodule; possibly a three-dimensional projection of Manhattan Cafe in the real dimension.\n ————British tea tastes terrible."
  
  
  
  
  
