 ############################### 
 civic_umamihonobourbon: "Bourbon powered solar furnace"
 civic_umamihonobourbon_desc: "At the age of 10, Mihono Bourbon, known as a genius mechanic, was nearly killed by the wild machinery of the experiment to protect her best friend. When she awoke from her coma and unrealistically stroked her cheek, the cold touch instantly brought her to consciousness. To save her, scientists had to top the extremely low fit to the mechanical transformation of Bourbon's body, and the result was astonishingly successful. The past of the previous decade was taken away by the machinery, and the future of the future was given by the machinery. Her affinity with machinery gave Bourbon a new level of ability and understanding as a mechanic, and she became the leader of the mechanical industry in that era, and her research into the powered solar furnace had a profound impact in the later era of exploration of the stars."
 civic_umasymbolirudolf: "Symboli Rudolf's Interstellar Student Union"
 civic_umasymbolirudolf_desc: "She was a natural leader, a fact that would have been acutely felt by any Umamusume who knew Rudolf. This talent was demonstrated in her childhood, and when she entered the doors of Tresen with excellent grades in many areas and was undoubtedly elected student president, a new era was destined to dawn, a new era for the legend who was given the name "Emperor". With a bang in the year 2200, the ship with the FTL engine disappeared into the universe and opened the curtain of the Star River Era. Rudolf became the first student chairman of this initial civilization to enter the universe, and is destined to carve the glory of the Umamusume civilization in the history of the universe."
 civic_umaagnestachyon: "The scientific dominance of Agnes Tachyon"
 civic_umaagnestachyon_desc: "First of all, for the record, the scientist Agnes Tachyon has not been heard from for four years after resigning from her position, so if anyone gets a clue about her anywhere, please report it at the first opportunity. Genius is a term that was perhaps coined to describe Agnes Tachyon. The children were curious about this maverick peer, but intimidated by the "science" she often poured out on them, which they knew nothing about. In the 12th year of her lonely life, Agnes Tachyon met a Umamusume who was willing to enter her heart. Perhaps it was because she was the first person of her age to talk to her, or perhaps she was even willing to accompany each other as her experimental subjects ...... In any case, from then on, experimentation gradually began to cease to be all that Sachiko had. Then one day at sunset, Umamusume made a pact with Tachyon - when you become the greatest scientist in the world, I will prepare a gift for you."
 civic_umacurrenchan: "Were you just looking at another woman?"
 civic_umacurrenchan_desc: "Could it be that I'm not cute? Hmmm ~? The charm of Curren is unstoppable, and now everyone in the galaxy can appreciate this cuteness."
 civic_umafujikiseki: "The principle of equal distribution of apples"
 civic_umafujikiseki_desc: "The standard management of the Fuji dormitory manager ensures that everyone is treated fairly and that the Umamusume don't go hungry because of uneven distribution, although some of the big appetites are outrageous (scratch)."
 civic_umamatikanefukukitaru: "Traincent Face Reading Master"
 civic_umamatikanefukukitaru_desc: "The sacred psychic crystal ball of the pending cum Fulai guides each of us, from which the face of each person can be read, and those who are not satisfied are often invited for a day trip to the basement."
 civic_umasupercreek: "Traincent Mom's Kindergarten"
 civic_umasupercreek_desc: " Super Creek Mama is full of a reassuring aura and everyone is lingering in love and peace. Baby, honest, sent stroller by stroller!"
 civic_umanicenature: "Looking out of the corner of your eye"
 civic_umanicenature_desc: "Miss Nature's excellent stare-down makes the secrets of other races visible. My power as the Red Skill Arch Chancellor is unlimited."
 civic_umazennorobroy: "The great library of Zenno Rob Roy"
 civic_umazennorobroy_desc: "Zenno Rob Roy loves to read and collect books of all kinds, from ancient legends to scientific and technological readings. By funding the large library she has built, we have been able to gain a lot of useful knowledge from it."
 civic_umamayanotopgun: "Mayano Top Gun Fleet Academy"
 civic_umamayanotopgun_desc: "As one of the few Umamusume with an Air Force background, Heavy Artillery has many unique insights into fleet operations. Her help can significantly enhance the combat capability of our fleet."
 civic_umaagnesdigital: "Umamusumes' DD Friendship Association"
 civic_umaagnesdigital_desc: "As a glorious DD head, Digital has an overwhelming affection for all Umamusume. Now, she wants to raise a fellow Umamusume association so that more Umamusume can recognize the sparkle in other Umamusumen as she does."
 civic_umabamboomemory: "Bamboo Memory's Disciplinary Committee"
 civic_umabamboomemory_desc: "Bamboo Memory has a sense of justice beyond the ordinary, and under her inspiration, a wind discipline squad was established to maintain a positive atmosphere in society. With their efforts, the Umamusume will lead a peaceful life."
 civic_umafinemotion: "Fine Motion's Ministry of Foreign Affairs"
 civic_umafinemotion_desc: "As the Queen's daughter, Fine Motion is well versed in diplomatic etiquette and tactics. Through her "ramen diplomacy", we have been able to maintain good relations with other countries, and we have been able to make our way around the Galaxy stage."
 civic_umaeishinflash: "Blitz Fencing Training"
 civic_umaeishinflash_desc: "The blood of war is in the body of Eishin Flash, a mare who can make all enemies pale in comparison with the sword. In addition, she also creatively introduced "blitzkrieg" into our army, which greatly enhanced the fighting ability of our army."
 civic_tooltip_umaeishinflash_effects: "If we choose this national policy, it will allow us to recruit special armies:§YBlack Legion§!"
 civic_umasmartfalcon: "Smart Falcon's Idol Project"
 civic_umasmartfalcon_desc: "Smart Falcon used to have a dream to stand on the highest stage and convey the charm of an idol to everyone. Now, she has become a famous idol and is trying to help more youngsters who want to be idols to realize their dreams."
 civic_umasatonodiamond: "Satono Corporate Group"
 civic_umasatonodiamond_desc: "As the daughter of the Satono Foundation, Light Diamond has spread its branches to every corner of every planet. And these well-managed and highly competitive companies are breathing new life into our economy."
 civic_umaairgroove: "Air Groove's Government Aid"
 civic_umaairgroove_desc: "As expected of the "empress", as Umamusume calls her, she is one of the best in the country in terms of her ability to handle government affairs (as long as she is not told jokes). By inviting her to join our administration, our ability to handle all kinds of complicated affairs inside and outside the country will be enhanced exponentially."
  
 civic_uma_vivlos_shopping: "Vivlos的上~流购物观"
 civic_uma_vivlos_shopping_desc: "呼呼~超上流的说。该国的人民似乎更加喜欢消费，这大大提升了我们的群众消费力，促进经济的发展。"
  
 civic_uma_ayb_star_watcher: "Umamusume观星者"
 civic_uma_ayb_star_watcher_desc: "作为一名特雷森学院的学生，爱慕织姬似乎对星星有着无限的追求以及拥有丰厚的知识。"
  
 civic_uma_cheval_civillian_workshop: "Cheval Grand的研究小作坊"
 civic_uma_cheval_civillian_workshop_desc: "虽然性格内向，但仍然向着自己心中的‘伟大’前进。虽然在特雷森的选拔中遗憾落败，但是她仍然坚持自己的梦想..."
  
 civic_uma_matikanetannhauser_radio: "Matikanetannhauser的小广播"
 civic_uma_matikanetannhauser_radio_desc: "可爱的声音？神奇的魔法！这个正点播放的访谈音乐节目似乎使Umamusume们工作的激情上升了？"
  
 civic_uma_luckey_geo_training: "Copano Rickey的风水课堂"
 civic_uma_luckey_geo_training_desc: "水火相克！通过简单的风水预测，便可知道太空风暴的信息。嗯...历奇似乎还说过风水还能把风暴叫出来什么的？"
  
 civic_uma_win_variation: "Win Variation的主角之心"
 civic_uma_win_variation_desc: "可恶！我不仅要证明谁是主角，还要把你搞得乱七八糟！ 可爱的外表下是不屈的内心，对命运的宣战。"
  
 auth_trainingcenter: "Traincent College"
 auth_trainingcenter_desc: "The academy that provides the top environment for Umamusume and guides their development. Elite Umamusume discusses state affairs at the academy congress."
 UMAMUSUME_TRANIING_CENTER: "The College Representative Assembly elects new College leaders, with the possibility of re-election in case of emergency."
  
  
 gov_uma_country: "Traincent Interstellar Academy"
 gov_uma_country_desc: "The civilization dominated by the Traincent Institute, which had provided top facilities for Umamusume on the planet, now they are looking to the Star Ocean."
  
 gov_uma_country_spiritualist: "Privy Council of Traincent"
 gov_uma_country_spiritualist_desc: "Influenced by Matikanefukukitaru, Traincent College follows the will of God in every step they take."
  
  
 gov_uma_country_militarist: "Traincent War Council"
 gov_uma_country_militarist_desc: "Militarized Traincent College, their iron shoes will tread the sea of stars。"
  
 gov_uma_country_authoritarian: "Chief Council of Traincent"
 gov_uma_country_authoritarian_desc: "With the enhanced power of the student government, all aspects of Traincent gained greater efficiency。"
  
 gov_uma_country_xenophob: "Traincent Darwin Society"
 gov_uma_country_xenophob_desc: "The main objective is to create a Star Ocean where only the top racing maids exist in the Traincent Association, and they will ensure this by all means."
  
 gov_uma_country_egalitarian: "Traincent Utopia"
 gov_uma_country_egalitarian_desc: "Traincent College strives to ensure that its first-class facilities can serve anyone, regardless of race."
  
 gov_uma_country_xenophile: "Traincent Interstellar Exchange Gathering"
 gov_uma_country_xenophile_desc: "The Traincent Institute, which wishes to seek common ground and friendly exchange among civilizations."
  
 gov_uma_country_pacifist: "Traincent Peace Council"
 gov_uma_country_pacifist_desc: "The Traincent Institute, led by the peace-loving Horsewoman, is dedicated to the spread of peace."
  
 gov_uma_country_materialist: "Traincent Scientific Research Society"
 gov_uma_country_materialist_desc: "The Traincent Society, dominated by Umamusume who never stop on the road to knowledge and truth."
  
  
 ########################################################### 
 UMA_SPECIES_CAN_NOT_BE_HIVE_MIND: "Umamusume, as independent and spiritual beings, are unable to use hive-like government structures."
 UMA_SPECIES_CAN_NOT_BE_CORPORATE: "The Umamusume's love of running and freedom by nature makes it impossible for them to be ruled by a giant corporation."
  
  
 civic_uma_my_venus_park: "My Venus Park"
 civic_uma_my_venus_park_desc: "Venus Park-chan was so cute! I haven't been able to stop watching her face every day!!!"
 civic_uma_my_venus_park_effects: "Venus Park will be the ruler ,but we can't get Venus Park in events."
  
  
  
 civic_uma_win_variation_tt: "\n\n§Y在前10年内:\n在主动进攻其他国家时将获得以下增益§!\n-生物飞船每月生长: §G+90%§!\n-宣称影响力花费: §G-90%§!\n-军用飞船建造速度: §G-80%§!\n\n\n§R后续游戏过程中该理念仅能被移除§!"
 civic_uma_win_variation_tt_only_remove: "§R后续游戏过程中该理念仅能被移除§!"
 uma_variation_early_war_buff: "我才是主角！"
