uma_marking.4.desc: "现在您存档的£uma_sd£星海德比版本是[event_target:global_event_country.UMA_SD_VER]。哼哼，似乎旧于现在的版本哦。本次版本更新内容如下：\n\n添加了三个末期天灾\n添加了领袖合成系统。\n添加了政策:自动亚种合并\n修复了若干bug，当然免不了的是创建了一堆bug! \n\n不过啊，似乎对旧版本存档没有影响哦，祝你游玩愉快，谢谢支持(爱心)"
