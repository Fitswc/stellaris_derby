menp_uma_objectives_desc: "恭喜！你现在已经开启了灾飞\n现在可以通过天灾目标中的内容积攒进度条，达成最终的游戏胜利。详细说明可以前往总览进行查看"
uma_unlocks_menace_objectives: "允许完成§H目标§!累积£uma_menace£§Y$uma_menace$§!。\n"
menp_uma_undertaker_desc: "要收集海量的领域能，我们必须拥有大量的马娘人口。幸运的是对于这个问题，我们可以强迫异种加入我们。"
menp_uma_undertaker_tt: "允许使用['technology:tech_uma_tranform']科技解锁的内容"
menp_uma_base_breaker_desc: "要快速掐断敌人的支援来源，我们必须速战速决，直接针对具有舰船生产能力的恒星基地入手。"
menp_uma_relentless_aggression_desc: "为了我们的共同目标，我们可以赌上一切。"
menp_uma_easily_replaced_desc: "我们对我们的舰船生产流水线进行了模块化改造：现在我们可以以更快的速度制造一艘正常规格的舰船。"
menp_uma_death_from_above_desc: "现在领域能的收集效率得到了大大提升"
menp_uma_death_from_above_tt: "现在赛马娘产出的领域能将翻倍"
menp_uma_ship_chipper_desc: "由于我们对武器和舰船的改良，现在他们能够携带的弹药的数量和弹药装药量得到了大大的提升。我们让我们的士兵认识到，我们的武器工厂一日能够产出数倍于以往的弹药。"
menp_uma_paid_in_ambition_desc: "由于高强度的战争需求，我们抛弃了以往的繁文冗节的维修检查程序。虽然存在一定的风险，但我们维修的成本确是降低了不少。"
menp_uma_star_eater_desc: "今天我们将重新回顾重火力和巨炮的浪漫。"
menp_uma_star_eater_tt: "可以使用所有星球级兵器"
menp_uma_megastructure_desc: "经过长时间的领域能收集，现在我们终于能够启动这个存在我们星系内已久的装置。希望我们已经准备就绪了。"
menp_uma_megastructure_tt: "启动天灾最后阶段。将消耗领域能激活装置。希望我们已经准备就绪了"


crisobj_uma_destroy_country_name: "毁灭帝国"
crisobj_uma_destroy_country_desc: "文明的覆灭可以提升我们处理领域能的效率。\n\n摧毁其他帝国来获得进度奖励。"
crisobj_uma_pugre_name: "同化/净化异种"
crisobj_uma_pugre_desc: "在我们需要大量领域能的情况下，人口数量变得十分重要，当然，把他们全都消灭也是一种不错的选择。\n\n以Transform来同化或是使用残躯化火净化方式处理其他物种的人口来获得进度奖励。"
crisobj_uma_realm_power_natural_name: "§Y领域能§!"
crisobj_uma_realm_power_natural_desc: "自然收集赛马娘们领域产生的能量。\n\n越多赛马娘产生的领域能越多。"
crisobj_uma_destroy_fleet_name: "摧毁舰队"
crisobj_uma_destroy_fleet_desc: "摧毁舰队可以提升我们处理异种领域能的效率。\n\n摧毁其他帝国的舰队来获得进度奖励。"
crisobj_uma_destroy_starbases_name: "摧毁恒星基地"
crisobj_uma_destroy_starbases_desc: "恒星基地是帝国的锚点。移除这些锚点可以提升我们处理异种领域能的效率\n\n摧毁恒星基地来获得进度奖励。"
crisobj_uma_purge_pops_name: "转化其他物种到马娘"
crisobj_uma_purge_pops_desc: "更多马娘！\n\n将其他物种转化为马娘来获得进度奖励。"
crisobj_uma_conquer_worlds_name: "占领星球"
crisobj_uma_conquer_worlds_desc: "占领其他星球以便我们能够获得更多能够产出领域能的资源\n\n占领星球来获得进度奖励。"

