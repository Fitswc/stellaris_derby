 building_uma_tg_custom_goods_productor_2: "TG-自动化消费品工厂GenⅡ"  <"TG-Automated Consumer Products Factory GenⅡ">  #NT!
 building_uma_tg_custom_goods_productor_2_desc: "该消费品工厂已经实现自动化，只需要通电就可以源源不断地产出大量的£consumer_goods£消费品\n§R建筑带有自动止损机制：在所需维护资源储量<=400时将自动禁用建筑！§!"  <"The consumer goods factory has been automated and can continuously produce a large number of consumer goods\n§R建筑带有自动止损机制：在所需维护资源储量<=400时将自动禁用建筑！§ if you only need to power on!">  #NT!
 building_uma_tg_custom_goods_productor_2_tt: "本建筑的产出为:基础值(产出=14£consumer_goods£)*(§Y收入的£food£食物*0.03+收入的£uma_crystal_carrot£水晶萝卜*0.03+总£pop£人口*0.1§!)\n维护为:基础值(8£food£,0.6£uma_crystal_carrot£)*(§Y收入的£food£食物*0.03+收入的£uma_crystal_carrot£水晶萝卜*0.03+总£pop£人口*0.1§!)"  <"The output of this building is: base value (output = 14£consumer_goods£)*(§Y收入的£food£食物*0.03+收入的£uma_crystal_carrot£水晶萝卜*0.03+总£pop£人口*0.1§!)\n Maintenance is: base value (8£food£, 0.6£uma_crystal_carrot£)*(§Y收入的£food£食物*0.03+收入的£uma_crystal_carrot£水晶萝卜*0.03+总£pop£人口*0.1§!)">  #NT!
 building_uma_tg_industrial_complex: "TG-工业复合体"  <"TG-industrial complex">  #NT!
 building_uma_tg_industrial_complex_desc: "这个工厂似乎什么都能生产！\n事实上，你可以在行星决议里调整生产配方\n§R建筑带有自动止损机制：在所需维护资源储量<=400时将自动禁用建筑！§!"  <"This factory seems to be able to produce anything! \nIn fact, you can adjust the production formula in Planetary Resolution\n§R建筑带有自动止损机制：在所需维护资源储量<=400时将自动禁用建筑！§!">  #NT!
