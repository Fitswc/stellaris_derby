###############################
 civic_umamihonobourbon:0 "远征支援委员会"
 civic_umamihonobourbon_desc:0 ""

 civic_umasymbolirudolf:0 "星际学生会"
 civic_umasymbolirudolf_desc:0 "她是天生的领袖，任何一个认识鲁道夫的马娘都会深刻地感受到这个事实。这种天赋在她的童年时光就展现得淋漓尽致，当她凭借多方面优异的成绩踏入特雷森的大门，并毋庸置疑地当选了学生会长，就注定了一个崭新的时代即将来临，一个属于被冠以"皇帝"之名的传奇马娘的新时代。随着2200年的一声巨响，载有ftl引擎的飞船遁入宇宙，也揭开了星河时代的帷幕。鲁道夫成为了这个初步进入宇宙的文明的第一任学生会长，也注定将在这宇宙的历史上刻下属于马娘文明的荣光。"
 civic_umaagnestachyon:0 "爱丽速子的科学统治力"
 civic_umaagnestachyon_desc:0 "首先声明一点，科学家爱丽速子在辞去职务后已经杳无音讯了四年，如果任何人在任何地方获得其相关线索，请第一时间上报。天才这个词汇，或许就是为了形容爱丽速子而被创造出来的。孩子们都对这个特立独行的同龄人感到好奇，却因为她时常倒弄那些她们一无所知的“科学”而望而生畏。在这孤寂生活的第12年，爱丽速子遇到了一个愿意走进她心底的马娘。或许是因为她是第一个真正意义和自己搭话的同龄人，又或许是她甚至愿意作为自己的实验对象来互相陪伴……无论如何，从那时起，实验逐渐开始不再是速子的全部。然后在某日的夕阳下，那个马娘与速子定下了一个约定——当你成为全世界最伟大的科学家时，我会为你准备一份礼物。"

 civic_umafujikiseki:0 "赛事海选制"
 civic_umafujikiseki_desc:0 "我们坚信，奔跑的天赋与梦想绝不应受到出生地点或是门第阶级的限制，通过彻底而平等的海选制度，从满是泥泞的船桥到璀璨的星空，任何马娘都有机会展示自己的才能。"

 civic_umacurrenchan:0 "真真联盟"
 civic_umacurrenchan_desc:0 "当真机怜的可爱和真弓快车想要被记住的愿望结合在一起的时候，我们深信宇宙中最强大的武器不是中子灭杀的歼星武器，而是无法抗拒的魅力。无论是长满触手的软体生物还是冷冰冰的硅基机器人，最终都会在屏幕面前成为她们的粉丝。没有任何人能拒绝我们的外交请求————谁忍心对真机怜和麻酱宣战呢？"

 civic_umamatikanefukukitaru:0 "特雷森神棍联合会"
 civic_umamatikanefukukitaru_desc:0 "由两位大仙成立的联合会如今已是帝国的至高信仰，什么？你说她们只是拿着水晶球和八卦阵造谣撞骗的神棍？那些无视了“今日忌航行”的唯物主义蠢货现在连残骸都找不到了！"

 civic_umasupercreek:0 "特雷森运动保健科"
 civic_umasupercreek_desc:0 "充足的休息可以解决99%的疾病。在结合了顶尖的生物理疗技术和小海湾的专属理论之后，强制性的每日拉伸放松到特制的海量营养餐补给被列入了每名马娘的日常清单，虽然偶尔会有试图逃避深度护理的马娘，但最终都会在散发着令人无法拒绝的安心气场下的保健科中被塞进特制的婴儿车医疗舱"
 civic_umanicenature:0 "睥睨八方"
 civic_umanicenature_desc:0 "素质女士的优秀盯防让其他种族的机密一览无余。我作为红技能大统领的权力是无限的。"
 civic_umazennorobroy:0 "特雷森大书库"
 civic_umazennorobroy_desc:0 "荒漠英雄曾经的梦想只是在午后安静的读遍书中的英雄故事。随着时间的推移，这座由她牵头建立的图书馆，已经保存了自古典时代以来的每一场赛事录像，恒星的光谱数据，行星上的远古化石，一切信息在这里被归类，分析，保存。尽管科学家们每天都在这里争吵不休，但不可否认的是，这座庞大的图书馆已经成为了事实上的中央数据库。"

 civic_umahuruwurara: "乌拉拉主义"
 civic_umahuruwurara_desc: "为什么要在星际间互相厮杀呢？大家一起开开心心地举办庆典不好吗？哪怕舰队在边境摩擦中吃瘪，哪怕科技水平被邻国甩在身后，都不会在我国引发恐慌与不满。我们把所有的国力都投入到了让每一位公民都能展露笑容的伟大事业里。就算是那些最冷血的净化者，在将准星对准我们那些会因为一点小事就欢呼雀跃的国民时，也会产生一丝莫名的负罪感……大概吧？"

 civic_umateio:0 "地下室文化"
 civic_umateio_desc:0 "嘘……别挣扎了，这里真的很安全。"

 civic_umamayanotopgun:0 "特雷森空天学院"
 civic_umamayanotopgun_desc:0 "Take off~ 这些马娘对天空具有无尽的向往。"

 civic_umaagnesdigital:0 "马娘DD同好会"
 civic_umaagnesdigital_desc:0 "作为一位光荣的DD头子，数码对于所有的马娘们都有着无比热烈的感情。现在，她想通过筹建马娘同好会的形式，让更多的马娘们和她一样，认识到其她马娘身上的闪光点。\n\n wwww,这谁忍得住嘶"

 civic_umafinemotion:0 "目白城"
 civic_umafinemotion_desc:0 "‘我必定会把荣耀与名誉献给辉煌的目白家!’那座大到离谱的家族宅邸如今已经成为了覆盖了半个星球的奇观。目白城不仅仅是一座庞大的建筑群，更是帝国最高级官员与总督的摇篮。每一位从目白城走出的管理者都自带无可挑剔的优雅与极高的行政手腕。凭借着传承百年的贵族底蕴与极其严苛的精英管理学，目白世家接管了帝国最核心的官僚体系。在那些优雅的下午茶会与古典乐的掩映下，成千上万的资源调度与人事任命被安排得井井有条。毕竟，如果连宅邸里那座宛如迷宫般的后花园都能管理好，治理几个偏远星区又算得了什么呢？"

 civic_umaeishinflash:0 "荣耀血脉"
 civic_umaeishinflash_desc:0 "许多人不知道，为什么我们的指挥官总能做出违背常理却精准无比的战术指挥？为什么我们的总督仿佛天生就懂得如何抚平民众的情绪？为什么我们的科学家对宇宙的奥秘破译的如此之快？通过对历代殿堂马娘的血脉进行追溯、保护与提纯，我国确保了每一代走上领导岗位的精英都继承了先辈的卓越才智与不屈意志。一马当先，万马无光。生而伟大，绝非虚言。"

civic_tooltip_umaeishinflash_effects:0 "若我们选择了该国策，将允许我们建造特殊军队：§Y黑色军团§!"
 civic_umasmartfalcon:0 "偶像国度"
 civic_umasmartfalcon_desc:0 "以前的飞鹰子有一个梦想，那就是站在最高的舞台上，将偶像的魅力传达给每一个人。而如今，早已成为著名偶像的她，则正努力帮更多想要走上偶像道路的年轻后辈实现她们自己的梦。"

 civic_umasatonodiamond:0 "冠名标准化"
 civic_umasatonodiamond_desc:0 "学院里有不少贵为财团的千金小姐，她们背后往往有着富可敌国的公司企业。这些管理有素且拥有强大竞争力的公司，正为我们的经济注入新的活力。"

 civic_umaairgroove:0 "学生会政务辅助"
 civic_umaairgroove_desc:0 "绝对不要小看了学生会的工作量！哪怕舞台从学院扩展到了全银河，在这套成熟而严密的行政体系下，学生会的干事们总能在恰当的时间和恰当的地点为审批文件盖上最后的印章。只要红茶的储备还足够，我们庞大帝国的行政机构就永远不会停摆。"

 civic_uma_vivlos_shopping: "kirakira名流外贸部"
 civic_uma_vivlos_shopping_desc: "KiraKira~ DokiDoki!?"

 civic_uma_ayb_star_watcher: "逐星者协会"
 civic_uma_ayb_star_watcher_desc: "作为一名特雷森学院的学生，有些马娘似乎对星星有着无限的追求，更重要的是，她们拥有丰厚的知识。"

 civic_uma_cheval_civillian_workshop: "BoC'z's帽子工厂"
 civic_uma_cheval_civillian_workshop_desc: "‘要让全宇宙都领略帽子的魅力！’最初，这只是一场由五位热爱帽子的马娘在愚人节发起的一场企划，但谁也没想到，它最终竟演变成了垄断时尚的超级大生意。卖军火会引来纷争，卖粮食利润太薄，但卖帽子，尤其是卖限量版的偶像联名帽子，是一本万利的生意！"

 civic_uma_matikanetannhauser_radio: "星际赛事广播"
 civic_uma_matikanetannhauser_radio_desc: "向全宇宙发送赛事广播！？真的假的"
 civic_uma_kita: "祭典之国"
 civic_uma_kita_desc: "浩瀚的星海或许是黑暗的森林，但在我们眼中这不过是一片巨大的祭典场地。‘瓦休————！’在某位对祭典有着狂热执念的黑发马娘的带领下，无论是研究科技、舰船竣工，还是新的殖民星建立，都会伴随着盛大的烟火与狂欢。如果我们能举办一场跨越整个巨大的星际大感谢祭……？唉，什么，你说这个游戏已经暴雷了？"

 civic_uma_luckey_geo_training: "无限制农业运营"
 civic_uma_luckey_geo_training_desc: "问题的关键是食物！在目睹了行星首府的食物储备是如何在一天之内耗尽的之后，为了防止国家在和平年代就因为被吃破产而崩溃，我们推行了极端激进的无限制农业运营策略。每一寸可利用的星际土壤都被用于种植胡萝卜，整颗整颗的行星被改造成无边无际的胡萝卜田与全自动化牧场。电力、住宅和矿物区被压缩到了极致————只要我们的马娘胃口能被满足，她们的生产力就没有极限！"

 civic_uma_win_variation: "主角之心"
 civic_uma_win_variation_desc: "可恶！我不仅要证明谁是主角，还要把你搞得乱七八糟！ 可爱的外表下是不屈的内心，对命运的宣战。"

 auth_trainingcenter:0 "特雷森学院"
 auth_trainingcenter_desc:0 "为赛马娘们提供最顶级的环境，并为发展作出指引的学园。精英赛马娘们在学院代表大会上进行国事的商榷。"
 UMAMUSUME_TRANIING_CENTER:0 "学院代表大会选举产生新的学院领袖，在紧急情况下可以进行重新选举。"

 
 gov_uma_country:0 "特雷森星际学院"
 gov_uma_country_desc:0 "曾在星球上为赛马娘提供顶尖设施的特雷森学院主导的文明，现在她们将目光投向星海。"
 
 gov_uma_country_spiritualist:0 "特雷森枢机院"
 gov_uma_country_spiritualist_desc:0 "受到福来大仙影响的特雷森学院，她们走出的每一步都遵循神的旨意。"
 
 
 gov_uma_country_militarist:0 "特雷森战争委员会"
 gov_uma_country_militarist_desc:0 "军事化的特雷森学院，她们的铁蹄将踏遍星海。"
 
 gov_uma_country_authoritarian:0 "特雷森首席议会"
 gov_uma_country_authoritarian_desc:0 "学生会权力强化后，特雷森的方方面面都获得了更高的效率。"
 
 gov_uma_country_xenophob:0 "特雷森达尔文协会"
 gov_uma_country_xenophob_desc:0 "主旨为创造一个只存在顶尖赛马娘的星海的特雷森协会，她们会用一切方式保证这一点。"
 
 gov_uma_country_egalitarian:0 "特雷森乌托邦"
 gov_uma_country_egalitarian_desc:0 "特雷森学园力求保证其一流的设施能服务到任何人，无论种族。"
 
 gov_uma_country_xenophile:0 "特雷森星际交流集会"
 gov_uma_country_xenophile_desc:0 "希望在各种文明间求同存异，友好交流的特雷森学院。"
 
 gov_uma_country_pacifist:0 "特雷森和平委员会"
 gov_uma_country_pacifist_desc:0 "由爱好和平的赛马娘主导的致力于和平传播的特雷森学院。"
 
 gov_uma_country_materialist:0 "特雷森科研学会"
 gov_uma_country_materialist_desc:0 "在追求知识与真理的道路上永不停蹄的赛马娘们主导的特雷森学会。"


###########################################################
UMA_SPECIES_CAN_NOT_BE_HIVE_MIND:0 "马娘们作为独立而富有灵性的生灵，无法使用蜂巢类的政府结构。"
UMA_SPECIES_CAN_NOT_BE_CORPORATE:0 "马娘们热爱奔跑和自由的天性，使得她们无法被一个巨型企业所统治。"


civic_uma_my_venus_park: "我推的卓芙"
civic_uma_my_venus_park_desc: "卓芙酱真是太可爱了，我真的忍不住每天都看着她的脸！！"
civic_uma_my_venus_park_effects: "国家领袖会变成卓芙，但后续无法获取事件链内的卓芙"

 civic_uma_aston_machan: "特异马娘研究中心"
 civic_uma_aston_machan_desc: "麻酱小姐十分擅长马娘纪念品的制作，可爱而又富有特色的马娘纪念品深受民众喜爱。\n在她的帮助下，我们的贸易体系如虎添翼。"


civic_uma_win_variation_tt: "\n\n§Y在前20年内:\n在主动进攻其他国家时将获得以下增益§!\n-生物飞船每月生长: §G+90%§!\n-宣称影响力花费: §G-90%§!\n-军用飞船建造速度: §G-80%§!\n\n\n§R后续游戏过程中该理念仅能被移除§!"
civic_uma_win_variation_tt_only_remove: "§R后续游戏过程中该理念仅能被移除§!"
 uma_variation_early_war_buff: "我才是主角嘶！"
