UMA_ALE_SP_1_DESC: "科学家完成了对该黑洞的研究，结果显示，尽管该黑洞正在不断地吸收物质，其引力却在逐渐下降，这意味着它正在失去质量，这显然并非黑洞辐射的范畴。\n科学家提议将量子信标投放进入黑洞中，这或许对于我们的黑洞学研究有帮助。"
