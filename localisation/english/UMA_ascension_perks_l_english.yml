 uma_ap.51.title: "Ready"
 uma_ap.51.desc: "After a long period of preparation, we are ready to enhance the inherent factors of Umamusumes. In the past, we struggled to pick that star with our own hands. Now, we will forge her with our own hands."
 uma_ap.51.a: "Let see these power"
 uma_ap.52.title: "Internal Factor improvement - Completed"
 uma_ap.52.desc: "We have strengthened our inherent factors, and now it has become more powerful and controllable. The next step is to replace the unfavorable parts in the inherent factors of Umamusumes. Doing so is very risky, but it's worth taking a chance."
 uma_ap.52.a: "Well Done"
  
 uma_ap.53.title: "Inherent factor addition - completed"
 uma_ap.53.desc: "Now we have the ability to enhance our inherent factors. It is time to add some more powerful inherent factors on the basis of the original ones and pass them on to our descendants. If we can successfully break through, our dream of casting stars will undoubtedly become a reality"
 uma_ap.53.a: "make persistent efforts"
  
 uma_ap.54.title: "Star-casting Dreams: Reality"
 uma_ap.54.desc: "After long-term efforts and the correct handling of some unexpected situations, we finally pushed open the last door set for us by the three goddesses - the inherent factors. Now, the stars in our hearts are not only tightly held in our hands, but also cast into different shapes by our own hands, radiating unique and distinctive light."
 uma_ap.54.a: "Yeah"
  
  
  
 uma_ap.60.title: "Infinite strength"
 uma_ap.60.desc: "The enhanced inherent factors have brought about tremendous changes to Umamusumes' life, endowing him with more powerful abilities than ever before. However, more than half of the subjects indicated that they seemed to exhibit uncontrollable strength as they did last time: even a gentle pull could separate the door handle from the door carcass, which indirectly made the furniture daily shopping mall very popular. Although we have subsidized a considerable amount of funds for furniture replacement, we still believe that the force control training we have implemented for this purpose is still effective. It was not until a college student who was a test subject smashed the thick walls of the swimming pool directly with a volleyball during swimming training that the proposal for this issue and the matter of repair funds were placed together on the desk of [Owner.GetRulerName]. \n "If she hadn't eaten, I would have turned into Umamusume sauce.""
 uma_ap.60.a: "Modify the inherent factors of Umamusumes to make their strength a little less"
 uma_ap.60.b: "Perhaps let's ask them to pick up tofu with chopsticks again?"
 uma_ap.60.c: "They will adapt."
 uma_ap.61.title: "Advanced power Control"
 uma_ap.61.desc: "After countless complaints from Umamusume about picking up tofu with chopsticks, it returns to the battlefield! With scientific methods of training, Umamusumes seems to have a more reasonable control over his strength. It's just that this time the tofu seems to have become much harder?"
 uma_ap.61.a: "That is to say, did you use dried bean curd?"
 uma_ap.70.title: "Alternating personality"
 uma_ap.70.desc: "It seems that some situations have emerged. Our scientists reported observing MPD among the volunteers in the isolated subjects. Some of the volunteers experienced personality changes. From time to time, they exhibited behaviors completely different from before and failed to remember their important information. However, they can recall identity information that is completely different from it. The changes in personality are very dramatic. One minute a volunteer can clearly answer his or her name and address, but the next minute, the information is completely different. \n Our scientists suspect that multiple personality experiences are caused by additional external inherent factors, though this is not conclusive......"
 uma_ap.70.a: "This might just be an accidental event"
 uma_ap.70.b: "Key observation"
 uma_ap.70.a.tt: "Tips: The situation can be stopped at any time, and the benefits depend on §G The progress of the situation §! (All progress + one DEBUFF)"
  
 uma_ap.80.title: "Alternating personality"
 uma_ap.80.desc: "Something abnormal has occurred! The phenomenon of Umamusume going crazy has been reported in many places, and even the military has been affected. All these Umamusume have a common feature: severe MPD has been observed in them, and they are all Umamusume that have undergone factor replacement. They behave strangely and are highly disciplined. Even more strangely, they seem to be obsessed with imprisfying normal Umamusume and forcing factor replacement surgery. Although we don't know exactly where those potions came from either. This phenomenon seems to be spreading. As these crazy Umamusume are taking over all kinds of our infrastructure, our homeland has been damaged to varying degrees. Fortunately, the Minister of Defense issued a T0-level directive during the first report, enabling all military members to take reverse measures against this factor change. This has given us the means to counter it. Whether there is a direct connection or not, we must terminate this plan."
 uma_ap.80.a: "How?"
 uma_ap.80.a.tt: "We have to take back our colonies\nStart Event chain:$uma_ap2_factor_invator_title$"
  
 uma_ap.71.title: "Personality disorder"
 uma_ap.71.desc: "Something abnormal has occurred! The phenomenon of Umamusume going crazy has been reported in many places, and even the military has been affected. All these Umamusume have a common feature: severe MPD has been observed in them, and they are all Umamusume that have undergone factor replacement. They behave strangely and are highly disciplined. Even more strangely, they seem to be obsessed with imprisfying normal Umamusume and forcing factor replacement surgery. Although we don't know exactly where those potions came from either. This phenomenon seems to be spreading. As these crazy Umamusume are taking over all kinds of our infrastructure, our homeland has been damaged to varying degrees. Fortunately, the Minister of Defense issued a T0-level directive during the first report, enabling all military members to take reverse measures against this factor change. This has given us the means to counter it. Whether there is a direct connection or not, we must terminate this plan."
 uma_ap.71.a: "How?"
 uma_ap.71.a.tt: "We have to take back our colonies\nStart Event chain:$uma_ap2_factor_invator_title$"
  
 uma_ap.81.title: "The planet has fallen"
 uma_ap.81.desc: "This factor disease has spread like a plague. Now the planet [this.planet.getname] has fallen and we must reclaim it"
 uma_ap.81.a: "Defend!"
 uma_ap.84.title: "Quiet down"
 uma_ap.84.desc: "We finally managed to control the factor disease before it spread. For those former companions, we have no way to save them."
 uma_ap.84.a: "RIP"
 uma_ap.85.title: "Who am I?"
 uma_ap.85.desc: "As the crazy Umamusumes burst through the student council's door, [GetRulerTitle][GetRulerName] was soon pricked in the neck. She felt dizzy all of a sudden, and her mind and strength seemed to be growing stronger. But soon another voice rang out in her mind, and then.... She wouldn't be herself anymore. After an unknown period of time, when the real [GetRulerName] woke up, she found herself still sitting at that desk, with all kinds of documents neatly stacked on it. Apart from the fact that my pen breaks easily when pinched and I get dizzy from time to time, which makes me not myself, there seems to be no difference from before. Perhaps when everyone is crazy, crazy people will no longer be crazy?"
 uma_ap.85.a: "So what should I do?"
  
  
  
  
