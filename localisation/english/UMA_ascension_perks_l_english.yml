 uma_ap.40.title: "Star-Casting Project launched"
 uma_ap.40.desc: "After a long period of research and verification, we now finally have the conditions and ability to replace every factor in our bodies and produce stronger offspring. Although we have heard from other Umamusume about the destruction of other old civilizations due to factors, we believe we can handle it well. \nNow we will start to gradually update the factors in the national body."
 uma_ap.40.a: "Let see this power"
  
 uma_ap.140.title: "Heart of everything"
 uma_ap.140.desc: "After completing the Full-Body and Full-Spirit plan, we pushed open the door left to us by the three goddesses. Now we hold the key to another door. Once we open this door, we will be able to inspire new horizons for Umamusumes. No matter what consequences the field has had on our old civilization, do we believe that our conservatism can control this technology"
 uma_ap.140.a: "Let see this power"
  
  
  
