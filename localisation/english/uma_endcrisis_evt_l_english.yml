###EVT
uma_ec_3.20.title: "Spatial Fluctuation"
uma_ec_3.20.desc: "The black hole in [event_target:uma_ec3_first_system.GetName] has experienced a momentary powerful subspace fluctuation. This fluctuation has caused a strong electromagnetic storm in surrounding star systems—all electronic devices briefly stopped working at the same instant. What could be the cause of this?"
uma_ec_3.20.a: "Unease"
uma_ec_3.21.title: "Alert!"
uma_ec_3.21.desc: "A large number of fleets warped out from the black hole in [event_target:uma_ec3_first_system.GetName] and quickly constructed a command center.\nSurprisingly, they seem to be able to build space structures without construction ships, instead releasing self-assembling components directly from their vessels to piece themselves together in space.\nIt appears all ship commands are being issued from [event_target:uma_ec3_first_system.GetName]. Without a doubt, we need to attack their command center."
uma_ec_3.21.a: "Enter Alert Status"
uma_ec_3.22.title: "???"
uma_ec_3.22.desc: "I didn't expect to find fellow Umamusume here, and a young civilization at that. Let us introduce ourselves: we are from 'another universe' on the same level as yours. Although we are very similar in appearance and history, unfortunately, strictly speaking, we are ultimately not the same species. However, we will grant you certain privileges after we defeat you.....\n\n......but your star sector, resources, colonies, and every blade of grass on your planets will be our property! The stars in this universe will become our power plants, and the planets will become our mines!"
uma_ec_3.22.a: "We must stop them!"
uma_ec_3.23.title: "???"
uma_ec_3.23.desc: "You possess a fertile territory, xenos... but soon, your star sector, resources, colonies, and every blade of grass on your planets will be our property! The stars in this universe will become our power plants, and the planets will become our mines!"
uma_ec_3.23.a: "We must stop them!"
uma_ec_3.24.title: "Scorched Earth Plan"
uma_ec_3.24.desc: "Under a blinding flash of light, all planets in [From.GetName] have been reduced to barren wastes, all life completely eradicated, and even the star has become a black hole. Is this their Scorched Earth Plan?"
uma_ec_3.24.desc.swap: "Under a blinding flash of light, all colonies in [From.GetName] have fallen silent, all life completely eradicated. Is this their Scorched Earth Plan?"
uma_ec_3.24.a: "Shocking"
uma_ec_3.28.title: "Suddenly Appearing Behemoth"
uma_ec_3.28.desc: "The moment these Umamusume from another dimension arrived in this universe, a giant outpost warped into our capital system. It is just sitting there quietly, and we currently do not know what this spontaneously appearing behemoth is meant to do. But intuitively, we feel this is not a good thing..."
uma_ec_3.28.a: "Must research immediately"
uma_ec_3.29.title: "Ticking Time Bomb"
uma_ec_3.29.desc: "After exploring and reverse-engineering this behemoth, we have discovered that this massive object lingering in our star system is actually a ticking time bomb! It draws power from other Scorched Anchors within a certain range, and once the charge reaches a certain level, it will release a powerful burst of energy that will wipe out all life in the system. Furthermore, if you have a colony in any system with a Scorched Anchor, the population on that colony will instantly suffer heavy losses. We can now use a monthly connection scan to locate the other Scorched Anchors powering this weapon of death.\nWe hope we are fast enough"
uma_ec_3.29.a: "Understood"
uma_ec_3.32.title: "Aid from the Gold Family"
uma_ec_3.32.desc: "\"......Since we all have the same factors within us, as family, we should provide you with assistance. However, there is one condition: this fleet may only be used to attack enemies who seek to destroy our home. When the war ends... please disband the fleet and bring them home......\""
uma_ec_3.32.a: "Of course..."
uma_ec_3.25.title: "Rout"
uma_ec_3.25.desc: "The base established in this universe by the evil Umamusume from another universe has finally been captured in one fell swoop. A catastrophe has finally ended..."
uma_ec_3.25.a: "A relief"
uma_ec_3.26.title: "???"
uma_ec_3.26.desc: "Young Umamusume... have you heard of the Three Goddesses? Through the Domain, we have discovered that the Three Goddesses seem to be... a supervisor... who exists independently outside of all our universes... {COMMUNICATION INTERRUPTED BY EXTERNAL SOURCE}... They are watching you."
uma_ec_3.26.a: "What?"

