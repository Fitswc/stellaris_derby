 # 麻酱事件链
 uma_am_catch_phrase: "您好，我是真弓快车，您也可以叫我麻酱，请多指教。"
 uma_never_forget.2.name: "麻酱的私房钱"
 uma_never_forget.2.desc: "“听说最近国家发展有些预算不足呢，这些是我的私房钱，请收好！虽然只有一点点，但是希望能够帮到您......”"
 uma_never_forget.2.a: "谢谢"
 uma_never_forget.3.name: "潮声渐起"
 uma_never_forget.3.desc: "最近与麻酱共事的其他马娘常常报告说经常看到麻酱一个人在发呆，并且有事找她时也常常联系不上。\n\n面对其他马娘关切的询问，她只是回道：“不用担心，我只是和春天不是很合得来，等到夏天就好了。”\n\n医务室的检查结果也证明麻酱小姐的身体十分健康，但你仍有些担心她。"
 uma_never_forget.3.a: "......不好的预感"
 uma_never_forget.4.name: "......被遗忘"
 uma_never_forget.4.desc: "帝国的各项事务正在有条不紊的被你处理着，但是当你翻阅帝国贸易这一重要项目的相关文件时，你却感到一阵强烈的违和感袭来。\n\n“这么庞大的资金流转，居然只有几位总督及职员在负责？我们不可能不在这个地方设立贸易主管的。”\n\n但是你仔细翻查了近一年的文件，也没发现“贸易主管”的痕迹，难道真的只靠几位总督和手下的职员就能处理好我们的贸易项目么？"
 uma_never_forget.4.a: "这不对劲，我一定忘记了什么重要的事情"
 uma_never_forget.5.name: "我们究竟忘记了什么"
 uma_never_forget.5.desc: "随着总督们的报告结束，你们越发确信发生了什么事，导致大家的记忆集体消失。\n\n有关某人或者某物的记录完全消失了，这是从未有过的事情，我们必须搞清楚这是怎么做到的，更为重要的是：\n\n§Y一定要想起我们失去了什么§!\n\n科学家们提出了一个设想——我们可以利用马娘的领域产生共振，从而扭曲一定区域内的时间，通过局部时间逆流以让其中的人回到“遗忘”之前的状态。"
 uma_never_forget.5.a: "我们需要立刻行动起来"
 uma_never_forget.6.name: "她的名字是...麻酱！"
 uma_never_forget.6.desc: "停滞时间对我们来说很简单，但是倒转却难如登天。终于，在科学家的不懈努力下，我们先是将一小块区域的时间停滞，随后进行了时间倒转。\n\n伴随着志愿者的重新出现，他还尚未开口，一个名字便出现在了所有人的心中——“真弓快车”，是啊，除了我们亲爱的麻酱小姐，还能是谁呢？ \n\n科学家从刚才的逆流实验中截取到了一股神秘的领域能量，虽然我们对领域的研究并不透彻，但是有理由相信这股能量的来源与麻酱小姐有关，我们或许可以由此定位她的位置。"
 uma_never_forget.6.a: "定位她的位置！"
 uma_never_forget.8.name: "一个未知的星系"
 uma_never_forget.8.desc: "这是我们从来没有在星图上发现的星系，直至今日，我们才发现他的存在。\n\n没人知道它究竟是如何隐藏自己的，但是既然它已经被发现，我们应当派出探索队。"
 uma_never_forget.8.a: "立即派出探索队"
 uma_never_forget.9.name: "于故事结束的那片海"
 uma_never_forget.9.desc: "随着科研人员的靠近，那个身影越发清晰，很显然，她是一位马娘 \n\n她为什么会在这里？ \n\n她的身影又为何如此的熟悉？"
 uma_never_forget.9.a: "让我们去和她聊聊"
 uma_never_forget.9.b: "是...她么"
 uma_never_forget.10.desc: "§H真弓快车向我们打了个招呼。她显得十分意外。§!\n\n...为什么你会在这里呢？...不，但是，这都已经没关系了。 \n\n虽然还有点早...但是，这也是没办法的。每个人都会从上游漂流到下游，这是，命中注定的...\n\n这里就是我漂流的终点吧...所以，再见了。"
 uma_never_forget.10.a: "不，这里绝不是你的终点"
 uma_never_forget.10.a.resp: "虽然是有些不甘，但是，我已经整理好心情了。"
 uma_never_forget.10.b: "那成为超级无敌吉祥物的梦想呢"
 uma_never_forget.10.b.resp: "...... \n小真相信。只要有你在，真弓快车就不会消失。\n所以，没关系的。 \n\n§H她笑的很开心，但那笑容仿佛是强装出来的。§! \n\n你要将小真的事情，讲给大家听哦。"
 uma_never_forget.10.c: "我不要你不在"
 uma_never_forget.10.c.resp: "...！ \n\n§B“真弓快车现在才刚启程，那不是别人——既不是会长，也不是总督，努力奋斗的是你啊。\n你让大家看到了梦想，无数次，无数次。\n你让大家看到了光辉，永远，永远。\n这才是你啊”§! \n\n......才刚，启程。 \n\n§H似乎是不知道该怎么做，真弓快车突然一言不发。许久过后——§! \n\n...是吗\n是吗，这样啊，这——\n...让我有些难办呢 \n\n§H然后真弓快车转身背向大海§! \n\n小真要无视掉那个声音，把那个呼唤我的波浪声当做不存在 \n真没办法，谁叫你是个奇怪的人呢 \n我们要去往河口，从下游漂到上游 \n...虽然有可能会被洪水冲走，被水流带走，最终又回到海里。又或者会遇上船底开了个洞，船帆被吹折之类的事情。但是——即使如此。 \n小真的传说，也要继续下去 \n\n§H让我们一起，延续下去吧。§!"
 uma_never_forget.10.HIRE: "欢迎回来"
 uma_never_forget.10.DISMISS: "休息一下吧"

 FIND_WHAT_WE_LOST: "寻找我们失去的东西"
 FIND_WHAT_WE_LOST_DESC: "帝国内最优秀的马娘领域学科科学家们齐聚一堂，试图研发一个足以扭曲时间的装置。\n\n可以预想的是，这是十分艰难的，除非“我们§Y完全激发§!了§Y自身的领域能力§!” \n\n选择心象二段飞升将有助于完成这一项目"
