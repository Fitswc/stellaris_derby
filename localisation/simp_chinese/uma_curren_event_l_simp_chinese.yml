uma_curren_catch_phrase: "机伶今天也很可爱吧～☆转发要带上“#真机伶”哦!"
uma_curren_backstory: "Curren（可爱）的，真机伶De-su！\n整个世界都被“可爱”所包围着☆\n东张西望是不行的，只能好好注视着机伶哟♪"



