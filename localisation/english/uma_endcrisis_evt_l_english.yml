 ###EVT
 uma_ec_3.20.title: "Spatial Anomaly"
 uma_ec_3.20.desc: "A powerful, instantaneous subspace surge has erupted from the black hole in [event_target:uma_ec3_first_system.GetName]. The resulting electromagnetic storm caused all electronic devices in neighboring systems to briefly fail. What could be the cause of this?"
 uma_ec_3.20.a: "Unsettling."
 uma_ec_3.21.title: "Alert!"
 uma_ec_3.21.desc: "A massive fleet has warped in from the black hole in [event_target:uma_ec3_first_system.GetName] and quickly established a command center.\nSurprisingly, they do not seem to require construction ships; they release self-assembling components directly from their vessels to construct space structures.\nAll fleet commands appear to originate from [event_target:uma_ec3_first_system.GetName]. Without a doubt, we must strike their command center."
 uma_ec_3.21.a: "Enter high alert."
 uma_ec_3.22.title: "???"
 uma_ec_3.22.desc: "I did not expect to find Umamusume compatriots here, especially such a young civilization. Allow us to introduce ourselves: We hail from 'another universe' parallel to yours. While we share similar appearances and histories, strictly speaking, we are not of the same race. However, we shall grant you favorable treatment once we have defeated you...\n\n...But your sectors, your resources, your colonies, every blade of grass on your planets—all shall become our property! The stars of this universe will serve as our power plants, and the planets shall be our mines!"
 uma_ec_3.22.a: "They must be stopped!"

 uma_ec_3.23.title: "???"
 uma_ec_3.23.desc: "You sit upon a bountiful territory, aliens... but soon, your sectors, resources, colonies, and every blade of grass on your planets will be ours! The stars of this universe will become our power plants, and the planets will be our mines!"
 uma_ec_3.23.a: "They must be stopped!"
 uma_ec_3.24.title: "Scorched Earth Project"
 uma_ec_3.24.desc: "Under a blinding light, every planet in [From.GetName] has been turned to ash, all life erased, and even the stars have collapsed into black holes. Is this their 'Scorched Earth Project'?"
 uma_ec_3.24.desc.swap: "Under a blinding light, all colonies in [From.GetName] have fallen silent, and all life has been erased. Is this their 'Scorched Earth Project'?"
 uma_ec_3.24.a: "Shocking."
 uma_ec_3.28.title: "A Colossal Presence"
 uma_ec_3.28.desc: "The moment these Umamusume from another dimension arrived, a massive outpost warped into our capital system. It sits there silently; we do not yet know the purpose of this sudden behemoth. But we sense a dark foreboding..."
 uma_ec_3.28.a: "Research it immediately."
 uma_ec_3.29.title: "Time Bomb"
 uma_ec_3.29.desc: "Through exploration and reverse-engineering of this behemoth, we have discovered it is actually a time bomb! It draws power from Scorched Anchors within a certain range. Once fully charged, it will release a massive energy pulse to wipe out all life in this system. Furthermore, any colony in a system containing a Scorched Anchor will suffer immediate and massive population loss. We can now perform monthly connection scans to locate the Scorched Anchors powering this death machine.\nHopefully, we are fast enough."
 uma_ec_3.29.a: "Understood."

 uma_ec_3.32.title: "Aid from the Gold Family"
 uma_ec_3.32.desc: "\"...Since we share the same factors, as family, we should provide you with corresponding aid. On one condition: this fleet may only be used against those who seek to destroy our home. When the war ends... please disband the fleet and let them go home...\""
 uma_ec_3.32.a: "Of course..."

 uma_ec_3.25.title: "Retreat"
 uma_ec_3.25.desc: "The bases established by the evil Umamusume from the other universe have finally been taken down. The catastrophe is finally over..."
 uma_ec_3.25.a: "A narrow escape."

 uma_ec_3.26.title: "???"
 uma_ec_3.26.desc: "Young Umamusume... have you heard of the Triple Goddesses? We discovered through the Realm that they seem to be a... [COMMUNICATION INTERRUPTED]... independent of all our universes. They are watching you."
 uma_ec_3.26.a: "What?"

