l_simp_chinese:

uma_curren_name: "真机怜"


uma_curren.1.title: "可爱的真谛"
uma_curren.1.desc: "在你的领导下，你的国家蒸蒸日上，实力版图逐渐扩张，你也因此听到许多故事及传说，大部分除了提供闲暇时的调剂以外并没有更多作用，某个关于“可爱”的传说就此埋入你的记忆深处。"
uma_curren.1.a: "……"

uma_curren.2.title: "可爱的拜访"
uma_curren.2.desc: "你的部下表示有人想觐见你，对方是个§H唐突出现§!在本舰上的“马娘”。"
uma_curren.2.a: "你怎么笑成这个样子？这“马娘”是什么来头？"
uma_curren.2.b: "我很忙，让她提前预约再来。"

uma_curren.3.title: "真机伶"
uma_curren.3.desc: "你就是这个国家的领导人吗？机伶很高兴见到你。"
uma_curren.3.a: "你找我有什么事？"


uma_curren.4.desc: "嗯……机伶也不知道呢，明明先前还在瀑布下修炼的说。"
uma_curren.4.a: "不知道？"

uma_curren.5.desc: "机伶，想留在这里，不知道可不可以呢？"
uma_curren.5.a: "你为什么想留下呢？"
uma_curren.5.b: "当然可以，能获得一位这么可爱的伙伴是我的荣幸"
uma_curren.5.c: "不好意思，恕我拒绝"

uma_curren.6.desc: "因为机伶想让全宇宙的大家都因为机伶的可爱变得幸福起来，也就是——可爱的终点！"
uma_curren.6.a: "既然如此，你就陪在我的身边吧"
uma_curren.6.b: "不好意思，恕我拒绝"

uma_curren.6.a.tt: "机伶好开心，有什么机伶能帮忙的，请尽管拜托我吧~"

uma_curren.7.title: "End"
uma_curren.7.desc: "真机伶对你的决定似乎并不意外，只是失落地自言自语道：“还是没有办法实现吗。”你将她安排在专人看管的房间中。可没等你想好如何处理，第二天真机伶便从房间中消失。床上只留着一张用鎏金字体写着“香草度假村”的白色小纸片。"
uma_curren.7.a: "……"

uma_curren.8.desc: "##占位"
uma_curren.8.a: "##占位"
uma_curren.8.a.resp: "##占位"
uma_curren.8.b: "##占位"
uma_curren.8.b.resp: "##占位"
uma_curren.8.c: "##占位"
uma_curren.8.c.resp: "##占位"
uma_curren.8.hire: "欢迎!"




uma_curren.10.title: "可爱的扩散"
uma_curren.10.desc: "真机伶被你收留之后，十分主动地了解起你的国家的现状。除了非常机密的部分，你对真机伶知无不言，没想到她却意外的机敏，在很多领域亟待突破的问题给予了奇特的角度，令你也有所启发。政事之外，真机伶似乎非常热衷于提高自己在你的臣民间的知名度，并称之为“专属于机伶的可爱”。"
uma_curren.10.a: "什么叫专属于机伶的可爱？去调查一下"
uma_curren.10.b: "她确实挺可爱的......"

uma_curren.11.title: "Research Completed"
uma_curren.11.desc: "从收集到的反馈意见来看，群众对于“可爱”这一词汇的定义可能不甚了然，但看见真机伶时总能莫名其妙的或打起精神，或情绪平复，单从这一点来看，她似乎并未带来任何不良影响。"
uma_curren.11.a: "真不错"



