l_english:
  uma_f_t.2.title: ""
  uma_f_t.2.desc: "Our starbase at [event_target:uma_fairy_trail_system_here.GetName] has detected intermittent gravitational waves emanating from [event_target:uma_fairy_trail_planet_here.GetName]. Upon closer imaging, we discovered an ancient ruin towering into the clouds. It pierces the sky like a needle, seemingly built to transmit signals to a specific target in space. Unfortunately, we have found no structures—either in space or in the direction it points—capable of receiving such signals or energy. It is worth sending scientists for a field investigation."
  uma_f_t.2.a: "Approve."
  uma_f_t.2.b: "Just another unremarkable building."

  uma_f_t.3.name: "The Structure"
  uma_f_t.3.desc: "The scientific team led by [This.leader] has successfully reached the surface. We found the building occupies an excellent geographical location, built by the water at a moderate latitude. Before entering for a more detailed inspection, our team noticed the exterior walls seem to be made of an unknown alloy-crystal material with incredible heat resistance and hardness. Although there are currently no means to collect samples for study, a scientist with some knowledge of materials science remarked: 'This seems slightly beyond the technological level of the present or any past we know of.'"

  uma_f_t.4.name: "Floor 0"
  uma_f_t.4.desc: "Our team entered the building—it wasn't even locked! Technical assessments suggest the structure is at least tens of thousands of years old. Strangely, the internal circuits and mechanical structures still function normally. The lobby displays many objects seemingly belonging to Umamusume: worn-out running shoes, rusted horseshoes, and a trophy so decayed it's nearly soil, its inscriptions illegible. There are also broken personal electronic devices and common tools; it appears this was once a place where Umamusume lived. In a corner, the team found a still-functioning elevator that could lead us to the lower levels. 'The temperature inside remains remarkably comfortable.'"
  uma_f_t.4.a: "Proceed."

  uma_f_t.5.name: "B1 - Indoor Running Facility"
  uma_f_t.5.desc: "Highly skeptical of the ancient elevator's safety, [This.Leader] reluctantly took the stairs. After minutes of tedious climbing, they reached what looks like a control room. Though dilapidated and covered in dust, traces of its former glory remain: several omni-directional treadmills and augmented reality facilities are neatly arranged. Whether Umamusume once used these or not, time has erased their tracks. Additionally, we found signs of heavy modification on one wall, but without tools to break the hardened material, we can only conclude this was a place for Umamusume to run to their heart's content indoors."

  uma_f_t.6.name: "B3 - Greenhouse"
  uma_f_t.6.desc: "'We didn't expect things to still grow here; perhaps that's what the insulation was for.' Indeed, after several more minutes of walking, the team reached a greenhouse. Sadly, due to lack of maintenance, the plants have long since withered. Only the sprinklers continue their mechanical duty, drawing water from outside to numbly spray the lifeless earth."
  uma_f_t.6.a: "Incredible that it's still running."

  uma_f_t.7.name: "B5 - Bedroom"
  uma_f_t.7.desc: "After a short rest, the team headed deeper. This climb back up will surely be difficult for certain Umamusume lacking in exercise. To the point: the team reached a personal living space. Despite the dust, the items reflect the habits of the Umamusume who lived here—clean and tidy. The only flaw is the wardrobes; the clothes are haphazardly piled together, and worse, the colors and styles are nearly identical. As expected, we soon found a row of identical coats."
  uma_f_t.7.a: "How terrible."

  uma_f_t.8.name: "Unreliable Depth Data"
  uma_f_t.8.desc: "Theoretically, our team should have reached the last floor according to deep scans, but in reality, there's still a distance to go. One must admit, the elevator truly was a great invention."

  uma_f_t.9.name: "Deepest Level - Hall"
  uma_f_t.9.desc: "Finally, we reached the bottom floor with all our questions. It was unexpectedly empty. Just as the team was settling down to rest and prepare a message to the homeworld stating 'nothing here but traces of living,' a sharp-eyed member found a stone tablet. It bore the words 'Observe the walls carefully' in a language we understand, with an incredibly cringeworthy sentence written on the back. This immediately piqued the team's interest; who would deliberately leave such a tablet on the floor?"

  uma_f_t.10.name: "Deepest Level - Hall"
  uma_f_t.10.desc: "After days of searching, we finally found a secret door disguised as a wall. The unlocking method was... interesting: it required an Umamusume to activate a 'Domain' in front of the door and recite something akin to a magic spell. The whole process was awkward yet hilarious; our team isn't just made of nerds. Can you imagine an Umamusume striking a pose, eating heartily, and shouting a mysterious incantation while blushing furiously? Regardless, the door eventually opened."
  uma_f_t.10.a: "Hey hey hey stop laughing!"

  uma_f_t.11.name: "Metallic Casket"
  uma_f_t.11.desc: "Behind the door, we found a coffin-like container resting in the center, surrounded by scattered components. Information is scarce, as the only screen connected to the container is broken. Although the facility seems powered by geothermal and solar energy, we detected no voltage at the container's power interface. Most likely, it has been depowered for a long time. Given the unknown nature of the contents, the team has requested to transport the container back to the capital for research."
  uma_f_t.11.a: "Of course."
  uma_f_t.11.b: "Leave it be."

  uma_f_t.12.title: "Umamusume Activation Manual"
  uma_f_t.12.desc: "After arriving at the Capital Science Academy, our scientists used Crystal Carrots to amplify the power and successfully opened the container. Inside lay a bionic Umamusume body. The exterior material is extremely similar to skin, and X-ray scans show an internal structure identical to a normal Umamusume, except it is composed of a specialized nano-material metal rather than cells.\nA manual was found inside detailing a series of procedures, seemingly intended to activate this body."
  uma_f_t.12.a: "Intriguing."
  uma_f_t.12.b: "Too many resources. Abandon the project."

  uma_f_t.13.title: "Awakening After Millennia"
  uma_f_t.13.desc: "As the procedures were completed step-by-step, the Umamusume in the container remained still. The manual ended abruptly with 'Final Step: A Kiss.' After the scientists settled it with Rock-Paper-Scissors, the loser prepared to kiss the 'machine' (which had begun to emit body heat) under everyone's gaze. Suddenly, the Umamusume reached out, covered the scientist's mouth, and gave a playful wink~\n'Thanks, but I'll pass on that.'\nShe sat up slowly, looked around, and whispered softly:\n'We meet again. This place really hasn't changed much, has it?'"
  uma_f_t.13.a: "'Meet again'? Let me speak with her."

  uma_f_t.14.title: "???"
  uma_f_t.14.desc: "“Ah, we meet again, [This.Ruler.GetRulerTitle] [This.Ruler.GetName]. I gave you my word back then... now look at me... am I an honest girl?”\n“And another thing! After you left, I used the leftover materials to reinforce the outer walls, then I started farming underground. Yes, because of the temperature, the moisture...”"
  uma_f_t.14.a: "Uh, about that..."

  uma_f_t.15.desc: "“It was super delicious! Especially the Garlic Onsen-Egg Ramen. Even though it didn't taste quite like the first time we went, I think for my halfway-decent cooking skills, it wasn't bad at all!”\n“Oh, and I ran on every—single—one of the omni-directional treadmills! The first one on the left has high resistance, the second is a bit loose...”\nYou try to get a word in, but her chatter is unstoppable.\n“Hmph~ I even beat all the built-in challengers 100 times! That was way too easy...”"
  uma_f_t.15.a: "I'm saying..."

  uma_f_t.16.desc: "“...Right, in the first 50 years after you left, the whole planet was slowly taken over by plants again, just like before! But the dominant plants changed every time. The riverbeds filled with water, and even small animals started appearing. Fishing is fun... but doing it forever is boring. So I started learning gardening, tidying up the front door to keep my spirits up.”\n“...Then I set out... and eventually walked across the whole planet. Honestly, nature is amazing! It’s just a shame there were no starships...”"
  uma_f_t.16.a: "So..."

  uma_f_t.17.desc: "“...Later, around the 7th millennium after you left, my own energy couldn't hold out anymore, so I had to go back to sleep... after all, I had to save the last bit of energy to see you again. Hehe...”\n“Looks like I messed up again...”\nAfter talking non-stop, the Umamusume looks at you, waiting for a response."
  uma_f_t.17.a: "And... how should I address you?"

  uma_f_t.18.desc: "“Eh?”\nShe seems genuinely surprised, but recovers after a moment.\n“...Haha... so that's how it is. I... I forgot again. Why... why did I say so much... seriously... it's like this every time.”\nA silence lasting several minutes follows; not a single sound fills the small room."
  uma_f_t.18.a: "...The question from before..."

  uma_f_t.19.desc: "Finally, she takes a deep breath, straightens up, and says with a serious yet playful tone:\n“My name is ['concept_uma_member_f_concept',$FT$]. As you can see, I am an Umamusume, but well... not an Umamusume in the truest sense. As for why, that’s a secret~”\n“...What? Why are you laughing? You already knew?”\nShe spreads her arms, intentionally making a fierce face.\n§E“I’ll bite you!”§!\nBut she quickly continues her self-introduction:\n“My former profession was... a Fleet Commander, I believe. Hobbies... eating, sleeping, playing video games. That’s about it.”"
  uma_f_t.19.a: "You seem very familiar with this place."
  uma_f_t.19.b: "Are you some kind of silly dog?"

  uma_f_t.20.desc: "I remember everything here clearly: your name, the academy's address, the daily schedule, basic starship maintenance—I know it all! The reason is, well, this isn't the first time I've met you like this. As for you not remembering me... I already expected that...\nIn the first few times, I would have made a huge scene, but after so many §Irepetitions§!, I’ve pretty much gotten used to it. Even a naive child grows mature after being tempered by time and events, right?\nBy the way, though I ask the same thing every time: can I stay here? I haven't soaked in a hot spring for a long time. It's my tiny wish. I wonder... if it can be granted?"
  uma_f_t.20.desc.a: "§E“Hmph... you're just as difficult to serve as that silly cat.”§!\nI remember everything here clearly: your name, the academy's address, the daily schedule, basic starship maintenance—I know it all! The reason is, well, this isn't the first time I've met you like this. As for you not remembering me... I already expected that...\nIn the first few times, I would have made a huge scene, but after so many times, I’ve pretty much gotten used to it. Even a naive child grows mature after being tempered by time and events, right?\nBy the way, though I ask the same thing every time: can I stay here? I haven't soaked in a hot spring for a long time. It's my tiny wish. I wonder... if it can be granted?"
  uma_f_t.20.a: "Of course, we welcome you, Ms. Fairy."
  uma_f_t.20.a.repo: "My, my, why so formal? From now on, no more 'Miss' or 'Lady' suffixes. Well then, I look forward to our time together."

  uma_f_t.21.desc: "§YShe is tidying up her belongings in the room you assigned her. Unfortunately, you find her ability to organize a wardrobe is just as disastrous as it was in the ruins. Sensing your presence, she pokes her head out.§!\n“Ah, it's you.”\n§YShe kicks the wardrobe door shut and flashes in front of you.§!\n“What is it, what is it? Any news?”"
  uma_f_t.21.a: "What's going on with that wardrobe?"
  uma_f_t.21.a.resp: "§YShe looks in the direction you're pointing, and her expression immediately darkens. She turns back and forcefully straightens your head.§!\n“You. Did. Not. See. Anything. Is that clear?”\n§YHer eyes bore into yours until, under intense pressure, you are forced to mutter 'I understand.'§!"
  uma_f_t.21.b: "Doesn't living similar lives over and over get boring?"
  uma_f_t.21.b.resp: "“Probably not.”\n§YShe presses a finger against her puffed-up cheek, striking a thoughtful pose.§!\n“Even though the general outline is the same, every time is actually different. There might be new events, new opportunities, and crises. Even if the script is written, no one can say for sure what the future holds.”"
  uma_f_t.21.c: "What do you want to do in the future?"
  uma_f_t.21.c.resp: "“Think about it later? For now, I'm going to sleep.”\n§YHaving said that, she actually flops onto the bed. Before long, soft breathing sounds come from the pillow—she’s actually fallen asleep!§!"

  UMA_FT_SP: "Transport Metallic Container"
  UMA_FT_SP_DESC: "This thing is surprisingly heavy. Fortunately, our ground support brought mechanical equipment capable of climbing stairs."
  UMA_FT_SP_2: "Activate the Umamusume in the Container"
  UMA_FT_SP_2_DESC: "After arriving at the Capital Science Academy, our scientists used Crystal Carrots to amplify the power and successfully opened the container. Inside lay a bionic Umamusume body. The exterior material is extremely similar to skin, and X-ray scans show an internal structure identical to a normal Umamusume, except it is composed of a specialized nano-material metal rather than cells.\nA manual was found inside detailing a series of procedures, seemingly intended to activate this body."

  uma_fairy_trail_arch: "Space Probe"
  uma_fairy_trail_arch_desc: "We have discovered an ancient ruin on this planet that towers into the clouds. It pierces the sky like a needle, seemingly built to transmit signals to a specific target in space. However, we have found no structures in the direction it points capable of receiving signals. It is worth sending scientists for a field investigation."

  uma_fairy_catch_phrase: "Well, it's a pleasure to see you again."
  uma_fairy_backstory: "An old friend who has waited for you through countless cycles of companionship and solitude."

  uma_commander_trait_sp_ft_desc: ""
  uma_commander_trait_sp_ft: "Fairy Trail"