 uma_mmu_vc_m85_effect_tt: "This will result in:\n£mod_produces_mult£$mod_country_produces_mult$: §R-85%§!\n\n§RNote: This option may lead to very low initial output (Vanilla or Umamusume)§!\nReference Value: 100 £job_uma_carrot_farmer£$job_uma_carrot_farmer$ will produce approximately 0.8 £food£$food$"

 uma_mmu_vc_m75_effect_tt: "This will result in:\n£mod_produces_mult£$mod_country_produces_mult$: §R-75%§!\n\n§RNote: This option may lead to low initial output (Vanilla or Umamusume)§!\nReference Value: 100 £job_uma_carrot_farmer£$job_uma_carrot_farmer$ will produce approximately 2.4 £food£$food$"

 uma_mmu_vc_m65_effect_tt: "This will result in:\n£mod_produces_mult£$mod_country_produces_mult$: §R-65%§!\n\n§YNote: In ideal conditions, (Umamusume) initial output is close to Vanilla§!\nReference Value: 100 £job_uma_carrot_farmer£$job_uma_carrot_farmer$ will produce approximately 4 £food£$food$"

 uma_mmu_vc_m55_effect_tt: "This will result in:\n£mod_produces_mult£$mod_country_produces_mult$: §R-55%§!\n\n§YNote: In ideal conditions, (Umamusume) initial output is slightly higher than Vanilla§!\nReference Value: 100 £job_uma_carrot_farmer£$job_uma_carrot_farmer$ will produce 5.6 £food£$food$"

 uma_mmu_vc_m45_effect_tt: "This will result in:\n£mod_produces_mult£$mod_country_produces_mult$: §R-45%§!\n\n§YNote: In ideal conditions, (Umamusume) initial output is higher than Vanilla§!\nReference Value: 100 £job_uma_carrot_farmer£$job_uma_carrot_farmer$ will produce 8.8 £food£$food$"

 uma_mmu_vc_m25_effect_tt: "This will result in:\n£mod_produces_mult£$mod_country_produces_mult$: §R-25%§!\n\n§YNote: In ideal conditions, (Umamusume) initial output is close to the Mod's original values§!\nReference Value: 100 £job_uma_carrot_farmer£$job_uma_carrot_farmer$ will produce 12 £food£$food$"

 uma_mmu_vc_mp0_effect_tt: "These are the original values for this Mod\nReference Value: 100 £job_uma_carrot_farmer£$job_uma_carrot_farmer$ will produce 16 £food£$food$"

 uma_mmu_vc_p150_effect_tt: "This will result in:\n£mod_produces_mult£$mod_country_produces_mult$: §G+150%§!\n\n§GMan! Ultimate Production!§!\nReference Value: 100 £job_uma_carrot_farmer£$job_uma_carrot_farmer$ will produce 36 £food£$food$"

 uma_mmu_vc_p200_effect_tt: "This will result in:\n£mod_produces_mult£$mod_country_produces_mult$: §G+200%§!\n\n§GDid you know? Sister Rudolf stomps the ground twice, and food actually grows out by itself!§!\nReference Value: 100 £job_uma_carrot_farmer£$job_uma_carrot_farmer$ will produce 48 £food£$food$"

