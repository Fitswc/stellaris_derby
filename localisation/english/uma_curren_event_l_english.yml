 uma_curren_name: "Curren Chan"  #NT!
  
  
 uma_curren.1.title: "The lovely true meaning"  #NT!
 uma_curren.1.desc: "Under your leadership, your country is booming and your strength map is gradually expanding. You have also heard many stories and legends, most of which have no effect except providing free adjustments. A legend about "cute" is buried deep in your memory."  #NT!
 uma_curren.1.a: "..."  #NT!
  
 uma_curren.2.title: "Lovely visit"  #NT!
 uma_curren.2.desc: "Your subordinates said that someone wanted to meet you, and the other party was a "Umamusume" on this ship."  #NT!
 uma_curren.2.a: "Why do you laugh like this? What is the origin of this "Umamusume"?"  #NT!
 uma_curren.2.b: "I was very busy and asked her to make an appointment in advance."  #NT!
  
 uma_curren.3.title: "Curren Chan"  #NT!
 uma_curren.3.desc: "Are you the leader of this country? Curren is very happy to see you."  #NT!
 uma_curren.3.a: "What's wrong with you looking for me?"  #NT!
  
  
 uma_curren.4.desc: "Well... I don’t know if I don’t know, I said that I was practicing under the waterfall before."  #NT!
 uma_curren.4.a: "no idea?"  #NT!
  
 uma_curren.5.desc: "Curren, I want to stay here, but I don’t know if it’s OK?"  #NT!
 uma_curren.5.a: "Why do you want to stay?"  #NT!
 uma_curren.5.b: "Of course"  #NT!
 uma_curren.5.c: "Sorry, I refuse"  #NT!
  
 uma_curren.6.desc: "Because of cleverness, I want everyone in the universe to become happier because of cleverness and cuteness, that is, the end of cuteness!"  #NT!
 uma_curren.6.a: "That being the case, you should be by my side"  #NT!
 uma_curren.6.b: "Sorry, I refuse"  #NT!
  
 uma_curren.6.a.tt: "I am so happy to be Curren. If you have any Curren things to help, please ask me."  #NT!
  
 uma_curren.7.title: "End"
 uma_curren.7.desc: "Curren Chan didn't seem surprised by your decision, but just said to herself in disappointment: "Is it still impossible to achieve it?" You arranged her in a room with dedicated care. But before you could figure out what to do, Zhenzhi disappeared from the room the next day. There was only a small white piece of paper written in gilded font on the bed with "Vanilla Resort"."  #NT!
 uma_curren.7.a: "……"  <"..."  #NT!
  
 uma_curren.8.desc: ""§YFrom Tracen Academy，"Cutie calle angel" with millions of followers on UmaIns. To reach a higher level of "cuteness", one comes to the stage of the universe. With her "lovely" power, rule the country better and explore the unknown ahead together with her.§!\n"Ah, Onichan!"\n§YShe hopped over and stared at you with her clear eyes.§!"  #NT!
 uma_curren.8.a: "Thank you, so Curren. By the way, congratulations on winning URA."  #NT!
 uma_curren.8.a.resp: ""Yes Yes, everyone smiled because of their clever cuteness."\n§YShe jumped back two steps and made a circle on the spot.§!\n"But that's not enough. You have to let the whole universe realize the clever cuteness.""  #NT!
 uma_curren.8.b: "Like that 'Ultimate lovely' legend."  #NT!
 uma_curren.8.b.resp: ""This time is different. You have to work with Curren Chan to turn those legends into reality.""  #NT!
 uma_curren.8.hire: "Welcome!"  #NT!
  
  
  
  
 uma_curren.10.title: "Lovely diffuse"  #NT!
 uma_curren.10.desc: "After you took in real martial arts, you will be very proactive in understanding the current situation of your country. In addition to the very confidential part, you know everything about true intelligence. Unexpectedly, she was unexpectedly agile and gave a unique perspective on issues that need to be broken through in many fields, which inspires you. In addition to political affairs, Curren Chan seems to be very keen on increasing your popularity among your subjects and calls it "a cute and cute person who is exclusively Curren.""  #NT!
 uma_curren.10.a: "What is cute and cute? Go and investigate"  #NT!
 uma_curren.10.b: "She is really cute..."  #NT!
  
 uma_curren.11.title: "Research Completed"
 uma_curren.11.desc: "Judging from the feedback collected, the public may not know much about the definition of the word "cute", but when they see real cleverness, they can always inexplicably cheer up or calm down. From this point of view alone, she does not seem to have any adverse effects."  #NT!
 uma_curren.11.a: "Really good"  #NT!
  
 uma_curren.12.desc: "Life in your country is really amazing. But what makes you happier than that is, it is true that you can still feel the cleverness of "cute" here."  #NT!
 uma_curren.12.a: "I hope this country will also be recognized by you in the future."  #NT!
 uma_curren.12.a.repo: "Haha, everyone is also very good people, your leadership skills are really great."  #NT!
 uma_curren.12.b:"Speaking of which, why should I be so persistent in "cute" when I am Curren Chan?"  #NT!
 uma_curren.12.b.repo: "As for being Curren, when I was very cute, I always make my family happy because I was very cute. Curren just thinks that if this ability spreads, it will not only be the people around Curren, but also more people, and everyone can feel happy because of Curren. \nAnd that is, the Curren trainer, that is, his brother, has also paid a lot for his Currenness... The Currenness doesn't want to disappoint him."  #NT!
 uma_curren.12.c: "I wonder if you have ever heard of the legend about ‘cute’?"  #NT!
 uma_curren.13.desc: "Well...I don't know. The cleverness probably hasn't reached the point where it becomes a legend."  #NT!
 uma_curren.13.a: "§gShe seemed to know something, but now was clearly not the time to talk about it.§!"  #NT!
  
 uma_curren.20.title: "Remains"  #NT!
 uma_curren.20.desc: "Your advance team discovered a ruin. Judging from the returned information, it was left by a race called Vanilla Stars. Vanilla Stars are a scientific-oriented race. They were once famous for their superb science and technology, but legend has it that they suffered a certain blow, and the entire Vanilla Stars disappeared, and Vanilla Stars completely became one of the countless forgotten dusts in the vast sea of stars. For some reason, Zhen Zhixing must participate in it in person."  #NT!
 uma_curren.20.a: "...There are also heard that the Vanilla Stars chose to destroy the entire planet by themselves."  #NT!
  
 uma_curren.21.title: "Going further"  #NT!
 uma_curren.21.desc: "As your subordinates gradually discover the remains, more and more vanilla star people's science and technology will be used by you. During the break, you talked about the results you got - Curren Chan is now a well-known idol in your country, and even has a considerable reputation among the stars. Whether deserted or prosperous, almost every space trading station can find the shadow of Curren Chan spreading "cute". The "lovely end point" that Curren Chan has always been concerned about seems to be very close. \n'Then why do they destroy the knowledge gained from their tribe’s struggle for generations? ’"  #NT!
 uma_curren.21.a: "Because people are always afraid of what they don't know"  #NT!
  
 uma_curren.22.title: "Unknown invitation"  #NT!
 uma_curren.22.desc: "Long before you met Curren Chan, the subordinates who stayed in the ruins sent you a picture - the pure white invitation letter seemed particularly abrupt among the gravel rubble, but the gilded "Vanilla Resort" big word never seemed to have been baptized by time. On the back of the invitation letter, the three words "Curren Chan" are clearly written."  #NT!
 uma_curren.22.a: "But there will be people working hard for that moment, even the end of the unknown is the depths that cannot even reach even imagination."  #NT!
  
 uma_curren.23.title: "Hiding"  #NT!
 uma_curren.23.desc: "You hide what you saw and as the team continues to explore, you discover a strange building called the "Vanilla Star Technology Museum"."  #NT!
 uma_curren.23.a: "Let's continue"  #NT!
  
 uma_curren.24.title: "α=1" #NT!
 uma_curren.24.desc: "The remains of the Vanilla Star Man have been basically searched, but as the saying goes, "The more you know, the more you feel ignorant," the Vanilla Star Man's technology is like a radiation map, and the results obtained from the simple excavation are just walking around the periphery. Scientists have brought back nothing of valuable except a huge sphere-like body composed of countless planes with almost zero reflectivity."  #NT!
 uma_curren.24.a: "What is this thing? You must analyze it with all your strength!"  #NT!
  
 uma_curren.30.title: "Cute unknown"  #NT!
 uma_curren.30.desc: "After the completion of the institute, dozens of the top scientists in the country began research day and night, but there was still no substantial progress. One day when you were worried about this, you suddenly noticed a familiar figure appeared in the monitor in the core area of the "spherical-like" installation. \nThe wonderful thing is that a sphere-like body that has no response to all connection methods in a few months. Curren Chan didn't bring any protective gear, and just touched the surface of the sphere like this. When you arrive with the guard, the sphere-like body has become a pure black high-dimensional geometry that has only appeared in quantum computer simulations."  #NT!
 uma_curren.30.a: "Curren Chan? ! How did she get in!"  #NT!
  
 uma_curren.31.desc: "'Star of Berehen, then just...'\nYou see Curren Chan taking out a white card. The gilded "Vanilla Resort" looks particularly dazzling under the light. When you lift your hand, the card slowly floats up and flies straight towards the keyhole created by Berehenheng. In an instant, a stream of energy surged towards the true wisdom."  #NT!
 uma_curren.31.a: "Curren Chan!"  #NT!
  
 uma_curren.32.desc: "No, no, this is not the "future"!"  #NT!
 uma_curren.32.a: "What the hell are you doing?"  #NT!
 uma_curren.33.desc: "Sorry, I've been using you for so long."  #NT!
 uma_curren.33.a: "Is it for the device to use us?"  #NT!
 uma_curren.34.desc: "That's right, to find the Star of Bethlehem."  #NT!
 uma_curren.34.a: "For the ultimate of ‘cute’?"  #NT!
 uma_curren.35.desc: "That's right, to find the Star of Bethlehem."  #NT!
 uma_curren.35.a: "Our researchers went all out and could not analyze it. It should be said that it is waiting for you!"  #NT!
 uma_curren.36.desc: "...Vanilla Star Man is actually very pitiful. For such a vague "future", we can give the strength of the whole clan. Thousands of years, ten thousand years, no, it has been longer than that. This ‘Belleheng Star’ is a timeline spanning device that uses the user’s three qualities as fuel to know countless possible futures."  #NT!
 uma_curren.36.a: "Sounds very tempting"  #NT!
 uma_curren.37.desc: "Curren thinks that in order to select the correct answer among the thousands of choices, it is important to first eliminate the wrong answer. \nThis card with the words ‘Vanilla Resort’ and your name it releases a special signal. The result of tracking it is that such signals are almost all over the universe - the technology of the Vanilla Stars is not perfect. The signals you tracked are the remnants of the timeline that has existed in a clever way. But as long as the correct timeline is found cleverly, the universe will automatically eliminate these remnants, leaving only the final path."  #NT!
 uma_curren.37.a: "Why is it an invitation letter, and it is also called a ‘resort’."  #NT!
 uma_curren.38.desc: "That was the first time I tried it, the Vanilla Stars guided the clever illusion, and the Star of Berehen should have remembered this setting. Originally, cleverness... should have been burned out as fuel in that spiritual ‘resort’ because of the endless timeline. But Curren seized the opportunity and escaped, and the Vanilla Star was left there, probably disappeared along with the broken Star Berehen. You know everything after you escape."  #NT!
 uma_curren.38.a: "Since I escaped, why do I still need to find it back?"  #NT!
 uma_curren.39.desc: "This timeline does not belong to the cleverness, nor does it mean that people are very important to cleverness. No matter how clever he is, it is better to be "cute" or not, without her, nothing will make any sense."  #NT!
 uma_curren.39.a: "Are you not afraid of failure?"  #NT!
 uma_curren.40.desc: "If the cleverness is not completed before a certain node, the self-healing mechanism of the cosmic timeline will regard the cleverness as a threat, and eliminate the cleverness itself and all the remnants in unknown events in which timeline."  #NT!
 uma_curren.40.a: "You're crazy..."  #NT!
 uma_curren.41.desc: "Curren, I like the days of living in your country. Everyone feels happy because of their cleverness and cuteness, and they feel happy because of your leadership... But you are an outsider after all. The stories you tell may also come out casually."  #NT!
 uma_curren.41.a: "I admit to hiding something from you, but never lie."  #NT!
 uma_curren.42.desc: "The choice is up to you, your friend. But just like Curren just said, no matter how you choose, Curren will not regret the past time."  #NT!
 uma_curren.42.a: "I'm sorry, friend. But we must study this device thoroughly."  #NT!
 uma_curren.42.b: "If possible, please let us help too."  #NT!
  
 uma_curren.43.title: "Ending of cute"  #NT!
 uma_curren.43.desc: "Curren Chan's eyes drooped, staring silently at the ground of the institute, allowing the researchers to shut down the Star of Bethlehem. The keyhole on the surface of the Star Berehend broke and re-decomposed into countless planes. \n"If you want, my people and I will still welcome you." \nCurren Chan shook his head, then nodded, and whispered: "Thank you, but Curren, I want to take a break now." \n"As you wish." \nCurren Chan didn't take a few steps, and suddenly a familiar voice came from the void: "Sure enough, you failed." \nThe sudden appearance of "§RCurren Chan§!" hugged Curren Chan from behind, with a smug smile on her face. \n"Then, it's time to clean up the garbage~"\n"Wait, who are you!"\nThe two disappeared in the moment. Looking at the empty laboratory, you and the soldiers looked at each other."  #NT!
 uma_curren.43.a: "Where is this? What are we doing?"  #NT!
  
 uma_curren.44.title: "Lovely future/past"  #NT!
 uma_curren.44.desc: "No! It's okay for me, the user. If something happens, you may be the same as the Vanilla Starman...\n"So, I need to ask you, the person who knows the Vanilla Starman's device, to lead us. I think others should not have any objections."\n"Always support Miss Curren!"\n"Thank you..."\n"You're welcome, we are friends, right?"\n\nThe white invitation seemed to flash a light of recognition when he was taken over by Curren. After swallowing the invitation, the star Berehen began to tremble gradually, and the fluctuations emitted spread from the institute and spread to the edge that the perception radar could not reach. Curren Chan, you, the soldiers you follow, researchers in the institute, the people of your country, the space caravans stationed at the edge of the wormhole, the black hole worms being hunted, and the galaxy group being hunted... The "cute" footsteps all over the place, and they all felt a certain calm, and they all turned their sights and perceptions to the direction where the star of Berehen is located. \nThe crisp "click" sound gently hit the spirits of all living beings. The Star of Bethlehem gradually melted from the eyes of everyone present, without the pure whiteness of the body, and was little by little applied to the surface of the space, sticking to the sight. When I came back to my senses, I was already in conceptualized ⌈⌋. \nYou look back and look behind you. \nTwo you look behind you. \nFour you look behind you. \n46.5 billion light years away, you look behind you. \n\nCountless timelines are displayed in front of you. Seeing so many of your backs must be not so comfortable, so you turn your head and look in a real Curren direction—"  #NT!
 uma_curren.44.a: "Welcome to Vanilla Resort."  #NT!
 uma_curren.50.title: "Win!"  #NT!
 uma_curren.50.desc: ""Everyone, the Star of Berehend has finally been destroyed by us. It depends on your full help to achieve the current results. It is great to meet you all."\n"Cute and Curren!"\n"You are so handsome when you command the fleet just now. Thank you, for your willingness to trust Curren."\nI'm too modest. If you don't have your opinion, the results will be different. \n"Hehe, if you only have a clever mind, you will definitely not be able to reach today." \n Are you going back? \n"Well, because my brother will witness the Curren future together."\nI wish you happiness. \n"Don't be so sad! This is the contact information of Curren. If you need Curren, just call Curren~""  #NT!
 uma_curren.50.a: "Eh?"  #NT!
  
  
