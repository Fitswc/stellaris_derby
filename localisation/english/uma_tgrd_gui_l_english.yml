 uma_threegodness_rd.10089.title: "[This.GetName]核心塌缩"  <"[This.GetName] Core collapse">  #NT!
 uma_threegodness_rd.10089.desc: "由于对地核的过度采集，[This.GetName]的核心已经被采集殆尽。现在[This.GetName]的地表正在慢慢坍塌。现在情况已无法挽回。在星球塌缩破裂前我们还有一段时间，或许我们还能做些什么......"  <"Due to excessive collection of the earth core, the core of [This.GetName] has been completely collected. Now the surface of [This.GetName] is slowly collapsing. The situation is now irreversible. We still have some time before the planet collapses and breaks, maybe something else can we do...">  #NT!
 uma_threegodness_rd.10089.a: "好的"  <"OK">  #NT!
  
  
  
  
  
