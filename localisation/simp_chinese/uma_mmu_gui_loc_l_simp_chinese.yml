uma_mmu_donate: "‘啊，钱包里空空如也啊’F在更新完又一个群友的需求后正准备买个KFC时看到自己空无一物的钱包叹道。'那,可,可,可不可以,打赏一下?'她把头朝你这边转了过来，露出了可怜巴巴的表情。'我,我会分给其他人的,顺便，也帮他们买一份....而且,我会记住你的哦!\n啊，看来只剩我一个了呢....'\n\n\n\n\n\n£uma_donate_wechat£\n\n\n\n\n\n\n谢谢！"

