l_english:
  
 uma_ar_mejro_ardan: "A one-way ticket"  #NT!
 uma_mejro_ardan.1.title: "Odysseus and his one-way ticket"  #NT!
 uma_mejro_ardan.1.desc: "When this rift tear opens the universe, we receive a faint neutrino signal. After decryption by the R&D department, we finally believe that this beam of signal came from a private satellite launched by the Aerospace Group founded by the "Mejro Family" in the last century, and its purpose was to verify the possibility of flying on Ma Niang. \nFor records of that era, our database only retains a timeline record that records the last conversation between the astronaut and the Control Center: \n "Control Center, I don't know exactly what I was pulled by, but the only thing I know is that... cannot get rid of it with the power of the rocket..."\n"... Method..."\n"I think there is no more."\n"I'm sorry...we... can only wish you good luck."\n" Please don't be discouraged, and don't be because of this Disdained by the failure of the expedition, we have achieved the ultimate we can do. When we resist and fear trying the next one because of this failure, that is the beginning of the real failure. I think I will sleep, hoping that when I open my eyes again, our rockets will be able to break out of the solar system. I look forward to the arrival of this day and firmly believe... Confidence... Confidence... We will definitely be able to do..."\nWe are sure there must be an aircraft inside, but which one? Is it related to the missing astronaut? Is that astronaut still alive? Or is this just another inexplicable communication from within the vision? \nI want to find out. The Ma girls in the Mejro family seemed to be extremely enthusiastic about this exploration."  #NT!
  
 uma_mejro_ardan.1.a: "Let's go in and take a look"  #NT!
  
  
 uma_mejro_ardan.2.title: "The long journey"  #NT!
 uma_mejro_ardan.2.desc: "The ball brought several members of the expedition team into the rift. Surprisingly, after a few minutes, the surrounding environment did not change significantly, and it was still as calm as the universe outside. Our expedition members quickly became sleepy, but according to the navigation rules, sleeping during the expedition was not allowed. "Uh, after I go out I want to add a Bafil to my dinner"\nJust as they imagined the taste of Bafil tonight, the gravity in the instrument suddenly surged, and our scouts plunged into the atmosphere and fell heavily on the grass. Fortunately, the ball has excellent performance, and there is no big loss except that the ball surface is wrapped around several circles. \nIn a moment, our expedition team set foot on this land"  #NT!
 uma_mejro_ardan.2.a: "Tonight's Parfait cancelled"  #NT!
  
 uma_mejro_ardan.3.title: "Pioneer"  #NT!
 uma_mejro_ardan.3.desc: "There are many rare species here, and some botanists or biologists adhere to the principle of "all come" and take away the "special products" here on the way to their destination. Please don't be too harsh, scientists always like these novel things. \nNot far away, a rocket covered with green vegetation and rust appeared in front of everyone. The rocket was almost broken into two pieces. The team members subconsciously stood in front of the rocket's wreckage and observed silently, praying that the three goddesses would take away the hero's heroic soul. \nThe team members found the astronaut sitting on the chair in the rocket's control room. Her original body had turned into bones, and she could wear the bulky space suit; her no longer moved body also turned into a place for vegetation. Now she is simply integrated with nature, and a brilliant flower grows from her empty eyes. \nShe may have passed away due to lack of food or something before the Rockets arrived on the planet\nHold her diary in her arms, which records the first day she sent and the last day before her death. At the end of the diary, she wrote in crooked handwriting: \n "I am already from my motherland, too far... too far..." People at that time thought that she would be a star version of Columbus or Magellan, but she did not expect that she was not even as good as Robinson on the isolated island."  #NT!
 uma_mejro_ardan.3.a: "We're here to pick you up home"  #NT!
  
 uma_mejro_ardan.4.title: "Iliad"  #NT!
 uma_mejro_ardan.4.desc: "After several days of traveling to the marked signal source, our team members found that they were in a crystal field, and their quality was different from what they collected or purchased from the market. The quality here was better than outside, and its hardness could also be used as a shield for casting hulls, which was tough under any circumstances. \nThey haven't forgotten their purpose yet, so they can only continue to move forward with some reluctance. \nWhen they walked to the depths of the planet, they found a trace of life, and who had been here before, and for a long time. They naturally thought of the astronaut, and the portable survival tools and backpacks they discovered later in the era also confirmed this. A little further away, they also found a rocket wreckage in the last century with traces of repairs on it, but obviously she did not succeed. \nInvestigators found several notebooks in the toolkit, and the pages were yellowed, as if they could pinch the paper into pieces by turning it gently. And where the astronauts lived, they also found handwriting on some of the marks on the ground, perhaps continuing the content written in the notebook. They carefully scan the notebook and other places with leftover handwriting and transmit it to the command center simultaneously. \n Maybe she had thought that one day she would definitely be found by people of the same clan, it was just a matter of time, and she herself believed that the things she wrote could also help them a little. She wrote at the beginning of each note and at the beginning of each chapter: \n "To my dear motherland and comrades... Hey! If your surname is Mejro, not...even if you don't surname Mejro...""  #NT!
 uma_mejro_ardan.4.a: "It shouldn't be the end yet"  #NT!
  
 uma_mejro_ardan.5.title: "The Umamusume in the painting"  #NT!
 uma_mejro_ardan.5.desc: "When the expedition team went to the core of the planet through the hole on the surface of the planet, they found on the way that the crystals here were strangely connected together, transporting something deeper like blood vessels. \nAs they deepened, the secret veil here was gradually revealed. \n Located in the heart of the planet, there is a huge diamond crystal there, and the crystals around it are clustered around it. When investigators noticed the things in the diamond crystal, they were all dumbfounded. \nThe diamond-shaped crystal was placed in the center, and what was wrapped in it was the Meba Ardan they had been looking for for a long time. She was wearing the 20th century space suit; she closed her eyes and her hands were quietly overlapping, showing her childlike demise, making everyone feel that no matter how she entered the crystal, how she was emotional at that time, it might be forced or actively accepted, but at least she was very happy as she looked at the moment. Now she looks like a prehistoric creature immersed in amber. She has not been aged or decayed, but has become a bone frame, but is immersed in crystals, as if all the youth and beauty in the world are permanently surrounded by her, so that she can maintain her youthful, beautiful and heroic appearance. Just like the image of "My White Ardan, wearing a space suit, is always in people's hearts and artistic creations. Who could have thought that she was an old man who lived nearly two or three hundred years ago? \nThey couldn't help but sigh that Ardan, the "painted man" who used to be only in book illustrations or similar wall-painted banners, really appeared in front of everyone, and there was some excitement of the little idol seeing their worship object with their own eyes. \n When the official staff is still thinking about whether Ardan still has vital signs. If he moves this central crystal without authorization, will it lead to the collapse of the planet? On the other side, members of the Mejro family have taken out the cutting equipment and are ready to send Ardan back to Tresen. \nOnly at this time, the Megumi family will put aside their reserve and elegance. \n"Hey! You guys are so reckless!""  #NT!
 uma_mejro_ardan.5.a: "Our Sleeping Beauty"  #NT!
  
 uma_mejro_ardan.6.title: "Time of melting"  #NT!
 uma_mejro_ardan.6.desc_a: "Everyone entrusted Ardan's life to Agnes Tachyon, who was in charge of the project, and told her a lot of words, as if she was a little careful. \nScientific researchers familiar with Agnes Tachyon often describe Agnes Tachyon's experiments: "Although the process is always so thrilling, you will find that she is a technique similar to showing off skills and bluffing. In fact, her efficiency and success rate are both fast and safe. She is the kind of person who is extremely terrible." I don't know if Agnes Tachyon listened carefully to the instructions, or if she herself knew that this was an extremely serious and serious important matter, and she should not be careless. Throughout the whole show, you can see that she was doing it pragmatically and did not do anything extra, which also made the people from the side feel relieved. \nThe project lasted for less than an hour and the "Ice Melting Operation" was announced to be completed. Ardan is now lying calmly on the recuperation bed, her face is a little rosy, and her slow and steady breathing makes everyone know: she is still alive and is asleep. No one is excited about the people of the Mejro family. If they weren't by Mejro Ardan now, they would have shouted a few words and then ran thousands or tens of thousands of meters on the playground. \nWhat Ardan has to do now is to calm down and cultivate herself, and when one day she wakes up herself."  #NT!
 uma_mejro_ardan.6.desc_b: "Everyone entrusted Ardan's life to the scientific research manager who was in charge of the project, and told her a lot of words, as if she was a little careful. \nShe herself knew that this was an extremely serious and serious important matter and should not be careless. Throughout the whole show, you can see that she was doing it pragmatically and did not do anything extra, which also made the people from the side feel relieved. \nThe project lasted for less than an hour and the "Ice Melting Operation" was announced to be completed. Ardan is now lying calmly on the recuperation bed, her face is a little rosy, and her slow and steady breathing makes everyone know: she is still alive and is asleep. No one is excited about the people of the Mejro family. If they weren't by Mejro Ardan now, they would have shouted a few words and then ran thousands or tens of thousands of meters on the playground. \nWhat Ardan has to do now is to calm down and cultivate herself, and when one day she wakes up herself."  #NT!
 uma_mejro_ardan.6.a: "Well done"  #NT!
 uma_mejro_ardan.7.title: "Citizens from the Old Age"  #NT!
 uma_mejro_ardan.7.desc: "Ardan woke up. This is actually a secret, not many people know it. She was able to get out of bed soon, and the medical staff advised her to rest first, but she refused, and finally agreed. \nIn order not to disturb Ardan's rest, the Mejro family sent only three small representatives. \nArdan always goes to the garden outside, and at this time there will always be three little guys following him secretly. She always greeted them and joked: "What are you always standing there stupidly? Are you afraid of me?"\n Whenever Ardan was surprised by the current progress, they couldn't help laughing. The territory of their country was no longer limited to one planet or one galaxy. They had already become an interstellar civilization that the entire Milky Way could not ignore. She still needs to adapt. Just like she only realized that she had become a spiritual symbol of a generation not long ago\nThinking that familiar people and things had passed by early with time, she couldn't help but feel sad. She often sobbed in the room when the three little representatives left. \nWhen they asked why Ardan was inside the crystal at that time. \n "They... are not very ordinary, they can grow naturally, which is incredible, but they lack a heart that pulsates like us, and I thought, 'Can I? Anyway, I will die from food scarcity any day.' After thinking about this, I took the initiative to contact them and finally integrated into the crystal... In fact, this experience may be somewhat similar to vegetatives. When the investigation team came, I could feel them, they were like knights. Now it seems that this choice is not bad." Ardan said with a chuckling. \nThe vigorous vitality that encouraged Ardan when he was young appeared in his heart again. She asked a representative to buy many books for her and learn about science and humanities in the past two hundred years. \nIt can be seen that Ardan will never let go of everything and live a peaceful life somewhere."  #NT!
 uma_mejro_ardan.7.a: "Awesome"  #NT!
  
  
  
 uma_mejro_ardan.adname: "Mejro Ardan"  #NT!
 uma_mejro_ardan.8.desc: "First meeting, Miss President. This time I communicated with you is my personal request."  #NT!
 uma_mejro_ardan.8.a: "What's the matter with Miss Ardan?"  #NT!
 uma_mejro_ardan.9.desc: "I hope to get a chance to take the job. I don’t want me to live a good life like a rare animal in a zoo. I hope to continue to engage in my career... If this profession requires examination and evaluation, please give me such an opportunity. Even if I fail the exam, I will not take my anger on you. I have done my best to do this..."  #NT!
 uma_mejro_ardan.9.a: "So do you still want to become a scientist?"  #NT!
 uma_mejro_ardan.10.desc: "Why don’t you think about it, Miss President? I filled in this choice when I urinated and hoped to fight for it for the rest of my life."  #NT!
 uma_mejro_ardan.10.a: "But can your body...support your dream?"  #NT!
 uma_mejro_ardan.11.desc: "My body is no longer in the way... Otherwise, the chief astronaut of the UMAS-Tracen-Soyuz would not be me, and these can be proven."  #NT!
 uma_mejro_ardan.11.a: "Despite this, we still hope that you have a good rest"  #NT!
 uma_mejro_ardan.12.desc: "Miss President, I have been resting for more than two hundred years."  #NT!
 uma_mejro_ardan.12.a: "Well, if you can pass the exam, then we will accept you"  #NT!
 uma_mejro_ardan.12.a.repo: "Thank you, Miss President. I'm glad I'm about to go back to my position."  #NT!
 uma_mejro_ardan.13.title: "Unified Exam"  #NT!
 uma_mejro_ardan.13.desc: "The news that Ardan is about to come back has been spread through various tricks, and the official later issued a formal notice to confirm the truth of the news. Although people are enthusiastic, they can think independently. They don’t form a group to play banners to go to the place where Ardan rests, but occasionally some small fans will come to the vicinity in groups of three or three to see if they have the chance to see the true appearance. But unfortunately, Ardan has never gone out. People guess she is cultivating well, but in fact she is learning the knowledge of this century day and night. Knowledge from the 23rd century crashed into her 20th century brain with just a slight push. \n With the end of a unified examination for scientific and technical personnel, some particularly meticulous people saw a familiar name from the recruitment list of the National Academy of Sciences: \nMejro Ardan."  #NT!
 uma_mejro_ardan.13.a: "She made it"  #NT!
  
  
 UMA_MEJRO_ARDAN_SAVE_AD: "Melt"  #NT!
 UMA_MEJRO_ARDAN_SAVE_AD_DESC: "Our expedition brought Ardan, wrapped in crystals, back in the rift. It is obvious that it is impossible for us to put this crystal coffin in the museum. In order to confirm whether Ardan was trapped inside survived, we must rescue her from it."  #NT!
  
  
  
 uma_mejro_ardan.14.desc: "§YMejro Ardan, with his eyes white, held the textbook in his hands, walking lightly, like a feather falling to the ground, then rising again and falling once more. She has adapted quite well to the changes of the present era. Her face is filled with the joy and liveliness of a child, along with an inevitable sense of curiosity.\nThen she immediately stopped, her face showing surprise. She had no idea that the student union secretary was standing here so quietly.§!\n"Hello, Miss President, do you have official duties here?\nIf you need it, I can accompany you. I am very familiar with every colleague and professor here.""  #NT!
 uma_mejro_ardan.14.a: "No, I'm just here to see how you are"  #NT!
 uma_mejro_ardan.14.a.resp: "§YShe smile slightly§!\n "Don't worry about me, Miss President. Anyway, I'm a hundred years old in terms of the time I was sealed! The various knowledge and theories of the present dazzled me. To be honest, the physics knowledge I learned in the past is like a waste of time. In fact, this makes me feel a little sad. It is for this reason that I am willing to accept such advanced knowledge now, and they always benefit me a lot. I believe that in the near future, I will be able to return to my job.""  #NT!
 uma_mejro_ardan.14.b: "It seems you get along well with them"  #NT!
 uma_mejro_ardan.14.b.resp: ""Yes, Miss President. I can even proudly tell you that I can recognize the faces of every colleague in this facility and call them out!"\n§YA look of pride did indeed appear on her face, looked so gentle, so humble.§!\n"They taught me the current physics and aerospace science, and taught me the modern common sense and the history of that generation to the present. Without them, I am still trying to read the textbooks to the point. Yes...they helped me a lot.""  #NT!
 uma_mejro_ardan.14.c: "I believe you can still work, but we are afraid that you will have such an accident again"  #NT!
 uma_mejro_ardan.14.c.resp: ""At that time, I had thought of all the difficulties and despair that I might encounter. Others also said that even if my body survived the simulation test, I would not survive the real space environment. But even so, I still chose to board the Rockets."\n"A step back means completely rejecting the once firm-willed self; we have developed to the present, not by souvenirs of the past, but by our belief that we can strode forward with our heads raised.""  #NT!
  
 uma_mejro_ardan.14.hire: "Welcome back"  #NT!
 uma_leader_ardan: "Aerospace pioneer Mejro Ardan"  #NT!
 uma_mejro_ardan.15.title: "Same day from hundred years ago"  #NT!
 uma_mejro_ardan.15.desc: "At some point, a planet suddenly appeared before discovering Ardan's rift. It seems that the rift spit out the planet that the scientific expedition team boarded. We are not very clear about the reason, but the fact is that we have another planet that can be colonized."  #NT!
 uma_mejro_ardan.15.a: "Very good"  #NT!
  
 uma_pc_ardan_planet: "Otroy"  #NT!
  
  
