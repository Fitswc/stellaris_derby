 #uma_crisis.6666.desc: "Cooperation? ... Cooperation! ? You are so ridiculous. You slaughtered all the species in the galaxy and even used the people as firewood. Now you are talking to us about cooperation! ? Hahahaha, hypocrisy! You must be afraid of our invincible fleet, and you are cooperating because you are exhausted by our attack. Sorry, we refuse. Go back to where you came from! Go away!"
