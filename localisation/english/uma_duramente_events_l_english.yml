uma_duramente_anomoly: "War Remains"
uma_duramente_anomoly_desc: "After the completion of the archaeological work at the Three Goddesses Ruins, we gained not only the leftover knowledge, but also deciphered a mysterious coordinate within our territory from them. Through tracking the coordinate, we discovered an unremarkable planet."
uma_duramente_site: "Ancient Wreckage"
uma_duramente_site_desc: "When our science ship's sensors scanned the planet, they accidentally found unnaturally occurring alloy fragments on it. These alloys are almost identical to those used in modern warships. Scientists speculate that a large-scale battle once took place on this planet, which is why such a huge quantity of alloy fragments were left behind.\nAfter more detailed scanning, we actually discovered a structure similar to a warship beneath the planet's surface!\nCould it be an ancient sanctuary?"
uma_duramente.3.desc: "When our science ship's sensors scanned the planet, they accidentally found unnaturally occurring alloy fragments on it. These alloys are almost identical to those used in modern warships. Scientists speculate that a large-scale battle once took place on this planet, which is why such a huge quantity of alloy fragments were left behind.\nAfter more detailed scanning, we actually discovered a structure similar to a warship beneath the planet's surface!\nCould it be an ancient sanctuary?"
uma_duramente_sp_everywhere: "Ancient Wreckage"
uma_duramente_sp_everywhere_DESC: "When our science ship's sensors scanned the planet, they accidentally found unnaturally occurring alloy fragments on it. These alloys are almost identical to those used in modern warships. Scientists speculate that a large-scale battle once took place on this planet, which is why such a huge quantity of alloy fragments were left behind.\nAfter more detailed scanning, we actually discovered a structure similar to a warship beneath the planet's surface!\nCould it be an ancient sanctuary?"
uma_duramente.3.title: "Everywhere"
uma_duramente.3.a: "Really or not?"
uma_duramente.3.b: "I've seen a lot of weird things"
uma_duramente.4.name: "Nanomaterial Alloy Spaceship"
uma_duramente.4.desc: "Our scientists have definitely never seen such a warship design. They are amazing! It's like they have life, even after thousands of years have passed!\nWhen we broke through an iron wall, it only took a day to recover. Maybe they are a kind of memory nanomaterial alloy. Perhaps the experts need to act quickly, otherwise they might get trapped in these warship remains."
uma_duramente.4.a: "Maybe a bomb can help us"
uma_duramente.5.name: "Non-exist"
uma_duramente.5.desc: "It's terrifying! The deeper we go, the more restless we feel, as if someone is watching us. Some experts even hear strange voices when resting quietly. Despite this, we still choose to continue approaching the entrance of the underground building; maybe in a few days we can break through the final obstacle and enter the underground facility."
uma_duramente.5.a: "Move forward"
uma_duramente.6.name: "Behind the Door"
uma_duramente.6.desc: "The drilling rig successfully broke through the door of the underground building. It's hard to imagine that the passage behind such a huge door can only accommodate one person. On the way forward, experts saw many skeletons that fell in the tunnel and were assimilated by metal. They might have been Umamusume during their lifetime; this scene made experts fall into deep thought: why would these metals assimilate these Umamusume soldiers? Were these Umamusume soldiers assimilated after death, or did they die after assimilation?"
uma_duramente.6.a: "It's incredible"
uma_duramente.7.name: "Traces of Life"
uma_duramente.7.desc: "The end of the road opened up, and our experts found traces of Umamusume's life inside, and the traces looked very new. This may indicate that when we first started excavating, the creatures living here noticed something unusual and left in advance! The equipment found at the scene is all powered by electricity, and the power source is the undamaged cold fusion battery in the warship; the food is made from compressed algae. The owner here seems to have left in a hurry. I wonder if they will come back?"
uma_duramente.7.a: "Then wait and see"
uma_duramente.7.b: "Look around"
uma_duramente.8.name: "In the Secret Passage"
uma_duramente.8.desc: "The stationed security team found an unconscious Umamusume in the hidden secret passage! After examination by experts, it was found that the reason for her coma was hunger and dehydration. What's surprising is that in the serum test, it was found that compared with the factor group of modern Umamusume, the factors of this Umamusume seem to be quite different. She has been hiding in the secret passage for an unknown amount of time, so much so that she has eaten up all the algae in the secret passage!\nTaking her back to Tracen for further medical treatment is certainly an option, but various microorganisms and viruses in modern society may be a severe challenge to her body."
uma_duramente.8.a: "Bring her back"
uma_duramente.8.b: "Inject glucose into her, leave some food, and then leave"
uma_duramente.10.title: "Ancient Radish"
uma_duramente.10.desc: "After sending that Umamusume away, our experts can finally give full play to their abilities! After studying the entire warship site, we found that the technology contained in it is much more advanced than our current stage. And from it, we found a special crystal radish that can amplify the energy of homogeneous crystal radishes!\n\nNow, that Umamusume is being carefully taken care of by us. She will probably wake up soon."
uma_duramente.10.a: "It's of great significance"
uma_duramente.11.title: "Ancient Umamusume"
uma_duramente.11.desc: "That Umamusume finally woke up under our careful care. Facing the unfamiliar environment, she seemed very calm. When the sun was about to set, she requested to meet [Ruler.GetTitle]"
uma_duramente.11.a: "Of course, although I want to eat"
uma_duramente.12.desc: "……Are you a new Umamusume civilization? What do you believe in? The Three Goddesses... or..."
uma_duramente.12.a: "Of course; besides, we found you under a relic marked in the Three Goddesses Ruins"
uma_duramente.13.desc: "Three Goddesses Ruins... It seems that tens of thousands of years have passed... Since you are descendants of the goddesses, then you are the meaning I fought for back then. Although the previous civilization has disappeared, the spark has been passed down. I have lived under the relics for so long that I have no concept of time... But now, maybe I can do something more meaningful. Can you let me stay? If you believe in the goddesses... let me stay as a fleet commander. Also, my name is Duramente."
uma_duramente.13.a: "The Three Goddesses brought us together, [This.GetName] welcomes you"
uma_duramente.13.b: "No, lady, Tracen has no rules for letting the elderly play."
uma_duramente.13.b.tt: "Gain Imperial Reformation: Crisis Thought Theory\nGain bonuses when entering war: \n\n$mod_country_unity_produces_mult$+60\n$mod_planet_jobs_alloys_produces_mult$+20%\n$mod_planet_jobs_consumer_goods_produces_mult$+20%"

