uma_ap.40.title: "铸星计划启动"
uma_ap.40.desc: "经过漫长的研究和验证，我们现在终于有条件和能力将我们身体中的每一个因子进行替换，产生更加强健的后代。尽管我们从其他马娘嘴中听说过有关其他旧文明因为因子而毁灭这件事，但我们相信我们可以掌控得好\n现在我们将开始逐步更新国民体中的因子。"
uma_ap.40.a: "让我们见证这份力量吧"














