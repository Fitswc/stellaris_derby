l_simp_chinese:
###飞升有关本地化###
uma_abandon_normal_ascension:0 "由于马娘的§Y身体§!和§Y灵魂§!§R非常特殊§!，她们并不能够采用一般有机体的飞升路径。"
###全身全灵
ap_uma_zenshizenren:0 "全身全灵"
ap_uma_zenshizenren_desc:0 "£uma_sd£§Y赛马娘:星海德比§!\n以往，每一代马娘中只有屈指可数的精英才能在比赛中觉醒“领域”。而如今，经过对领域漫长的统计、研究、实验，我们初步掌握了领域的秘密：当身与心的目标极端统一时，领域就有可能被激发。\n现在，我们的科学家可以通过心理学手段调整马娘的情绪，尽可能地实现身心同步并以此激发领域。这使得马娘们能不只在赛场中开启领域，还能在各行各业的工作中开启领域。"
uma_will_enable_zenshizenren_ap:0 "我们将开启一个§Y特殊项目§!，以帮助§Y所有§!马娘开启§Y领域§!"
uma_requires_technology_uma_terriroty_in_use:0 "$TRIGGER_FAIL$需要科技§Y领域启发与应用§!"
uma_must_be_toresen_auth:0 "$TRIGGER_FAIL$必须要是§Y特雷森学院§!政体"
###摘星
ap_uma_fly_me_to_the_star:0 "摘星"
ap_uma_fly_me_to_the_star_desc:0 "£uma_sd£§Y赛马娘:星海德比§!\n曾经，因子如同夜空中的繁星，亲切却又遥远，不可触及，她指引着每只马娘的前路，却又腼腆地拒绝接触。一代又一代科学家的努力共同搭起一道星梯，以后当孩子们想要摘下天上的星星，母亲就可以温柔地指指女儿的胸膛，“星星已经在这里了哦？”"
uma_will_enable_keisun_ap:0 "我们将开启一个§Y特殊项目§!，以帮助§Y所有§!马娘强化她们的§Y普通因子§!"
#uma_requires_technology_uma_complex_keisun_test:0 "需要科技§Y综合遗传实验§!"

ap_uma_all_galaxy_full_umamusume: "Full Galaxy Full Umamusume"
ap_uma_all_galaxy_full_umamusume_desc: "我才不管什么物种多样性！我要整个银河全是马娘！变！给我变！"
uma_requires_technology_uma_complex_keisun_test:0 "$TRIGGER_FAIL$需要科技§Y综合遗传实验§!"
uma_requires_first_ascension_perks_1: "$TRIGGER_FAIL$需要飞升§Y摘星§!"
uma_requires_first_ascension_perks_2: "$TRIGGER_FAIL$需要飞升§Y全身全灵§!"


ap_uma_fly_me_to_the_star_ap_two: "铸星"
#ap_uma_fly_me_to_the_star_ap_two_desc: "£uma_sd£§Y赛马娘:星海德比§!\n我亦锻铸群星\n§R此飞升与['ascension_perk:ap_uma_zenshizenren_ap_2']和['ascension_perk:ap_uma_mixture_ap_2']不能同时选择§!"
ap_uma_fly_me_to_the_star_ap_two_desc: "£uma_sd£§Y赛马娘:星海德比§!\n因子如同马娘们继承给后代的星辰，是独一无二的珍贵礼物，它一度被认为是天赐的神迹，但我们终于掌握了因子，让星辰化为掌间玩物。\n§R此飞升与['ascension_perk:ap_uma_zenshizenren_ap_2']和['ascension_perk:ap_uma_mixture_ap_2']不能同时选择§!"
#ap_uma_zenshizenren_ap_2: "心生万象"
ap_uma_zenshizenren_ap_2: "心象"
#ap_uma_zenshizenren_ap_2_desc: "£uma_sd£§Y赛马娘:星海德比§!\n宇宙皆存我心\n§R此飞升与['ascension_perk:ap_uma_fly_me_to_the_star_ap_two']和['ascension_perk:ap_uma_mixture_ap_2']不能同时选择§!"
ap_uma_zenshizenren_ap_2_desc: "£uma_sd£§Y赛马娘:星海德比§!\n特雷森历史上曾有一场著名的比赛，那是古典时代晚期，两名年轻的马娘让赛场上落下金色的细雨，又减缓了时间的流逝，被认为是领域第一次激活的记录。\n两千多年来，马娘们一直追逐着那可遇不可求的领域，如今，心灵和肉体不再有界限，而是合二为一，化为触手可得的领域。\n§R此飞升与['ascension_perk:ap_uma_fly_me_to_the_star_ap_two']和['ascension_perk:ap_uma_mixture_ap_2']不能同时选择§!"
uma_requires_first_ascension_perks_both: "$TRIGGER_FAIL$需要['ascension_perk:ap_uma_zenshizenren'] 和 ['ascension_perk:ap_uma_fly_me_to_the_star']"
#ap_uma_mixture_ap_2: "因子-领域融合"
ap_uma_mixture_ap_2: "曲径通幽"
#ap_uma_mixture_ap_2_desc: "£uma_sd£§Y赛马娘:星海德比§!\n我们贯彻中庸的路线，二者择其优而舍其劣，兼收并蓄，可以避免我们陷入被动的境地。\n§R此飞升与['ascension_perk:ap_uma_zenshizenren_ap_2']和['ascension_perk:ap_uma_fly_me_to_the_star_ap_two']不能同时选择§!"
ap_uma_mixture_ap_2_desc: "£uma_sd£§Y赛马娘:星海德比§!\n因子与领域就如同两座横亘在面前的高山，无数马娘曾试图攀登，但或许，山间那条小道才是通往彼方的道路，当我们小心翼翼地从两座山之间穿过，豁然开朗的正是那桃源，说不定？\n§R此飞升与['ascension_perk:ap_uma_zenshizenren_ap_2']和['ascension_perk:ap_uma_fly_me_to_the_star_ap_two']不能同时选择§!"
ap_uma_mixture_ap_2_tt: "\n§Y解锁建筑：§!\n['building:building_uma_field_realm_enhence'] \n['building:building_realm_planetary_shield_generator']"

ap_uma_fly_me_to_the_star_ap_two_tt: "\n§Y解锁传统树:§!['tradition_category:tradition_uma_tradition_factor']"
ap_uma_zenshizenren_ap_two_tt: "\n§Y解锁传统树:§!['tradition_category:tradition_uma_tradition_realm']"

