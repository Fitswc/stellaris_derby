l_simp_chinese:

uma_buffet: "神奇的芭菲"
uma_buffet_desc_short: "好吃的芭菲，能让人心情愉悦"
uma_buffet_desc_details: "一个很漂亮的芭菲，无论哪个马娘吃了之后都会心情大悦。很难想象发明这个仙品的马娘是一位怎么样的天才。\n 感觉有点甜——"

uma_building_maunal: "上古建筑指南"
uma_building_maunal_desc_short: "过了不知道多少年的建筑指南"
uma_building_maunal_desc_details: "呐——你知道吗，老祖宗的智慧，有时比现代技术更加高效哦"

#uma_buffet: ""
#uma_buffet_short: ""
#uma_buffet_desc_details: ""


uma_care_kit: "上古特雷森医务室装备"
uma_care_kit_desc_short: "神奇的医疗套装，能治好任何疾病"
uma_care_kit_desc_details: "你知道吗，不论是胖了，失眠了还是不想训练了......只要往医务室里一躺。什么问题都好了。\n不过，在那里躺一下能治好我不会游泳的病吗？"

uma_cheval_hat: "高尚骏逸的(其中一顶)帽子"
uma_cheval_hat_desc_short: "天堂的凤蝶啊，何时再次起舞？"
uma_cheval_hat_desc_details: ""

uma_clock: "闹钟"
uma_clock_desc_short: "这个闹钟似乎能逆转时间？"
uma_clock_desc_details: "奇妙的闹钟，可以让已经发生的比赛没有发生过......真神奇\n 我明白了！我在梦里做梦。"

uma_clover: "四叶草"
uma_clover_desc_short: "平平无奇的四叶草，但是给人一种很贵的感觉"
uma_clover_desc_details: "在特雷森，每位入学的孩子都会携带一枚象征着幸运和痛苦的四叶草。这也大概是对她们未来生活的象征"


uma_coin: "上古钱币"
uma_coin_desc_short: "在几千年前流通的通用货币。"
uma_coin_desc_details: "这些小小的金色货币有着无穷的魔力，不仅能买生活必需品，还能让鬼帮你修bug，呐，你觉得呢。"

uma_history_book: "特雷森小说史"
uma_history_book_desc_short: "不知道什么时候出现的小短文和历史概述合二为一的小文章"
uma_history_book_desc_details: "‘现在，让我们翻开第一页，看看特雷森这颗星辰最初的样子吧。’\n 不是，你说第一页被黏住了？"

uma_kasume_doll: "手纲小姐的玩偶"
uma_kasume_doll_desc_short: "软软的玩偶，但是还是挡不住里面散发的奸商气息"
uma_kasume_doll_desc_details: "手纲小姐的玩偶，软软的触感不错，感觉可以送给织姬同学......但是我为什么莫名其妙地感觉我的钱包在颤抖？"

uma_live_video: "UMALive录像"
uma_live_video_desc_short: "现在看来都很有参考价值的live影像"
uma_live_video_desc_details: "马娘偶像们登台演出的Live录像，现在看也让人乐在其中。\n不过有一说一，我还是觉得5th更好看一些。"

nn_gift: "内恰的情人节礼物"
nn_gift_desc_short: "那份千年的爱，现在献给你。"
nn_gift_desc_details: ""

uma_piece_uma: "刻有马马头的奇妙晶片"
uma_piece_uma_desc_short: "上限解放！才能开花！"
uma_piece_uma_desc_details: "这个东西居然能让马娘能力得到快速提升? Win!\n 我觉得这就是一种自信"

uma_shoe_trophy: "古代鞋型奖杯"
uma_shoe_trophy_desc_short: "败者，会被剥下鞋子。而胜者，将会将这双鞋子作为自己战胜对手的象征 \n 话说，这双鞋子是不是有点熟悉。"
uma_shoe_trophy_desc_details: "嗯.....味大，无需多言。"

uma_sky_flower: "星云天空的雏菊发卡"
uma_sky_flower_desc_short: "青雲の空を駆け抜けた稲妻"
uma_sky_flower_desc_details: ""

uma_strength_crystal: "刻有 有偿 的奇怪水晶萝卜"
uma_strength_crystal_desc_short: "这个萝卜一看就很贵的样子"
uma_strength_crystal_desc_details: "这枚水晶萝卜与众不同！它它它居然刻有 有偿二字。"

uma_sweepy: "东商变革的魔法扫帚"
uma_sweepy_desc_short: "哼哼，我的扫帚可是真的会飞的哦"
uma_sweepy_desc_details: ""

uma_tg_chess: "三女神小棋子"
uma_tg_chess_desc_short: "三女神样的小棋子"
uma_tg_chess_desc_details: "这个棋子感觉很有用的样子。难道它能给我带来祝福？"

uma_tp: "TP药水"
uma_tp_desc_short: "一个让马娘喝了就能感觉还能冲10圈的奇妙药水"
uma_tp_desc_details: "你说瓶底写了什么？你刚刚是不是提到了爱丽速子？\n 等等，你是不是已经喝完了...."

uma_trophy_classic: "经典赛奖杯"
uma_trophy_classic_desc_short: "很贵重且有意义的奖杯"
uma_trophy_classic_desc_details: "经典赛的胜利对马娘们来说意义非凡。所以这个奖杯的价值也随之变得不可计量了起来。\n 你知道的，Ug < SS"


uma_tt_shoes: "东海帝王的鞋子"
uma_tt_shoes_desc_short: "东海帝王的(其中一双)鞋子，是她自己当成礼物送给我们的？"
uma_tt_shoes_desc_details: ""

uma_twinkle_maz: "古代 闪耀Twinkle杂志 增刊"
uma_twinkle_maz_desc_short: "一份记录着马娘们激烈竞赛的杂志。这份增刊似乎是特别对一位全冠马娘的报道？"
uma_twinkle_maz_desc_details: "群英荟萃"

uma_ty_medicine: "爱丽速子的药"
uma_ty_medicine_desc_short: "啊啦，豚鼠君，今天也让我记录下数据吧。"
uma_ty_medicine_desc_details: ""

uma_shine_of_dream: "梦想的光辉"
uma_shine_of_dream_desc_short: "一块发光的小盘子，能让人感受到其他马娘的梦想"
uma_shine_of_dream_desc_details: "你说你的梦想是把食堂吃破产？"



uma_specimen_null: ""


