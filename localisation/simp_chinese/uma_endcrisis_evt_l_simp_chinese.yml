##EC2

uma_ec_2.20.title: "怪异的装置"
uma_ec_2.20.desc: "我们注意到马娘堕落帝国似乎在某个星系建立了一个神秘装置，与此同时，所有的堕落帝国们似乎都集体合并到了马娘堕落帝国中。发生了什么？或许我们可以派一艘科研船进去研究一下。"
uma_ec_2.20.a: "批准"
uma_ec_2.21.title: "秋川理事长"
uma_ec_2.21.desc: "这些领域增幅器被你们发现了嘛？听着，孩子们，你们触碰了禁忌，你们不应该将领域发展到这个地步......对于这点，我已经警告过你们了。现在，根据和§Y她们§!的契约，我们必须将你们和所有国家消灭，无论你们是否有看到过§Y那些景象§!，这是我们的使命，希望你们会理解......"
uma_ec_2.21.a: "???什么回事"

uma_ec_2.22.title: "秋川理事长"
uma_ec_2.22.desc: "听着，孩子们，你们触碰了禁忌，你们不应该将领域发展到这个地步......对于这点，我已经警告过你们了。现在，根据和§Y她们§!的契约，我们必须将你们和所有国家消灭，无论你们是否有看到过§Y那些景象§!，这是我们的使命，希望你们会理解......"
uma_ec_2.22.a: "???什么回事"
uma_ec_2.23.title: "祸根"
uma_ec_2.23.desc: "原本安静的马娘堕落帝国不知何时开始无条件进攻所有国家，通过我们的情报网得知，似乎是某个马娘帝国将她们自身的力量发展到了超越某个限制的程度。"
uma_ec_2.23.a: "做好防御"
uma_ec_2.24.title: "领域增幅"
uma_ec_2.24.desc: "那些分散在以前堕落帝国首都的带领域增幅器的恒星基地似乎能有效增强马娘堕落帝国的战斗力。必须摧毁它们才能让我们的伤亡减轻。同时，我们需要攻入马娘堕落的首都 诺亚 以开启与她们的谈判。"
uma_ec_2.24.a: "$OK$"
uma_ec_2.25.title: "秋川理事长"
uma_ec_2.25.desc: "§g把摄像头关掉————对，关掉了吗？好的§!\n啊.....已经攻打到这了吗......我们失败了，这一切所有§Y她们§!都看在眼里。"
uma_ec_2.25.a: "她们是谁"
uma_ec_2.26.desc: "§Y三女神§!\n我们在亿万年前就与她们签订契约：观察马娘文明的领域发展程度，并对越界者加以惩戒......你们是发展程度相当高的一代，恭喜你们。只是我们的旅途该结束了，一旦我们防守失败，三女神将会把我们连同整个宇宙一起抹除。只不过由于领【外部干扰】的关系，我们会先走一步；除非你们有信心能够对抗‘神’ 否则请将人口迁移到我们最后的方舟：§Y诺亚§! 上，这是我最后一个请求.......拜托了....... \n【噪声】\n【噪声】\n【死寂】"
uma_ec_2.26.a.resp: "【死寂】"
uma_ec_2.26.a: "理事长？"
uma_ec_2.27.title: "诺亚和大洪水"
uma_ec_2.27.desc: "无论我们后续如何联系，通信频道那头都是一片寂静。至于是否将首都迁移到诺亚，我们内部还存在许多争议，相信我们的[ruler.GetTitle]会像以往一样做出令人信服的决策。"
uma_ec_2.27.a: "我们会迁移到诺亚"
uma_ec_2.27.b: "我们不会屈服"
uma_ec_2.27.c: "我...不知道"
uma_ec_2.27.a.tt: "迁都到诺亚"
uma_ec_2.27.b.tt: "不迁都到诺亚(后续内容：灾飞正在完成)"
uma_ec_2.28.title: "冲击波"
uma_ec_2.28.desc: "当我们的舰船靠近马娘堕落的母星系 往事 时，一道巨大的冲击波突然发出，令我们的舰船受到了巨大的伤害。看来在削减她们的领域强度到一定程度之前，我们最好不要冒险进入"
uma_ec_2.28.a: "可怕"

uma_ec_2.29.title: "冲击波"
uma_ec_2.29.desc: "当我们的舰船靠近马娘堕落的母星系 诺亚 时，一道巨大的冲击波突然发出，我们的舰船直接原地蒸发。看来在削减她们的领域强度到一定程度之前，我们最好不要冒险进入"
uma_ec_2.29.a: "可怕"

