 uma_crisis.7000.desc: "It's you. What do you want from us?"
  
 uma_crisis.7000.a: "Tell us about the story of the Golden Family?"
 uma_crisis.7000.b: "We want to further possess the golden factor…"
 uma_crisis.7000.c: "We need a fleet."
