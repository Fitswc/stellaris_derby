###EVT
uma_ec_3.20.title: "空间异动"
uma_ec_3.20.desc: "位于[event_target:uma_ec3_first_system.GetName]的黑洞出现了瞬时强大的亚空间波动。这次波动使得周边星系受到了强电磁暴的影响——所有的电子设备在一瞬间集体短暂罢工。这会是什么原因导致的？"
uma_ec_3.20.a: "不安"
uma_ec_3.21.title: "警戒！"
uma_ec_3.21.desc: "大量舰队从[event_target:uma_ec3_first_system.GetName]的黑洞中折跃出来，并迅速建造了指挥中心。\n令人惊奇的是，它们似乎并不需要工程船就能建造太空建筑而是从舰船上直接释放自组装构件在太空中自己拼装起来。"
uma_ec_3.21.a: "进入警戒"
uma_ec_3.22.title: "???"
uma_ec_3.22.desc: "！场矿为变会将星行，厂电发的们我为变会将星恒的宙宇篇这！产财的们我是会将都，木一草一的上球星，地民殖，源资，区星的们你过不......\n\n.....待优的应相供提们你给会们我后们你败击们我在过不，族种个一样同是不究终们我，说来上义意格严，憾遗很。明文的轻年个一是还，胞同娘马有也里这到想没"
uma_ec_3.22.a: "必须阻止它们！"

uma_ec_3.23.title: "???"
uma_ec_3.23.desc: "！场矿为变会将星行，厂电发的们我为变会将星恒的宙宇篇这！产财的们我是会将都，木一草一的上球星，地民殖，源资，区星的们你，快很过不......人星外，地领的饶丰片一着拥坐们你"
uma_ec_3.23.a: "必须阻止它们！"
uma_ec_3.24.title: "焦土计划"
uma_ec_3.24.desc: "在一片耀眼的亮光之下，[From.GetName] 的所有星球都变为荒芜，所有生命都被全部抹除，甚至恒星也变为黑洞。难道这就是它们的焦土计划？"
uma_ec_3.24.desc.swap: "在一片耀眼的亮光之下，[From.GetName] 的所有殖民地都归于寂静，所有生命都被全部抹除。难道这就是它们的焦土计划？"
uma_ec_3.24.a: "令人震惊"

###Situation
situation_uma_endcrisis_ec3_progress_desc: "当距离首都星系10跳内存在焦土锚时，倒计时将启用"
situation_uma_endcrisis_ec3_progress_1_desc: "当首都的焦土锚发动，首都不为[owner.GetName]所拥有时，倒计时速度x2"
situation_uma_endcrisis_ec3_progress_2_desc: "当首都的焦土锚发动，首都为[owner.GetName]所拥有时，倒计时速度x1.5"
situation_uma_endcrisis_ec3_complet: "首都星系将被抹除，其他星系将在加速倒计时结束后抹除"
