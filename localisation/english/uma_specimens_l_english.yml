l_english:
  
 uma_buffet: "神奇的芭菲"  <"The magical barfie">  #NT!
 uma_buffet_desc_short: "好吃的芭菲，能让人心情愉悦"  <"Delicious barbache, can make people feel happy">  #NT!
 uma_buffet_desc_details: "一个很漂亮的芭菲，无论哪个马娘吃了之后都会心情大悦。很难想象发明这个仙品的马娘是一位怎么样的天才。\n 感觉有点甜——"  <"A very beautiful barbada, no matter which mama mama eats it, she will be very happy. It is hard to imagine what kind of genius Ma Niang who invented this immortal product was. \n Feel a little sweet-">  #NT!
  
 uma_building_maunal: "上古建筑指南"  <"Ancient Architecture Guide">  #NT!
 uma_building_maunal_desc_short: "过了不知道多少年的建筑指南"  <"A construction guide that has been around for many years">  #NT!
 uma_building_maunal_desc_details: "呐——你知道吗，老祖宗的智慧，有时比现代技术更加高效哦"  <"Now—Do you know, the wisdom of our ancestors is sometimes more efficient than modern technology">  #NT!
  
 #uma_buffet: ""
 #uma_buffet_short: ""
 #uma_buffet_desc_details: ""
  
  
 uma_care_kit: "上古特雷森医务室装备"  <"Upper Guterresen Infirmary Equipment">  #NT!
 uma_care_kit_desc_short: "神奇的医疗套装，能治好任何疾病"  <"A magical medical suit that can cure any disease">  #NT!
 uma_care_kit_desc_details: "你知道吗，不论是胖了，失眠了还是不想训练了......只要往医务室里一躺。什么问题都好了。\n不过，在那里躺一下能治好我不会游泳的病吗？"  <"Do you know, whether you are fat, insomnia or don’t want to train anymore...just lie in the infirmary. All the problems are fine. \nHowever, can lying there cure my disease of not being able to swim?">  #NT!
  
 uma_cheval_hat: "高尚骏逸的(其中一顶)帽子"  <"The noble and elegant (one of them) hats">  #NT!
 uma_cheval_hat_desc_short: "天堂的凤蝶啊，何时再次起舞？"  <"When will the butterfly in heaven start dancing again?">  #NT!
 uma_cheval_hat_desc_details: ""
  
 uma_clock: "闹钟"  <"Alarm clock">  #NT!
 uma_clock_desc_short: "这个闹钟似乎能逆转时间？"  <"This alarm clock seems to reverse time?">  #NT!
 uma_clock_desc_details: "奇妙的闹钟，可以让已经发生的比赛没有发生过......真神奇\n 我明白了！我在梦里做梦。"  <"A wonderful alarm clock can prevent the game that has happened before... It's amazing\n I understand! I dream in my dream.">  #NT!
  
 uma_clover: "四叶草"  <"Four-leaf grass">  #NT!
 uma_clover_desc_short: "平平无奇的四叶草，但是给人一种很贵的感觉"  <"The ordinary four-leaf clover, but it gives people a very expensive feeling">  #NT!
 uma_clover_desc_details: "在特雷森，每位入学的孩子都会携带一枚象征着幸运和痛苦的四叶草。这也大概是对她们未来生活的象征"  <"In Trayson, every child who enters school carries a four-leaf clover that symbolizes luck and pain. This is probably a symbol of their future lives.">  #NT!
  
  
 uma_coin: "上古钱币"  <"Ancient coins">  #NT!
 uma_coin_desc_short: "在几千年前流通的通用货币。"  <"The common currency circulated thousands of years ago.">  #NT!
 uma_coin_desc_details: "这些小小的金色货币有着无穷的魔力，不仅能买生活必需品，还能让鬼帮你修bug，呐，你觉得呢。"  <"These small golden currencies have infinite magic power. They can not only buy necessities of life, but also let ghosts help you fix bugs. Hey, what do you think.">  #NT!
  
 uma_history_book: "特雷森小说史"  <"Tresen's novel history">  #NT!
 uma_history_book_desc_short: "不知道什么时候出现的小短文和历史概述合二为一的小文章"  <"A short article that combines a historical overview with a small article that appears in unknown time">  #NT!
 uma_history_book_desc_details: "‘现在，让我们翻开第一页，看看特雷森这颗星辰最初的样子吧。’\n 不是，你说第一页被黏住了？"  <"‘Now, let’s turn the first page and see what the star Tresen originally looked like. ’\n No, you said the first page was stuck?">  #NT!
  
 uma_kasume_doll: "手纲小姐的玩偶"  <"Miss Tetsuntung's doll">  #NT!
 uma_kasume_doll_desc_short: "软软的玩偶，但是还是挡不住里面散发的奸商气息"  <"A soft doll, but it still can't stop the aura of profiteering inside">  #NT!
 uma_kasume_doll_desc_details: "手纲小姐的玩偶，软软的触感不错，感觉可以送给织姬同学......但是我为什么莫名其妙地感觉我的钱包在颤抖？"  <"Miss Tetsunto’s doll has a soft touch and feels like it can be given to Orihime... But why do I feel my wallet trembling for no reason?">  #NT!
  
 uma_live_video: "UMALive录像"  <"UMALive video">  #NT!
 uma_live_video_desc_short: "现在看来都很有参考价值的live影像"  <"Live images that seem to be of great reference value now">  #NT!
 uma_live_video_desc_details: "马娘偶像们登台演出的Live录像，现在看也让人乐在其中。\n不过有一说一，我还是觉得5th更好看一些。"  <"The live video of Ma Niang's idols performing on stage is also fun to watch now. \nBut to say that, I still think 5th is better.">  #NT!
  
 nn_gift: "内恰的情人节礼物"  <"Neicha Valentine's Day Gift">  #NT!
 nn_gift_desc_short: "那份千年的爱，现在献给你。"  <"That thousand-year-old love is now dedicated to you.">  #NT!
 nn_gift_desc_details: ""
  
 uma_piece_uma: "刻有马马头的奇妙晶片"  <"Wonderful crystals engraved with horse heads">  #NT!
 uma_piece_uma_desc_short: "上限解放！才能开花！"  <"Liberation of the upper limit! Only then can it bloom!">  #NT!
 uma_piece_uma_desc_details: "这个东西居然能让马娘能力得到快速提升? Win!\n 我觉得这就是一种自信"  <"Can this thing actually improve Ma Niang's abilities quickly? Win!\n I think this is a kind of self-confidence">  #NT!
  
 uma_shoe_trophy: "古代鞋型奖杯"  <"Ancient shoe trophy">  #NT!
 uma_shoe_trophy_desc_short: "败者，会被剥下鞋子。而胜者，将会将这双鞋子作为自己战胜对手的象征 \n 话说，这双鞋子是不是有点熟悉。"  <"The loser will be stripped of his shoes. And the winner will use this pair of shoes as a symbol of his victory over his opponent \n By the way, are these shoes a little familiar?">  #NT!
 uma_shoe_trophy_desc_details: "嗯.....味大，无需多言。"  <"Well...it's a lot of fun, no need to say much.">  #NT!
  
 uma_sky_flower: "星云天空的雏菊发卡"  <"Daisy hairpin in the nebula sky">  #NT!
 uma_sky_flower_desc_short: "青雲の空を駆け抜けた稲妻"  <"Qingyun's Hollow Wife">  #NT!
 uma_sky_flower_desc_details: ""
  
 uma_strength_crystal: "刻有 有偿 的奇怪水晶萝卜"  <"Strange crystal carrot engraved with paid">  #NT!
 uma_strength_crystal_desc_short: "这个萝卜一看就很贵的样子"  <"This carrot looks very expensive">  #NT!
 uma_strength_crystal_desc_details: "这枚水晶萝卜与众不同！它它它居然刻有 有偿二字。"  <"This crystal radish is unique! It actually carved the word "paid".">  #NT!
  
 uma_sweepy: "东商变革的魔法扫帚"  <"The magic broom of the Dongshang Reform">  #NT!
 uma_sweepy_desc_short: "哼哼，我的扫帚可是真的会飞的哦"  <"Humph, my broom really flies">  #NT!
 uma_sweepy_desc_details: ""
  
 uma_tg_chess: "三女神小棋子"  <"Three goddesses chess pieces">  #NT!
 uma_tg_chess_desc_short: "三女神样的小棋子"  <"Three goddess-like small chess pieces">  #NT!
 uma_tg_chess_desc_details: "这个棋子感觉很有用的样子。难道它能给我带来祝福？"  <"This piece looks very useful. Can it bring me blessings?">  #NT!
  
 uma_tp: "TP药水"  <"TP potion">  #NT!
 uma_tp_desc_short: "一个让马娘喝了就能感觉还能冲10圈的奇妙药水"  <"A wonderful potion that Ma Niang can feel that she can still rush for 10 rounds after drinking it">  #NT!
 uma_tp_desc_details: "你说瓶底写了什么？你刚刚是不是提到了爱丽速子？\n 等等，你是不是已经喝完了...."  <"What did you say is written on the bottom of the bottle? Did you just mention Alice Suko? \n Wait, have you finished drinking...">  #NT!
  
 uma_trophy_classic: "经典赛奖杯"  <"Classic Trophy">  #NT!
 uma_trophy_classic_desc_short: "很贵重且有意义的奖杯"  <"Very valuable and meaningful trophy">  #NT!
 uma_trophy_classic_desc_details: "经典赛的胜利对马娘们来说意义非凡。所以这个奖杯的价值也随之变得不可计量了起来。\n 你知道的，Ug < SS"  <"The victory of the classics is of great significance to the Ma Girls. So the value of this trophy has become immeasurable. \n You know, Ug < SS">  #NT!
  
  
 uma_tt_shoes: "东海帝王的鞋子"  <"The Emperor's Shoes of the East China Sea">  #NT!
 uma_tt_shoes_desc_short: "东海帝王的(其中一双)鞋子，是她自己当成礼物送给我们的？"  <"Did she give us the (one of the) shoes of the Emperor of Donghai as a gift?">  #NT!
 uma_tt_shoes_desc_details: "真的嘛"  <"Really">  #NT!
  
 uma_twinkle_maz: "古代 闪耀Twinkle杂志 增刊"  <"Ancient Shining Twinkle Magazine Supplement">  #NT!
 uma_twinkle_maz_desc_short: "一份记录着马娘们激烈竞赛的杂志。这份增刊似乎是特别对一位全冠马娘的报道？"  <"A magazine that records the fierce competition among the horse girls. This supplement seems to be a report specifically on a full-time Ma Niang?">  #NT!
 uma_twinkle_maz_desc_details: "群英荟萃"  <"Gathering of heroes">  #NT!
  
 uma_ty_medicine: "爱丽速子的药"  <"Alice's medicine">  #NT!
 uma_ty_medicine_desc_short: "啊啦，豚鼠君，今天也让我记录下数据吧。"  <"Oh, Guizhu, let me record the data today.">  #NT!
 uma_ty_medicine_desc_details: "呃...不要"  <"Uh...No">  #NT!
  
 uma_shine_of_dream: "梦想的光辉"  <"The glory of dreams">  #NT!
 uma_shine_of_dream_desc_short: "一块发光的小盘子，能让人感受到其他马娘的梦想"  <"A shiny little plate can make people feel the dreams of other Mama girls">  #NT!
 uma_shine_of_dream_desc_details: "你说你的梦想是把食堂吃破产？"  <"You said your dream is to bankrupt the canteen?">  #NT!
  
 uma_zephyr_journy_with_zephyr: "《西风行记》"  <""The Story of the West Wind"">  #NT!
 uma_zephyr_journy_with_zephyr_desc_short: "内容翔实，丰富多彩，真实的记录了宇宙各地的风物风貌"  <"The content is detailed, colorful, and truly records the scenery and appearance of the universe">  #NT!
 uma_zephyr_journy_with_zephyr_desc_details: "\n里面的复合句怎么这么多"  <"\nWhy are there so many compound sentences">  #NT!
  
  
  
 uma_specimen_null: ""
  
  
