 op_cat_uma_pop_looting_and_transform: "Population plunder and assimilation"  #NT!
 op_cat_uma_pop_looting_and_transform_desc: "Not enough people? Take them! Turn them into umamusume!" #NT!
  
  
 operation_uma_pop_looting_and_transform: "Population plunder and assimilation"    #NT!
 operation_uma_pop_looting_and_transform_desc: "Our agents will randomly pick some shaky, unemployed civilians in the country's capital, and then secretly take them away in their sleep and force them to volunteer to become Umamusume in our secret assimilation facilities! whee! \nThis action may be contrary to the interests of informants"  #NT!
 operation_uma_pop_looting_and_transform_no_dlc_desc: "Our agents will randomly pick some shaky, unemployed civilians in the country's capital, and then secretly take them away in their sleep and force them to volunteer to become Umamusume in our secret assimilation facilities! whee!"  #NT!
 operation_uma_pop_looting_and_transform_on_success: "40% of the population of the civilian class in the capital of the other empire will become Umamusume joining our civilian class."   #NT!
  
 uma_espionage.1.title: "Lock the population"  #NT!
 uma_espionage.1.desc: "Our agents identified a list of people who will be abducted on [Root.Target]. These aliens will be transformed into Umamusume by us!"    #NT!
  
 uma_espionage.2.title: "Become one of us"  #NT!
 uma_espionage.2.desc: "These alien civilians were quietly taken away by us in our sleep and were loaded with a transport ship sent to our secret assimilation device. When they wake up, they will be surprised to find that they have become Umamusume, and we have integrated them into our civilian class after reasonable brainwashing education. Now there seems to be no other problem except that they need to re-establish their homes."  #NT!
 uma_espionage.2.a: "We'll come back next time"  #NT!
  
  
