UMA_AP_BC_RESEARCH_REALM: "研究领域"
UMA_AP_BC_RESEARCH_REALM_DESC: "在无数的的实践和记载中我们发现，每当马娘们使用领域时似乎能够在一定程度上改变当前时空的一部分特征。最典型的就是莫名其妙出现的区域性金色雨滴。这是否意味着，如果很多马娘一起发动领域的话，会有一些特别的事情发生：比如出现另一个空间通道什么的。总感觉我们和领域的真相之间还隔着一层薄薄的白纱，这需要我们进行进一步的研究。"

##Evt
uma_ap.300.title: "$UMA_AP_BC_RESEARCH_REALM$"
uma_ap.300.desc: "$UMA_AP_BC_RESEARCH_REALM_DESC$"
uma_ap.300.a: "有趣"
uma_ap.301.title: "惊人发现"
uma_ap.301.desc: "在一次实验当中，我们让大约一千名马娘聚集在食堂，并同时释放了她们的领域。然后，一件奇异的事情就发生了！在可控范围内几乎立刻产生了一道微小的裂隙，我们的科学家似乎有些后知后觉，在观察了好一会后才对裂隙内部进行观察。科学家们通过针孔窥视摄像头窥探到了裂隙内的一小块区域：是一片赛场，同时还时不时有一些不明的四足生物在上面走过。就在研究人员记录下这一刻的图像后，这个裂隙就立刻被封堵。一切悄无声息，除了......一些奇怪的，周期性的时间暂停现象——就像时间突然停止了几秒。在往后的多次重复实验中，研究员不断在一道道裂隙中窥探到了更多的信息，直到研究人员在一个偶然的机会中发现了一本名为《星海德比志》的小说放在裂隙消失的地方。她注意到这本书上似乎记载了这个世界的所作所为，令人感到惶恐的是，最后一句居然是：\n§g‘她翻开了《星海德比志》，阅读其中的文本，嗯，书中的文本令她不解。’§!\n她拿起笔，正准备在研究报告上写下这一现象，书中立马就出现了一句：\n§g‘疑惑的研究员拿起了笔，转向她的研究报告，试着把这奇怪的现象记录下来。’§!\n太可怕了，一本这样的东西，真是越想越怕，这名可怜的研究员连忙合上书本，匆匆将这一现象记录了下来，并冲出了研究中心，第二天，她请了个长假，我们再也没有见到过她。\n§g‘这位研究员被吓破了胆，不用担心，她只是世界观受到了极大的冲击，你只需要继续在你的终端前操作就好了，她没事。’§!"
uma_ap.301.a: "如果我们将更多领域集中起来....."
uma_ap.301.tt: "§g‘喔嚯，这会很疯狂。’§!"
UMA_AP_BC_RESEARCH_MEGASTRUCTURE: "研究领域能集中"
UMA_AP_BC_RESEARCH_MEGASTRUCTURE_DESC: "现在问题来到了如何将领域收集起来，并且在同一时间释放。如果我们能够达成这点，说不定能够解开那本奇怪小说的秘密。"
uma_ap.302.title: "研究完成"
uma_ap.302.desc: "§g‘很有趣，她们似乎决定研究到底，不过这也理所当然。’§!\n我们的研究员发现收集和释放马娘们在释放领域时的能量是可行的。当这些能量被集中释放，就可以还原此前观察到的神秘裂缝。由此我们的研究员进行了更多的尝试，她们不断观察到了诸如类似人类的物种，未知四足兽，以及晶体管。与此同时我们的研究员也记录到了规律发生的时间暂停以及时间停滞——这多亏了停留在裂隙中未被封堵影响的的记录器。这些发现不禁让我们开始怀疑所处的这个世界的真实性。后续的研究验证了这个疯狂的猜想：我们所处的世界似乎存在于一台高纬度的硅基晶体管计算机的模拟内。此前的多次记录到的时间现象可能是这台计算机工作的结果。\n这意味着这台计算机的操作将会直接影响我们的命运。那可不行，我们或许可以尝试使用集中我们的领域将我们的种族提升到与和这台晶体计算机同级的世界中。\n§g‘现在她们正在尝试打破这层墙壁。’§!"
uma_ap.302.a: "当然"
uma_ap.302.tt: "§g‘一次大航海’§!"
UMA_AP_BC_BUILD_MEGASTRUCTURE: "建造领域空间篡改器"
UMA_AP_BC_BUILD_MEGASTRUCTURE_DESC: "现在我们要将理论发展到实践：在太空中建造一个足够将所有人（外星人除外）送进上层空间的一个装置，我们的无人机器和动物实验已验证了可行性，接下来只需要确保这项大工程稳步推进。"
uma_ap.303.title: "准备就绪"
uma_ap.303.desc: "超级装置已经准备就绪，现在我们只需要专心收集领域能了。为了防御不可预见的后果，我们可能需要使用必要的武力和进行必要的军事力量储备"
uma_ap.303.a: "了解"
uma_ap.303.tt: "§g‘......准备应对的措施’§!"


