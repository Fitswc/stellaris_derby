 ###飞升有关本地化### 
 uma_abandon_normal_ascension: "Because of Umamusume's §Y Body §! And §Y Soul §! are §R Very Special§!, \n\n§YUnless unlock§! ['ascension_perk:ap_uma_mixture_ap_2'],After unlock this ascension perk, you can choose ['ascension_perk:ap_the_flesh_is_weak'] and ['ascension_perk:ap_mind_over_matter']"
 ###全身全灵 
 ap_uma_zenshizenren: "Whole Body All Souls"
 ap_uma_zenshizenren_desc: "In the past, only a handful of elites in each generation of Umamusume were able to awaken the Realm in the competition. Now, after a long period of statistics, research and experiments on the Realm, we have initially grasped the secret of the Realm:when the goals of body and mind are extremely unified, the Realm can be stimulated. \nNow, our scientists can adjust the emotions of Umamusume through psychological means, to achieve as much as possible the synchronization of body and mind and in this way stimulate the Realm. This allows Umamusume to open the "Realm" not only in the race but also in their work in all walks of life."
 uma_will_enable_zenshizenren_ap: "We will initiate a §YSpecial Projects§! to help §YAll§! Umamusume§Yto open the 'Realm'§!"
 uma_requires_technology_uma_terriroty_in_use: "Need Technology §YThe Inspiration and Applications of the 'Realm'§!"
 uma_must_be_toresen_auth: "The Polity Must be §YTraincent College§!"
 origin_uma_after_factor_perk_already: "We already know the secrets of factors and use them to strengthen ourselves"  #NT!
  
 ###摘星 
 ap_uma_fly_me_to_the_star: "Fly me to the star"
 ap_uma_fly_me_to_the_star_desc: "Once, the "Factor" just like a star in the night sky, intimate but distant and untouchable, she guiding the way ahead for each Umamusume, Generations of scientists have worked together to build a star ladder, Later, When children want to pluck the stars from the sky, Their Mothers can point to their daughters' chests gently, and said "The star is already here.""
 uma_will_enable_keisun_ap: "We will initiate a §YSpecial Project§! to help §YAll§! Umamusume strengthen their §YCommon 'Factor' §!"
 #uma_requires_technology_uma_complex_keisun_test: "Requires technology §YComprehensive genetic experiments§!"
  
 ap_uma_all_galaxy_full_umamusume: "Full Galaxy Full Umamusume"
 ap_uma_all_galaxy_full_umamusume_desc: "I don't care about species diversity! I want the whole galaxy to be filled with Umamusume! Change! Change!"
 uma_requires_technology_uma_complex_keisun_test: "Need Technology §YIntegrated genetic experiments§!"
 uma_requires_first_ascension_perks_1: "$TRIGGER_FAIL$Need ascension perk §YFly me to the star§!"
 uma_requires_first_ascension_perks_2: "$TRIGGER_FAIL$Need to ascension perk §YWhole Body All Souls§!"
  
  
 ap_uma_fly_me_to_the_star_ap_two: "Casting Stars"
 #ap_uma_fly_me_to_the_star_ap_two_desc: "£uma_sd£§Y赛Umamusume:星海德比§!\n我亦锻铸群星\n§R此飞升与['ascension_perk:ap_uma_zenshizenren_ap_2']和['ascension_perk:ap_uma_mixture_ap_2']不能同时选择§!"  <"£uma_sd£§Y赛Umamusume:星海德比§!\nI also forge the stars\n§R此飞升与['ascension_perk:ap_uma_zenshizenren_ap_2']和['ascension_perk:ap_uma_mixture_ap_2']不能同时选择§!">  #NT!
 ap_uma_fly_me_to_the_star_ap_two_desc: "£uma_sd£§YUmamusume:StellarDerby§!\nI also cast the stars\n§RThis ascension perks cannot coexist with['ascension_perk:ap_uma_zenshizenren_ap_2'] and ['ascension_perk:ap_uma_mixture_ap_2']§!"
 #ap_uma_zenshizenren_ap_2: "心生万象"  <"All things come from the heart">  #NT!
 ap_uma_zenshizenren_ap_2: "Heart of everything"
 #ap_uma_zenshizenren_ap_2_desc: "£uma_sd£§Y赛Umamusume:星海德比§!\n宇宙皆存我心\n§R此飞升与['ascension_perk:ap_uma_fly_me_to_the_star_ap_two']和['ascension_perk:ap_uma_mixture_ap_2']不能同时选择§!"  <"£uma_sd£§Y赛Umamusume:星海德比§!\nThe universe is in my heart\n§R此飞升与['ascension_perk:ap_uma_fly_me_to_the_star_ap_two']和['ascension_perk:ap_uma_mixture_ap_2']不能同时选择§!">  #NT!
 ap_uma_zenshizenren_ap_2_desc: "£uma_sd£§YUmamusume:StellarDerby§!\nThe universe is in my heart\n§RThis ascension perks cannot coexist with['ascension_perk:ap_uma_fly_me_to_the_star_ap_two'] and ['ascension_perk:ap_uma_mixture_ap_2']§!"
 uma_requires_first_ascension_perks_both: "$TRIGGER_FAIL$ Requires ['ascension_perk:ap_uma_zenshizenren'] and ['ascension_perk:ap_uma_fly_me_to_the_star']"
 #ap_uma_mixture_ap_2: "因子-领域融合"  <"Factor-Domain Fusion">  #NT!
 ap_uma_mixture_ap_2: "Factor-Realm fusion"
 #ap_uma_mixture_ap_2_desc: "£uma_sd£§Y赛Umamusume:星海德比§!\n我们贯彻中庸的路线，二者择其优而舍其劣，兼收并蓄，可以避免我们陷入被动的境地。\n§R此飞升与['ascension_perk:ap_uma_zenshizenren_ap_2']和['ascension_perk:ap_uma_fly_me_to_the_star_ap_two']不能同时选择§!"  <"£uma_sd£§Y赛Umamusume:星海德比§!\nWe implement the doctrine of the mean, choose the best and abandon the worst, and absorb both, which can prevent us from falling into a passive situation. \n§R此飞升与['ascension_perk:ap_uma_zenshizenren_ap_2']和['ascension_perk:ap_uma_fly_me_to_the_star_ap_two']不能同时选择§!">  #NT!
 ap_uma_mixture_ap_2_desc: "£uma_sd£§YUmamusume:StellarDerby§!\nWe follow the path of moderation, choosing the best from the two and discarding the worst, embracing both, and can avoid falling into a passive situation. \n§RThis ascension perks cannot coexist with['ascension_perk:ap_uma_zenshizenren_ap_2'] and ['ascension_perk:ap_uma_fly_me_to_the_star_ap_two']§!"
 #ap_uma_mixture_ap_2_tt: "\n§Y解锁建筑：§!\n['building:building_uma_field_realm_enhence'] \n['building:building_realm_planetary_shield_generator']"  <"\n§Y解锁建筑：§!\n['building:building_uma_field_realm_enhence'] \n['building:building_realm_planetary_shield_generator']">  #NT!
  
