 uma_ap.151.title: "Ready"
 uma_ap.151.desc: "After a long period of preparation, we are ready to enhance and stimulate the realm of Umamusumes. We have witnessed the powerful force in this field. Now, we are going to take it a step further."
 uma_ap.151.a: "Let see these power"
 uma_ap.152.title: "Realm enhancement-Completed"
 uma_ap.152.desc: "We have enhanced our existing Realm, and now it has become more powerful and controllable. The next step is to stimulate the potential areas of Umamusumes. Doing so is very risky, but it's worth taking a chance."
 uma_ap.152.a: "Well done"
  
 uma_ap.154.title: "Mental imagery"
 uma_ap.154.desc: "After long-term efforts, we have finally been able to bring back the golden raindrops that appeared on the sports field thousands of years ago. The old rumor that only the Umamusume that was about to change history would activate its domain while running has become a thing of the past. Now, every Umamusume has been inspired to create its own domain, which will take our development one step further"
 uma_ap.154.a: "Well Done"
  
  
