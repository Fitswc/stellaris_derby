###EVT
uma_ar_ec3: "贯穿"
uma_ec_3.2.title: "宇宙伤疤"
uma_ec_3.2.desc: "什么都逃不过我们传感器的眼睛！就在不久前我们[event_target:uma_ec3_begining_astral_rift_system.GetName]发现了一个裂隙，大量从另一个宇宙来的物质从这细小的缝隙里不断渗透进这个空间。里面藏着什么惊喜？"
uma_ec_3.2.a: "会发生什么？"
uma_ec_3.2.b: "搁置该提案"
uma_ec_3.3.title: "Departure"
uma_ec_3.3.desc: "我们的科研船在这个新生的裂隙前进行了锚定，接下来只需要照常发射裂隙探球，就可以对内部环境进行详尽的探索了。"
uma_ec_3.3.a: "前进"
uma_ec_3.4.a: "当然，时刻准备着"
uma_ec_3.4.desc: "我们的裂隙探球在穿过视界的那一刹捕捉到了大量舰队的身影，速度之快使得我们无法对其设计类型进行辨认；它们高速穿行，向着入口方向奔去。这是幻想嘛？"
uma_ec_3.4.title: "次元舰队"
uma_ec_3.5.b: "情况不对，做好准备"
uma_ec.3.6.title: "异常空间波动"
uma_ec.3.6.desc: "强大的能量场从空间裂隙中涌出，伴随着一阵强烈的空间波动。虽然在其中的东西尚未露面，但我们可以清楚地感受到这股力量的存在。\n与这个空间波动一起抵达的还有一束信号，似乎是内部相互通信不慎泄露出来的；这束信号解码出来的只有短短几字: ‘还有200天到达目标地点’"
uma_ec.3.6.a: "这是什么"
uma_ec.3.8.desc: "一支强大的舰队如期跃迁到了[event_target:uma_ec3_begining_astral_rift_system.GetName]，后续舰队则在一瞬间将所有星球化成荒芜之地。它们甚至向全宇宙进行了广播"
uma_ec.3.8.title: "舰队与焦土"
uma_ec.3.8.a: "接入通信！"


