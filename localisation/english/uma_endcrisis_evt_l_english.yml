 ##EC2
 uma_ec_2.20.title: "Strange Device"
 uma_ec_2.20.desc: "We have noticed that the Umamusume Fallen Empire has constructed a mysterious device in a certain system. Simultaneously, all other Fallen Empires seem to have merged into the Umamusume Fallen Empire. What is happening? Perhaps we should send a science ship to investigate."
 uma_ec_2.20.a: "Approve."
 uma_ec_2.21.title: "Chairwoman Akikawa"
 uma_ec_2.21.desc: "Have you discovered these Realm Amplifiers? Listen, children, you have touched upon a taboo. You should not have developed your Realm to this extent... I have warned you about this. Now, according to the contract with §YThem§!, we must eliminate you and all nations, regardless of whether you have seen §Ythose visions§!. This is our mission. I hope you understand..."
 uma_ec_2.21.a: "??? What is going on?"

 uma_ec_2.22.title: "Chairwoman Akikawa"
 uma_ec_2.22.desc: "Listen, children, you have touched upon a taboo. You should not have developed your Realm to this extent... I have warned you about this. Now, according to the contract with §YThem§!, we must eliminate you and all nations. This is our mission. I hope you understand..."
 uma_ec_2.22.a: "??? What is going on?"
 uma_ec_2.23.title: "The Root of Evil"
 uma_ec_2.23.desc: "The once-quiet Umamusume Fallen Empire has begun attacking all nations unconditionally. Intelligence suggests an Umamusume empire developed their power beyond a certain limit."
 uma_ec_2.23.a: "Prepare defenses."
 uma_ec_2.24.title: "Realm Amplification"
 uma_ec_2.24.desc: "The starbases with Realm Amplifiers scattered in the former Fallen Empire capitals seem to effectively enhance the Umamusume Fallen Empire's combat power. They must be destroyed to reduce our casualties. Meanwhile, we must fight our way into the Umamusume capital, Noah, to initiate negotiations."
 uma_ec_2.24.a: "$OK$"
 uma_ec_2.25.title: "Chairwoman Akikawa"
 uma_ec_2.25.desc: "§gTurn off the camera—yes, is it off? Good.§!\nAh... have you fought your way here already? We have failed, and §YThey§! have seen everything."
 uma_ec_2.25.a: "Who are 'They'?"
 uma_ec_2.26.desc: "§YThe Triple Goddesses§!\nWe signed a contract with them billions of years ago: to observe the development of Umamusume Realm and punish those who cross the line... You are a highly developed generation. Congratulations. However, our journey must end. Once our defense fails, the Triple Goddesses will erase us along with the entire universe. But due to [EXTERNAL INTERFERENCE], we will leave first; §YUnless you have the confidence to face 'God'§!.\nOtherwise, please migrate your population to our final ark: §YNoah§!'s §YVibrancy§!. This is my last request... I beg of you...\n[NOISE]\n[NOISE]\n[SILENCE]"
 uma_ec_2.26.a.resp: "[SILENCE][ECHO]"
 uma_ec_2.26.a: "Chairwoman?"
 uma_ec_2.27.title: "Noah and the Flood"
 uma_ec_2.27.desc: "No matter how we try to contact them, there is only silence on the other end. There is much debate internally regarding whether to move our capital to Noah. We trust our [ruler.GetTitle] will make a convincing decision."
 uma_ec_2.27.a: "We will migrate to Noah."
 uma_ec_2.27.b: "We will not submit."
 uma_ec_2.27.c: "I... I don't know."
 uma_ec_2.27.a.tt: "Move capital to Noah."
 uma_ec_2.27.b.tt: "Do not move capital to Noah. (Continuing content: Crisis path completing)"
 uma_ec_2.27.c.tt: "This will take some time to consider..."
 uma_ec_2.28.title: "Shockwave"
 uma_ec_2.28.desc: "When our ships approached the Umamusume Fallen Empire's home system, 'The Past', a massive shockwave was emitted, heavily damaging our fleet. It seems we should not risk entering until we reduce their Realm intensity."
 uma_ec_2.28.a: "Terrifying."

 uma_ec_2.29.title: "Shockwave"
 uma_ec_2.29.desc: "As our ships approached Noah, a massive shockwave caused our fleet to instantly vaporize. We should not enter until their Realm intensity is weakened."
 uma_ec_2.29.a: "Terrifying."

 uma_ec_2.31.title: "Boarding"
 uma_ec_2.31.desc: "We have boarded Noah and moved our capital here as Chairwoman Akikawa requested. Though we don't fully understand why, we believe there was a reason... perhaps the Triple Goddesses she mentioned?\nOnce settled, a previously unrecorded nation calling themselves the §YTriple Goddesses§! requested communication."
 uma_ec_2.31.a: "Patch them through."

 uma_ec_2.32.title: "The Triple Goddesses"
 uma_ec_2.32.desc: "§PIt's the new children, so good to see you. As you know, we are the Triple Goddesses—the ones who created your species, the ones you worship.§!\n§BLet's get straight to the point, Little Sheep.§!\n§PAlright... I just wanted to say hello... As you can see, Vibrancy is an Ecumenopolis. We want you to continue the work of the previous children—observe the new ones and prevent them from... following the same path as you.§!\n§H...The Realm is dangerous. Many children have lost their lives because of it...§!\n§PThe Realm will cause your universe to be forcibly unfolded and eventually vanish into the unknown.§!\n§BBut luckily you've controlled it well, and we're doing our best to help reduce the Realm's impact on your universe. So, are you willing to take this job? Observe and guide the new children; we will provide as much help as possible to ensure your empire prospers forever.§!\n§H...Of course, if you are defeated...§!\n§PI'm sure you'll do fine. Well, do you accept?§!"
 uma_ec_2.32.a: "Accept"
 uma_ec_2.32.a.tt: ""
 uma_ec_2.32.b: "Accept"
 uma_ec_2.32.b.tt: "Why is there no option to refuse?"
 uma_ec_2.32.c.tt: "Seriously, why can't I refuse?"

 uma_ec_2.33.title: "The Triple Goddesses"
 uma_ec_2.33.desc: "§PThank you, children. We will provide resources shortly. We hope you have a pleasant life... contact us anytime if you need help.§!\n§PAlso, I can give you a little... prophecy: years from now, your nation will produce a great Chairwoman, your technology will be highly advanced, and a gifted child will be born. That's all I can say for now. Goodbye!§!"
 uma_ec_2.33.a: "Certainly."

 uma_ap_2.10000.title: "Communication Lost"
 uma_ap_2.10000.desc: "The Umamusume Fallen Empire has suddenly terminated all communications. What has happened?"
 uma_ap_2.10000.a: "What's going on?"

