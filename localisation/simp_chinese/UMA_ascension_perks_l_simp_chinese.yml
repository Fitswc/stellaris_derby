uma_ap.51.title: "准备完成"
uma_ap.51.desc: "经过长时间的准备，我们已经准备好强化马娘们的固有因子；过去，我们靠我们的双手艰难地摘到了那颗星星，现在，我们将亲手铸造她。"
uma_ap.51.a: "撒，让我们见证这份力量吧"
uma_ap.52.title: "固有因子加强-完成"
uma_ap.52.desc: "我们加强了我们的固有因子，现在它变得更加强大，可控。下一步便是替换掉马娘们固有因子中的不利部分。这样做的风险很大，但是值得我们放手一搏。"
uma_ap.52.a: "做得不错"

uma_ap.53.title: "固有因子附加-完成"
uma_ap.53.desc: "现在我们已经有能力加强我们的的固有因子了，现在是时候在原有因子的基础上附加一些更加强大的固有因子，以遗传给我们的后代了。如果我们能成功突破，我们的铸星绮梦将会毫无疑问地成为现实"
uma_ap.53.a: "再接再厉"

uma_ap.54.title: "铸星绮梦:现实"
uma_ap.54.desc: "经过长久的努力，以及对一些意外情况的正确处理，我们终于推开了三女神为我们设下的最后一道大门——固有因子；现在，心中的星星不仅紧握在我们手中，更被我们亲手铸造成不同的形状，散发着与众不同不同的光芒。"
uma_ap.54.a: "好耶"



uma_ap.60.title: "力大无穷"
uma_ap.60.desc: "强化后的固有因子使马娘们的生活发生了极大的变化，马娘们拥有了比以往更加强大的能力。不过超过半数受试者表示她们似乎像上次一样出现了无法控制自己力气的行为: 即使轻轻一拉也能使门把手和门尸首分离，这变相使得家具日用商城变得火爆了起来。虽然更置家具补贴了不少的资金，但我们依然认为我们为此实行的力量控制训练还是有效的。直到一名受试的学院学生在游泳训练中用排球将游泳馆厚厚的墙壁直接击垮，这个问题的提案和修复经费事项才一起放到了[Owner.GetRulerName]的办公桌上\n“如果不是她没吃饭，我已经变成马娘酱了”"
uma_ap.60.a: "修改马娘们的固有因子，使她们的力气小一点"
uma_ap.60.b: "或许我们再让她们用筷子夹豆腐?"
uma_ap.60.c: "马娘们会适应的"
uma_ap.61.title: "高级力量控制"
uma_ap.61.desc: "经过无数马娘抱怨的筷子夹豆腐重返战场！有科学的方法加以训练，马娘们对力气的掌控似乎变得更加合理了。只不过这次的豆腐似乎换成了硬了不少？"
uma_ap.61.a: "也就是说你们用了豆干?"
uma_ap.70.title: "多重人格"
uma_ap.70.desc: "似乎出现了一些状况，我们的科学家报告称在隔离受试的志愿者中观察到MPD，某些志愿者出现了人格更替，她们不时表现出完全不同于以往的行为，并且不记得自己的重要信息；然而，她们却可以回忆起与之截然不同的身份信息。而人格间的变化又十分有戏剧性，前一分钟一名志愿者能清楚的回答自己的姓名住址，而后一分钟，这些信息却截然不同。\n我们的科学家怀疑是附加的外部固有因子导致的多重人格体验，不过这尚不能下定论......"
uma_ap.70.a: "这或许只是偶然事件"
uma_ap.70.b: "重点观测"
uma_ap.70.a.tt: "Tips: 局势可以被随时停止，而收益根据§G局势的进度§!(全部进度+一个DEBUFF)给予"

uma_ap.80.title: "多重人格"
uma_ap.80.desc: "出现了异常！多个地方报告了马娘发疯的现象，甚至军队都受到了波及。这些马娘都有一个共同的特点，就是都观察到了重度的MPD，并且都是接受过因子更替的马娘，她们行为怪异又充满纪律性，更加异常的是，她们似乎热衷于将正常马娘囚禁并且强制进行因子更替手术，虽然我们也不知道那些药剂到底是从哪里来的。这一现象似乎正在蔓延。由于这些疯狂的马娘正在占领我们的各种基础设施，我们的家园受到了不同程度的破坏。幸好国防部长在首次报告时发布了T0级指令，让所有军队成员都对这次因子更迭做了逆向措施，这才使我们拥有反制的手段。不管是否有直接关联，我们都必须终止这一次计划了。"
uma_ap.80.a: "怎么会这样"
uma_ap.80.a.tt: "局势将被终止，收益按§G90%§!的进度(全部进度+一个DEBUFF)给予\n我们必须夺回我们的殖民地"

