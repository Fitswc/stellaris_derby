l_english:
###############################
 civic_umamihonobourbon:0 "Expedition Support Committee"
 civic_umamihonobourbon_desc:0 "Umamusume launched an unprecedented galaxy unification expedition, determined to turn the entire galaxy into the arena of Traincent. To ensure that the Umamusumes on the front line have no worries, the student union has specially established an expedition support committee to comprehensively coordinate the dispatch of materials, medical logistics and communication support, and must respond promptly to the needs of the front line and ensure sufficient supply."

 civic_umasymbolirudolf:0 "Interstellar Student Council"
 civic_umasymbolirudolf_desc:0 "She is a natural leader, a fact that any Umamusume who knows Rudolf understands deeply. This gift was already on full display in her childhood. When she entered Tracen with outstanding achievements in every field and was elected Student Council President without question, a new era was destined to begin: an era belonging to the legendary Umamusume known as the 'Emperor'. With the thunderous launch of 2200, the ship carrying the FTL engine vanished into space and opened the curtain on the galactic age. Rudolf became the first Student Council President of this civilization newly entering space, and she was destined to carve the glory of Umamusume civilization into the history of the universe."
 civic_umaagnestachyon:0 "Agnes Tachyon's Scientific Dominance"
 civic_umaagnestachyon_desc:0 "First, a clarification: the scientist Agnes Tachyon has been missing for four years since resigning from her post. Anyone who obtains any information related to her, anywhere, must report it immediately. Perhaps the word genius was created to describe Agnes Tachyon. The children were curious about this eccentric peer, yet they kept their distance because she was always tinkering with some kind of 'science' they knew nothing about. In the twelfth year of that lonely life, Agnes Tachyon met an Umamusume willing to step into her heart. Perhaps it was because she was the first peer to truly speak with her, or perhaps because she was even willing to keep her company as an experimental subject... In any case, from that moment onward, experiments gradually ceased to be Tachyon's entire world. Then, under the sunset one day, that Umamusume made a promise with Tachyon: when you become the greatest scientist in the world, I will prepare a gift for you."

 civic_umafujikiseki:0 "Open Race Trials"
 civic_umafujikiseki_desc:0 "We firmly believe that the talent and dream of running should never be limited by birthplace, status, or class. Through a thorough and equal open-trial system, from the muddy tracks of Funabashi to the brilliant stars, every Umamusume has a chance to show her talent."

 civic_umacurrenchan:0 "Maji-Maji Alliance"
 civic_umacurrenchan_desc:0 "When Curren Chan's cuteness combines with Aston Machan's wish to be remembered, we are convinced that the most powerful weapon in the universe is not a neutron-sweeping planet killer, but irresistible charm. Whether tentacled molluscoids or cold silicon-based robots, all will eventually become their fans in front of the screen. No one can refuse our diplomatic requests—who could bear to declare war on Curren Chan and Ma-chan?"

 civic_umamatikanefukukitaru:0 "Tracen Occultist Association"
 civic_umamatikanefukukitaru_desc:0 "The association founded by two great diviners has now become the empire's supreme faith. What? You say they are just charlatans waving crystal balls and Bagua arrays to spread nonsense? Those materialist fools who ignored 'No Navigation Today' cannot even find their own wreckage now!"

 civic_umasupercreek:0 "Tracen Sports Healthcare Department"
 civic_umasupercreek_desc:0 "Adequate rest can solve 99% of illnesses. After combining top-tier biophysical therapy with Super Creek's exclusive theory, mandatory daily stretching and relaxation, followed by specially prepared massive nutritional meals, were added to every Umamusume's daily routine. Although some Umamusume occasionally try to evade deep care, they are ultimately tucked into custom baby-car medical pods inside the Healthcare Department, where an irresistible aura of reassurance fills the room."
 civic_umanicenature:0 "Watching All Directions"
 civic_umanicenature_desc:0 "Nice Nature's excellent marking exposes the secrets of other species completely. My authority as the Great Commander of Red Skills is unlimited."
 civic_umazennorobroy:0 "Great Tracen Library"
 civic_umazennorobroy_desc:0 "Zenno Rob Roy's old dream was simply to quietly read heroic stories in the afternoon. As time passed, the library established under her leadership came to preserve every race recording since the classical era, stellar spectral data, ancient planetary fossils, and more. All information is classified, analyzed, and stored here. Although scientists argue here every day, there is no denying that this vast library has become the de facto central database."

 civic_umahuruwurara: "Urara-ism"
 civic_umahuruwurara_desc: "Why should everyone slaughter each other among the stars? Would it not be better for everyone to hold festivals happily together? Even if our fleets take losses in border skirmishes, even if our technology falls behind our neighbors, none of it will cause panic or unrest in our country. We have invested all national strength into the great undertaking of letting every citizen show a smile. Even the coldest purifiers may feel a faint, inexplicable guilt when aiming at citizens who cheer over the smallest things... probably?"

 civic_umateio:0 "Basement Culture"
 civic_umateio_desc:0 "Shh... stop struggling. It really is safe here."

 civic_umamayanotopgun:0 "Tracen Aerospace Academy"
 civic_umamayanotopgun_desc:0 "Take off~ These Umamusume have an endless longing for the sky, so they often wonder how they should run in space."

 civic_umaagnesdigital:0 "Umamusume DD Fan Club"
 civic_umaagnesdigital_desc:0 "As a proud DD leader, Digital has boundless passion for all Umamusume. Now she wants to establish an Umamusume fan club so that more Umamusume can, like her, recognize the shining qualities of other Umamusume.\n\nwwww, how could anyone endure this?"

 civic_umafinemotion:0 "Mejiro Castle"
 civic_umafinemotion_desc:0 "'I shall surely dedicate glory and honor to the magnificent Mejiro family!' That absurdly vast family estate has now become a wonder covering half a planet. Mejiro Castle is not merely a huge architectural complex; it is also the cradle of the empire's highest officials and governors. Every administrator who walks out of Mejiro Castle possesses flawless elegance and exceptional administrative skill. With centuries of noble heritage and extremely rigorous elite management studies, the Mejiro family has taken control of the empire's core bureaucracy. Under the cover of elegant afternoon teas and classical music, thousands upon thousands of resource allocations and personnel appointments are arranged in perfect order. After all, if one can manage that maze-like back garden inside the estate, how hard can it be to govern a few remote sectors?"

 civic_umaeishinflash:0 "Glorious Bloodline"
 civic_umaeishinflash_desc:0 "Many do not understand why our commanders can make tactical decisions that defy common sense yet remain astonishingly precise. Why do our governors seem born knowing how to calm public sentiment? Why do our scientists decipher the mysteries of the universe so quickly? By tracing, protecting, and refining the bloodlines of generations of Hall Umamusume, our nation ensures that every generation of elites who take leadership positions inherits the extraordinary intellect and unyielding will of their predecessors. One horse takes the lead, and all others lose their light. Born great—this is no empty phrase."

civic_tooltip_umaeishinflash_effects:0 "If we select this civic, we will be able to build a special army: §YBlack Legion§!"
 civic_umasmartfalcon:0 "Idol Nation"
 civic_umasmartfalcon_desc:0 "Falco once had a dream: to stand on the highest stage and deliver the charm of idols to everyone. Now, having long since become a famous idol, she is working hard to help more young juniors who want to follow the idol path realize their own dreams."

 civic_umasatonodiamond:0 "Sponsorship Standardization"
 civic_umasatonodiamond_desc:0 "There are quite a few young ladies in the academy who are daughters of powerful financial groups, often backed by companies and enterprises wealthy enough to rival nations. These well-managed and highly competitive companies are injecting new vitality into our economy."

 civic_umaairgroove:0 "Student Council Administrative Support"
 civic_umaairgroove_desc:0 "Never underestimate the workload of the Student Council! Even when the stage expands from the academy to the entire galaxy, under this mature and rigorous administrative system, the Student Council clerks can always place the final seal on approval documents at the right time and in the right place. As long as the tea reserves remain sufficient, the administrative machinery of our vast empire will never grind to a halt."

 civic_uma_vivlos_shopping: "KiraKira Celebrity Foreign Trade Department"
 civic_uma_vivlos_shopping_desc: "KiraKira~ DokiDoki!?"

 civic_uma_ayb_star_watcher: "Star Watchers Association"
 civic_uma_ayb_star_watcher_desc: "As students of Tracen Academy, some Umamusume seem to pursue the stars without limit. More importantly, they possess abundant knowledge."

 civic_uma_cheval_civillian_workshop: "BoC'z's Hat Factory"
 civic_uma_cheval_civillian_workshop_desc: "'Let the whole universe experience the charm of hats!' At first, this was only an April Fools' project launched by five hat-loving Umamusume. No one expected it to eventually become a super-business that monopolized fashion. Selling arms brings conflict, selling food has thin margins, but selling hats—especially limited-edition idol collaboration hats—is pure profit!"

 civic_uma_matikanetannhauser_radio: "Interstellar Race Broadcast"
 civic_uma_matikanetannhauser_radio_desc: "Broadcast races to the entire universe!? Seriously?"
 civic_uma_kita: "Nation of Festivals"
 civic_uma_kita_desc: "The vast Stellar Sea may be a dark forest, but in our eyes it is simply a gigantic festival ground. 'Wasshoi————!' Under the leadership of a black-haired Umamusume with a fanatical obsession for festivals, whether researching technology, completing ships, or establishing new colonies, everything is accompanied by grand fireworks and revelry. What if we could hold a Great Interstellar Thanksgiving Festival spanning the entire galaxy...? Huh, what? You say this game has already caused a controversy?"

 civic_uma_luckey_geo_training: "Unrestricted Agricultural Operations"
 civic_uma_luckey_geo_training_desc: "The key issue is food! After witnessing how the food reserves of a planetary capital could be exhausted within a single day, we adopted an extremely aggressive unrestricted agricultural operations strategy to prevent the nation from collapsing into bankruptcy from overeating during peacetime. Every usable inch of interstellar soil is used to plant carrots, and entire planets are transformed into endless carrot fields and fully automated ranches. Power, housing, and mining districts are compressed to the limit—as long as our Umamusume appetites can be satisfied, their productivity has no limit!"

 civic_uma_win_variation: "Heart of the Protagonist"
 civic_uma_win_variation_desc: "Damn it! I will not only prove who the protagonist is, I will also mess you up completely! Beneath the cute exterior lies an unyielding heart, a declaration of war against fate."

 auth_trainingcenter:0 "Tracen Academy"
 auth_trainingcenter_desc:0 "An academy that provides the finest environment for Umamusume and guides their development. Elite Umamusume deliberate on national affairs at the Academy Representative Assembly."
 UMAMUSUME_TRANIING_CENTER:0 "The Academy Representative Assembly elects a new academy leader. A new election may be held in emergencies."

 
 gov_uma_country:0 "Tracen Interstellar Academy"
 gov_uma_country_desc:0 "A civilization led by Tracen Academy, which once provided top-class facilities for Umamusume on the planet. Now they turn their eyes toward the Stellar Sea."
 
 gov_uma_country_spiritualist:0 "Tracen Curia"
 gov_uma_country_spiritualist_desc:0 "A Tracen Academy influenced by the Great Fukukitaru Diviner. Every step they take follows the will of the gods."
 
 
 gov_uma_country_militarist:0 "Tracen War Committee"
 gov_uma_country_militarist_desc:0 "A militarized Tracen Academy. Their iron hooves will tread across the Stellar Sea."
 
 gov_uma_country_authoritarian:0 "Tracen Chief Council"
 gov_uma_country_authoritarian_desc:0 "After the Student Council's authority was strengthened, every aspect of Tracen gained higher efficiency."
 
 gov_uma_country_xenophob:0 "Tracen Darwin Association"
 gov_uma_country_xenophob_desc:0 "A Tracen association whose purpose is to create a Stellar Sea inhabited only by top-tier Umamusume. They will use every means to ensure it."
 
 gov_uma_country_egalitarian:0 "Tracen Utopia"
 gov_uma_country_egalitarian_desc:0 "Tracen Academy strives to ensure that its first-class facilities can serve everyone, regardless of species."
 
 gov_uma_country_xenophile:0 "Tracen Interstellar Exchange Assembly"
 gov_uma_country_xenophile_desc:0 "A Tracen Academy that seeks common ground while respecting differences among civilizations and promotes friendly exchange."
 
 gov_uma_country_pacifist:0 "Tracen Peace Committee"
 gov_uma_country_pacifist_desc:0 "A Tracen Academy led by peace-loving Umamusume and dedicated to spreading peace."
 
 gov_uma_country_materialist:0 "Tracen Scientific Society"
 gov_uma_country_materialist_desc:0 "A Tracen society led by Umamusume who never stop on the road toward knowledge and truth."


###########################################################
UMA_SPECIES_CAN_NOT_BE_HIVE_MIND:0 "As independent and spiritually rich beings, Umamusume cannot use hive-minded government structures."
UMA_SPECIES_CAN_NOT_BE_CORPORATE:0 "Umamusume love running and freedom by nature, making it impossible for them to be ruled by a megacorporation."


civic_uma_my_venus_park: "My Beloved Venus Park"
civic_uma_my_venus_park_desc: "Venus Park-chan is just too cute. I really cannot stop looking at her face every day!!"
civic_uma_my_venus_park_effects: "The national leader will become Venus Park, but Venus Park in the subsequent event chain will no longer be available."

 civic_uma_aston_machan: "Anomalous Umamusume Research Center"
 civic_uma_aston_machan_desc: "Every once in a while, there are always a few "chosen girls" that emerge out of nowhere - on the track, they ride far ahead of the rest and trample records under their feet. Off the field, he is also versatile, as if being chased by the three goddesses to feed his talent. We believe that such an existence is the grace bestowed by the three goddesses. Such an existence naturally becomes the stars that everyone looks up to - in our world, the worship of them has long been a prevailing trend."


civic_uma_win_variation_tt: "\n\n§YDuring the first 20 years:\nWhen actively attacking another country, gain the following bonuses:§!\n-Monthly biological ship growth: §G+90%§!\n-Claim influence cost: §G-90%§!\n-Military ship build speed: §G-80%§!\n\n\n§RThis civic can only be removed later in the game§!"
civic_uma_win_variation_tt_only_remove: "§RThis civic can only be removed later in the game§!"
 uma_variation_early_war_buff: "I am the protagonist, shii!"
